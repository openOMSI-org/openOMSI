# Isolated native CPU AI/passenger/timetable TEST only (not production)
# This example enables bounded simulated AI, passengers and road-bus timetables.
# Set traffic up to 512 and ai_max_humans up to 2000, starting low for TPS tests.
# Run ONLY with --experimental-simulation; NOT with --experimental-free-roam.
# After editing live traffic, passenger_density, time_speed, ai_max_scheduled
# or speed_limit_kmh, enter /reload in the LOCAL server console. All other
# setting changes require a server restart and reject the whole reload.
# Map and bus sharing is OFF by default. Use share_maps=1 and/or
# accept_uploads=1 for redistribution-authorized mods in PRIVATE tests.
# These options require a complete restart, not /reload.
# Optional parked_buses=1..32 requires accept_uploads=1 and a restart.
name = Headless LAN test
motd = Experimental CPU simulation with limited AI and passengers
map = Maps/Grundorf/global.cfg
date = 1989-05-30
time = 09:00
traffic = 8
timetable = 1
passengers = 1
ai_max_humans = 64
ai_max_scheduled = 8
passenger_density = 1.0
port = 27015
web_port = 27025
max_players = 8
tunnel = 0
public_server = 0
public_address = off
real_time = 0
metar_sync = 0
time_speed = 1
speed_limit_kmh = 0
accept_uploads = 0
share_maps = 0
parked_buses = 0
share_positions = 0
voice = 0
voice_radio = 0
allow_player_teleport = 0
# For a local TPS/admin panel, set a UNIQUE 12+-character password.
# Leave it blank to keep web admin disabled. Never ship a preset password.
admin_web = local
admin_password =
moderator_password =
require_hardware_id = 0
