name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["rust", "javascript-typescript", "actions"]' || '["javascript-typescript", "actions"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # test files hold fixed passwords, salts and keys on purpose (a known answer, a
          # password too short to take); a test module inside a source file cannot be told
          # apart by its path and is still analysed
          config: |
            paths-ignore:
              - launcher/patches
              - "**/tests/**"
              - "**/tests.rs"
              - "**/*_tests.rs"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
