# Publishes the website (site/) with the documentation (docs/*.md) to GitHub Pages, one page per address (scripts/build-site.mjs).
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "assets/logos/**", "assets/icons/app/**", "README.md", "scripts/build-site.mjs", "scripts/site.test.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site
        run: node --test scripts/site.test.mjs && node scripts/build-site.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
