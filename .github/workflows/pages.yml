# Builds the website (site/: a static generator, see site/README.md) from the documentation
# (docs/*.md) and publishes it to GitHub Pages. It is rebuilt when a release is published or changed
# (the site carries the releases and the issue list, read at build time) and every day (openMapper's
# documents are read from its own repository).
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "assets/logos/**", "assets/icons/app/**", ".github/workflows/pages.yml"]
  # a new or changed release: the site bakes the releases in (site/src/github.mjs)
  release:
    types: [published, edited, deleted, released, prereleased]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --version
          npm ci --no-audit --no-fund
          node build.mjs --check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      # (the artifact is listed a moment after it is uploaded; deploy-pages looks for it at once)
      - name: Wait for the artifact to be listed
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
