# Publishes the website (site/) with the documentation (docs/*.md) to GitHub Pages.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "assets/logos/**", "assets/icons/app/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/docs _site/assets
          cp -R site/. _site/
          cp docs/*.md _site/docs/
          cp -R assets/logos _site/assets/logos
          cp assets/icons/app/openomsi-256.png _site/assets/icon.png
          cp assets/icons/app/openomsi.svg _site/assets/icon.svg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
