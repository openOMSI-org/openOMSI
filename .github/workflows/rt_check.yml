# Enhanced+'s ray tracing on Vulkan and Direct3D 12 without a graphics card: Mesa's lavapipe
# (software Vulkan with VK_KHR_ray_query) and WARP (software Direct3D 12) run the renderer's
# ray tracing smoke test (crates/omsi-render/tests/rt_smoke.rs) and print every device error.
name: Ray tracing check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "crates/omsi-render/src/rt*"
      - "crates/omsi-render/tests/rt_smoke.rs"
      - ".github/workflows/rt_check.yml"

permissions:
  contents: read

jobs:
  vulkan:
    name: Vulkan (lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rt-check
      - name: Mesa with ray queries
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
          ls /usr/share/vulkan/icd.d/
          vulkaninfo --summary || true
          vulkaninfo 2>/dev/null | grep -i -E "VK_KHR_ray_query|VK_KHR_acceleration_structure|driverName" | head || true
      - name: Ray tracing smoke test
        env:
          RUST_MIN_STACK: "67108864"
          RUST_LOG: wgpu_core=warn,wgpu_hal=warn,omsi_render=info
          RUST_BACKTRACE: "1"
        run: cargo test --release -p omsi-render --test rt_smoke -- --ignored --nocapture

  d3d12:
    name: Direct3D 12 (WARP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rt-check
      - name: DXC (the shader compiler ray queries need)
        shell: pwsh
        run: |
          $u = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip"
          $expected = "ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1"
          Invoke-WebRequest -Uri $u -OutFile dxc.zip
          $actual = (Get-FileHash dxc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "DXC checksum mismatch: $actual" }
          Expand-Archive dxc.zip -DestinationPath dxc
          Copy-Item dxc/bin/x64/dxcompiler.dll -Destination $env:GITHUB_WORKSPACE
          Copy-Item dxc/bin/x64/dxil.dll -Destination $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          "PATH=$env:GITHUB_WORKSPACE;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: With DXC, ray tracing
        continue-on-error: true
        env:
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: dynamicdxc
          RUST_MIN_STACK: "67108864"
          RUST_BACKTRACE: "1"
        run: cargo test --release -p omsi-render --test rt_smoke -- --ignored --nocapture
      - name: Without ray tracing (the same scene, Enhanced)
        continue-on-error: true
        env:
          WGPU_BACKEND: dx12
          OMSI_NO_RT: "1"
          RUST_MIN_STACK: "67108864"
          RUST_BACKTRACE: "1"
        run: cargo test --release -p omsi-render --test rt_smoke -- --ignored --nocapture --test-threads=1
      - name: Ray tracing smoke test
        env:
          WGPU_BACKEND: dx12
          RUST_MIN_STACK: "67108864"
          RUST_LOG: wgpu_core=warn,wgpu_hal=warn,omsi_render=info
          RUST_BACKTRACE: "1"
        run: cargo test --release -p omsi-render --test rt_smoke -- --ignored --nocapture
