# Checks on a pull request's files, beside the builds of release.yml:
# * the interface translations: a changed `locales/app.yml` must load, keep the placeholders
#   of the texts it translates and keep every text the code uses (.github/scripts/check_locales.py;
#   changed existing translations and unused new keys are shown as warnings);
# * no file of a megabyte or more, added or changed, the translations aside (see
#   CONTRIBUTING.md: large data, screenshots and example content stay out of the repository).
name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      LOCALES: crates/omsi-app/locales/app.yml
      MAX_BYTES: 1000000
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE"

      - name: No large files
        run: |
          status=0
          while IFS= read -r f; do
            # (the translations are one file for every language, checked on their own below)
            [ "$f" = "$LOCALES" ] && continue
            [ "$f" = apple/Resources/Localizable.xcstrings ] && continue
            size=$(stat -c %s "$f" 2>/dev/null || echo 0)
            if [ "$size" -ge "$MAX_BYTES" ]; then
              echo "::error file=$f::$f is $((size / 1024)) KB. Files of a megabyte or more do not go into the repository (see CONTRIBUTING.md): link screenshots and videos in the pull request, and keep test data small."
              status=1
            fi
          done < <(git diff --name-only --diff-filter=AM "$BASE" HEAD)
          exit $status

      - name: Translations
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet "$BASE" HEAD -- "$LOCALES"; then
            echo "$LOCALES is not changed."
            exit 0
          fi
          pip install --quiet pyyaml
          git show "$BASE:$LOCALES" > "$RUNNER_TEMP/app.base.yml" 2>/dev/null || : > "$RUNNER_TEMP/app.base.yml"
          python3 .github/scripts/check_locales.py "$RUNNER_TEMP/app.base.yml" "$LOCALES"

      # No Rust file and no function may grow past its recorded size (+5 %), and new ones stay
      # under 1500 / 300 lines: scripts/size-budget.sh, baseline in scripts/size-budget.txt.
      - name: File and function sizes
        if: ${{ !cancelled() }}
        run: bash scripts/size-budget.sh

      # Which crate may depend on which (nothing on omsi-app, the simulation on no renderer,
      # ...) and the app crate only shrinking: scripts/arch-guard.sh, rules in scripts/arch-rules.txt.
      - name: Crate layers
        if: ${{ !cancelled() }}
        run: bash scripts/arch-guard.sh

      - name: Drive page layouts
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet "$BASE" HEAD -- launcher/ui launcher/tests .github/workflows/pr_checks.yml; then
            echo "The launcher's page is not changed."
            exit 0
          fi
          if node -e "process.exit(typeof WebSocket === 'function' ? 0 : 1)"; then
            node launcher/tests/drive-check.mjs
          else
            node --experimental-websocket launcher/tests/drive-check.mjs
          fi

      - name: AI Lists state
        if: ${{ !cancelled() }}
        run: node launcher/tests/ai-lists-check.mjs
