<!doctype html><html lang="en" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings navigation checks</title><link rel="stylesheet" href="../ui/styles.css"><link rel="stylesheet" href="../ui/settings-navigation.css"><style>body{overflow:auto}#run{margin:12px}#report{white-space:pre-wrap;margin:12px;user-select:text}#fixture{height:calc(100dvh - 110px);min-height:520px}.settings-test-shell{height:100%}</style><button class="btn primary" id="run">Run settings checks</button><pre id="report">Ready. Local command fixtures only; no real settings are changed.</pre><div id="fixture"></div><script type="module">import { run } from './settings-navigation-check.js';document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;try{document.querySelector('#report').textContent=await run(document.querySelector('#fixture'))}catch(e){document.querySelector('#report').textContent='FAIL '+e.stack}finally{button.disabled=false}};</script></html>
