<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplayer interface checks</title>
<link rel="stylesheet" href="../ui/styles.css">
<style>body{overflow:auto;padding:24px}#fixture{max-width:1100px;margin:20px auto}#report{white-space:pre-wrap;user-select:text}#run{margin-bottom:16px}</style>
<button class="btn primary" id="run">Run multiplayer checks</button>
<pre id="report">Ready. Uses local fixtures; no game or remote server is started.</pre>
<div id="fixture"></div>
<script type="module">
import { run } from './multiplayer-check.js';
import { run as unified } from './unified-driving-check.js';
import { run as driveMode, mobileInvitations } from './drive-mode-check.js';
document.querySelector('#run').onclick = async () => {
  const button = document.querySelector('#run');
  button.disabled = true;
  const report = document.querySelector('#report');
  report.textContent = 'Running…';
  try { report.textContent = await run(document.querySelector('#fixture')) + '\n' + await driveMode(document.querySelector('#fixture')) + '\n' + await mobileInvitations(document.querySelector('#fixture')) + '\n' + await unified(document.querySelector('#fixture')); }
  catch (e) { report.textContent = `FAIL ${e.stack || e}`; }
  finally { button.disabled = false; }
};
</script>
</html>
