[package]
name = "omsi-cfg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reader for OMSI's line-oriented [keyword] configuration format and its text encodings"

[dependencies]
encoding_rs.workspace = true
thiserror.workspace = true
log.workspace = true
rayon.workspace = true
flate2.workspace = true
ring.workspace = true
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
# (DXGI's adapter list: whether DLSS can be offered, `upscaler_files::rtx_present`)
windows = { workspace = true, features = ["Win32_Graphics_Dxgi"] }
