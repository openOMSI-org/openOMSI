  ru: "Ходит как сейчас"
  uk: "Ходить як зараз"
"Its trips change: its bus and drivers are given anew":
  de: "Seine Fahrten ändern sich: Bus und Fahrer werden neu vergeben"
  fr: "Ses courses changent : son bus et ses conducteurs sont attribués à nouveau"
  nl: "Zijn ritten veranderen: bus en chauffeurs worden opnieuw toegewezen"
  pl: "Jej kursy się zmieniają: autobus i kierowcy są przydzielani od nowa"
  ru: "Его рейсы меняются: автобус и водители назначаются заново"
  uk: "Його рейси змінюються: автобус і водіїв призначають заново"
"A tour more: a bus and drivers to give":
  de: "Ein Umlauf mehr: Bus und Fahrer zu vergeben"
  fr: "Un service de plus : un bus et des conducteurs à attribuer"
  nl: "Een omloop meer: bus en chauffeurs toe te wijzen"
  pl: "Jedna brygada więcej: autobus i kierowcy do przydzielenia"
  ru: "На выход больше: нужно назначить автобус и водителей"
  uk: "На оборот більше: треба призначити автобус і водіїв"
"No longer driven: its bus and drivers are free":
  de: "Fährt nicht mehr: Bus und Fahrer sind frei"
  fr: "N'est plus assuré : son bus et ses conducteurs sont libres"
  nl: "Rijdt niet meer: bus en chauffeurs zijn vrij"
  pl: "Już nie kursuje: autobus i kierowcy są wolni"
  ru: "Больше не ходит: автобус и водители свободны"
  uk: "Більше не ходить: автобус і водії вільні"
"In one go":
  de: "In einem Zug"
  fr: "D'un coup"
  nl: "In één keer"
  pl: "Za jednym razem"
  ru: "Разом"
  uk: "Разом"
"Runs on these days":
  de: "Fährt an diesen Tagen"
  fr: "Roule ces jours-là"
  nl: "Rijdt op deze dagen"
  pl: "Kursuje w te dni"
  ru: "Ходит в эти дни"
  uk: "Ходить у ці дні"
"A change here makes these days' trips anew from the pattern: the departures moved by hand on these days go.":
  de: "Eine Änderung hier erstellt die Fahrten dieser Tage neu aus dem Muster: Von Hand verschobene Abfahrten dieser Tage gehen verloren."
  fr: "Une modification ici refait les courses de ces jours à partir du modèle : les départs déplacés à la main ces jours-là sont perdus."
  nl: "Een wijziging hier maakt de ritten van deze dagen opnieuw uit het patroon: met de hand verschoven vertrekken op deze dagen vervallen."
  pl: "Zmiana tutaj tworzy kursy tych dni od nowa według wzorca: odjazdy przesunięte ręcznie w tych dniach przepadają."
  ru: "Изменение здесь заново создаёт рейсы этих дней по шаблону: отправления, сдвинутые вручную в эти дни, пропадут."
  uk: "Зміна тут заново створює рейси цих днів за шаблоном: відправлення, зсунуті вручну в ці дні, зникнуть."
"What it needs":
  de: "Was sie braucht"
  fr: "Ce qu'il lui faut"
  nl: "Wat ze nodig heeft"
  pl: "Czego potrzebuje"
  ru: "Что ей нужно"
  uk: "Що їй потрібно"
"Changed":
  de: "Geändert"
  fr: "Modifié"
  nl: "Gewijzigd"
  pl: "Po zmianie"
  ru: "После изменения"
  uk: "Після зміни"
"Buses at the busiest hour":
  de: "Busse zur Spitzenstunde"
  fr: "Bus à l'heure de pointe"
  nl: "Bussen op het drukste uur"
  pl: "Autobusy w godzinie szczytu"
  ru: "Автобусы в час пик"
  uk: "Автобуси в годину пік"
