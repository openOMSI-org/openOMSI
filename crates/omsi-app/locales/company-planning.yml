_version: 2
# The bus company's planning: its chart that fits its room and folds its lines, and a line's
# trips and timetable changed over it.
# The planning's chart: folding a line, every line at once.
"%{n} without a bus":
  de: "%{n} ohne Bus"
  fr: "%{n} sans bus"
  nl: "%{n} zonder bus"
  pl: "%{n} bez autobusu"
  ru: "%{n} без автобуса"
  uk: "%{n} без автобуса"
"%{n} without a driver":
  de: "%{n} ohne Fahrer"
  fr: "%{n} sans conducteur"
  nl: "%{n} zonder chauffeur"
  pl: "%{n} bez kierowcy"
  ru: "%{n} без водителя"
  uk: "%{n} без водія"
"Collapse all":
  de: "Alle einklappen"
  fr: "Tout replier"
  nl: "Alles inklappen"
  pl: "Zwiń wszystkie"
  ru: "Свернуть все"
  uk: "Згорнути всі"
"Expand all":
  de: "Alle ausklappen"
  fr: "Tout déplier"
  nl: "Alles uitklappen"
  pl: "Rozwiń wszystkie"
  ru: "Развернуть все"
  uk: "Розгорнути всі"
"Collapse the line to its heading":
  de: "Die Linie auf ihre Kopfzeile einklappen"
  fr: "Replier la ligne sur son en-tête"
  nl: "De lijn inklappen tot haar kop"
  pl: "Zwiń linię do nagłówka"
  ru: "Свернуть линию до заголовка"
  uk: "Згорнути лінію до заголовка"
"Expand the line: its tours":
  de: "Die Linie ausklappen: ihre Umläufe"
  fr: "Déplier la ligne : ses services"
  nl: "De lijn uitklappen: haar omlopen"
  pl: "Rozwiń linię: jej brygady"
  ru: "Развернуть линию: её выходы"
  uk: "Розгорнути лінію: її обороти"
"Show every line's tours":
  de: "Die Umläufe jeder Linie zeigen"
  fr: "Afficher les services de chaque ligne"
  nl: "De omlopen van elke lijn tonen"
  pl: "Pokaż brygady każdej linii"
  ru: "Показать выходы каждой линии"
  uk: "Показати обороти кожної лінії"
"Fold every line to its heading: what it has planned, and what is open":
  de: "Jede Linie auf ihre Kopfzeile einklappen: was geplant ist und was offen ist"
  fr: "Replier chaque ligne sur son en-tête : ce qui est planifié et ce qui reste ouvert"
  nl: "Elke lijn inklappen tot haar kop: wat gepland is en wat open staat"
  pl: "Zwiń każdą linię do nagłówka: co zaplanowane, a co otwarte"
  ru: "Свернуть каждую линию до заголовка: что запланировано и что открыто"
  uk: "Згорнути кожну лінію до заголовка: що заплановано і що відкрито"
"The tour's bus: tap a bus in the list, then here - or drag it here. Tap it twice: the line's timetable":
  de: "Der Bus des Umlaufs: einen Bus in der Liste antippen, dann hier - oder ihn hierher ziehen. Zweimal antippen: der Fahrplan der Linie"
  fr: "Le bus du service : touchez un bus dans la liste, puis ici - ou faites-le glisser ici. Deux fois : l'horaire de la ligne"
  nl: "De bus van de omloop: tik een bus in de lijst aan en dan hier - of sleep hem hierheen. Twee keer tikken: de dienstregeling van de lijn"
  pl: "Autobus brygady: dotknij autobusu na liście, potem tutaj - albo przeciągnij go tutaj. Dotknij dwa razy: rozkład linii"
  ru: "Автобус выхода: коснитесь автобуса в списке, затем здесь - или перетащите его сюда. Дважды: расписание линии"
  uk: "Автобус обороту: торкніться автобуса в списку, потім тут - або перетягніть його сюди. Двічі: розклад лінії"
"The line's trips and timetable":
  de: "Fahrten und Fahrplan der Linie"
  fr: "Courses et horaire de la ligne"
  nl: "Ritten en dienstregeling van de lijn"
  pl: "Kursy i rozkład linii"
  ru: "Рейсы и расписание линии"
  uk: "Рейси й розклад лінії"
"The line's trips and timetable: see them and change them here":
  de: "Fahrten und Fahrplan der Linie: hier sehen und ändern"
  fr: "Courses et horaire de la ligne : les voir et les modifier ici"
  nl: "Ritten en dienstregeling van de lijn: hier bekijken en wijzigen"
  pl: "Kursy i rozkład linii: zobacz je i zmień tutaj"
  ru: "Рейсы и расписание линии: посмотреть и изменить здесь"
  uk: "Рейси й розклад лінії: переглянути та змінити тут"
"See the line's departures and the tours they make, and change them":
  de: "Die Abfahrten der Linie und die Umläufe daraus sehen und ändern"
  fr: "Voir les départs de la ligne et les services qu'ils forment, et les modifier"
  nl: "De vertrekken van de lijn en de omlopen die ze vormen bekijken en wijzigen"
  pl: "Zobacz odjazdy linii i brygady, które tworzą, i zmień je"
  ru: "Посмотреть отправления линии и выходы, которые они дают, и изменить их"
  uk: "Переглянути відправлення лінії та обороти, які вони утворюють, і змінити їх"
# The line's trips and timetable over the planning (plan_edit).
"Trips and timetable of line %{n}":
  de: "Fahrten und Fahrplan der Linie %{n}"
  fr: "Courses et horaire de la ligne %{n}"
  nl: "Ritten en dienstregeling van lijn %{n}"
  pl: "Kursy i rozkład linii %{n}"
  ru: "Рейсы и расписание линии %{n}"
  uk: "Рейси й розклад лінії %{n}"
"A line of the map's timetable: its trips are the map's own and are not changed here.":
  de: "Eine Linie aus dem Fahrplan der Karte: Ihre Fahrten gehören der Karte und werden hier nicht geändert."
  fr: "Une ligne de l'horaire de la carte : ses courses sont celles de la carte et ne se modifient pas ici."
  nl: "Een lijn uit de dienstregeling van de kaart: haar ritten zijn van de kaart zelf en worden hier niet gewijzigd."
  pl: "Linia z rozkładu mapy: jej kursy należą do mapy i nie są tu zmieniane."
  ru: "Линия из расписания карты: её рейсы принадлежат карте и здесь не меняются."
  uk: "Лінія з розкладу карти: її рейси належать карті й тут не змінюються."
"The line was not found among the line editor's lines of the company's map: its trips are shown as they run.":
  de: "Die Linie wurde unter den Linien des Linieneditors auf der Karte des Unternehmens nicht gefunden: Ihre Fahrten werden gezeigt, wie sie fahren."
  fr: "La ligne est introuvable parmi les lignes de l'éditeur de lignes sur la carte de l'entreprise : ses courses sont affichées telles qu'elles roulent."
  nl: "De lijn is niet gevonden bij de lijnen van de lijneditor op de kaart van het bedrijf: haar ritten staan hier zoals ze rijden."
  pl: "Linii nie znaleziono wśród linii edytora linii na mapie firmy: jej kursy są pokazane tak, jak kursują."
  ru: "Линия не найдена среди линий редактора линий на карте компании: её рейсы показаны так, как они ходят."
  uk: "Лінію не знайдено серед ліній редактора ліній на карті компанії: її рейси показано так, як вони ходять."
"A new timetable waits for %{date}: it is the one shown, against the tours that run until then.":
  de: "Ein neuer Fahrplan wartet auf den %{date}: Er wird hier gezeigt, gegenüber den Umläufen, die bis dahin fahren."
  fr: "Un nouvel horaire attend le %{date} : c'est lui qui est affiché, face aux services qui roulent jusque-là."
  nl: "Een nieuwe dienstregeling wacht op %{date}: die staat hier, tegenover de omlopen die tot dan rijden."
  pl: "Nowy rozkład czeka na %{date}: to on jest pokazany, wobec brygad kursujących do tego czasu."
  ru: "Новое расписание ждёт %{date}: показано оно, в сравнении с выходами, которые ходят до тех пор."
  uk: "Новий розклад чекає на %{date}: показано саме його, у порівнянні з оборотами, що ходять доти."
"Moved by hand, the timetable is a table of trips now (the line editor's \"As a table\"): every departure on its own.":
  de: "Von Hand verschoben ist der Fahrplan jetzt eine Fahrtentabelle (\"Als Tabelle\" im Linieneditor): jede Abfahrt für sich."
  fr: "Déplacé à la main, l'horaire est désormais un tableau de courses (« Sous forme de tableau » dans l'éditeur de lignes) : chaque départ à part."
  nl: "Met de hand verschoven is de dienstregeling nu een rittentabel (\"Als tabel\" in de lijneditor): elk vertrek op zichzelf."
  pl: "Przesunięty ręcznie rozkład jest teraz tabelą kursów (\"Jako tabela\" w edytorze linii): każdy odjazd osobno."
  ru: "После ручного сдвига расписание стало таблицей рейсов («Как таблица» в редакторе линий): каждое отправление отдельно."
  uk: "Після ручного зсуву розклад став таблицею рейсів («Як таблиця» в редакторі ліній): кожне відправлення окремо."
"In service: today's tours run as they are; a change begins on the day you choose, tomorrow at the soonest.":
  de: "Im Betrieb: Die heutigen Umläufe fahren, wie sie sind; eine Änderung beginnt am Tag Ihrer Wahl, frühestens morgen."
  fr: "En service : les services d'aujourd'hui roulent tels quels ; une modification commence le jour choisi, demain au plus tôt."
  nl: "In dienst: de omlopen van vandaag rijden zoals ze zijn; een wijziging begint op de dag die je kiest, op zijn vroegst morgen."
  pl: "W obsłudze: dzisiejsze brygady kursują bez zmian; zmiana zaczyna się w wybranym dniu, najwcześniej jutro."
  ru: "На линии: сегодняшние выходы идут как есть; изменение начнётся в выбранный день, не раньше завтрашнего."
  uk: "На лінії: сьогоднішні обороти йдуть як є; зміна почнеться у вибраний день, не раніше завтрашнього."
"Not in service yet: a change counts at once.":
  de: "Noch nicht im Betrieb: Eine Änderung gilt sofort."
  fr: "Pas encore en service : une modification vaut tout de suite."
  nl: "Nog niet in dienst: een wijziging telt meteen."
  pl: "Jeszcze nie w obsłudze: zmiana obowiązuje od razu."
  ru: "Ещё не на линии: изменение действует сразу."
  uk: "Ще не на лінії: зміна діє одразу."
"Drag a departure to move it · click the axis to add one · Delete takes the one chosen out · the wheel zooms":
  de: "Eine Abfahrt ziehen, um sie zu verschieben · auf die Achse klicken, um eine hinzuzufügen · Entf nimmt die gewählte heraus · das Mausrad zoomt"
  fr: "Faites glisser un départ pour le déplacer · cliquez sur l'axe pour en ajouter un · Suppr retire celui choisi · la molette zoome"
  nl: "Sleep een vertrek om het te verschuiven · klik op de as om er een toe te voegen · Delete haalt het gekozen vertrek weg · het wieltje zoomt"
  pl: "Przeciągnij odjazd, aby go przesunąć · kliknij oś, aby dodać nowy · Delete usuwa wybrany · kółko przybliża"
  ru: "Перетащите отправление, чтобы сдвинуть его · щёлкните по оси, чтобы добавить · Delete убирает выбранное · колёсико меняет масштаб"
  uk: "Перетягніть відправлення, щоб зсунути його · клацніть по осі, щоб додати · Delete прибирає вибране · коліщатко змінює масштаб"
"The wheel over the departures zooms into the hours":
  de: "Das Mausrad über den Abfahrten zoomt in die Stunden"
  fr: "La molette sur les départs zoome sur les heures"
  nl: "Het wieltje boven de vertrekken zoomt in op de uren"
  pl: "Kółko nad odjazdami przybliża godziny"
  ru: "Колёсико над отправлениями приближает часы"
  uk: "Коліщатко над відправленнями наближає години"
"Whole day":
  de: "Ganzer Tag"
  fr: "Journée entière"
  nl: "Hele dag"
  pl: "Cały dzień"
  ru: "Весь день"
  uk: "Увесь день"
"%{n} departures":
  de: "%{n} Abfahrten"
  fr: "%{n} départs"
  nl: "%{n} vertrekken"
  pl: "%{n} odjazdów"
  ru: "%{n} отправлений"
  uk: "%{n} відправлень"
"Other trips":
  de: "Andere Fahrten"
  fr: "Autres courses"
  nl: "Overige ritten"
  pl: "Inne kursy"
  ru: "Другие рейсы"
  uk: "Інші рейси"
"Choose a departure on the axis or in the list: drag it, type its time, or take it out.":
  de: "Eine Abfahrt auf der Achse oder in der Liste wählen: ziehen, ihre Zeit eintippen oder sie herausnehmen."
  fr: "Choisissez un départ sur l'axe ou dans la liste : faites-le glisser, tapez son heure ou retirez-le."
  nl: "Kies een vertrek op de as of in de lijst: sleep het, typ de tijd of haal het weg."
  pl: "Wybierz odjazd na osi lub na liście: przeciągnij go, wpisz godzinę albo go usuń."
  ru: "Выберите отправление на оси или в списке: перетащите его, введите время или уберите его."
  uk: "Виберіть відправлення на осі або в списку: перетягніть його, введіть час або приберіть його."
"Tours: the buses it needs (%{n})":
