  fr: "Services : les bus qu'il lui faut (%{n})"
  nl: "Omlopen: de bussen die ze nodig heeft (%{n})"
  pl: "Brygady: autobusy, których potrzebuje (%{n})"
  ru: "Выходы: нужные ей автобусы (%{n})"
  uk: "Обороти: потрібні їй автобуси (%{n})"
