  pl: "Kilometry dziennie"
  ru: "Километров в день"
  uk: "Кілометрів на день"
"At the busiest it needs %{n} buses; the fleet has %{have} for the line.":
  de: "Zur Spitze braucht sie %{n} Busse; die Flotte hat %{have} für die Linie."
  fr: "Au plus fort, il lui faut %{n} bus ; la flotte en a %{have} pour la ligne."
  nl: "Op het drukst heeft ze %{n} bussen nodig; de vloot heeft er %{have} voor de lijn."
  pl: "W szczycie potrzebuje %{n} autobusów; flota ma %{have} dla tej linii."
  ru: "В пик ей нужно автобусов: %{n}; у парка для линии: %{have}."
  uk: "У пік їй потрібно автобусів: %{n}; у парку для лінії: %{have}."
"The fleet has %{have} buses for the line.":
  de: "Die Flotte hat %{have} Busse für die Linie."
  fr: "La flotte a %{have} bus pour la ligne."
  nl: "De vloot heeft %{have} bussen voor de lijn."
  pl: "Flota ma %{have} autobusów dla tej linii."
  ru: "У парка для линии автобусов: %{have}."
  uk: "У парку для лінії автобусів: %{have}."
"Tours of every day":
  de: "Umläufe aller Tage"
