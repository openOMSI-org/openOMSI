  ru: "Списком"
  uk: "Списком"
"Close without saving the changes?":
  de: "Ohne Speichern der Änderungen schließen?"
  fr: "Fermer sans enregistrer les modifications ?"
  nl: "Sluiten zonder de wijzigingen op te slaan?"
  pl: "Zamknąć bez zapisywania zmian?"
  ru: "Закрыть, не сохранив изменения?"
  uk: "Закрити, не зберігши зміни?"
"Close without saving":
  de: "Ohne Speichern schließen"
  fr: "Fermer sans enregistrer"
  nl: "Sluiten zonder opslaan"
  pl: "Zamknij bez zapisu"
  ru: "Закрыть без сохранения"
  uk: "Закрити без збереження"
"Keep changing":
  de: "Weiter ändern"
  fr: "Continuer à modifier"
  nl: "Verder wijzigen"
  pl: "Zmieniaj dalej"
  ru: "Продолжить изменять"
  uk: "Продовжити змінювати"
"Save from %{date}":
  de: "Ab %{date} speichern"
  fr: "Enregistrer à partir du %{date}"
  nl: "Opslaan vanaf %{date}"
  pl: "Zapisz od %{date}"
  ru: "Сохранить с %{date}"
  uk: "Зберегти з %{date}"
"Undo":
  de: "Rückgängig"
  fr: "Annuler"
  nl: "Ongedaan maken"
  pl: "Cofnij"
  ru: "Отменить"
  uk: "Скасувати"
"Start again":
  de: "Von vorn"
  fr: "Recommencer"
  nl: "Opnieuw beginnen"
  pl: "Zacznij od nowa"
  ru: "Начать заново"
  uk: "Почати знову"
"The line's timetable as it is saved":
  de: "Der Fahrplan der Linie, wie er gespeichert ist"
  fr: "L'horaire de la ligne tel qu'il est enregistré"
  nl: "De dienstregeling van de lijn zoals die is opgeslagen"
  pl: "Rozkład linii w zapisanej postaci"
  ru: "Расписание линии в сохранённом виде"
  uk: "Розклад лінії у збереженому вигляді"
"No changes yet.":
  de: "Noch keine Änderungen."
  fr: "Aucune modification pour l'instant."
  nl: "Nog geen wijzigingen."
  pl: "Na razie bez zmian."
  ru: "Изменений пока нет."
  uk: "Змін поки немає."
"Today's tours run as they are.":
  de: "Die heutigen Umläufe fahren, wie sie sind."
  fr: "Les services d'aujourd'hui roulent tels quels."
  nl: "De omlopen van vandaag rijden zoals ze zijn."
  pl: "Dzisiejsze brygady kursują bez zmian."
  ru: "Сегодняшние выходы идут как есть."
  uk: "Сьогоднішні обороти йдуть як є."
"Saved, it counts at once.":
  de: "Gespeichert gilt es sofort."
  fr: "Une fois enregistré, cela vaut tout de suite."
  nl: "Opgeslagen telt het meteen."
  pl: "Po zapisaniu obowiązuje od razu."
  ru: "После сохранения действует сразу."
  uk: "Після збереження діє одразу."
"Changed meanwhile":
  de: "Inzwischen geändert"
  fr: "Modifié entre-temps"
  nl: "Intussen gewijzigd"
  pl: "W międzyczasie zmieniono"
  ru: "Изменено тем временем"
  uk: "Тим часом змінено"
"The line's timetable was changed meanwhile - in the line editor, or its new timetable began: it is shown as it is now.":
  de: "Der Fahrplan der Linie wurde inzwischen geändert - im Linieneditor, oder ihr neuer Fahrplan hat begonnen: Er wird gezeigt, wie er jetzt ist."
  fr: "L'horaire de la ligne a été modifié entre-temps - dans l'éditeur de lignes, ou son nouvel horaire a commencé : il est affiché tel qu'il est maintenant."
  nl: "De dienstregeling van de lijn is intussen gewijzigd - in de lijneditor, of haar nieuwe dienstregeling is begonnen: hij staat hier zoals hij nu is."
  pl: "Rozkład linii zmieniono w międzyczasie - w edytorze linii albo zaczął się jej nowy rozkład: pokazano go w obecnej postaci."
  ru: "Расписание линии тем временем изменилось - в редакторе линий, или началось её новое расписание: оно показано таким, как сейчас."
  uk: "Розклад лінії тим часом змінився - у редакторі ліній, або почався її новий розклад: його показано таким, як зараз."
"There is no content folder to write the timetable into.":
  de: "Es gibt keinen Inhaltsordner, in den der Fahrplan geschrieben werden kann."
  fr: "Il n'y a pas de dossier de contenu où écrire l'horaire."
  nl: "Er is geen inhoudsmap om de dienstregeling in te schrijven."
  pl: "Brak folderu zawartości, do którego można zapisać rozkład."
  ru: "Нет папки содержимого, куда записать расписание."
  uk: "Немає теки вмісту, куди записати розклад."
"Line %{n} saved.":
  de: "Linie %{n} gespeichert."
  fr: "Ligne %{n} enregistrée."
  nl: "Lijn %{n} opgeslagen."
  pl: "Linia %{n} zapisana."
  ru: "Линия %{n} сохранена."
  uk: "Лінію %{n} збережено."
"Line %{n} saved: %{k} of its tours to plan anew.":
  de: "Linie %{n} gespeichert: %{k} ihrer Umläufe neu zu planen."
  fr: "Ligne %{n} enregistrée : %{k} de ses services à planifier à nouveau."
  nl: "Lijn %{n} opgeslagen: %{k} van haar omlopen opnieuw te plannen."
  pl: "Linia %{n} zapisana: %{k} jej brygad do zaplanowania od nowa."
  ru: "Линия %{n} сохранена: её выходов спланировать заново: %{k}."
  uk: "Лінію %{n} збережено: її оборотів спланувати заново: %{k}."
