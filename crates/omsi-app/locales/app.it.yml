"Wheels with a saved direction use their own setting under Controls → Game controllers.": "I volanti con una direzione salvata usano la propria impostazione in Comandi → Controller di gioco."
"INJURY RISK: TAKE YOUR HANDS OFF THE WHEEL. Keep hands and fingers clear before starting and throughout the test.": "RISCHIO DI LESIONI: TOGLI LE MANI DAL VOLANTE. Tieni mani e dita lontane prima di iniziare e per tutta la durata della prova."
"Start test": "Avvia la prova"
"Test strength": "Forza della prova"
"If the wheel barely moves, increase Test strength and retry. Keep your hands clear.": "Se il volante si muove appena, aumenta la forza della prova e riprova. Tieni le mani lontane."
