"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS non lo include. In modalità Desktop, in Konsole: sudo steamos-readonly disable, poi sudo pacman -S webkit2gtk-4.1, poi sudo steamos-readonly enable (un aggiornamento di SteamOS può rimuoverlo di nuovo). Vedi docs/USER_GUIDE.md."
