"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "Le modifiche hanno effetto alla prossima guida o dopo «Ricarica i controller salvati» nel menu dei controller del gioco."
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Quanto il bus in movimento riporta il volante dritto dopo una curva; a bus fermo non tira mai."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Quanto il volante si oppone ai movimenti rapidi, così che lasciato andare si fermi al centro invece di oltrepassarlo; aumentalo se il volante oscilla."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Quanto è pesante girare il volante a bus fermo o quasi fermo; si alleggerisce quando il bus si muove."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Alza le forze più piccole oltre la soglia in cui il volante inizia a trasmetterle; utile sui volanti a cinghia o a ingranaggi con un punto morto al centro, lascia a 0 sui direct drive."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Ammorbidisce i salti improvvisi della forza dello sterzo, che sui volanti potenti a frame rate bassi possono sembrare granulosi; valori più alti aggiungono un piccolo ritardo."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Intensità complessiva delle forze dello sterzo su questo volante; abbassala su una base direct drive potente, alzala su un volante debole."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Intensità complessiva di scossoni, urti contro il marciapiede e tremolio della strada e del motore su questo volante."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Disattivato: il gioco non invia forze al volante; l'eventuale resistenza rimasta viene dal software driver del volante stesso (per esempio la molla di centraggio in Logitech G HUB)"
