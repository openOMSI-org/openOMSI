"Radio stations": "Stazioni radio"
"A radio's station button n plays the n-th station, a cassette player the first; Shift+R steps through them. An address is an MP3, AAC or Ogg stream or an .m3u/.pls playlist.": "Il tasto stazione n di una radio riproduce l'n-esima stazione, un mangianastri la prima; Maiusc+R le scorre. Un indirizzo è uno stream MP3, AAC o Ogg o una playlist .m3u/.pls."
"Add a station": "Aggiungi una stazione"
"Remove this station": "Rimuovi questa stazione"
"Address": "Indirizzo"
"Road texture vibration": "Vibrazione del fondo stradale"
"Engine vibration": "Vibrazione del motore"
"Vibration fade-out": "Dissolvenza della vibrazione"
"Zoom on a key": "Zoom su un tasto"
"How far the view zooms while the zoom key is held (Controls: Zoom while held)": "Quanto la vista si avvicina finché si tiene premuto il tasto di zoom (Comandi: Zoom tenendo premuto)"
"Zoom key stays": "Il tasto di zoom resta"
"One press zooms in, the next zooms out; off: only while the key is held": "Una pressione avvicina, la successiva allontana; spento: solo finché il tasto è premuto"
"Zoom while held": "Zoom tenendo premuto"
"Flashlight follows the cursor": "La torcia segue il cursore"
"With the cursor free (on foot, or in the cab while the mouse does not steer) the flashlight lights where it points; otherwise straight ahead": "Con il cursore libero (a piedi, o in cabina mentre il mouse non sterza) la torcia illumina dove punta; altrimenti dritto davanti"
