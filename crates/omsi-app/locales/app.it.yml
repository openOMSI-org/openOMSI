"Current time": "Ora attuale"
"Current date": "Data attuale"
"Pedal keys speed": "Velocità dei tasti dei pedali"
"How fast the throttle and brake keys press their pedals; slower is finer": "Quanto rapidamente i tasti di acceleratore e freno premono i pedali; più lento è più preciso"
