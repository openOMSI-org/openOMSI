"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Amb quina força l'autobús en marxa torna el volant a la posició recta després d'un revolt; mai no estira amb l'autobús aturat."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Quant es resisteix el volant als moviments ràpids, perquè en deixar-lo anar s'aturi al centre en lloc de passar-se'n; apuja-ho si el volant oscil·la."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Com de pesat és el volant amb l'autobús aturat o gairebé aturat; s'alleugereix quan l'autobús roda."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Eleva les forces més petites per sobre del punt en què el volant les comença a transmetre; útil en volants de corretja o d'engranatges amb un centre mort, deixa-ho a 0 en direct drive."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Suavitza els salts bruscos de la força de la direcció, que es poden notar granulosos en volants potents amb pocs fotogrames per segon; els valors alts hi afegeixen un petit retard."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Intensitat general de les forces de la direcció en aquest volant; abaixa-la en una base direct drive potent, apuja-la en un volant feble."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Intensitat general de les sotragades, els cops contra la vorera i la tremolor de la carretera i del motor en aquest volant."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Desactivat: el joc no envia cap força al volant; la resistència que quedi ve del programari del controlador del mateix volant (per exemple, la molla de centrat del Logitech G HUB)"
