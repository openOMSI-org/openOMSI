"Invert force feedback by default": "Inverteix el retorn de força per defecte"
"Wheels with a saved direction use their own setting under Controls → Game controllers.": "Els volants amb un sentit desat fan servir el seu propi ajust a Controls → Dispositius de joc."
"INJURY RISK: TAKE YOUR HANDS OFF THE WHEEL. Keep hands and fingers clear before starting and throughout the test.": "RISC DE LESIONS: TREU LES MANS DEL VOLANT. Mantén les mans i els dits allunyats abans de començar i durant tota la prova."
"Start test": "Inicia la prova"
"Test strength": "Intensitat de la prova"
"If the wheel barely moves, increase Test strength and retry. Keep your hands clear.": "Si el volant gairebé no es mou, augmenta la intensitat de la prova i torna-ho a provar. Mantén les mans allunyades."
"The wheel did not move enough. Retry or choose the direction manually.": "El volant no s'ha mogut prou. Torna-ho a provar o tria el sentit manualment."
"Direction detected: normal": "Sentit detectat: normal"
"Direction detected: inverted": "Sentit detectat: invertit"
"Testing: keep your hands off the wheel...": "Provant: mantén les mans fora del volant..."
"If detection is inconclusive, retry or choose the direction manually. You can change it later on this device's page.": "Si la detecció no és concloent, torna-ho a provar o tria el sentit manualment. El podràs canviar més endavant a la pàgina del dispositiu."
"The test was interrupted. Please try again.": "La prova s'ha interromput. Torna-ho a provar."
"The wheel is unavailable. Reconnect it and try again.": "El volant no està disponible. Torna'l a connectar i torna-ho a provar."
"Move the wheel away from its end stops and try again.": "Allunya el volant dels topalls i torna-ho a provar."
"The wheel did not settle. Let go and try again.": "El volant no s'ha estabilitzat. Deixa'l anar i torna-ho a provar."
"The wheel moved too far. Test stopped.": "El volant s'ha mogut massa. Prova aturada."
"The result is inconclusive. Retry or choose the direction manually.": "El resultat no és concloent. Torna-ho a provar o tria el sentit manualment."
"Force feedback is unavailable. Choose the direction manually.": "El retorn de força no està disponible. Tria el sentit manualment."
