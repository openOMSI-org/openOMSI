"NVIDIA DLSS runtime (optional)": "Entorn d'execució NVIDIA DLSS (opcional)"
"Not included with openOMSI. Installs NVIDIA's own DLLs only after your approval. Windows, NVIDIA RTX and a game restart required.": "No s'inclou amb openOMSI. Instal·la les DLL pròpies de NVIDIA només amb la vostra aprovació. Cal Windows, NVIDIA RTX i reiniciar el joc."
"Checking NVIDIA DLSS files…": "S'estan comprovant els fitxers de NVIDIA DLSS…"
"NVIDIA DLSS runtime is installed.": "L'entorn d'execució NVIDIA DLSS està instal·lat."
"DLSS files are not installed. The game works without them.": "Els fitxers de DLSS no estan instal·lats. El joc funciona sense ells."
"NVIDIA RTX/NGX license": "Llicència de NVIDIA RTX/NGX"
"Streamline MIT license": "Llicència MIT de Streamline"
"View official NVIDIA SDK 2.14.1": "Mostra l'SDK oficial de NVIDIA 2.14.1"
"I have read and agree to NVIDIA's applicable Streamline and RTX/NGX license terms. The launcher will download the SDK directly from NVIDIA and install the four verified DLSS DLLs plus notices.": "He llegit i accepto les condicions de llicència de NVIDIA aplicables a Streamline i RTX/NGX. El llançador baixarà l'SDK directament de NVIDIA i instal·larà les quatre DLL de DLSS verificades i els avisos."
"Downloading and verifying NVIDIA DLSS…": "S'està baixant i verificant NVIDIA DLSS…"
"Install NVIDIA DLSS": "Instal·la NVIDIA DLSS"
"NVIDIA DLSS installed. Restarting the launcher to refresh available upscalers.": "NVIDIA DLSS instal·lat. Es reinicia el llançador per actualitzar els escaladors disponibles."
"The NVIDIA runtime was not found after installation": "No s'ha trobat l'entorn de NVIDIA després de la instal·lació"
