"Welcome to openOMSI": "Benvingut a openOMSI"
"Drive the buses of OMSI 2 wherever you are: its maps, its buses and its lines, at your fingertips.": "Condueix els autobusos d'OMSI 2 siguis on siguis: els seus mapes, els seus autobusos i les seves línies, a l'abast dels dits."
