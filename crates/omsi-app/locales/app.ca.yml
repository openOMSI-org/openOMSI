"Ultra performance": "Ultrarendiment"
"Upscaling quality": "Qualitat de l'escalat"
"Native keeps the window's resolution and only smooths the edges; the lower the quality, the smaller the picture is drawn and the higher the frame rate": "La nativa manté la resolució de la finestra i només suavitza les vores; com més baixa és la qualitat, més petita es dibuixa la imatge i més alta és la freqüència de fotogrames"
"Frame generation": "Generació de fotogrames"
"Shows a generated frame between every two drawn ones: smoother motion for a little more input lag. Needs Apple MetalFX upscaling and works best from 30 drawn frames a second; with V-sync the game draws half the display's rate": "Mostra un fotograma generat entre cada dos de dibuixats: moviment més fluid a canvi d'una mica més de retard d'entrada. Necessita l'escalat Apple MetalFX i funciona millor a partir de 30 fotogrames dibuixats per segon; amb V-sync el joc dibuixa la meitat de la freqüència de la pantalla"
"Standard Catmull-Rom or AMD FSR 1 change at once; NVIDIA DLSS or AMD FSR 3 take the place of the anti-aliasing and the render scale, on DirectX 12 or Vulkan, from the next start": "El Catmull-Rom estàndard o l'AMD FSR 1 canvien de seguida; NVIDIA DLSS o AMD FSR 3 substitueixen l'antialiàsing i l'escala de renderització, amb DirectX 12 o Vulkan, a partir del proper inici"
"Standard Catmull-Rom or AMD FSR 1 change at once; Apple MetalFX takes the place of the anti-aliasing and the render scale, from the next start": "El Catmull-Rom estàndard o l'AMD FSR 1 canvien de seguida; Apple MetalFX substitueix l'antialiàsing i l'escala de renderització, a partir del proper inici"
