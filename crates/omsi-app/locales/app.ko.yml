"openOMSI {version} does not start on this computer, and it could not heal itself.\n\nDownload the latest version: {url}\n\nThe start's log: {log}\nTo report it, attach a support package: openomsi --export-diagnostics support.json": "openOMSI {version}이(가) 이 컴퓨터에서 시작되지 않으며, 스스로 복구하지도 못했습니다.\n\n최신 버전을 내려받으세요: {url}\n\n시작 로그: {log}\n신고하려면 지원 패키지를 첨부하세요: openomsi --export-diagnostics support.json"
"Open the download page": "다운로드 페이지 열기"
"OK": "확인"
"Open the download page now?": "지금 다운로드 페이지를 열까요?"
"The openOMSI launcher ({launcher}) was not found. It belongs in the same folder as the game ({folder}).\n\nPlease download openOMSI again and keep all of its files together.": "openOMSI 런처({launcher})를 찾지 못했습니다. 게임과 같은 폴더({folder})에 있어야 합니다.\n\nopenOMSI를 다시 내려받고 모든 파일을 함께 두세요."
"The openOMSI launcher ({launcher}) could not be started: {why}.": "openOMSI 런처({launcher})를 시작할 수 없습니다: {why}."
"The openOMSI launcher ({launcher}) stopped right after it started ({why}).": "openOMSI 런처({launcher})가 시작하자마자 멈췄습니다 ({why})."
"Microsoft Edge WebView2 {version} is registered on this Windows, but its files are missing (removed by a clean-up tool?). Repair it: Settings > Apps > Installed apps > Microsoft Edge WebView2 Runtime > Modify > Repair, or install Microsoft's \"Evergreen Standalone Installer\" from https://developer.microsoft.com/microsoft-edge/webview2/": "Microsoft Edge WebView2 {version}이(가) 이 Windows에 등록되어 있지만 파일이 없습니다 (정리 도구가 지웠나요?). 복구하세요: 설정 > 앱 > 설치된 앱 > Microsoft Edge WebView2 Runtime > 수정 > 복구, 또는 https://developer.microsoft.com/microsoft-edge/webview2/ 에서 Microsoft의 \"Evergreen Standalone Installer\"를 설치하세요"
"Its log says: {error}": "로그 내용: {error}"
"Microsoft Edge WebView2 {version} is installed, so it is not missing.": "Microsoft Edge WebView2 {version}이(가) 설치되어 있으므로 빠진 것이 아닙니다."
"The openOMSI launcher shows its window with Microsoft Edge WebView2, which this Windows does not have yet.\n\nInstall it now with Microsoft's installer?": "openOMSI 런처는 Microsoft Edge WebView2로 창을 표시하는데, 이 Windows에는 아직 없습니다.\n\n지금 Microsoft 설치 프로그램으로 설치할까요?"
"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "로그는 openOMSI 데이터 폴더(launcher.log)에 있습니다. Microsoft Edge WebView2 {version}은(는) 설치되어 있습니다."
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "런처 창에는 Microsoft Edge WebView2가 필요합니다 (Windows 10과 11에 포함; 이전 시스템은: https://developer.microsoft.com/microsoft-edge/webview2/)."
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS에는 포함되어 있지 않습니다. 데스크톱 모드의 Konsole에서: sudo steamos-readonly disable, 그다음 sudo pacman -S webkit2gtk-4.1, 그다음 sudo steamos-readonly enable (SteamOS 업데이트가 다시 지울 수 있음). docs/USER_GUIDE.md를 참고하세요."
"this code was made by a game with LAN protocol {}, this one speaks {PROTOCOL} - both players need the same version": "이 코드는 LAN 프로토콜 {} 게임에서 만들어졌고, 이 게임은 {PROTOCOL}입니다 - 두 플레이어의 버전이 같아야 합니다"
"the number {t} is not a port (1 to 65535)": "숫자 {t}은(는) 포트(1~65535)가 아닙니다"
"the part after ':' must be a port (1 to 65535), not '{p}'": "':' 뒤에는 '{p}'이(가) 아니라 포트(1~65535)가 와야 합니다"
"the entry '{t}' is neither a session code (OMSI-XXXX-…), an address (192.168.1.20 or 192.168.1.20:27015), a port, nor empty (search)": "입력 '{t}'은(는) 세션 코드(OMSI-XXXX-…), 주소(192.168.1.20 또는 192.168.1.20:27015), 포트, 빈칸(검색) 중 어느 것도 아닙니다"
"the entry '{t}': the part after ':' must be a port (1 to 65535)": "입력 '{t}': ':' 뒤에는 포트(1~65535)가 와야 합니다"
"the entry '{t}' is neither a session code (OMSI-…), an address (192.168.1.20 or 192.168.1.20:27015) nor a port": "입력 '{t}'은(는) 세션 코드(OMSI-…), 주소(192.168.1.20 또는 192.168.1.20:27015), 포트 중 어느 것도 아닙니다"
"the computer {host} has no IPv4 address": "컴퓨터 {host}에 IPv4 주소가 없습니다"
"the entry '{t}' is neither a session code (OMSI-…), an address nor a port, and no computer of that name was found ({e})": "입력 '{t}'은(는) 세션 코드(OMSI-…), 주소, 포트 중 어느 것도 아니며, 그 이름의 컴퓨터도 찾지 못했습니다 ({e})"
"a session code has {} characters after OMSI- (this one has {n}) - copy the whole code": "세션 코드는 OMSI- 뒤에 {}자가 있습니다 (이 코드는 {n}자) - 코드 전체를 복사하세요"
"the character '{}' never appears in a session code - check the character that looks like it": "'{}' 문자는 세션 코드에 쓰이지 않습니다 - 비슷하게 생긴 문자를 확인하세요"
"the character '{}' is not part of a session code": "'{}' 문자는 세션 코드에 속하지 않습니다"
"the session code has a typo (its checksum does not match)": "세션 코드에 오타가 있습니다 (체크섬 불일치)"
"the host has sent you away from this session (reason: {why})": "호스트가 이 세션에서 추방했습니다 (사유: {why})"
"nothing to say": "보낼 내용이 없습니다"
"not connected to a session": "세션에 연결되어 있지 않습니다"
"not so fast: one line a second": "너무 빠릅니다: 1초에 한 줄"
"the host drives on {}, you on {} - you will not meet": "호스트는 {}, 당신은 {}에서 운전 중입니다 - 만나지 못합니다"
"the host has not answered for {:.0} s - the session is over (playing on alone; still trying, or type /reconnect)": "호스트가 {:.0}초 동안 응답하지 않습니다 - 세션이 끝났습니다 (혼자 계속 플레이 중; 계속 시도하거나 /reconnect 입력)"
"the address {} answers, but no session runs on port {port} there - check the port, or whether the host has started its game": "주소 {}은(는) 응답하지만 그곳의 포트 {port}에서 실행 중인 세션이 없습니다 - 포트를 확인하거나 호스트가 게임을 시작했는지 확인하세요"
"the host did not answer (another computer did: {r})": "호스트가 응답하지 않았습니다 (다른 컴퓨터가 응답함: {r})"
"no answer from {} within {:.0} s. Is the session still running, and was the whole code copied? The host's firewall must let the game receive UDP on port {port} (on Windows allow it for public networks too). If both of you are behind a mobile or carrier network that changes the port for every connection, the way cannot be opened: the host can forward UDP port {port} on the router, or you both use a VPN": "{}에서 {:.0}초 안에 응답이 없습니다. 세션이 아직 실행 중인가요? 코드를 전부 복사했나요? 호스트의 방화벽이 게임의 UDP 포트 {port} 수신을 허용해야 합니다 (Windows에서는 공용 네트워크도 허용). 둘 다 연결마다 포트를 바꾸는 모바일 또는 통신사 네트워크 뒤에 있다면 길을 열 수 없습니다: 호스트가 공유기에서 UDP 포트 {port}를 포워딩하거나, 둘 다 VPN을 사용하세요"
"the host runs LAN protocol {PROTOCOL}, your game an older one - both players need the same version of the game": "호스트는 LAN 프로토콜 {PROTOCOL}, 당신의 게임은 이전 프로토콜입니다 - 두 플레이어가 같은 버전의 게임을 써야 합니다"
"the host runs LAN protocol {PROTOCOL}, your game protocol {proto} - both players need the same version of the game": "호스트는 LAN 프로토콜 {PROTOCOL}, 당신의 게임은 프로토콜 {proto}입니다 - 두 플레이어가 같은 버전의 게임을 써야 합니다"
"wrong session code: this host now runs another session - ask for the current code": "잘못된 세션 코드: 이 호스트는 지금 다른 세션을 실행 중입니다 - 현재 코드를 물어보세요"
"the session is full ({} players)": "세션이 가득 찼습니다 (플레이어 {}명)"
