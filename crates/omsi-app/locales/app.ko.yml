"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "변경 사항은 다음 운전 때 또는 게임의 컨트롤러 메뉴에서 ‘저장된 컨트롤러 다시 불러오기’를 실행한 뒤 적용됩니다."
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "달리는 버스가 회전 후 핸들을 직진 위치로 되돌리는 세기입니다. 버스가 멈춰 있을 때는 절대 당기지 않습니다."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "빠른 움직임에 대한 핸들의 저항입니다. 손을 뗀 핸들이 중앙을 지나쳐 흔들리지 않고 중앙에 멈추게 합니다. 핸들이 흔들리면 높이세요."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "버스가 서 있거나 아주 천천히 움직일 때 핸들을 돌리는 무게입니다. 버스가 굴러가면 가벼워집니다."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "가장 작은 힘을 핸들이 느끼기 시작하는 지점 위로 끌어올립니다. 중앙에 데드존이 있는 벨트식·기어식 핸들에 유용하며, 다이렉트 드라이브에서는 0으로 두세요."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "낮은 프레임 레이트에서 강한 핸들에 거칠게 느껴질 수 있는 조향 힘의 급격한 변화를 부드럽게 합니다. 값을 높이면 약간의 지연이 생깁니다."
