"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Milyen erősen fordítja vissza a haladó busz a kormányt egyenesbe kanyar után; álló busznál sosem húz."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Mennyire áll ellen a kormány a gyors mozgásnak, hogy az elengedett kormány középen álljon meg, és ne lendüljön túl rajta; növeld, ha a kormány leng."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Milyen nehéz elforgatni a kormányt, amíg a busz áll vagy araszol; ahogy a busz gurul, könnyebb lesz."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "A legkisebb erőket a küszöb fölé emeli, ahonnan a kormányod érezhetővé teszi őket; szíjas és fogaskerekes kormányoknál hasznos, ha középen holtjáték van, direct drive esetén hagyd 0-n."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Kisimítja a kormányerő hirtelen ugrásait, amelyek erős kormányokon alacsony képkockasebességnél szemcsésnek érződhetnek; a nagyobb értékek kis késleltetést adnak."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "A kormányerők teljes erőssége ezen a kormányon; erős direct drive alapon csökkentsd, gyenge kormányon növeld."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "A rázkódások, a szegélyütések, valamint az út és a motor remegésének teljes erőssége ezen a kormányon."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Ki: a játék nem küld erőket a kormánynak; a megmaradó ellenállás a kormány saját illesztőprogramjából származik (például a középre húzó rugó a Logitech G HUB-ban)"
"The running engine buzzes in the wheel, felt even at a standstill": "A járó motor zümmög a kormányban, álló helyzetben is érezhetően"
