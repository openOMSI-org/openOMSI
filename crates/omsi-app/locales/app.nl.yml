"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Hoe sterk de rijdende bus het stuur na een bocht terugdraait naar rechtuit; bij stilstand trekt het nooit."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Hoeveel het stuur zich verzet tegen snelle bewegingen, zodat een losgelaten stuur in het midden tot rust komt in plaats van erdoorheen te zwaaien; verhoog het als het stuur slingert."
