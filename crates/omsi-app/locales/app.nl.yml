"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Tilt de kleinste krachten boven het punt waarop je stuur ze begint door te geven; handig bij riem- en tandwielsturen met een dood midden, laat op 0 bij direct drive."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Verzacht plotselinge sprongen in de stuurkracht die op sterke sturen bij een lage framerate korrelig kunnen aanvoelen; hogere waarden geven een kleine vertraging."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Totale sterkte van de stuurkrachten op dit stuur; verlaag op een sterke direct-drive-basis, verhoog op een zwak stuur."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Totale sterkte van schokken, stoeprandstoten en het trillen van weg en motor op dit stuur."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Uit: het spel stuurt het stuur geen krachten; eventuele resterende weerstand komt van de eigen driversoftware van het stuur (bijvoorbeeld de centreerveer in Logitech G HUB)"
