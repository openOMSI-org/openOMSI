"The openOMSI launcher ({launcher}) stopped right after it started ({why}).": "openOMSI ランチャー ({launcher}) は起動直後に停止しました ({why})。"
"Microsoft Edge WebView2 {version} is registered on this Windows, but its files are missing (removed by a clean-up tool?). Repair it: Settings > Apps > Installed apps > Microsoft Edge WebView2 Runtime > Modify > Repair, or install Microsoft's \"Evergreen Standalone Installer\" from https://developer.microsoft.com/microsoft-edge/webview2/": "Microsoft Edge WebView2 {version} はこの Windows に登録されていますが、ファイルがありません (クリーンアップツールで削除された?)。修復してください: 設定 > アプリ > インストールされているアプリ > Microsoft Edge WebView2 Runtime > 変更 > 修復、または Microsoft の \"Evergreen Standalone Installer\" を https://developer.microsoft.com/microsoft-edge/webview2/ からインストールしてください"
"Its log says: {error}": "ログの内容: {error}"
"Microsoft Edge WebView2 {version} is installed, so it is not missing.": "Microsoft Edge WebView2 {version} はインストール済みなので、不足していません。"
"The openOMSI launcher shows its window with Microsoft Edge WebView2, which this Windows does not have yet.\n\nInstall it now with Microsoft's installer?": "openOMSI ランチャーは Microsoft Edge WebView2 でウィンドウを表示しますが、この Windows にはまだありません。\n\nMicrosoft のインストーラーで今すぐインストールしますか?"
"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "ログは openOMSI のデータフォルダ (launcher.log) にあります。Microsoft Edge WebView2 {version} はインストール済みです。"
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "ランチャーのウィンドウには Microsoft Edge WebView2 が必要です (Windows 10 と 11 に標準搭載。古いシステムでは: https://developer.microsoft.com/microsoft-edge/webview2/)。"
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS には含まれていません。デスクトップモードの Konsole で: sudo steamos-readonly disable、次に sudo pacman -S webkit2gtk-4.1、次に sudo steamos-readonly enable (SteamOS の更新で再び削除されることがあります)。docs/USER_GUIDE.md を参照してください。"
"this code was made by a game with LAN protocol {}, this one speaks {PROTOCOL} - both players need the same version": "このコードは LAN プロトコル {} のゲームで作られましたが、このゲームは {PROTOCOL} です - 両方のプレイヤーが同じバージョンである必要があります"
"the number {t} is not a port (1 to 65535)": "数字 {t} はポート (1～65535) ではありません"
"the part after ':' must be a port (1 to 65535), not '{p}'": "':' の後はポート (1～65535) である必要があります。'{p}' ではありません"
"the entry '{t}' is neither a session code (OMSI-XXXX-…), an address (192.168.1.20 or 192.168.1.20:27015), a port, nor empty (search)": "入力 '{t}' はセッションコード (OMSI-XXXX-…)、アドレス (192.168.1.20 または 192.168.1.20:27015)、ポート、空欄 (検索) のいずれでもありません"
"the entry '{t}': the part after ':' must be a port (1 to 65535)": "入力 '{t}': ':' の後はポート (1～65535) である必要があります"
"the entry '{t}' is neither a session code (OMSI-…), an address (192.168.1.20 or 192.168.1.20:27015) nor a port": "入力 '{t}' はセッションコード (OMSI-…)、アドレス (192.168.1.20 または 192.168.1.20:27015)、ポートのいずれでもありません"
"the computer {host} has no IPv4 address": "コンピューター {host} には IPv4 アドレスがありません"
"the entry '{t}' is neither a session code (OMSI-…), an address nor a port, and no computer of that name was found ({e})": "入力 '{t}' はセッションコード (OMSI-…)、アドレス、ポートのいずれでもなく、その名前のコンピューターも見つかりませんでした ({e})"
"a session code has {} characters after OMSI- (this one has {n}) - copy the whole code": "セッションコードは OMSI- の後に {} 文字あります (このコードは {n} 文字) - コード全体をコピーしてください"
"the character '{}' never appears in a session code - check the character that looks like it": "文字 '{}' はセッションコードには使われません - 似た文字を確認してください"
"the character '{}' is not part of a session code": "文字 '{}' はセッションコードの一部ではありません"
"the session code has a typo (its checksum does not match)": "セッションコードに入力ミスがあります (チェックサムが一致しません)"
"the host has sent you away from this session (reason: {why})": "ホストによってこのセッションから退出させられました (理由: {why})"
"nothing to say": "送る内容がありません"
"not connected to a session": "セッションに接続していません"
"not so fast: one line a second": "速すぎます: 1秒に1行まで"
"the host drives on {}, you on {} - you will not meet": "ホストは {}、あなたは {} を走行中です - 出会うことはありません"
"the host has not answered for {:.0} s - the session is over (playing on alone; still trying, or type /reconnect)": "ホストから {:.0} 秒間応答がありません - セッションは終了しました (ひとりでプレイを続行中。再接続を試みています。または /reconnect と入力)"
"the address {} answers, but no session runs on port {port} there - check the port, or whether the host has started its game": "アドレス {} は応答しますが、そこではポート {port} でセッションが動いていません - ポートを確認するか、ホストがゲームを開始したか確認してください"
"the host did not answer (another computer did: {r})": "ホストは応答しませんでした (別のコンピューターが応答: {r})"
"no answer from {} within {:.0} s. Is the session still running, and was the whole code copied? The host's firewall must let the game receive UDP on port {port} (on Windows allow it for public networks too). If both of you are behind a mobile or carrier network that changes the port for every connection, the way cannot be opened: the host can forward UDP port {port} on the router, or you both use a VPN": "{} から {:.0} 秒以内に応答がありません。セッションはまだ動いていますか? コードは全部コピーしましたか? ホストのファイアウォールで、ゲームがポート {port} の UDP を受信できるよう許可する必要があります (Windows ではパブリックネットワークでも許可)。両方が接続ごとにポートを変えるモバイル回線やキャリア回線の下にいる場合、経路を開けません: ホストがルーターで UDP ポート {port} を転送するか、両方で VPN を使ってください"
"the host runs LAN protocol {PROTOCOL}, your game an older one - both players need the same version of the game": "ホストは LAN プロトコル {PROTOCOL}、あなたのゲームは古いプロトコルです - 両方のプレイヤーが同じバージョンのゲームを使う必要があります"
"the host runs LAN protocol {PROTOCOL}, your game protocol {proto} - both players need the same version of the game": "ホストは LAN プロトコル {PROTOCOL}、あなたのゲームはプロトコル {proto} です - 両方のプレイヤーが同じバージョンのゲームを使う必要があります"
"wrong session code: this host now runs another session - ask for the current code": "セッションコードが違います: このホストは今は別のセッションを動かしています - 現在のコードを聞いてください"
"the session is full ({} players)": "セッションは満員です ({} 人)"
"the host is letting other players in - try again in a minute": "ホストが他のプレイヤーを入室させています - 1分後にもう一度試してください"
"this session needs the game's hardware identifier: update the game": "このセッションにはゲームの端末識別子が必要です: ゲームを更新してください"
"the host runs LAN protocol {proto}, this game protocol {PROTOCOL}": "ホストは LAN プロトコル {proto}、このゲームはプロトコル {PROTOCOL} です"
"the host answered with session {} instead of {}": "ホストはセッション {} で応答しました (期待したのは {})"
