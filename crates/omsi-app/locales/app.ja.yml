"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "変更は次回の運転時、またはゲームのコントローラーメニューで「保存したコントローラーを再読み込み」を実行した後に反映されます。"
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "走行中のバスがカーブの後にハンドルを直進位置へ戻す強さです。停車中は引っ張りません。"
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "速い動きに対するハンドルの抵抗です。手を離したハンドルが中央を行き過ぎずに中央で止まります。ハンドルが揺れ続ける場合は上げてください。"
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "バスが停車中や徐行中のハンドルの重さです。バスが動き出すと軽くなります。"
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "最も小さな力を、ハンドルが感じ取れるようになる点より上に持ち上げます。中央に不感帯があるベルト式・ギア式のハンドルに有効です。ダイレクトドライブでは 0 のままにしてください。"
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "低いフレームレートで強力なハンドルにザラザラと感じられる、ステアリングの力の急な段差を和らげます。値を上げると少し遅れが出ます。"
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "このハンドルにかかるステアリングの力全体の強さです。強力なダイレクトドライブのベースでは下げ、力の弱いハンドルでは上げてください。"
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "このハンドルに伝わる揺れ、縁石の衝撃、路面とエンジンの振動全体の強さです。"
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "オフ：ゲームはハンドルに力を送りません。残る抵抗はハンドル自体のドライバーソフトウェアによるものです（例：Logitech G HUB のセンタースプリング）"
"The running engine buzzes in the wheel, felt even at a standstill": "動いているエンジンの振動がハンドルに伝わり、停車中でも感じられます"
