"The folder {root} does not exist: choose the folder of the original OMSI 2 (with Omsi.exe, maps and Vehicles in it) under Setup.": "フォルダ {root} は存在しません: セットアップでオリジナルの OMSI 2 のフォルダ (Omsi.exe、maps、Vehicles があるもの) を選んでください。"
"The folder {root} is openOMSI's own folder, not OMSI 2's: choose the folder of the original game (with Omsi.exe in it) under Setup.": "フォルダ {root} は openOMSI 自身のフォルダで、OMSI 2 のものではありません: セットアップでオリジナルゲームのフォルダ (Omsi.exe があるもの) を選んでください。"
"The folder {root} is not a complete OMSI 2 - it lacks {}. openOMSI plays on the original's stock content: choose the folder of a complete installation under Setup.": "フォルダ {root} は完全な OMSI 2 ではありません - {} がありません。openOMSI はオリジナルの標準コンテンツで動作します: セットアップで完全なインストールのフォルダを選んでください。"
