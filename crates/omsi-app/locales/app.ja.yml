"openOMSI {from} could not start on this computer.\n\nIt has updated itself to {to} and starts again now.": "openOMSI {from} はこのコンピューターで起動できませんでした。\n\n{to} に自動更新し、今から再起動します。"
"openOMSI {from} could not start on this computer.\n\nIt went back to {to}, which ran here, and starts again now. {from} will not be installed again, only a newer version.": "openOMSI {from} はこのコンピューターで起動できませんでした。\n\nここで動作していた {to} に戻し、今から再起動します。{from} は今後インストールされず、より新しいバージョンのみがインストールされます。"
"The project lists openOMSI {from} as broken.\n\nIt was replaced by {to} and starts again now.": "プロジェクトは openOMSI {from} を不具合ありとしています。\n\n{to} に置き換え、今から再起動します。"
"The project lists openOMSI {from} as broken: {why}.\n\nIt was replaced by {to} and starts again now.": "プロジェクトは openOMSI {from} を不具合ありとしています: {why}。\n\n{to} に置き換え、今から再起動します。"
"openOMSI {version} could not start on this computer, and there is no newer or earlier version for it yet.\n\nIt tries once more in safe mode (simple graphics, no plugins).": "openOMSI {version} はこのコンピューターで起動できませんでした。また、より新しいバージョンも以前のバージョンもまだありません。\n\nセーフモード (シンプルなグラフィック、プラグインなし) でもう一度試します。"
"openOMSI {version} does not start on this computer, and it could not heal itself.\n\nDownload the latest version: {url}\n\nThe start's log: {log}\nTo report it, attach a support package: openomsi --export-diagnostics support.json": "openOMSI {version} はこのコンピューターで起動せず、自動修復もできませんでした。\n\n最新バージョンをダウンロードしてください: {url}\n\n起動ログ: {log}\n報告するにはサポートパッケージを添付してください: openomsi --export-diagnostics support.json"
"Open the download page": "ダウンロードページを開く"
"OK": "OK"
"Open the download page now?": "今すぐダウンロードページを開きますか?"
"The openOMSI launcher ({launcher}) was not found. It belongs in the same folder as the game ({folder}).\n\nPlease download openOMSI again and keep all of its files together.": "openOMSI ランチャー ({launcher}) が見つかりませんでした。ゲームと同じフォルダ ({folder}) にあるはずです。\n\nopenOMSI をもう一度ダウンロードし、すべてのファイルを一緒に置いてください。"
