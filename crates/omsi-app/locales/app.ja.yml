"nothing in it the game would use": "ゲームが使うものが入っていません"
"the disk is almost full ({free} free) - stopped unpacking and removed the partial files": "ディスクがほぼいっぱいです (空き {free}) - 展開を中止し、途中のファイルを削除しました"
"{name} is a folder; the mod's file of that name was not installed over it": "{name} はフォルダです。同名の Mod のファイルで上書きしませんでした"
"{name} is not a readable 7z archive": "{name} は読み込める 7z アーカイブではありません"
"{name} is not a readable RAR archive": "{name} は読み込める RAR アーカイブではありません"
"{name} is a multi-volume RAR archive; add all parts and start with the first .rar file": "{name} は分割 RAR アーカイブです。すべてのパートを追加し、最初の .rar ファイルから始めてください"
"not enough disk space to unpack {name}: {size} plus {margin} kept free needs {needed}, but only {free} is free on {disk}": "{name} を展開する空き容量が足りません: {size} と余裕分 {margin} で {needed} 必要ですが、{disk} の空きは {free} しかありません"
"unsafe 7z path refused: {path}": "安全でない 7z パスを拒否しました: {path}"
"unpacking {name} (the archive may be damaged or encrypted)": "{name} を展開中 (アーカイブが破損しているか暗号化されている可能性があります)"
"unsafe RAR path refused: {path}": "安全でない RAR パスを拒否しました: {path}"
"{encrypted} file(s) in the archive are password protected - unpack it with the password first and install the folder": "アーカイブ内の {encrypted} 個のファイルはパスワードで保護されています - 先にパスワードを使って展開し、そのフォルダをインストールしてください"
"{c} file(s) are packed with {m}, which the launcher cannot unpack - unpack the archive with the system's tool and install the folder": "{c} 個のファイルはランチャーが展開できない {m} で圧縮されています - システムのツールでアーカイブを展開し、そのフォルダをインストールしてください"
"{unsafe_names} file name(s) point outside the archive and were refused": "{unsafe_names} 個のファイル名がアーカイブの外を指しているため拒否しました"
"starting {game}": "{game} を起動中"
