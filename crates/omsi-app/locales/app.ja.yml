"process {pid} is no longer the game that was started (it has ended; the id now belongs to another program) - nothing was stopped": "プロセス {pid} はもう起動したゲームではありません (終了しており、ID は別のプログラムのものです) - 何も停止していません"
"could not stop process {pid}: {e}": "プロセス {pid} を停止できませんでした: {e}"
