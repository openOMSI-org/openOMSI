  pl: "Jak bardzo przechyla się widok, gdy przechylasz głowę (0 % utrzymuje poziomy horyzont)"
"Steadies the view against the tracker's trembling; big turns still follow at once (0 %: it only glides between the tracker's poses). For opentrack, choose its Accela filter there":
  nl: "Houdt het beeld rustig tegen het trillen van de tracker; grote draaien volgen nog steeds meteen (0 %: alleen glijden tussen de metingen van de tracker). Kies bij opentrack daar het filter Accela"
  de: "Beruhigt die Sicht gegen das Zittern des Trackers; große Drehungen folgen trotzdem sofort (0 %: nur Gleiten zwischen den Messungen des Trackers). Bei opentrack dort den Filter Accela wählen"
  fr: "Stabilise la vue contre les tremblements du tracker ; les grands mouvements suivent quand même aussitôt (0 % : seulement un glissement entre les mesures du tracker). Avec opentrack, choisissez-y le filtre Accela"
  ru: "Успокаивает вид от дрожания трекера; большие повороты по-прежнему отслеживаются сразу (0 %: только плавный переход между замерами трекера). Для opentrack выберите там фильтр Accela"
  uk: "Заспокоює вид від тремтіння трекера; великі повороти все одно відстежуються одразу (0 %: лише плавний перехід між вимірами трекера). Для opentrack виберіть там фільтр Accela"
  pl: "Uspokaja widok przed drżeniem trackera; duże obroty nadal są śledzone od razu (0 %: tylko płynne przejście między pomiarami trackera). W opentrack wybierz tam filtr Accela"
"Head movements smaller than this leave the view where it is, wherever you look":
  nl: "Hoofdbewegingen kleiner dan dit laten het beeld staan, waar je ook kijkt"
  de: "Kopfbewegungen, die kleiner sind, lassen die Sicht stehen, wohin du auch schaust"
  fr: "Les mouvements de tête plus petits laissent la vue en place, où que vous regardiez"
  ru: "Движения головы меньше этого не сдвигают вид, куда бы вы ни смотрели"
  uk: "Рухи голови, менші за це, не зсувають вид, куди б ви не дивилися"
  pl: "Ruchy głowy mniejsze niż ta wartość nie przesuwają widoku, gdziekolwiek patrzysz"
"Smoothing steadies the view against the tracker's trembling (big turns still follow at once); the dead zone leaves head movements smaller than it out. With opentrack, choose its Accela filter there.":
  nl: "Afvlakking houdt het beeld rustig tegen het trillen van de tracker (grote draaien volgen nog steeds meteen); de dode zone laat kleinere hoofdbewegingen weg. Kies bij opentrack daar het filter Accela."
  de: "Die Glättung beruhigt die Sicht gegen das Zittern des Trackers (große Drehungen folgen trotzdem sofort); die Totzone lässt kleinere Kopfbewegungen weg. Bei opentrack dort den Filter Accela wählen."
  fr: "Le lissage stabilise la vue contre les tremblements du tracker (les grands mouvements suivent quand même aussitôt) ; la zone morte ignore les mouvements de tête plus petits. Avec opentrack, choisissez-y le filtre Accela."
  ru: "Сглаживание успокаивает вид от дрожания трекера (большие повороты по-прежнему отслеживаются сразу); мёртвая зона отбрасывает меньшие движения головы. Для opentrack выберите там фильтр Accela."
  uk: "Згладжування заспокоює вид від тремтіння трекера (великі повороти все одно відстежуються одразу); мертва зона відкидає менші рухи голови. Для opentrack виберіть там фільтр Accela."
  pl: "Wygładzanie uspokaja widok przed drżeniem trackera (duże obroty nadal są śledzone od razu); strefa martwa pomija mniejsze ruchy głowy. W opentrack wybierz tam filtr Accela."
