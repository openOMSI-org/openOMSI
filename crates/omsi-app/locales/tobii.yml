"Head tracking with a Tobii eye tracker or opentrack (UDP port %{port}); Shift+F2 turns it on or off":
  nl: "Headtracking met een Tobii-eyetracker of opentrack (UDP-poort %{port}); Shift+F2 zet het aan of uit"
  de: "Headtracking mit einem Tobii-Eyetracker oder opentrack (UDP-Port %{port}); Umschalt+F2 schaltet es ein oder aus"
  fr: "Suivi de la tête avec un eye tracker Tobii ou opentrack (port UDP %{port}) ; Maj+F2 l'active ou le désactive"
  ru: "Отслеживание головы айтрекером Tobii или через opentrack (UDP-порт %{port}); Shift+F2 включает и выключает его"
  uk: "Відстеження голови айтрекером Tobii або через opentrack (UDP-порт %{port}); Shift+F2 вмикає і вимикає його"
  pl: "Śledzenie głowy eyetrackerem Tobii lub przez opentrack (port UDP %{port}); Shift+F2 włącza je i wyłącza"
"In the game, Shift+F1 takes where your head is as the middle and Shift+F2 turns head tracking on or off (keys you can change under Controls).":
  nl: "In het spel neemt Shift+F1 de plek van je hoofd als midden en zet Shift+F2 headtracking aan of uit (toetsen die je onder Besturing kunt wijzigen)."
  de: "Im Spiel nimmt Umschalt+F1 die Position deines Kopfes als Mitte, und Umschalt+F2 schaltet das Headtracking ein oder aus (Tasten, die du unter Steuerung ändern kannst)."
  fr: "En jeu, Maj+F1 prend la position de votre tête comme centre et Maj+F2 active ou désactive le suivi de la tête (touches modifiables dans Commandes)."
  ru: "В игре Shift+F1 принимает положение головы за центр, а Shift+F2 включает и выключает отслеживание головы (клавиши можно изменить в разделе «Управление»)."
  uk: "У грі Shift+F1 бере положення голови за центр, а Shift+F2 вмикає і вимикає відстеження голови (клавіші можна змінити в розділі «Керування»)."
  pl: "W grze Shift+F1 przyjmuje położenie głowy jako środek, a Shift+F2 włącza i wyłącza śledzenie głowy (klawisze można zmienić w Sterowaniu)."
