"How far the view tilts when you tilt your head (0 % keeps the horizon level)":
  nl: "Hoe ver het beeld kantelt als je je hoofd scheef houdt (0 % houdt de horizon recht)"
  de: "Wie weit sich die Sicht neigt, wenn du den Kopf neigst (0 % hält den Horizont gerade)"
  fr: "De combien la vue s'incline quand vous inclinez la tête (0 % garde l'horizon droit)"
