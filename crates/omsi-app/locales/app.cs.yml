"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Jak silně jedoucí autobus vrací volant po zatáčce do přímého směru; když autobus stojí, volant nikdy netáhne."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Jak moc volant klade odpor rychlému pohybu, aby se puštěný volant ustálil uprostřed a nepřekmitl přes střed; zvyšte, pokud volant kmitá."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Jak těžce se volant točí, když autobus stojí nebo se plíží; jakmile se rozjede, povolí."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Zvedne nejmenší síly nad práh, od kterého je váš volant začne přenášet; užitečné u volantů s řemenem nebo ozubeným převodem a mrtvým středem, u direct drive nechte 0."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Zjemní náhlé skoky síly řízení, které mohou na silných volantech při nízké snímkové frekvenci působit zrnitě; vyšší hodnoty přidají malé zpoždění."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Celková síla řízení na tomto volantu; na silné základně direct drive ji snižte, na slabém volantu zvyšte."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Celková síla otřesů, nárazů na obrubník a chvění vozovky a motoru na tomto volantu."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Vypnuto: hra volantu neposílá žádné síly; zbylý odpor pochází z vlastního ovladačového softwaru volantu (například středicí pružina v Logitech G HUB)"
