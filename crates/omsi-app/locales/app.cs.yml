"The project lists openOMSI {from} as broken: {why}.\n\nIt was replaced by {to} and starts again now.": "Projekt označil openOMSI {from} za vadné: {why}.\n\nBylo nahrazeno verzí {to} a nyní se znovu spouští."
"openOMSI {version} could not start on this computer, and there is no newer or earlier version for it yet.\n\nIt tries once more in safe mode (simple graphics, no plugins).": "openOMSI {version} se na tomto počítači nepodařilo spustit a zatím pro něj neexistuje novější ani starší verze.\n\nZkusí to ještě jednou v nouzovém režimu (jednoduchá grafika, bez pluginů)."
"openOMSI {version} does not start on this computer, and it could not heal itself.\n\nDownload the latest version: {url}\n\nThe start's log: {log}\nTo report it, attach a support package: openomsi --export-diagnostics support.json": "openOMSI {version} se na tomto počítači nespouští a nedokázalo se samo opravit.\n\nStáhněte nejnovější verzi: {url}\n\nProtokol spuštění: {log}\nPro nahlášení přiložte balíček podpory: openomsi --export-diagnostics support.json"
"Open the download page": "Otevřít stránku ke stažení"
"OK": "OK"
"Open the download page now?": "Otevřít nyní stránku ke stažení?"
"The openOMSI launcher ({launcher}) was not found. It belongs in the same folder as the game ({folder}).\n\nPlease download openOMSI again and keep all of its files together.": "Launcher openOMSI ({launcher}) nebyl nalezen. Patří do stejné složky jako hra ({folder}).\n\nStáhněte openOMSI znovu a ponechte všechny jeho soubory pohromadě."
"The openOMSI launcher ({launcher}) could not be started: {why}.": "Launcher openOMSI ({launcher}) se nepodařilo spustit: {why}."
"The openOMSI launcher ({launcher}) stopped right after it started ({why}).": "Launcher openOMSI ({launcher}) se zastavil hned po spuštění ({why})."
"Microsoft Edge WebView2 {version} is registered on this Windows, but its files are missing (removed by a clean-up tool?). Repair it: Settings > Apps > Installed apps > Microsoft Edge WebView2 Runtime > Modify > Repair, or install Microsoft's \"Evergreen Standalone Installer\" from https://developer.microsoft.com/microsoft-edge/webview2/": "Microsoft Edge WebView2 {version} je v tomto Windows registrován, ale chybí jeho soubory (odstranil je čisticí nástroj?). Opravte ho: Nastavení > Aplikace > Nainstalované aplikace > Microsoft Edge WebView2 Runtime > Upravit > Opravit, nebo nainstalujte \"Evergreen Standalone Installer\" od Microsoftu z https://developer.microsoft.com/microsoft-edge/webview2/"
"Its log says: {error}": "Jeho protokol uvádí: {error}"
"Microsoft Edge WebView2 {version} is installed, so it is not missing.": "Microsoft Edge WebView2 {version} je nainstalován, takže nechybí."
"The openOMSI launcher shows its window with Microsoft Edge WebView2, which this Windows does not have yet.\n\nInstall it now with Microsoft's installer?": "Launcher openOMSI zobrazuje okno pomocí Microsoft Edge WebView2, který tento Windows zatím nemá.\n\nNainstalovat ho nyní instalátorem od Microsoftu?"
"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "Jeho protokol je v datové složce openOMSI (launcher.log); Microsoft Edge WebView2 {version} je nainstalován."
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "Okno launcheru potřebuje Microsoft Edge WebView2 (součást Windows 10 a 11; pro starší systémy: https://developer.microsoft.com/microsoft-edge/webview2/)."
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS ho neobsahuje. V režimu plochy, v Konsole: sudo steamos-readonly disable, pak sudo pacman -S webkit2gtk-4.1, pak sudo steamos-readonly enable (aktualizace SteamOS ho může znovu odstranit). Viz docs/USER_GUIDE.md."
