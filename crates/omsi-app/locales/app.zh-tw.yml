"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "變更會在下次駕駛時生效，或在遊戲的控制器選單中執行「重新載入已儲存的控制器」後生效。"
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "行駛中的巴士在轉彎後將方向盤拉回正中的力道；巴士停止時絕不會拉動。"
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "方向盤對快速轉動的阻力，讓放開的方向盤停在中央而不會擺過頭；若方向盤來回擺動請調高。"
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "巴士停止或緩慢移動時轉動方向盤的沉重程度；巴士行駛起來後會變輕。"
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "將最小的力道提升到方向盤開始能感受到的門檻之上；適用於中央有死區的皮帶式和齒輪式方向盤，直驅方向盤請保持 0。"
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "柔化轉向力道的突然跳動，這在低影格率下的強力方向盤上可能感覺粗糙；數值越高會增加些許延遲。"
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "此方向盤上轉向力道的整體強度；強力的直驅底座請調低，力道弱的方向盤請調高。"
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "此方向盤上晃動、撞上路緣的衝擊以及路面與引擎震顫的整體強度。"
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "關閉：遊戲不會向方向盤傳送任何力道；剩下的阻力來自方向盤本身的驅動軟體（例如 Logitech G HUB 中的回中彈簧）"
"The running engine buzzes in the wheel, felt even at a standstill": "運轉中的引擎會在方向盤上嗡嗡震動，即使停著也感覺得到"
"On foot: W A S D walk, Shift runs, F4 free camera / F1 back, G sits down (by the driver's place: back at the wheel), Ctrl+Shift+G steps out of the bus": "步行：W A S D 行走，Shift 奔跑，F4 自由鏡頭／F1 返回，G 坐下（駕駛座位置：返回方向盤），Ctrl+Shift+G 下車"
