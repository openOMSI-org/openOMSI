_version: 2
# The bus company's clock with the real one: the company goes on while openOMSI is closed, is
# caught up when it is opened again, and says how far fast-forwarding moved it ahead.
"While you were away":
  de: "Während du weg warst"
  fr: "Pendant ton absence"
  nl: "Terwijl je weg was"
  pl: "Podczas twojej nieobecności"
  ru: "Пока вас не было"
  uk: "Поки вас не було"
"The company's time ran on with the real clock while you were away, from %{from} to %{until}. Days closed: %{n}, with a result of %{amount}.":
  de: "Die Firmenzeit lief mit der echten Uhr weiter, während du weg warst, vom %{from} bis zum %{until}. Abgeschlossene Tage: %{n}, mit einem Ergebnis von %{amount}."
  fr: "Le temps de l'entreprise a continué avec l'horloge réelle pendant ton absence, du %{from} au %{until}. Journées clôturées : %{n}, pour un résultat de %{amount}."
  nl: "De bedrijfstijd liep met de echte klok door terwijl je weg was, van %{from} tot %{until}. Afgesloten dagen: %{n}, met een resultaat van %{amount}."
  pl: "Czas firmy płynął dalej z prawdziwym zegarem podczas twojej nieobecności, od %{from} do %{until}. Zamknięte dni: %{n}, z wynikiem %{amount}."
  ru: "Время компании шло дальше вместе с реальными часами, пока вас не было, с %{from} по %{until}. Закрыто дней: %{n}, с результатом %{amount}."
  uk: "Час компанії йшов далі разом із реальним годинником, поки вас не було, з %{from} по %{until}. Закрито днів: %{n}, з результатом %{amount}."
"The company's time ran on with the real clock while you were away, from %{start} to %{end} today.":
  de: "Die Firmenzeit lief mit der echten Uhr weiter, während du weg warst, heute von %{start} bis %{end}."
  fr: "Le temps de l'entreprise a continué avec l'horloge réelle pendant ton absence, aujourd'hui de %{start} à %{end}."
  nl: "De bedrijfstijd liep met de echte klok door terwijl je weg was, vandaag van %{start} tot %{end}."
  pl: "Czas firmy płynął dalej z prawdziwym zegarem podczas twojej nieobecności, dziś od %{start} do %{end}."
  ru: "Время компании шло дальше вместе с реальными часами, пока вас не было, сегодня с %{start} до %{end}."
  uk: "Час компанії йшов далі разом із реальним годинником, поки вас не було, сьогодні з %{start} до %{end}."
"Not all caught up":
  de: "Nicht alles aufgeholt"
  fr: "Pas tout rattrapé"
  nl: "Niet alles ingehaald"
  pl: "Nie wszystko nadrobione"
  ru: "Наверстано не всё"
  uk: "Надолужено не все"
"You were away for longer than %{n} days: the company caught up %{n} days, and the rest was skipped.":
  de: "Du warst länger als %{n} Tage weg: Das Unternehmen hat %{n} Tage aufgeholt, der Rest wurde übersprungen."
  fr: "Tu as été absent plus de %{n} jours : l'entreprise a rattrapé %{n} jours, et le reste a été sauté."
  nl: "Je was langer dan %{n} dagen weg: het bedrijf heeft %{n} dagen ingehaald, de rest is overgeslagen."
  pl: "Nie było cię dłużej niż %{n} dni: firma nadrobiła %{n} dni, a resztę pominięto."
  ru: "Вас не было больше %{n} дней: компания наверстала %{n} дней, остальное пропущено."
  uk: "Вас не було понад %{n} днів: компанія надолужила %{n} днів, решту пропущено."
"%{d} d %{h} h":
  de: "%{d} T %{h} Std."
  fr: "%{d} j %{h} h"
  nl: "%{d} d %{h} u"
  pl: "%{d} d %{h} godz."
  ru: "%{d} д %{h} ч"
  uk: "%{d} д %{h} год"
