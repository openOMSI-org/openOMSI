  fr: "%{h} h"
  nl: "%{h} u"
  pl: "%{h} godz."
  ru: "%{h} ч"
  uk: "%{h} год"
"%{h} h %{m} min":
  de: "%{h} Std. %{m} Min."
  fr: "%{h} h %{m} min"
  nl: "%{h} u %{m} min"
  pl: "%{h} godz. %{m} min"
  ru: "%{h} ч %{m} мин"
  uk: "%{h} год %{m} хв"
"Catching up %{span} of the company's time…":
  de: "%{span} Firmenzeit werden aufgeholt…"
  fr: "Rattrapage de %{span} du temps de l'entreprise…"
  nl: "%{span} bedrijfstijd wordt ingehaald…"
  pl: "Nadrabianie %{span} czasu firmy…"
  ru: "Наверстываем %{span} времени компании…"
  uk: "Надолужуємо %{span} часу компанії…"
"Back to the real clock's pace":
  de: "Zurück zum Tempo der echten Uhr"
  fr: "Revenir au rythme de l'horloge réelle"
  nl: "Terug naar het tempo van de echte klok"
  pl: "Powrót do tempa prawdziwego zegara"
  ru: "Вернуться к темпу реальных часов"
  uk: "Повернутися до темпу реального годинника"
"The company's time stands still while it is closed: the real clock is off in the company's settings.":
  de: "Die Firmenzeit steht still, solange das Unternehmen geschlossen ist: Die echte Uhr ist in den Einstellungen des Unternehmens ausgeschaltet."
  fr: "Le temps de l'entreprise s'arrête tant qu'elle est fermée : l'horloge réelle est désactivée dans les réglages de l'entreprise."
  nl: "De bedrijfstijd staat stil zolang het bedrijf dicht is: de echte klok staat uit in de instellingen van het bedrijf."
  pl: "Czas firmy stoi, gdy jest zamknięta: prawdziwy zegar jest wyłączony w ustawieniach firmy."
  ru: "Время компании стоит, пока она закрыта: реальные часы выключены в настройках компании."
  uk: "Час компанії стоїть, поки її закрито: реальний годинник вимкнено в налаштуваннях компанії."
"In step with the real clock: the company's time goes on while openOMSI is closed, and is caught up when you open the company.":
  de: "Im Takt der echten Uhr: Die Firmenzeit läuft weiter, während openOMSI geschlossen ist, und wird aufgeholt, wenn du das Unternehmen öffnest."
  fr: "Au rythme de l'horloge réelle : le temps de l'entreprise continue quand openOMSI est fermé, et il est rattrapé quand tu ouvres l'entreprise."
  nl: "In de pas met de echte klok: de bedrijfstijd loopt door terwijl openOMSI dicht is, en wordt ingehaald als je het bedrijf opent."
  pl: "Zgodnie z prawdziwym zegarem: czas firmy płynie dalej, gdy openOMSI jest zamknięty, i jest nadrabiany, gdy otworzysz firmę."
  ru: "В такт с реальными часами: время компании идёт, пока openOMSI закрыт, и наверстывается, когда вы открываете компанию."
  uk: "У такт із реальним годинником: час компанії йде, поки openOMSI закрито, і надолужується, коли ви відкриваєте компанію."
"Fast-forwarded: %{span} ahead of the real clock.":
  de: "Vorgespult: %{span} vor der echten Uhr."
  fr: "Accéléré : %{span} d'avance sur l'horloge réelle."
  nl: "Vooruitgespoeld: %{span} voor op de echte klok."
  pl: "Przewinięto: %{span} przed prawdziwym zegarem."
  ru: "Перемотано: на %{span} впереди реальных часов."
  uk: "Перемотано: на %{span} попереду реального годинника."
"In step with the real clock":
  de: "Im Takt der echten Uhr"
  fr: "Au rythme de l'horloge réelle"
  nl: "In de pas met de echte klok"
  pl: "Zgodnie z prawdziwym zegarem"
  ru: "В такт с реальными часами"
  uk: "У такт із реальним годинником"
"×1: in step with the real clock. ×60: a minute a second; it stops for what needs you.":
  de: "×1: im Takt der echten Uhr. ×60: eine Minute pro Sekunde; sie hält an, wo du gebraucht wirst."
  fr: "×1 : au rythme de l'horloge réelle. ×60 : une minute par seconde ; elle s'arrête pour ce qui a besoin de toi."
  nl: "×1: in de pas met de echte klok. ×60: een minuut per seconde; hij stopt voor wat jou nodig heeft."
  pl: "×1: zgodnie z prawdziwym zegarem. ×60: minuta na sekundę; zatrzymuje się, gdy jesteś potrzebny."
  ru: "×1: в такт с реальными часами. ×60: минута в секунду; останавливаются, когда нужны вы."
  uk: "×1: у такт із реальним годинником. ×60: хвилина за секунду; зупиняється, коли потрібні ви."
"The company's time ran on with the real clock: %{span}, from %{from} to %{until}. The dispatcher decided what came up.":
  de: "Die Firmenzeit lief mit der echten Uhr weiter: %{span}, vom %{from} bis zum %{until}. Der Disponent hat entschieden, was anfiel."
  fr: "Le temps de l'entreprise a continué avec l'horloge réelle : %{span}, du %{from} au %{until}. Le régulateur a décidé de ce qui s'est présenté."
  nl: "De bedrijfstijd liep met de echte klok door: %{span}, van %{from} tot %{until}. De dienstleider besliste wat er voorviel."
  pl: "Czas firmy płynął dalej z prawdziwym zegarem: %{span}, od %{from} do %{until}. Dyspozytor decydował o tym, co się wydarzyło."
  ru: "Время компании шло дальше вместе с реальными часами: %{span}, с %{from} по %{until}. Диспетчер решал всё, что возникало."
  uk: "Час компанії йшов далі разом із реальним годинником: %{span}, з %{from} по %{until}. Диспетчер вирішував усе, що виникало."
"Days closed":
  de: "Abgeschlossene Tage"
  fr: "Journées clôturées"
  nl: "Afgesloten dagen"
  pl: "Zamknięte dni"
  ru: "Закрыто дней"
  uk: "Закрито днів"
"%{amount} while you were away":
  de: "%{amount}, während du weg warst"
  fr: "%{amount} pendant ton absence"
  nl: "%{amount} terwijl je weg was"
  pl: "%{amount} podczas twojej nieobecności"
  ru: "%{amount}, пока вас не было"
  uk: "%{amount}, поки вас не було"
"Nothing out of the ordinary: the tours ran as planned. The feed and the inbox have every line.":
  de: "Nichts Besonderes: Die Umläufe fuhren wie geplant. Der Verlauf und der Posteingang haben jede Zeile."
  fr: "Rien d'inhabituel : les services ont roulé comme prévu. Le fil et la boîte de réception ont chaque ligne."
  nl: "Niets bijzonders: de omlopen reden zoals gepland. Het verloop en de inbox hebben elke regel."
  pl: "Nic nadzwyczajnego: obiegi jechały zgodnie z planem. Przebieg i skrzynka odbiorcza mają każdy wpis."
  ru: "Ничего необычного: обороты прошли по плану. В ленте и во входящих есть каждая строка."
  uk: "Нічого незвичайного: оберти пройшли за планом. У стрічці та у вхідних є кожен рядок."
"The days' report":
  de: "Bericht der Tage"
  fr: "Rapport des journées"
  nl: "Verslag van de dagen"
  pl: "Raport z dni"
  ru: "Отчёт за дни"
  uk: "Звіт за дні"
"Run with the real clock, also while openOMSI is closed":
  de: "Mit der echten Uhr laufen, auch wenn openOMSI geschlossen ist"
  fr: "Suivre l'horloge réelle, même quand openOMSI est fermé"
  nl: "Met de echte klok meelopen, ook als openOMSI dicht is"
  pl: "Płyń z prawdziwym zegarem, także gdy openOMSI jest zamknięty"
  ru: "Идти вместе с реальными часами, даже когда openOMSI закрыт"
  uk: "Іти разом із реальним годинником, навіть коли openOMSI закрито"
"When you open the company, the time since is simulated, a month at most. Fast-forwarding moves it ahead of the real clock.":
  de: "Wenn du das Unternehmen öffnest, wird die Zeit seitdem simuliert, höchstens ein Monat. Vorspulen bringt es vor die echte Uhr."
  fr: "Quand tu ouvres l'entreprise, le temps écoulé depuis est simulé, un mois au plus. Accélérer la met en avance sur l'horloge réelle."
  nl: "Als je het bedrijf opent, wordt de tijd sindsdien gesimuleerd, hoogstens een maand. Vooruitspoelen zet het voor op de echte klok."
  pl: "Gdy otworzysz firmę, czas od tamtej pory jest symulowany, najwyżej miesiąc. Przewijanie wysuwa ją przed prawdziwy zegar."
  ru: "Когда вы открываете компанию, прошедшее время моделируется, не больше месяца. Перемотка выводит её вперёд реальных часов."
  uk: "Коли ви відкриваєте компанію, час відтоді моделюється, щонайбільше місяць. Перемотування виводить її попереду реального годинника."
"Off: the company's time stands still while it is closed.":
  de: "Aus: Die Firmenzeit steht still, solange das Unternehmen geschlossen ist."
  fr: "Désactivé : le temps de l'entreprise s'arrête tant qu'elle est fermée."
  nl: "Uit: de bedrijfstijd staat stil zolang het bedrijf dicht is."
  pl: "Wyłączone: czas firmy stoi, gdy jest zamknięta."
  ru: "Выключено: время компании стоит, пока она закрыта."
  uk: "Вимкнено: час компанії стоїть, поки її закрито."
