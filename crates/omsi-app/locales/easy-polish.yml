_version: 2
# Where the bus company's easy mode meets the rest: the guided tour of an easy company, the
# ways that led to pages the easy mode hides, and what the easy mode says instead.
"Its pages as tiles":
  de: "Seine Seiten als Kacheln"
  fr: "Ses pages en tuiles"
  nl: "Zijn pagina's als tegels"
  pl: "Jej strony jako kafelki"
  ru: "Её страницы плитками"
  uk: "Її сторінки плитками"
"The easy mode":
  de: "Der leichte Modus"
  fr: "Le mode facile"
  nl: "De makkelijke modus"
  pl: "Tryb łatwy"
  ru: "Простой режим"
  uk: "Простий режим"
"Your company in the easy mode, step by step: a line, buses, drivers, letting the time run and a duty of your own. The step to do now has its button; a step done gets its tick.":
  de: "Dein Betrieb im leichten Modus, Schritt für Schritt: eine Linie, Busse, Fahrer, die Zeit laufen lassen und ein eigener Dienst. Der Schritt, der jetzt dran ist, hat seinen Knopf; ein erledigter Schritt bekommt seinen Haken."
  fr: "Ton entreprise en mode facile, étape par étape : une ligne, des bus, des conducteurs, laisser filer le temps et un service à toi. L'étape à faire maintenant a son bouton ; une étape faite reçoit sa coche."
  nl: "Je bedrijf in de makkelijke modus, stap voor stap: een lijn, bussen, chauffeurs, de tijd laten lopen en een eigen dienst. De stap die nu aan de beurt is heeft zijn knop; een gedane stap krijgt zijn vinkje."
  pl: "Twoja firma w trybie łatwym, krok po kroku: linia, autobusy, kierowcy, puszczenie czasu i własna służba. Krok do zrobienia teraz ma swój przycisk; zrobiony krok dostaje ptaszek."
  ru: "Ваша компания в простом режиме, шаг за шагом: линия, автобусы, водители, ход времени и собственная смена. У шага, который нужно сделать сейчас, есть кнопка; выполненный шаг получает галочку."
  uk: "Ваша компанія в простому режимі, крок за кроком: лінія, автобуси, водії, плин часу і власна зміна. Крок, який треба зробити зараз, має свою кнопку; виконаний крок отримує позначку."
"Every page of the easy mode is a tile, with what matters there now. A badge says where something waits; under the tiles are the dealer, a new line, a loan and the settings.":
  de: "Jede Seite des leichten Modus ist eine Kachel, mit dem, was dort gerade zählt. Ein Abzeichen zeigt, wo etwas wartet; unter den Kacheln liegen der Händler, eine neue Linie, ein Kredit und die Einstellungen."
  fr: "Chaque page du mode facile est une tuile, avec ce qui compte là en ce moment. Un badge indique où quelque chose attend ; sous les tuiles se trouvent le concessionnaire, une nouvelle ligne, un prêt et les réglages."
  nl: "Elke pagina van de makkelijke modus is een tegel, met wat daar nu telt. Een badge zegt waar iets wacht; onder de tegels staan de dealer, een nieuwe lijn, een lening en de instellingen."
  pl: "Każda strona trybu łatwego to kafelek z tym, co tam teraz ważne. Plakietka pokazuje, gdzie coś czeka; pod kafelkami są dealer, nowa linia, kredyt i ustawienia."
  ru: "Каждая страница простого режима — плитка с тем, что там сейчас важно. Значок показывает, где что-то ждёт; под плитками — дилер, новая линия, кредит и настройки."
  uk: "Кожна сторінка простого режиму — плитка з тим, що там зараз важливо. Значок показує, де щось чекає; під плитками — дилер, нова лінія, кредит і налаштування."
"Every morning the company fills its roster, every night it hires, trains, repairs, researches and builds parking where it is needed. What it did is told here, the newest first.":
  de: "Jeden Morgen füllt der Betrieb seinen Dienstplan, jede Nacht stellt er ein, schult, repariert, forscht und baut Parkplätze, wo es nötig ist. Was er getan hat, steht hier, das Neueste zuerst."
  fr: "Chaque matin, l'entreprise remplit son roulement ; chaque nuit, elle embauche, forme, répare, fait de la recherche et construit des places là où il le faut. Ce qu'elle a fait est raconté ici, le plus récent d'abord."
  nl: "Elke ochtend vult het bedrijf zijn rooster, elke nacht neemt het aan, leidt het op, repareert, onderzoekt en bouwt het parkeerplaatsen waar dat nodig is. Wat het deed staat hier, het nieuwste eerst."
  pl: "Każdego ranka firma wypełnia grafik, każdej nocy zatrudnia, szkoli, naprawia, prowadzi badania i buduje miejsca postojowe, gdzie trzeba. Co zrobiła, jest opisane tutaj, najnowsze na górze."
  ru: "Каждое утро компания заполняет график, каждую ночь нанимает, обучает, ремонтирует, исследует и строит стоянки, где нужно. Что она сделала, написано здесь, новое сверху."
  uk: "Щоранку компанія заповнює графік, щоночі наймає, навчає, ремонтує, досліджує і будує стоянки, де потрібно. Що вона зробила, написано тут, нове зверху."
"The company sees to its routine by itself: no planning, no auctions, no workshop to run. A click here opens the settings, where the advanced mode shows every page with nothing lost.":
  de: "Der Betrieb erledigt seine Routine selbst: keine Planung, keine Auktionen, keine Werkstatt zu führen. Ein Klick hier öffnet die Einstellungen, wo der erweiterte Modus jede Seite zeigt, ohne dass etwas verloren geht."
  fr: "L'entreprise gère sa routine elle-même : pas de planification, pas d'enchères, pas d'atelier à diriger. Un clic ici ouvre les réglages, où le mode avancé montre chaque page sans rien perdre."
  nl: "Het bedrijf regelt zijn routine zelf: geen planning, geen veilingen, geen werkplaats te runnen. Een klik hier opent de instellingen, waar de uitgebreide modus elke pagina toont zonder dat er iets verloren gaat."
  pl: "Firma sama zajmuje się rutyną: bez planowania, bez licytacji, bez prowadzenia warsztatu. Kliknięcie tutaj otwiera ustawienia, gdzie tryb zaawansowany pokazuje każdą stronę i nic nie przepada."
  ru: "Компания сама ведёт рутину: без планирования, без аукционов, без управления мастерской. Щелчок здесь открывает настройки, где расширенный режим показывает все страницы, ничего не теряя."
  uk: "Компанія сама веде рутину: без планування, без аукціонів, без керування майстернею. Клацання тут відкриває налаштування, де розширений режим показує всі сторінки, нічого не втрачаючи."
"Under the company's name, always in view: its cash, the trophies earned with goals, and its reputation. The company spends the trophies on research by itself.":
  de: "Unter dem Namen des Betriebs, immer im Blick: sein Geld, die mit Zielen verdienten Trophäen und sein Ruf. Die Trophäen gibt der Betrieb selbst für Forschung aus."
  fr: "Sous le nom de l'entreprise, toujours en vue : sa trésorerie, les trophées gagnés avec les objectifs et sa réputation. L'entreprise dépense elle-même les trophées en recherche."
  nl: "Onder de naam van het bedrijf, altijd in beeld: zijn kas, de trofeeën verdiend met doelen, en zijn reputatie. De trofeeën geeft het bedrijf zelf uit aan onderzoek."
  pl: "Pod nazwą firmy, zawsze na widoku: jej gotówka, trofea zdobyte za cele i jej reputacja. Trofea firma sama wydaje na badania."
  ru: "Под названием компании, всегда на виду: её деньги, трофеи за цели и её репутация. Трофеи компания сама тратит на исследования."
  uk: "Під назвою компанії, завжди на виду: її гроші, трофеї за цілі та її репутація. Трофеї компанія сама витрачає на дослідження."
"Your buses with their condition and their livery. At the dealer you buy new or used ones at the list price, lease or rent them; worn buses go to the workshop by themselves.":
  de: "Deine Busse mit ihrem Zustand und ihrer Lackierung. Beim Händler kaufst du neue oder gebrauchte zum Listenpreis, least oder mietest sie; abgenutzte Busse kommen von selbst in die Werkstatt."
  fr: "Tes bus avec leur état et leur livrée. Chez le concessionnaire, tu achètes des neufs ou des occasions au prix catalogue, tu les loues en leasing ou en location ; les bus usés vont d'eux-mêmes à l'atelier."
  nl: "Je bussen met hun staat en hun lak. Bij de dealer koop je nieuwe of gebruikte tegen de catalogusprijs, lease of huur je ze; versleten bussen gaan vanzelf naar de werkplaats."
  pl: "Twoje autobusy z ich stanem i malowaniem. U dealera kupujesz nowe lub używane po cenie katalogowej, leasingujesz je lub wynajmujesz; zużyte autobusy same trafiają do warsztatu."
  ru: "Ваши автобусы с их состоянием и окраской. У дилера вы покупаете новые или подержанные по каталожной цене, берёте в лизинг или аренду; изношенные автобусы сами отправляются в мастерскую."
  uk: "Ваші автобуси з їхнім станом і фарбуванням. У дилера ви купуєте нові чи вживані за каталожною ціною, берете в лізинг або оренду; зношені автобуси самі йдуть до майстерні."
"Your employees and the labour market. The company hires the drivers its duties need by itself at night, grants their raises and trains them - or hire them yourself now.":
  de: "Deine Angestellten und der Arbeitsmarkt. Der Betrieb stellt die Fahrer, die seine Dienste brauchen, nachts selbst ein, gewährt ihre Lohnerhöhungen und schult sie – oder stell sie jetzt selbst ein."
  fr: "Tes employés et le marché du travail. L'entreprise embauche elle-même la nuit les conducteurs dont ses services ont besoin, leur accorde leurs augmentations et les forme – ou embauche-les toi-même maintenant."
  nl: "Je medewerkers en de arbeidsmarkt. Het bedrijf neemt 's nachts zelf de chauffeurs aan die zijn diensten nodig hebben, geeft hun loonsverhogingen en leidt ze op – of neem ze nu zelf aan."
  pl: "Twoi pracownicy i rynek pracy. Firma sama zatrudnia nocą kierowców potrzebnych do służb, przyznaje im podwyżki i ich szkoli – albo zatrudnij ich teraz sam."
  ru: "Ваши сотрудники и рынок труда. Компания сама ночью нанимает водителей, нужных для её смен, повышает им зарплату и обучает их — или наймите их сейчас сами."
  uk: "Ваші працівники і ринок праці. Компанія сама вночі наймає водіїв, потрібних для її змін, підвищує їм зарплату й навчає їх — або найміть їх зараз самі."
"Take on the map's lines or make your own in the line editor. A line runs at once: the company fills its roster every morning with the buses and drivers it has.":
  de: "Übernimm die Linien der Karte oder mach eigene im Linieneditor. Eine Linie fährt sofort: Der Betrieb füllt jeden Morgen seinen Dienstplan mit den Bussen und Fahrern, die er hat."
  fr: "Reprends les lignes de la carte ou crée les tiennes dans l'éditeur de lignes. Une ligne roule tout de suite : chaque matin, l'entreprise remplit son roulement avec les bus et les conducteurs qu'elle a."
  nl: "Neem de lijnen van de kaart over of maak je eigen in de lijneditor. Een lijn rijdt meteen: het bedrijf vult elke ochtend zijn rooster met de bussen en chauffeurs die het heeft."
  pl: "Przejmij linie z mapy albo utwórz własne w edytorze linii. Linia jeździ od razu: firma każdego ranka wypełnia grafik autobusami i kierowcami, których ma."
  ru: "Берите линии карты или создайте свои в редакторе линий. Линия работает сразу: каждое утро компания заполняет график имеющимися автобусами и водителями."
  uk: "Беріть лінії мапи або створіть власні в редакторі ліній. Лінія працює одразу: щоранку компанія заповнює графік наявними автобусами й водіями."
"Take one of the company's duties beside your list: it is yours on that weekday every week, a click from driving it. Here too: the company's level, the training courses and the rankings.":
  de: "Nimm einen der Dienste des Betriebs neben deiner Liste: Er gehört dir an diesem Wochentag jede Woche, einen Klick vom Fahren entfernt. Hier auch: die Stufe des Betriebs, die Schulungen und die Ranglisten."
  fr: "Prends l'un des services de l'entreprise à côté de ta liste : il est à toi ce jour-là chaque semaine, à un clic de la conduite. Ici aussi : le niveau de l'entreprise, les formations et les classements."
  nl: "Neem een van de diensten van het bedrijf naast je lijst: die is elke week op die weekdag van jou, een klik van het rijden. Hier ook: het niveau van het bedrijf, de opleidingen en de ranglijsten."
  pl: "Weź jedną ze służb firmy obok swojej listy: jest twoja w ten dzień tygodnia co tydzień, jedno kliknięcie od jazdy. Tu także: poziom firmy, szkolenia i rankingi."
  ru: "Возьмите одну из смен компании рядом со своим списком: она ваша в этот день недели каждую неделю, в одном щелчке от поездки. Здесь же: уровень компании, обучение и рейтинги."
  uk: "Візьміть одну зі змін компанії поруч зі своїм списком: вона ваша в цей день тижня щотижня, за одне клацання від поїздки. Тут також: рівень компанії, навчання й рейтинги."
"Articulated buses need research first.":
  de: "Gelenkbusse brauchen zuerst Forschung."
  fr: "Les bus articulés demandent d'abord de la recherche."
  nl: "Gelede bussen hebben eerst onderzoek nodig."
  pl: "Autobusy przegubowe wymagają najpierw badań."
  ru: "Для сочленённых автобусов сначала нужно исследование."
  uk: "Для зчленованих автобусів спершу потрібне дослідження."
"Double-deckers need research first.":
  de: "Doppeldecker brauchen zuerst Forschung."
  fr: "Les bus à impériale demandent d'abord de la recherche."
  nl: "Dubbeldekkers hebben eerst onderzoek nodig."
  pl: "Autobusy piętrowe wymagają najpierw badań."
  ru: "Для двухэтажных автобусов сначала нужно исследование."
  uk: "Для двоповерхових автобусів спершу потрібне дослідження."
"Research first":
  de: "Erst forschen"
  fr: "D'abord la recherche"
  nl: "Eerst onderzoek"
  pl: "Najpierw badania"
  ru: "Сначала исследование"
  uk: "Спершу дослідження"
"Switch to the advanced mode":
  de: "Zum erweiterten Modus wechseln"
  fr: "Passer au mode avancé"
  nl: "Naar de uitgebreide modus"
  pl: "Przełącz na tryb zaawansowany"
  ru: "Перейти в расширенный режим"
  uk: "Перейти в розширений режим"
"The company builds more parking spaces by itself before the yard is full, when its cash allows. To build them now, switch to the advanced mode.":
  de: "Der Betrieb baut selbst mehr Parkplätze, bevor der Hof voll ist, wenn das Geld reicht. Um sie jetzt zu bauen, wechsle zum erweiterten Modus."
  fr: "L'entreprise construit elle-même plus de places avant que le dépôt soit plein, quand sa trésorerie le permet. Pour les construire maintenant, passe au mode avancé."
  nl: "Het bedrijf bouwt zelf meer parkeerplaatsen voordat het terrein vol is, als de kas het toelaat. Om ze nu te bouwen, schakel je naar de uitgebreide modus."
  pl: "Firma sama buduje więcej miejsc postojowych, zanim plac się zapełni, jeśli pozwala na to gotówka. Aby zbudować je teraz, przełącz na tryb zaawansowany."
  ru: "Компания сама строит больше стояночных мест, пока двор не заполнен, если хватает денег. Чтобы построить их сейчас, перейдите в расширенный режим."
  uk: "Компанія сама будує більше місць для стоянки, поки двір не заповнений, якщо вистачає грошей. Щоб збудувати їх зараз, перейдіть у розширений режим."
"The company researches them by itself once a researcher works here and the trophies and the money are there. To start it now, switch to the advanced mode.":
  de: "Der Betrieb erforscht sie selbst, sobald hier ein Forscher arbeitet und die Trophäen und das Geld da sind. Um jetzt damit zu beginnen, wechsle zum erweiterten Modus."
  fr: "L'entreprise fait elle-même la recherche dès qu'un chercheur travaille ici et que les trophées et l'argent sont là. Pour la lancer maintenant, passe au mode avancé."
  nl: "Het bedrijf onderzoekt ze zelf zodra er een onderzoeker werkt en de trofeeën en het geld er zijn. Om het nu te starten, schakel je naar de uitgebreide modus."
  pl: "Firma sama je zbada, gdy pracuje tu badacz, a trofea i pieniądze są na miejscu. Aby zacząć teraz, przełącz na tryb zaawansowany."
  ru: "Компания сама проведёт исследование, когда здесь работает исследователь и есть трофеи и деньги. Чтобы начать сейчас, перейдите в расширенный режим."
  uk: "Компанія сама проведе дослідження, коли тут працює дослідник і є трофеї та гроші. Щоб почати зараз, перейдіть у розширений режим."
"The easy mode does not research this by itself: switch to the advanced mode and start it on its Research page.":
  de: "Das erforscht der leichte Modus nicht selbst: Wechsle zum erweiterten Modus und starte es auf dessen Forschungsseite."
  fr: "Le mode facile ne fait pas cette recherche lui-même : passe au mode avancé et lance-la sur sa page Recherche."
  nl: "Dit onderzoekt de makkelijke modus niet zelf: schakel naar de uitgebreide modus en start het op zijn pagina Onderzoek."
  pl: "Tryb łatwy nie bada tego sam: przełącz na tryb zaawansowany i rozpocznij to na jego stronie Badania."
  ru: "Простой режим не исследует это сам: перейдите в расширенный режим и начните на его странице «Исследования»."
  uk: "Простий режим не досліджує це сам: перейдіть у розширений режим і почніть на його сторінці «Дослідження»."
"Trophies: earned with goals, spent by the company on research by itself":
  de: "Trophäen: mit Zielen verdient, vom Betrieb selbst für Forschung ausgegeben"
  fr: "Trophées : gagnés avec les objectifs, dépensés par l'entreprise elle-même en recherche"
  nl: "Trofeeën: verdiend met doelen, door het bedrijf zelf uitgegeven aan onderzoek"
  pl: "Trofea: zdobywane za cele, wydawane przez firmę samodzielnie na badania"
  ru: "Трофеи: за цели, компания сама тратит их на исследования"
  uk: "Трофеї: за цілі, компанія сама витрачає їх на дослідження"
"No tours ran: the company's lines were not in service yet. They go into service by themselves the next morning.":
  de: "Es fuhren keine Umläufe: Die Linien des Betriebs waren noch nicht in Betrieb. Sie gehen am nächsten Morgen von selbst in Betrieb."
  fr: "Aucun service n'a roulé : les lignes de l'entreprise n'étaient pas encore en service. Elles se mettent en service d'elles-mêmes le lendemain matin."
  nl: "Er reden geen omlopen: de lijnen van het bedrijf waren nog niet in dienst. Ze gaan de volgende ochtend vanzelf in dienst."
  pl: "Nie wyjechała żadna brygada: linie firmy nie były jeszcze w eksploatacji. Wejdą do eksploatacji same następnego ranka."
  ru: "Ни один выход не состоялся: линии компании ещё не работали. Они сами начнут работать на следующее утро."
  uk: "Обороти не виконувались: лінії компанії ще не працювали. Вони самі почнуть працювати наступного ранку."
"Open: %{b} tours without a bus, %{d} duties without a driver. Get buses at the dealer; the company hires the drivers by itself, at night.":
  de: "Offen: %{b} Umläufe ohne Bus, %{d} Dienste ohne Fahrer. Busse gibt es beim Händler; die Fahrer stellt der Betrieb nachts selbst ein."
  fr: "En attente : %{b} services sans bus, %{d} services sans conducteur. Les bus s'obtiennent chez le concessionnaire ; les conducteurs, l'entreprise les embauche elle-même la nuit."
  nl: "Open: %{b} omlopen zonder bus, %{d} diensten zonder chauffeur. Bussen haal je bij de dealer; de chauffeurs neemt het bedrijf 's nachts zelf aan."
  pl: "Otwarte: %{b} brygad bez autobusu, %{d} służb bez kierowcy. Autobusy kupisz u dealera; kierowców firma zatrudni sama, w nocy."
  ru: "Открыто: %{b} выходов без автобуса, %{d} смен без водителя. Автобусы — у дилера; водителей компания наймёт сама ночью."
  uk: "Відкрито: %{b} оборотів без автобуса, %{d} змін без водія. Автобуси — у дилера; водіїв компанія найме сама вночі."
"Not in service yet":
  de: "Noch nicht in Betrieb"
  fr: "Pas encore en service"
  nl: "Nog niet in dienst"
  pl: "Jeszcze nie w eksploatacji"
  ru: "Ещё не работает"
  uk: "Ще не працює"
"The company puts the line into service by itself, at the latest the next morning.":
  de: "Der Betrieb nimmt die Linie selbst in Betrieb, spätestens am nächsten Morgen."
  fr: "L'entreprise met la ligne en service elle-même, au plus tard le lendemain matin."
  nl: "Het bedrijf neemt de lijn zelf in dienst, uiterlijk de volgende ochtend."
  pl: "Firma sama uruchomi linię, najpóźniej następnego ranka."
  ru: "Компания сама запустит линию, не позже следующего утра."
  uk: "Компанія сама запустить лінію, не пізніше наступного ранку."
