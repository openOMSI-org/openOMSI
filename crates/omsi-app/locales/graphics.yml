"Apply compatible graphics options in-game. Renderer mode and device formats require restart.":
  be: "Ужывае сумяшчальныя параметры ў гульні. Рэжым рэндэрынгу і фарматы прылады патрабуюць перазапуску."
  ca: "Aplica opcions compatibles durant el joc. El mode de renderització i els formats del dispositiu requereixen reiniciar."
  cs: "Použije kompatibilní možnosti ve hře. Režim vykreslování a formáty zařízení vyžadují restart."
  de: "Kompatible Grafikoptionen im Spiel anwenden. Renderermodus und Geräteformate erfordern einen Neustart."
  es: "Aplica opciones compatibles durante el juego. El modo de renderizado y los formatos del dispositivo requieren reiniciar."
  fr: "Applique les options compatibles en jeu. Le mode de rendu et les formats du périphérique nécessitent un redémarrage."
  hi: "संगत विकल्प खेल में लागू होते हैं। रेंडर मोड और डिवाइस फ़ॉर्मैट बदलने के लिए पुनः शुरू करें।"
  hu: "Kompatibilis opciók alkalmazása játék közben. A megjelenítési mód és az eszközformátumok újraindítást igényelnek."
  id: "Menerapkan opsi yang kompatibel saat bermain. Mode perender dan format perangkat memerlukan mulai ulang."
  it: "Applica opzioni compatibili durante il gioco. Modalità di rendering e formati del dispositivo richiedono un riavvio."
  ja: "対応する設定をゲーム中に適用します。描画モードとデバイス形式の変更には再起動が必要です。"
  ka: "თამაშში იყენებს თავსებად პარამეტრებს. რენდერის რეჟიმისა და მოწყობილობის ფორმატებისთვის საჭიროა გადატვირთვა."
  kk: "Үйлесімді параметрлерді ойында қолданады. Рендер режимі мен құрылғы пішімдері қайта іске қосуды талап етеді."
  ko: "호환되는 설정을 게임 중 적용합니다. 렌더링 모드와 장치 형식 변경은 재시작이 필요합니다."
  ms: "Menggunakan pilihan serasi semasa bermain. Mod pemapar dan format peranti memerlukan mula semula."
  nl: "Past geschikte opties tijdens het spelen toe. Renderermodus en apparaatformaten vereisen een herstart."
  pl: "Stosuje zgodne opcje w grze. Tryb renderowania i formaty urządzenia wymagają ponownego uruchomienia."
  pt: "Aplica opções gráficas compatíveis durante o jogo. Modo de renderização e formatos do dispositivo exigem reinício."
  pt-pt: "Aplica opções gráficas compatíveis durante o jogo. Modo de renderização e formatos do dispositivo exigem reinício."
  ru: "Применяет совместимые настройки в игре. Режим рендеринга и форматы устройства требуют перезапуска."
  sr: "Primenjuje podržane opcije u igri. Režim iscrtavanja i formati uređaja zahtevaju ponovno pokretanje."
  sv: "Tillämpar kompatibla alternativ i spelet. Renderingsläge och enhetsformat kräver omstart."
  th: "ใช้ตัวเลือกที่รองรับในเกม โหมดเรนเดอร์และรูปแบบอุปกรณ์ต้องเริ่มเกมใหม่"
