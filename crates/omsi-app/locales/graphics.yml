  fr: "Tous les modes : halo blanc et éclairage de la route des autres véhicules ; pas votre bus ni les réverbères"
  hi: "सभी मोड: दूसरे वाहनों की सफ़ेद हेडलाइट की चमक और सड़क की रोशनी; खिलाड़ी की बस या सड़क की बत्तियाँ नहीं"
  hu: "Minden mód: más járművek fehér fényszórófénye és útmegvilágítása; nem a játékos busza vagy az utcai lámpák"
  id: "Semua mode: kilau putih lampu depan dan penerangan jalan kendaraan lain; bukan bus pemain atau lampu jalan"
  it: "Tutte le modalità: bagliore bianco e illuminazione stradale degli altri veicoli; non il tuo autobus o i lampioni"
  ja: "全描画モード：他車の白いヘッドライトの光と路面照明。プレイヤーのバスや街灯には影響しません"
  ka: "ყველა რეჟიმი: სხვა მანქანების თეთრი ფარების ნათება და გზის განათება; არ ეხება მოთამაშის ავტობუსსა და ქუჩის განათებას"
  kk: "Барлық режим: басқа көліктердің ақ фара жарқылы мен жол жарығы; ойыншы автобусы мен көше шамдарына әсер етпейді"
  ko: "모든 그래픽 모드: 다른 차량의 흰색 전조등 빛과 도로 조명. 플레이어 버스나 가로등에는 영향이 없습니다"
  ms: "Semua mod: cahaya putih lampu hadapan dan pencahayaan jalan kenderaan lain; bukan bas pemain atau lampu jalan"
  nl: "Alle modi: witte koplampgloed en wegverlichting van andere voertuigen; niet je eigen bus of straatlantaarns"
  pl: "Wszystkie tryby: biała poświata reflektorów i oświetlenie drogi innych pojazdów; nie autobusu gracza ani latarni"
  pt: "Todos os modos gráficos: brilho dos faróis brancos e iluminação da pista por outros veículos; não afeta seu ônibus nem postes"
  pt-pt: "Todos os modos gráficos: brilho dos faróis brancos e iluminação da pista por outros veículos; não afeta seu ônibus nem postes"
  ru: "Все режимы: белое свечение фар и освещение дороги другими машинами; не автобус игрока и не уличные фонари"
  sr: "Svi režimi: beli sjaj farova i osvetljenje puta drugih vozila; ne igračev autobus ni ulične svetiljke"
  sv: "Alla grafiklägen: vitt strålkastarsken och vägbelysning från andra fordon; inte spelarens buss eller gatlyktor"
  th: "ทุกโหมด: แสงขาวของไฟหน้าและแสงบนถนนจากรถคันอื่น ไม่กระทบรถผู้เล่นหรือไฟถนน"
  tl: "Lahat ng mode: puting sinag at ilaw sa kalsada ng ibang sasakyan; hindi ang bus ng manlalaro o ilaw sa kalye"
  tr: "Tüm modlar: diğer araçların beyaz far parlaması ve yol aydınlatması; oyuncunun otobüsünü veya sokak lambalarını etkilemez"
  uk: "Усі режими: біле сяйво фар і освітлення дороги іншими машинами; не автобус гравця та не ліхтарі"
  vi: "Mọi chế độ: quầng sáng trắng và chiếu sáng mặt đường từ xe khác; không ảnh hưởng xe người chơi hay đèn đường"
  zh: "所有画质模式：其他车辆的白色前灯光晕及路面照明；不影响玩家巴士或路灯"
  zh-tw: "所有畫質模式：其他車輛的白色頭燈光暈及路面照明；不影響玩家巴士或路燈"

