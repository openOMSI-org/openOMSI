"All graphics modes: other vehicles' white headlamp glow and road illumination, not the player bus or street lights":
  be: "Усе рэжымы: белае свячэнне фар і асвятленне дарогі іншымі машынамі; не аўтобус гульца і не вулічныя ліхтары"
