"Confirm within 20 seconds; otherwise the previous values are restored.":
  be: "Пацвердзіце на працягу 20 секунд, інакш вернуцца ранейшыя значэнні."
  ca: "Confirmeu en 20 segons; altrament es restauren els valors anteriors."
  cs: "Potvrďte do 20 sekund, jinak se obnoví předchozí hodnoty."
  de: "Innerhalb von 20 Sekunden bestätigen, sonst werden die vorherigen Werte wiederhergestellt."
  es: "Confirma en 20 segundos; de lo contrario se restauran los valores anteriores."
  fr: "Confirmez dans les 20 secondes, sinon les valeurs précédentes seront restaurées."
  hi: "20 सेकंड में पुष्टि करें, वरना पिछले मान वापस आ जाएँगे।"
  hu: "Erősítse meg 20 másodpercen belül, különben visszaállnak a korábbi értékek."
  id: "Konfirmasi dalam 20 detik, atau nilai sebelumnya akan dipulihkan."
  it: "Conferma entro 20 secondi, altrimenti saranno ripristinati i valori precedenti."
  ja: "20秒以内に確定しない場合、以前の値に戻します。"
  ka: "დაადასტურეთ 20 წამში, წინააღმდეგ შემთხვევაში აღდგება წინა მნიშვნელობები."
  kk: "20 секунд ішінде растаңыз, әйтпесе алдыңғы мәндер қалпына келеді."
  ko: "20초 이내에 확인하지 않으면 이전 값으로 복원됩니다."
  ms: "Sahkan dalam 20 saat, jika tidak nilai terdahulu akan dipulihkan."
  nl: "Bevestig binnen 20 seconden, anders worden de vorige waarden hersteld."
  pl: "Potwierdź w ciągu 20 sekund, inaczej poprzednie wartości zostaną przywrócone."
  pt: "Confirme em até 20 segundos; caso contrário, os valores anteriores serão restaurados."
  pt-pt: "Confirme em até 20 segundos; caso contrário, os valores anteriores serão restaurados."
  ru: "Подтвердите в течение 20 секунд, иначе вернутся прежние значения."
  sr: "Potvrdite u roku od 20 sekundi ili se vraćaju prethodne vrednosti."
  sv: "Bekräfta inom 20 sekunder, annars återställs tidigare värden."
  th: "ยืนยันภายใน 20 วินาที มิฉะนั้นจะคืนค่าก่อนหน้า"
  tl: "Kumpirmahin sa loob ng 20 segundo; kung hindi, ibabalik ang dating mga halaga."
  tr: "20 saniye içinde onaylayın; aksi halde önceki değerler geri yüklenir."
  uk: "Підтвердьте протягом 20 секунд, інакше відновляться попередні значення."
  vi: "Xác nhận trong 20 giây; nếu không các giá trị cũ sẽ được khôi phục."
  zh: "请在20秒内确认，否则恢复之前的数值。"
  zh-tw: "請在20秒內確認，否則還原先前的數值。"

