"Graphics settings applied. Restart to change renderer mode or device formats.":
  be: "Графіка ўжыта. Перазапусціце гульню для змены рэжыму рэндэрынгу або фарматаў прылады."
  ca: "Gràfics aplicats. Reinicieu per canviar el mode de renderització o els formats del dispositiu."
  cs: "Grafika použita. Pro změnu režimu vykreslování nebo formátů zařízení restartujte hru."
  de: "Grafik übernommen. Für Renderermodus oder Geräteformate neu starten."
  es: "Gráficos aplicados. Reinicia para cambiar el modo de renderizado o los formatos del dispositivo."
  fr: "Graphismes appliqués. Redémarrez pour changer le mode de rendu ou les formats du périphérique."
  hi: "ग्राफ़िक्स लागू हुए। रेंडर मोड या डिवाइस फ़ॉर्मैट बदलने के लिए पुनः शुरू करें।"
  hu: "Grafika alkalmazva. A megjelenítési módhoz vagy eszközformátumokhoz indítsa újra a játékot."
  id: "Grafis diterapkan. Mulai ulang untuk mengubah mode perender atau format perangkat."
  it: "Grafica applicata. Riavvia per cambiare modalità di rendering o formati del dispositivo."
  ja: "グラフィック設定を適用しました。描画モードやデバイス形式の変更には再起動してください。"
  ka: "გრაფიკა გამოყენებულია. რენდერის რეჟიმის ან მოწყობილობის ფორმატების შესაცვლელად გადატვირთეთ თამაში."
  kk: "Графика қолданылды. Рендер режимін не құрылғы пішімдерін өзгерту үшін ойынды қайта іске қосыңыз."
  ko: "그래픽 설정을 적용했습니다. 렌더링 모드나 장치 형식을 변경하려면 재시작하세요."
  ms: "Grafik digunakan. Mula semula untuk menukar mod pemapar atau format peranti."
  nl: "Grafische instellingen toegepast. Herstart om renderermodus of apparaatformaten te wijzigen."
  pl: "Grafika zastosowana. Uruchom ponownie, aby zmienić tryb renderowania lub formaty urządzenia."
  pt: "Gráficos aplicados. Reinicie para mudar o modo de renderização ou os formatos do dispositivo."
  pt-pt: "Gráficos aplicados. Reinicie para mudar o modo de renderização ou os formatos do dispositivo."
  ru: "Графика применена. Для смены режима рендеринга или форматов устройства перезапустите игру."
  sr: "Grafika primenjena. Ponovo pokrenite igru za promenu režima iscrtavanja ili formata uređaja."
  sv: "Grafikinställningar tillämpade. Starta om för att ändra renderingsläge eller enhetsformat."
  th: "ใช้ค่ากราฟิกแล้ว เริ่มเกมใหม่เพื่อเปลี่ยนโหมดเรนเดอร์หรือรูปแบบอุปกรณ์"
  tl: "Nailapat ang graphics. Mag-restart para baguhin ang renderer mode o device format."
  tr: "Grafik ayarları uygulandı. İşleyici modunu veya aygıt biçimlerini değiştirmek için yeniden başlatın."
  uk: "Графіку застосовано. Перезапустіть гру для зміни режиму рендерингу чи форматів пристрою."
  vi: "Đã áp dụng đồ họa. Khởi động lại để đổi chế độ kết xuất hoặc định dạng thiết bị."
