"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "Magkakabisa ang mga pagbabago sa susunod mong pagmamaneho, o pagkatapos ng “I-reload ang mga naka-save na controller” sa controller menu ng laro."
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Gaano kalakas ibinabalik ng umaandar na bus ang manibela sa tuwid matapos lumiko; hindi ito humihila habang nakahinto ang bus."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Gaano nilalabanan ng manibela ang mabilis na galaw, para huminto sa gitna ang binitawang manibela sa halip na lumampas dito; taasan kung umuugoy ang manibela."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Gaano kabigat iikot ang manibela habang nakahinto o gumagapang ang bus; gumagaan ito habang umaandar ang bus."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Itinataas ang pinakamahihinang puwersa lampas sa puntong nagsisimulang maramdaman ng iyong manibela; kapaki-pakinabang sa mga belt at gear na manibela na may patay na gitna, iwanan sa 0 sa direct drive."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Pinalalambot ang biglaang pagtalon ng puwersa ng manibela na maaaring maramdamang magaspang sa malalakas na manibela kapag mababa ang frame rate; nagdaragdag ng kaunting antala ang mas matataas na halaga."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Kabuuang lakas ng mga puwersa ng manibela sa manibelang ito; babaan ito sa malakas na direct-drive base, taasan sa mahinang manibela."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Kabuuang lakas ng mga pag-alog, pagsalpok sa gilid ng bangketa at panginginig ng kalsada at makina sa manibelang ito."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Naka-off: walang ipinapadalang puwersa ang laro sa manibela; ang anumang natitirang resistensya ay mula sa sariling driver software ng manibela (halimbawa, ang centre spring sa Logitech G HUB)"
"The running engine buzzes in the wheel, felt even at a standstill": "Umuugong sa manibela ang umaandar na makina, ramdam kahit nakahinto"
