"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "Hindi ito kasama sa SteamOS. Sa Desktop Mode, sa Konsole: sudo steamos-readonly disable, saka sudo pacman -S webkit2gtk-4.1, saka sudo steamos-readonly enable (maaaring alisin ulit ito ng update ng SteamOS). Tingnan ang docs/USER_GUIDE.md."
