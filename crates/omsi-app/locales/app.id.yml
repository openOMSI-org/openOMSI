"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Seberapa kuat bus yang melaju mengembalikan setir ke posisi lurus setelah berbelok; tidak pernah menarik saat bus berhenti."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Seberapa besar setir menahan gerakan cepat, agar setir yang dilepas berhenti di tengah alih-alih berayun melewatinya; naikkan jika setir berosilasi."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Seberapa berat setir diputar saat bus diam atau merayap; makin ringan saat bus melaju."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Mengangkat gaya terkecil di atas titik saat setir Anda mulai merasakannya; berguna pada setir sabuk dan roda gigi yang punya titik mati di tengah, biarkan 0 pada direct drive."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Menghaluskan lonjakan mendadak pada gaya kemudi yang bisa terasa kasar pada setir bertenaga kuat saat frame rate rendah; nilai lebih tinggi menambah sedikit jeda."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Kekuatan keseluruhan gaya kemudi pada setir ini; turunkan pada base direct drive yang kuat, naikkan pada setir yang lemah."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Kekuatan keseluruhan guncangan, hentakan trotoar, serta getaran jalan dan mesin pada setir ini."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Mati: game tidak mengirim gaya apa pun ke setir; hambatan yang tersisa berasal dari perangkat lunak driver setir itu sendiri (misalnya pegas pemusat di Logitech G HUB)"
"The running engine buzzes in the wheel, felt even at a standstill": "Mesin yang menyala berdengung di setir, terasa bahkan saat diam"
