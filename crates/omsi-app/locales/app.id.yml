"Standard Catmull-Rom or AMD FSR 1 change at once; NVIDIA DLSS or AMD FSR 3 take the place of the anti-aliasing and the render scale, on DirectX 12 or Vulkan, from the next start": "Catmull-Rom standar atau AMD FSR 1 langsung berubah; NVIDIA DLSS atau AMD FSR 3 menggantikan anti-aliasing dan skala render, di DirectX 12 atau Vulkan, mulai peluncuran berikutnya"
