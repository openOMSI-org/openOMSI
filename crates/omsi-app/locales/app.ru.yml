"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Насколько сильно движущийся автобус возвращает руль в прямое положение после поворота; на месте руль никогда не тянет."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Насколько руль сопротивляется быстрому движению, чтобы отпущенный руль останавливался в центре, а не проскакивал его; увеличьте, если руль раскачивается."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Насколько тяжело крутить руль, пока автобус стоит или ползёт; по мере движения становится легче."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Поднимает самые слабые усилия выше порога, с которого ваш руль начинает их передавать; полезно для ременных и шестерёнчатых рулей с мёртвой зоной в центре, на direct drive оставьте 0."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Сглаживает резкие скачки усилия на руле, которые на мощных рулях при низкой частоте кадров ощущаются как зернистость; большие значения добавляют небольшую задержку."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Общая сила усилий на этом руле; уменьшите на мощной базе direct drive, увеличьте на слабом руле."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Общая сила тряски, ударов о бордюр и дрожи от дороги и двигателя на этом руле."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Выкл.: игра не передаёт рулю никаких усилий; оставшееся сопротивление создаёт собственное ПО драйвера руля (например, центрирующая пружина в Logitech G HUB)"
