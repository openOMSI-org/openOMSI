"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "В SteamOS его нет. В режиме рабочего стола, в Konsole: sudo steamos-readonly disable, затем sudo pacman -S webkit2gtk-4.1, затем sudo steamos-readonly enable (обновление SteamOS может снова его удалить). См. docs/USER_GUIDE.md."
