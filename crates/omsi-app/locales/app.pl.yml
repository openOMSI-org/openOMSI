# The interface texts in `pl`: the key is the English text of app.yml, the value its
# translation. A text missing here is shown in English.

"Current time": "Aktualny czas"
"Current date": "Aktualna data"
"Pedal keys speed": "Szybkość klawiszy pedałów"
"How fast the throttle and brake keys press their pedals; slower is finer": "Jak szybko klawisze gazu i hamulca wciskają pedały; wolniej znaczy precyzyjniej"
