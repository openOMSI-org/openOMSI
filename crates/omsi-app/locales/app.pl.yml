"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Jak mocno jadący autobus obraca kierownicę z powrotem na wprost po zakręcie; na postoju nigdy nie ciągnie."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Jak mocno kierownica opiera się szybkim ruchom, aby puszczona zatrzymała się na środku zamiast go przeskoczyć; zwiększ, jeśli kierownica oscyluje."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Jak ciężko obraca się kierownica, gdy autobus stoi lub ledwo się toczy; lżeje, gdy autobus jedzie."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Podnosi najmniejsze siły ponad próg, od którego kierownica zaczyna je oddawać; przydatne w kierownicach z paskiem lub przekładnią zębatą z martwym środkiem, przy direct drive zostaw 0."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Wygładza nagłe skoki siły kierownicy, które na mocnych kierownicach przy niskiej liczbie klatek mogą być odczuwalne jako ziarnistość; wyższe wartości dodają niewielkie opóźnienie."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Ogólna moc sił kierowniczych tej kierownicy; zmniejsz na mocnej bazie direct drive, zwiększ na słabej kierownicy."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Ogólna siła wstrząsów, uderzeń o krawężnik oraz drgań drogi i silnika na tej kierownicy."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Wył.: gra nie wysyła do kierownicy żadnych sił; pozostały opór pochodzi z własnego oprogramowania sterownika kierownicy (na przykład sprężyna centrująca w Logitech G HUB)"
