"Up the throttle, down the brake, as in OMSI; off: the mouse only steers, the pedals stay on the keys": "W górę gaz, w dół hamulec, jak w OMSI; wył.: mysz tylko kieruje, pedały zostają na klawiszach"
"Radio stations": "Stacje radiowe"
"A radio's station button n plays the n-th station, a cassette player the first; Shift+R steps through them. An address is an MP3, AAC or Ogg stream or an .m3u/.pls playlist.": "Przycisk stacji n w radiu odtwarza n-tą stację, magnetofon kasetowy pierwszą; Shift+R przełącza między nimi. Adres to strumień MP3, AAC lub Ogg albo playlista .m3u/.pls."
"Add a station": "Dodaj stację"
"Remove this station": "Usuń tę stację"
"Address": "Adres"
"Road texture vibration": "Wibracje nawierzchni"
"Engine vibration": "Wibracje silnika"
"Vibration fade-out": "Wygaszanie wibracji"
"Zoom on a key": "Zoom pod klawiszem"
"How far the view zooms while the zoom key is held (Controls: Zoom while held)": "Jak bardzo widok się przybliża, gdy klawisz zoomu jest wciśnięty (Sterowanie: zoom przy przytrzymaniu)"
"Zoom key stays": "Klawisz zoomu zostaje"
"One press zooms in, the next zooms out; off: only while the key is held": "Jedno naciśnięcie przybliża, następne oddala; wył.: tylko gdy klawisz jest wciśnięty"
"Zoom while held": "Zoom przy przytrzymaniu"
"Flashlight follows the cursor": "Latarka podąża za kursorem"
"With the cursor free (on foot, or in the cab while the mouse does not steer) the flashlight lights where it points; otherwise straight ahead": "Przy wolnym kursorze (pieszo lub w kabinie, gdy mysz nie steruje) latarka świeci tam, gdzie wskazuje; w przeciwnym razie prosto przed siebie"
"Steering view angle": "Kąt widoku przy skręcaniu"
"Steering view response": "Czas reakcji widoku na skręt"
"Indicator left (toggle)": "Lewy kierunkowskaz (włącz/wyłącz)"
"Indicator right (toggle)": "Prawy kierunkowskaz (włącz/wyłącz)"
"Force feedback direction": "Kierunek force feedback"
"Invert force feedback by default": "Domyślnie odwracaj force feedback"
"Wheels with a saved direction use their own setting under Controls → Game controllers.": "Kierownice z zapisanym kierunkiem używają własnego ustawienia w sekcji Sterowanie → Kontrolery gier."
"INJURY RISK: TAKE YOUR HANDS OFF THE WHEEL. Keep hands and fingers clear before starting and throughout the test.": "RYZYKO URAZU: PUŚĆ KIEROWNICĘ. Trzymaj ręce i palce z dala od niej przed rozpoczęciem i przez cały czas trwania testu."
"Start test": "Rozpocznij test"
"Test strength": "Siła testu"
"If the wheel barely moves, increase Test strength and retry. Keep your hands clear.": "Jeśli kierownica ledwo się porusza, zwiększ siłę testu i spróbuj ponownie. Trzymaj ręce z dala od kierownicy."
"The wheel did not move enough. Retry or choose the direction manually.": "Kierownica nie poruszyła się wystarczająco. Spróbuj ponownie lub wybierz kierunek ręcznie."
"Direction detected: normal": "Wykryty kierunek: normalny"
"Direction detected: inverted": "Wykryty kierunek: odwrócony"
"Testing: keep your hands off the wheel...": "Test trwa: nie dotykaj kierownicy..."
"If detection is inconclusive, retry or choose the direction manually. You can change it later on this device's page.": "Jeśli wykrywanie nie przyniesie jednoznacznego wyniku, spróbuj ponownie lub wybierz kierunek ręcznie. Możesz go później zmienić na stronie tego urządzenia."
"The test was interrupted. Please try again.": "Test został przerwany. Spróbuj ponownie."
"The wheel is unavailable. Reconnect it and try again.": "Kierownica jest niedostępna. Podłącz ją ponownie i spróbuj jeszcze raz."
"Move the wheel away from its end stops and try again.": "Odsuń kierownicę od ograniczników skrajnych i spróbuj ponownie."
"The wheel did not settle. Let go and try again.": "Kierownica nie ustabilizowała się. Puść ją i spróbuj ponownie."
"The wheel moved too far. Test stopped.": "Kierownica obróciła się za daleko. Test zatrzymany."
"The result is inconclusive. Retry or choose the direction manually.": "Wynik jest niejednoznaczny. Spróbuj ponownie lub wybierz kierunek ręcznie."
"Force feedback is unavailable. Choose the direction manually.": "Force feedback jest niedostępny. Wybierz kierunek ręcznie."
