"Each part of the company has a tile here, grouped by theme, with what matters there now. A badge says where something waits: unread messages, tours without a driver.":
  de: "Jeder Teil des Betriebs hat hier eine Kachel, nach Themen geordnet, mit dem, was dort gerade zählt. Ein Abzeichen zeigt, wo etwas wartet: ungelesene Nachrichten, Umläufe ohne Fahrer."
  fr: "Chaque partie de l'entreprise a ici sa tuile, rangée par thème, avec ce qui compte maintenant. Une pastille montre où quelque chose attend : des messages non lus, des services sans conducteur."
  nl: "Elk deel van het bedrijf heeft hier een tegel, per thema gegroepeerd, met wat er nu toe doet. Een badge laat zien waar iets wacht: ongelezen berichten, omlopen zonder chauffeur."
  pl: "Każda część firmy ma tu swój kafelek, pogrupowany tematycznie, z tym, co teraz ważne. Znaczek pokazuje, gdzie coś czeka: nieprzeczytane wiadomości, brygady bez kierowcy."
  ru: "У каждого раздела компании здесь своя плитка, по темам, с тем, что важно сейчас. Значок показывает, где что-то ждёт: непрочитанные сообщения, обороты без водителя."
  uk: "Кожен розділ компанії має тут свою плитку, за темами, з тим, що важливо зараз. Значок показує, де щось чекає: непрочитані повідомлення, обороти без водія."
"Cash, trophies, reputation":
  de: "Kasse, Trophäen, Ruf"
  fr: "Trésorerie, trophées, réputation"
  nl: "Kas, trofeeën, reputatie"
  pl: "Gotówka, trofea, reputacja"
  ru: "Касса, трофеи, репутация"
  uk: "Каса, трофеї, репутація"
"Under the company's name, always in view: its cash, the trophies earned with goals and contracts, and its reputation. A click opens the page about it.":
  de: "Unter dem Namen des Betriebs, immer im Blick: seine Kasse, die mit Zielen und Verträgen verdienten Trophäen und sein Ruf. Ein Klick öffnet die Seite dazu."
  fr: "Sous le nom de l'entreprise, toujours en vue : sa trésorerie, les trophées gagnés avec les objectifs et les contrats, et sa réputation. Un clic ouvre la page correspondante."
  nl: "Onder de naam van het bedrijf, altijd in zicht: de kas, de trofeeën verdiend met doelen en contracten, en de reputatie. Een klik opent de pagina erover."
  pl: "Pod nazwą firmy, zawsze na widoku: gotówka, trofea zdobyte za cele i umowy oraz reputacja. Kliknięcie otwiera odpowiednią stronę."
  ru: "Под названием компании, всегда на виду: касса, трофеи за цели и контракты и репутация. Щелчок открывает нужную страницу."
  uk: "Під назвою компанії, завжди на виду: каса, трофеї за цілі й контракти та репутація. Клацання відкриває відповідну сторінку."
"Back and across":
  de: "Zurück und hinüber"
  fr: "Retour et passage"
  nl: "Terug en verder"
  pl: "Wstecz i dalej"
  ru: "Назад и дальше"
  uk: "Назад і далі"
"This button takes you back to the start screen from every page, as Escape does. The icons on the right open any other page at once.":
  de: "Diese Schaltfläche bringt dich von jeder Seite zurück zur Startseite, wie Esc. Die Symbole rechts öffnen sofort jede andere Seite."
  fr: "Ce bouton vous ramène à l'accueil depuis chaque page, comme Échap. Les icônes à droite ouvrent aussitôt n'importe quelle autre page."
  nl: "Deze knop brengt je vanaf elke pagina terug naar het startscherm, net als Esc. De pictogrammen rechts openen meteen elke andere pagina."
  pl: "Ten przycisk z każdej strony wraca do ekranu startowego, tak jak Esc. Ikony po prawej od razu otwierają każdą inną stronę."
  ru: "Эта кнопка возвращает на главную с любой страницы, как и Esc. Значки справа сразу открывают любую другую страницу."
