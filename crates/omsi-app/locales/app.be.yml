"Its log says: {error}": "У яго журнале: {error}"
"Microsoft Edge WebView2 {version} is installed, so it is not missing.": "Microsoft Edge WebView2 {version} усталяваны, значыць, ён не адсутнічае."
"The openOMSI launcher shows its window with Microsoft Edge WebView2, which this Windows does not have yet.\n\nInstall it now with Microsoft's installer?": "Лаўнчар openOMSI паказвае акно праз Microsoft Edge WebView2, якога ў гэтай Windows яшчэ няма.\n\nУсталяваць яго зараз праз усталёўшчык Microsoft?"
"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "Яго журнал ляжыць у тэчцы даных openOMSI (launcher.log); Microsoft Edge WebView2 {version} усталяваны."
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "Акну лаўнчара патрэбны Microsoft Edge WebView2 (ёсць у Windows 10 і 11; для старэйшых сістэм: https://developer.microsoft.com/microsoft-edge/webview2/)."
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "У SteamOS яго няма. У Desktop Mode, у Konsole: sudo steamos-readonly disable, потым sudo pacman -S webkit2gtk-4.1, потым sudo steamos-readonly enable (абнаўленне SteamOS можа зноў яго выдаліць). Глядзіце docs/USER_GUIDE.md."
