"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Наколькі руль супраціўляецца хуткаму руху, каб адпушчаны руль спыняўся ў цэнтры, а не праскокваў яго; павялічце, калі руль разгойдваецца."
