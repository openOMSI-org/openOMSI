"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Падымае самыя слабыя высілкі вышэй за парог, з якога ваш руль пачынае іх перадаваць; карысна для рамянёвых і шасцярэнчатых руляў з мёртвай зонай у цэнтры, на direct drive пакіньце 0."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Згладжвае рэзкія скачкі высілку на рулі, якія на магутных рулях пры нізкай частаце кадраў адчуваюцца як зярністасць; большыя значэнні дадаюць невялікую затрымку."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Агульная сіла высілкаў на гэтым рулі; паменшыце на магутнай базе direct drive, павялічце на слабым рулі."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Агульная сіла трасяніны, удараў аб бардзюр і дрыжання ад дарогі і рухавіка на гэтым рулі."
