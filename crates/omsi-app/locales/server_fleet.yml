"This bus and its selected paint will be checked against the server and downloaded when needed.":
  es: "Este autobús y la pintura seleccionada se verificarán con el servidor y se descargarán cuando sea necesario."
  zh-tw: "此巴士及所選塗裝會與伺服器核對，並在需要時下載。"
  pt: "Este ônibus e a pintura selecionada serão verificados com o servidor e baixados quando necessário."
  ca: "Aquest autobús i la pintura seleccionada es verificaran amb el servidor i es descarregaran quan calgui."
  fr: "Ce bus et sa livrée sélectionnée seront vérifiés auprès du serveur et téléchargés si nécessaire."
  sr: "Ovaj autobus i izabrana boja biće provereni na serveru i preuzeti po potrebi."
  ru: "Этот автобус и выбранная окраска будут сверены с сервером и при необходимости загружены."
  de: "Dieser Bus und seine ausgewählte Lackierung werden mit dem Server abgeglichen und bei Bedarf heruntergeladen."
  pt-pt: "Este autocarro e a pintura selecionada serão verificados com o servidor e transferidos quando necessário."
  ka: "ეს ავტობუსი და არჩეული გაფორმება სერვერთან შემოწმდება და საჭიროებისას ჩამოიტვირთება."
  sv: "Bussen och den valda lackeringen kontrolleras mot servern och laddas ned vid behov."
  uk: "Цей автобус і вибране фарбування буде звірено із сервером і завантажено за потреби."
  be: "Гэты аўтобус і выбраная афарбоўка будуць правераны на серверы і пры неабходнасці спампаваны."
  kk: "Бұл автобус пен таңдалған бояу сервермен тексеріліп, қажет болса жүктеледі."
  pl: "Ten autobus i wybrane malowanie zostaną sprawdzone na serwerze i w razie potrzeby pobrane."
  cs: "Tento autobus a vybrané lakování se ověří na serveru a podle potřeby stáhnou."
  hu: "A buszt és a választott festést ellenőrizzük a szerveren, és szükség esetén letöltjük."
  it: "Questo autobus e la livrea selezionata saranno verificati con il server e scaricati se necessario."
  nl: "Deze bus en de gekozen beschildering worden met de server vergeleken en zo nodig gedownload."
  tr: "Bu otobüs ve seçilen kaplama sunucuyla doğrulanacak ve gerektiğinde indirilecektir."
  ja: "このバスと選択した塗装をサーバーと照合し、必要に応じてダウンロードします。"
  zh: "此巴士及所选涂装会与服务器核对，并在需要时下载。"
  hi: "इस बस और चुने गए पेंट की सर्वर से जाँच होगी और ज़रूरत पड़ने पर डाउनलोड किया जाएगा।"
  ko: "이 버스와 선택한 도색을 서버와 대조한 뒤 필요하면 다운로드합니다."
  th: "รถบัสและลวดลายที่เลือกจะถูกตรวจสอบกับเซิร์ฟเวอร์และดาวน์โหลดเมื่อจำเป็น"
