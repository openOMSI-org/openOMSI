"The server has not announced a downloadable version of this bus. Choose another bus or contact the server owner.":
  es: "El servidor no ha anunciado una versión descargable de este autobús. Elige otro autobús o contacta con el administrador del servidor."
  zh-tw: "伺服器未提供可下載的此巴士版本。請選擇其他巴士或聯絡伺服器管理員。"
  pt: "O servidor não anunciou uma versão deste ônibus disponível para download. Escolha outro ônibus ou entre em contato com o responsável pelo servidor."
  ca: "El servidor no ha anunciat cap versió descarregable d'aquest autobús. Trieu un altre autobús o contacteu amb l'administrador del servidor."
  fr: "Le serveur n'a annoncé aucune version téléchargeable de ce bus. Choisissez un autre bus ou contactez l'administrateur du serveur."
  sr: "Server nije ponudio verziju ovog autobusa za preuzimanje. Izaberi drugi autobus ili kontaktiraj administratora servera."
  ru: "Сервер не предоставил доступную для загрузки версию этого автобуса. Выберите другой автобус или свяжитесь с администратором сервера."
  de: "Der Server hat keine herunterladbare Version dieses Busses angekündigt. Wähle einen anderen Bus oder kontaktiere die Serververwaltung."
  pt-pt: "O servidor não anunciou uma versão deste autocarro disponível para transferência. Escolha outro autocarro ou contacte o responsável pelo servidor."
  ka: "სერვერს ამ ავტობუსის ჩამოსატვირთი ვერსია არ გამოუცხადებია. აირჩიეთ სხვა ავტობუსი ან დაუკავშირდით სერვერის ადმინისტრატორს."
  sv: "Servern har inte erbjudit någon nedladdningsbar version av den här bussen. Välj en annan buss eller kontakta serverägaren."
  uk: "Сервер не запропонував версію цього автобуса для завантаження. Виберіть інший автобус або зверніться до адміністратора сервера."
  be: "Сервер не прапанаваў версію гэтага аўтобуса для спампоўвання. Выберыце іншы аўтобус або звяжыцеся з адміністратарам сервера."
  kk: "Сервер бұл автобустың жүктелетін нұсқасын ұсынбады. Басқа автобусты таңдаңыз немесе сервер әкімшісіне хабарласыңыз."
  pl: "Serwer nie udostępnił wersji tego autobusu do pobrania. Wybierz inny autobus lub skontaktuj się z administratorem serwera."
  cs: "Server nenabídl verzi tohoto autobusu ke stažení. Vyberte jiný autobus nebo kontaktujte správce serveru."
  hu: "A szerver nem kínálta fel a busz letölthető változatát. Válassz másik buszt, vagy fordulj a szerver üzemeltetőjéhez."
  it: "Il server non ha annunciato una versione scaricabile di questo autobus. Scegli un altro autobus o contatta l'amministratore del server."
  nl: "De server heeft geen downloadbare versie van deze bus aangeboden. Kies een andere bus of neem contact op met de serverbeheerder."
  tr: "Sunucu bu otobüsün indirilebilir bir sürümünü sunmadı. Başka bir otobüs seçin veya sunucu yöneticisiyle iletişime geçin."
  ja: "サーバーはこのバスのダウンロード可能な版を提供していません。別のバスを選ぶか、サーバー管理者に連絡してください。"
  zh: "服务器未提供可下载的此巴士版本。请选择其他巴士或联系服务器管理员。"
  hi: "सर्वर ने इस बस का डाउनलोड करने योग्य संस्करण उपलब्ध नहीं कराया। दूसरी बस चुनें या सर्वर व्यवस्थापक से संपर्क करें।"
  ko: "서버가 이 버스의 다운로드 가능한 버전을 제공하지 않았습니다. 다른 버스를 선택하거나 서버 관리자에게 문의하세요."
  th: "เซิร์ฟเวอร์ไม่มีรุ่นที่ดาวน์โหลดได้ของรถบัสนี้ โปรดเลือกรถคันอื่นหรือติดต่อผู้ดูแลเซิร์ฟเวอร์"
  vi: "Máy chủ chưa cung cấp phiên bản có thể tải xuống của xe buýt này. Hãy chọn xe khác hoặc liên hệ quản trị viên máy chủ."
  id: "Server belum menyediakan versi bus ini yang dapat diunduh. Pilih bus lain atau hubungi pengelola server."
  ms: "Pelayan belum menawarkan versi bas ini untuk dimuat turun. Pilih bas lain atau hubungi pentadbir pelayan."
  tl: "Walang inialok na nada-download na bersyon ng bus na ito ang server. Pumili ng ibang bus o makipag-ugnayan sa administrator ng server."

"Offered by the joined server; its verified version is downloaded for this session.":
  es: "Ofrecido por el servidor conectado; su versión verificada se descarga para esta sesión."
  zh-tw: "由已加入的伺服器提供；經驗證的版本會下載供本次連線使用。"
  pt: "Disponibilizado pelo servidor conectado; a versão verificada é baixada para esta sessão."
  ca: "Ofert pel servidor al qual us heu connectat; la versió verificada es descarrega per a aquesta sessió."
  fr: "Proposé par le serveur rejoint ; sa version vérifiée est téléchargée pour cette session."
  sr: "Nudi ga povezani server; proverena verzija se preuzima za ovu sesiju."
  ru: "Предоставляется сервером подключения; проверенная версия загружается для этого сеанса."
  de: "Vom verbundenen Server angeboten; die geprüfte Version wird für diese Sitzung heruntergeladen."
  pt-pt: "Disponibilizado pelo servidor ao qual se ligou; a versão verificada é transferida para esta sessão."
  ka: "შემოთავაზებულია დაკავშირებული სერვერის მიერ; შემოწმებული ვერსია ამ სესიისთვის ჩამოიტვირთება."
  sv: "Erbjuds av servern du anslutit till; den verifierade versionen laddas ned för den här sessionen."
  uk: "Надається сервером підключення; перевірену версію буде завантажено для цього сеансу."
  be: "Прапануецца серверам падключэння; правераная версія спампуецца для гэтага сеанса."
  kk: "Қосылған сервер ұсынады; тексерілген нұсқа осы сеанс үшін жүктеледі."
  pl: "Udostępniany przez serwer, z którym się połączono; sprawdzona wersja zostanie pobrana na tę sesję."
  cs: "Nabízí připojený server; ověřená verze se stáhne pro tuto relaci."
  hu: "A csatlakoztatott szerver kínálja; az ellenőrzött változat erre a munkamenetre letöltődik."
  it: "Offerto dal server a cui ti sei connesso; la versione verificata viene scaricata per questa sessione."
  nl: "Aangeboden door de verbonden server; de geverifieerde versie wordt voor deze sessie gedownload."
  tr: "Bağlanılan sunucu tarafından sunulur; doğrulanmış sürüm bu oturum için indirilir."
  ja: "参加先のサーバーが提供します。検証済みの版がこのセッション用にダウンロードされます。"
  zh: "由已加入的服务器提供；经验证的版本将下载供本次会话使用。"
  hi: "जुड़े हुए सर्वर द्वारा उपलब्ध; सत्यापित संस्करण इस सत्र के लिए डाउनलोड किया जाएगा।"
  ko: "접속한 서버에서 제공하며, 검증된 버전이 이 세션에 다운로드됩니다."
  th: "เซิร์ฟเวอร์ที่เข้าร่วมเป็นผู้ให้บริการ โดยจะดาวน์โหลดรุ่นที่ตรวจสอบแล้วสำหรับเซสชันนี้"
  vi: "Do máy chủ đã kết nối cung cấp; phiên bản đã xác minh sẽ được tải xuống cho phiên này."
  id: "Disediakan oleh server yang diikuti; versi terverifikasi diunduh untuk sesi ini."
  ms: "Ditawarkan oleh pelayan yang disertai; versi yang disahkan dimuat turun untuk sesi ini."
  tl: "Inaalok ng sinalihang server; ida-download ang na-verify na bersyon para sa sesyong ito."
