"The selected bus or repaint may need files from this server. Matching local files are reused; other files are checked and cached for this session without replacing your installed mods. Continue?":
  es: "El autobús o la pintura seleccionados pueden necesitar archivos de este servidor. Se reutilizarán los archivos locales idénticos; los demás se verificarán y guardarán en la caché de esta sesión sin sustituir los mods instalados. ¿Continuar?"
  zh-tw: "所選巴士或塗裝可能需要從此伺服器下載檔案。相同的本機檔案會重複使用；其他檔案會經過驗證並暫存於本次連線，不會取代已安裝的模組。要繼續嗎？"
  pt: "O ônibus ou a pintura selecionada pode precisar de arquivos deste servidor. Os arquivos locais idênticos serão reutilizados; os demais serão verificados e guardados no cache desta sessão, sem substituir seus mods instalados. Continuar?"
  ca: "L'autobús o la pintura seleccionats poden necessitar fitxers d'aquest servidor. Es reutilitzaran els fitxers locals idèntics; els altres es verificaran i es guardaran a la memòria cau d'aquesta sessió sense substituir els mods instal·lats. Voleu continuar?"
  fr: "Le bus ou la livrée sélectionnés peuvent nécessiter des fichiers du serveur. Les fichiers locaux identiques seront réutilisés ; les autres seront vérifiés et mis en cache pour cette session sans remplacer les mods installés. Continuer ?"
  sr: "Izabrani autobus ili boja mogu zahtevati datoteke sa ovog servera. Iste lokalne datoteke će se ponovo koristiti; ostale će biti proverene i sačuvane u kešu za ovu sesiju bez zamene instaliranih modova. Nastaviti?"
  ru: "Для выбранного автобуса или окраски могут понадобиться файлы с этого сервера. Совпадающие локальные файлы будут использованы повторно, остальные проверены и сохранены в кэше на время сеанса без замены установленных модов. Продолжить?"
  de: "Für den ausgewählten Bus oder die Lackierung sind möglicherweise Dateien von diesem Server nötig. Identische lokale Dateien werden wiederverwendet; andere werden geprüft und für diese Sitzung zwischengespeichert, ohne installierte Mods zu ersetzen. Fortfahren?"
  pt-pt: "O autocarro ou a pintura selecionada pode precisar de ficheiros deste servidor. Os ficheiros locais idênticos serão reutilizados; os restantes serão verificados e guardados na cache desta sessão, sem substituir os mods instalados. Continuar?"
  ka: "არჩეულ ავტობუსს ან მის გაფორმებას შეიძლება ამ სერვერის ფაილები დასჭირდეს. იდენტური ადგილობრივი ფაილები ხელახლა გამოიყენება, დანარჩენი შემოწმდება და ამ სესიის ქეშში შეინახება დაყენებული მოდების შეცვლის გარეშე. გაგრძელება?"
  sv: "Den valda bussen eller lackeringen kan behöva filer från servern. Identiska lokala filer återanvänds; övriga kontrolleras och sparas i sessionens cache utan att installerade moddar ersätts. Fortsätta?"
  uk: "Для вибраного автобуса або фарбування можуть знадобитися файли із цього сервера. Однакові локальні файли буде використано повторно, інші перевірено й кешовано на цей сеанс без заміни встановлених модів. Продовжити?"
  be: "Для выбранага аўтобуса або афарбоўкі могуць спатрэбіцца файлы з сервера. Аднолькавыя лакальныя файлы будуць выкарыстаны паўторна, астатнія правераны і захаваны ў кэшы на гэты сеанс без замены ўсталяваных модаў. Працягнуць?"
  kk: "Таңдалған автобус не оның бояуы үшін осы серверден файлдар қажет болуы мүмкін. Сәйкес жергілікті файлдар қайта пайдаланылады, қалғандары тексеріліп, орнатылған модтарды алмастырмай, осы сеансқа кэштеледі. Жалғастыру керек пе?"
  pl: "Wybrany autobus lub malowanie może wymagać plików z tego serwera. Identyczne pliki lokalne zostaną ponownie użyte, a pozostałe sprawdzone i zapisane w pamięci podręcznej na tę sesję bez zastępowania zainstalowanych modów. Kontynuować?"
  cs: "Vybraný autobus nebo lakování může vyžadovat soubory z tohoto serveru. Shodné místní soubory se znovu použijí, ostatní se ověří a uloží do mezipaměti pro tuto relaci bez přepsání nainstalovaných modů. Pokračovat?"
  hu: "A kiválasztott buszhoz vagy festéshez fájlokra lehet szükség a szerverről. Az egyező helyi fájlok újra felhasználhatók, a többit ellenőrizzük és csak erre a munkamenetre gyorsítótárazzuk, a telepített modok felülírása nélkül. Folytatod?"
  it: "L'autobus o la livrea selezionati potrebbero richiedere file dal server. I file locali identici saranno riutilizzati; gli altri verranno verificati e memorizzati nella cache della sessione senza sostituire le mod installate. Continuare?"
  nl: "Voor de gekozen bus of beschildering zijn mogelijk bestanden van deze server nodig. Identieke lokale bestanden worden hergebruikt; andere worden gecontroleerd en voor deze sessie in de cache opgeslagen zonder geïnstalleerde mods te vervangen. Doorgaan?"
  tr: "Seçilen otobüs veya kaplama için bu sunucudan dosyalar gerekebilir. Eşleşen yerel dosyalar yeniden kullanılır; diğerleri doğrulanıp yüklü modlar değiştirilmeden bu oturum için önbelleğe alınır. Devam edilsin mi?"
  ja: "選択したバスまたは塗装には、このサーバーのファイルが必要な場合があります。同一のローカルファイルは再利用し、それ以外は検証して今回のセッション用にキャッシュします。インストール済みのMODは置き換えません。続行しますか？"
  zh: "所选巴士或涂装可能需要从此服务器下载文件。相同的本地文件会重复使用；其他文件将经过验证并缓存于本次会话，不会替换已安装的模组。是否继续？"
  hi: "चुनी गई बस या पेंट के लिए इस सर्वर की फ़ाइलें आवश्यक हो सकती हैं। मिलती हुई स्थानीय फ़ाइलें फिर उपयोग होंगी; अन्य फ़ाइलों की जाँच कर इस सत्र के लिए कैश किया जाएगा, बिना स्थापित मॉड बदले। जारी रखें?"
  ko: "선택한 버스나 도색에 서버 파일이 필요할 수 있습니다. 동일한 로컬 파일은 재사용하고 나머지는 검증한 뒤 이 세션에만 캐시합니다. 설치된 모드는 교체하지 않습니다. 계속할까요?"
  th: "รถบัสหรือลวดลายที่เลือกอาจต้องใช้ไฟล์จากเซิร์ฟเวอร์นี้ ไฟล์ในเครื่องที่ตรงกันจะถูกนำมาใช้ซ้ำ ส่วนไฟล์อื่นจะผ่านการตรวจสอบและเก็บในแคชสำหรับเซสชันนี้ โดยไม่แทนที่ม็อดที่ติดตั้งไว้ ดำเนินการต่อหรือไม่?"
  vi: "Xe buýt hoặc lớp sơn đã chọn có thể cần tệp từ máy chủ này. Các tệp cục bộ giống hệt sẽ được dùng lại; các tệp khác được xác minh và lưu vào bộ nhớ đệm cho phiên này mà không thay thế mod đã cài. Tiếp tục?"
  id: "Bus atau livery yang dipilih mungkin memerlukan berkas dari server ini. Berkas lokal yang cocok digunakan kembali; lainnya diverifikasi dan disimpan dalam cache sesi tanpa mengganti mod yang terpasang. Lanjutkan?"
  ms: "Bas atau corak yang dipilih mungkin memerlukan fail daripada pelayan ini. Fail setempat yang sepadan digunakan semula; fail lain disahkan dan disimpan dalam cache sesi ini tanpa menggantikan mod yang dipasang. Teruskan?"
  tl: "Maaaring mangailangan ng mga file mula sa server ang napiling bus o pintura. Gagamitin muli ang magkatugmang lokal na file; susuriin at ika-cache ang iba para sa sesyong ito nang hindi pinapalitan ang naka-install na mods. Magpatuloy?"

