"Red numbers in the status bar: some trips have no bus or no driver. Look at the stack above the rows, or let OPTIMIZE fill the gaps.":
  de: "Rote Zahlen in der Statusleiste: Manche Fahrten haben keinen Bus oder keinen Fahrer. Sehen Sie sich den Stapel über den Zeilen an oder lassen Sie OPTIMIEREN die Lücken füllen."
  fr: "Des nombres rouges dans la barre d'état : certaines courses n'ont pas de bus ou pas de conducteur. Regardez la pile au-dessus des lignes, ou laissez OPTIMISER combler les trous."
  nl: "Rode getallen in de statusbalk: sommige ritten hebben geen bus of geen chauffeur. Kijk naar de stapel boven de rijen, of laat OPTIMALISEREN de gaten vullen."
  pl: "Czerwone liczby na pasku stanu: niektóre kursy nie mają autobusu albo kierowcy. Zajrzyj na stos nad wierszami albo pozwól OPTYMALIZUJ wypełnić luki."
  ru: "Красные числа в строке состояния: у некоторых рейсов нет автобуса или водителя. Посмотрите стопку над строками или дайте ОПТИМИЗИРОВАТЬ закрыть пробелы."
  uk: "Червоні числа в рядку стану: деякі рейси не мають автобуса чи водія. Подивіться на стос над рядками або дайте ОПТИМІЗУВАТИ закрити прогалини."
"A red \"!\" by a row: hold the mouse over it to read which rule is broken. Click the issue counter in the status bar to see them all, and click one to jump to its row.":
  de: "Ein rotes „!“ an einer Zeile: Halten Sie die Maus darüber, um zu lesen, welche Regel verletzt ist. Klicken Sie auf den Problemzähler in der Statusleiste, um alle zu sehen, und auf eines, um zu seiner Zeile zu springen."
  fr: "Un « ! » rouge près d'une ligne : survolez-le pour lire quelle règle est enfreinte. Cliquez sur le compteur de problèmes dans la barre d'état pour tous les voir, et sur l'un pour aller à sa ligne."
  nl: "Een rood „!” bij een rij: houd de muis erboven om te lezen welke regel overtreden is. Klik op de probleemteller in de statusbalk om ze allemaal te zien, en op een ervan om naar zijn rij te springen."
  pl: "Czerwony „!” przy wierszu: najedź na niego, by przeczytać, która reguła jest złamana. Kliknij licznik problemów na pasku stanu, by zobaczyć wszystkie, i kliknij jeden, by przejść do jego wiersza."
  ru: "Красный «!» у строки: наведите на него, чтобы прочитать, какое правило нарушено. Щёлкните счётчик проблем в строке состояния, чтобы увидеть все, и щёлкните одну, чтобы перейти к её строке."
  uk: "Червоний «!» біля рядка: наведіть на нього, щоб прочитати, яке правило порушено. Клацніть лічильник проблем у рядку стану, щоб побачити всі, і клацніть одну, щоб перейти до її рядка."
"A red slot while you move something: dropping there breaks a rule. You may still do it, but the day gets an issue.":
  de: "Ein roter Platz beim Verschieben: Dort abzulegen verletzt eine Regel. Sie dürfen es trotzdem, aber der Tag bekommt ein Problem."
  fr: "Un emplacement rouge pendant un déplacement : déposer là enfreint une règle. Vous pouvez quand même le faire, mais la journée aura un problème."
  nl: "Een rood vak terwijl je iets verplaatst: daar neerzetten overtreedt een regel. Het mag nog steeds, maar de dag krijgt een probleem."
  pl: "Czerwone miejsce podczas przenoszenia: upuszczenie tam łamie regułę. Wciąż możesz to zrobić, ale dzień dostanie problem."
  ru: "Красное место при переносе: поставив туда, вы нарушите правило. Это можно сделать, но у дня появится проблема."
  uk: "Червоне місце під час перенесення: поставивши туди, ви порушите правило. Це можна зробити, але в дня з'явиться проблема."
"A red difference beside a figure: your last change made it worse. Ctrl+Z takes it back.":
  de: "Eine rote Differenz neben einer Kennzahl: Ihre letzte Änderung hat sie verschlechtert. Strg+Z nimmt sie zurück."
  fr: "Une différence rouge à côté d'un chiffre : votre dernière modification l'a aggravé. Ctrl+Z l'annule."
  nl: "Een rood verschil naast een cijfer: je laatste wijziging maakte het slechter. Ctrl+Z draait het terug."
  pl: "Czerwona różnica obok wskaźnika: ostatnia zmiana go pogorszyła. Ctrl+Z ją cofa."
  ru: "Красная разница рядом с показателем: последнее изменение его ухудшило. Ctrl+Z отменит его."
  uk: "Червона різниця біля показника: остання зміна його погіршила. Ctrl+Z скасує її."
"More duties than drivers (a Global issue): hire drivers on the Staff page, or make fewer, longer duties.":
  de: "Mehr Dienste als Fahrer (ein allgemeines Problem): Stellen Sie auf der Seite Personal Fahrer ein, oder machen Sie weniger, längere Dienste."
  fr: "Plus de services que de conducteurs (un problème général) : embauchez des conducteurs sur la page Personnel, ou faites des services moins nombreux et plus longs."
  nl: "Meer diensten dan chauffeurs (een algemeen probleem): neem chauffeurs aan op de pagina Personeel, of maak minder, langere diensten."
  pl: "Więcej służb niż kierowców (problem ogólny): zatrudnij kierowców na stronie Personel albo zrób mniej, ale dłuższych służb."
  ru: "Смен больше, чем водителей (общая проблема): наймите водителей на странице «Персонал» или сделайте меньше, но длиннее смены."
  uk: "Змін більше, ніж водіїв (загальна проблема): найміть водіїв на сторінці «Персонал» або зробіть менше, але довших змін."
"Orange is a soft rule: allowed, but it adds a penalty to the cost. Change the rules under Preferences (the first icon at the top).":
  de: "Orange ist eine weiche Regel: erlaubt, aber sie erhöht die Kosten um eine Strafe. Die Regeln ändern Sie unter Einstellungen (das erste Symbol oben)."
  fr: "L'orange est une règle souple : permise, mais elle ajoute une pénalité au coût. Changez les règles dans Préférences (la première icône en haut)."
  nl: "Oranje is een zachte regel: toegestaan, maar er komt een boete bij de kosten. Wijzig de regels onder Voorkeuren (het eerste pictogram bovenaan)."
  pl: "Pomarańczowy to reguła miękka: dozwolona, ale dolicza karę do kosztu. Reguły zmienisz w Preferencjach (pierwsza ikona na górze)."
  ru: "Оранжевое — мягкое правило: допустимо, но добавляет к стоимости штраф. Правила меняются в «Предпочтениях» (первый значок вверху)."
  uk: "Помаранчеве — м'яке правило: дозволено, але додає до вартості штраф. Правила змінюються у «Вподобаннях» (перший значок угорі)."
