_version: 2
# RosterFlow's tutorial (Luc: "build a tutorial for the new RosterFlow: I no longer understand
# how it works, let alone other players"): its guided tour, its lessons ("Try it yourself") and
# its help sheet ("RosterFlow in 2 minutes").
"What RosterFlow is":
  de: "Was RosterFlow ist"
  fr: "Ce qu'est RosterFlow"
  nl: "Wat RosterFlow is"
  pl: "Czym jest RosterFlow"
  ru: "Что такое RosterFlow"
  uk: "Що таке RosterFlow"
"Reading the screen":
  de: "Den Bildschirm lesen"
  fr: "Lire l'écran"
  nl: "Het scherm lezen"
  pl: "Jak czytać ekran"
  ru: "Как читать экран"
  uk: "Як читати екран"
"Start planning":
  de: "Los geht's mit der Planung"
  fr: "Commencer à planifier"
  nl: "Aan de slag met plannen"
  pl: "Zacznij planować"
  ru: "Начать планирование"
  uk: "Почати планування"
"Welcome to RosterFlow":
  de: "Willkommen bei RosterFlow"
  fr: "Bienvenue dans RosterFlow"
  nl: "Welkom bij RosterFlow"
  pl: "Witaj w RosterFlow"
  ru: "Добро пожаловать в RosterFlow"
  uk: "Ласкаво просимо до RosterFlow"
"RosterFlow plans your company's day: when the buses run, which bus drives which trips, and which driver drives which bus. It is a chain of four steps, and nothing counts until you save. Let's walk along it.":
  de: "RosterFlow plant den Tag Ihres Unternehmens: wann die Busse fahren, welcher Bus welche Fahrten fährt und welcher Fahrer welchen Bus fährt. Es ist eine Kette aus vier Schritten, und nichts zählt, bevor Sie speichern. Gehen wir sie gemeinsam durch."
  fr: "RosterFlow planifie la journée de votre entreprise : quand les bus circulent, quel bus fait quelles courses et quel conducteur conduit quel bus. C'est une chaîne de quatre étapes, et rien ne compte tant que vous n'avez pas enregistré. Parcourons-la ensemble."
  nl: "RosterFlow plant de dag van je bedrijf: wanneer de bussen rijden, welke bus welke ritten rijdt en welke chauffeur op welke bus zit. Het is een keten van vier stappen, en niets telt voordat je opslaat. Laten we hem samen doorlopen."
  pl: "RosterFlow planuje dzień twojej firmy: kiedy jeżdżą autobusy, który autobus wykonuje które kursy i który kierowca prowadzi który autobus. To łańcuch czterech kroków i nic się nie liczy, dopóki nie zapiszesz. Przejdźmy go razem."
  ru: "RosterFlow планирует день вашей компании: когда ходят автобусы, какой автобус выполняет какие рейсы и какой водитель ведёт какой автобус. Это цепочка из четырёх шагов, и ничего не вступает в силу, пока вы не сохраните. Пройдём её вместе."
  uk: "RosterFlow планує день вашої компанії: коли ходять автобуси, який автобус виконує які рейси і який водій веде який автобус. Це ланцюжок із чотирьох кроків, і ніщо не діє, доки ви не збережете. Пройдімо його разом."
"1. Timeplan: when the buses run":
  de: "1. Fahrplanentwurf: wann die Busse fahren"
  fr: "1. Plan horaire : quand les bus circulent"
  nl: "1. Dienstregelingsplan: wanneer de bussen rijden"
  pl: "1. Plan rozkładu: kiedy jeżdżą autobusy"
  ru: "1. План расписания: когда ходят автобусы"
  uk: "1. План розкладу: коли ходять автобуси"
"Here a line gets its timetable: the minutes a bus needs from stop to stop, and how often a bus leaves. Every other step is built from these trips.":
  de: "Hier bekommt eine Linie ihren Fahrplan: die Minuten, die ein Bus von Haltestelle zu Haltestelle braucht, und wie oft ein Bus abfährt. Alle anderen Schritte bauen auf diesen Fahrten auf."
  fr: "Ici, une ligne reçoit son horaire : les minutes qu'il faut à un bus d'un arrêt à l'autre, et la fréquence des départs. Toutes les autres étapes sont construites à partir de ces courses."
  nl: "Hier krijgt een lijn zijn dienstregeling: de minuten die een bus nodig heeft van halte tot halte, en hoe vaak er een bus vertrekt. Alle andere stappen bouwen op deze ritten voort."
  pl: "Tu linia dostaje swój rozkład: ile minut autobus potrzebuje od przystanku do przystanku i jak często odjeżdża. Wszystkie pozostałe kroki budowane są z tych kursów."
  ru: "Здесь линия получает расписание: сколько минут автобусу нужно от остановки до остановки и как часто он отправляется. Все остальные шаги строятся из этих рейсов."
  uk: "Тут лінія отримує розклад: скільки хвилин автобусу потрібно від зупинки до зупинки і як часто він вирушає. Усі інші кроки будуються з цих рейсів."
"2. Vehicles: which bus drives which trips":
  de: "2. Fahrzeuge: welcher Bus welche Fahrten fährt"
  fr: "2. Véhicules : quel bus fait quelles courses"
  nl: "2. Voertuigen: welke bus welke ritten rijdt"
  pl: "2. Pojazdy: który autobus wykonuje które kursy"
  ru: "2. Транспорт: какой автобус выполняет какие рейсы"
  uk: "2. Транспорт: який автобус виконує які рейси"
"The day's trips are shared out among your buses. One bus's day of trips is called a block. A good block keeps the bus busy and has few empty runs.":
  de: "Die Fahrten des Tages werden auf Ihre Busse verteilt. Der Tag eines Busses mit all seinen Fahrten heißt Umlauf. Ein guter Umlauf hält den Bus beschäftigt und hat wenige Leerfahrten."
  fr: "Les courses de la journée sont réparties entre vos bus. La journée de courses d'un bus s'appelle un bloc. Un bon bloc occupe bien le bus et compte peu de trajets à vide."
  nl: "De ritten van de dag worden over je bussen verdeeld. De dag met ritten van één bus heet een omloop. Een goede omloop houdt de bus bezig en heeft weinig lege ritten."
  pl: "Kursy dnia są rozdzielane między twoje autobusy. Dzień kursów jednego autobusu to obieg. Dobry obieg dobrze wykorzystuje autobus i ma mało pustych przejazdów."
  ru: "Рейсы дня распределяются между вашими автобусами. День рейсов одного автобуса называется выпуском. Хороший выпуск держит автобус занятым, и в нём мало порожних пробегов."
  uk: "Рейси дня розподіляються між вашими автобусами. День рейсів одного автобуса називається випуском. Добрий випуск тримає автобус зайнятим, і в ньому мало порожніх пробігів."
"3. Drivers: who drives":
  de: "3. Fahrer: wer fährt"
  fr: "3. Conducteurs : qui conduit"
  nl: "3. Chauffeurs: wie rijdt"
  pl: "3. Kierowcy: kto prowadzi"
  ru: "3. Водители: кто ведёт"
  uk: "3. Водії: хто веде"
"A bus's day is too long for one driver, so each block is cut into duties: one driver's working day. A cut can only be made where a driver can get on or off: at a terminus or at the depot.":
  de: "Der Tag eines Busses ist zu lang für einen Fahrer, darum wird jeder Umlauf in Dienste geteilt: der Arbeitstag eines Fahrers. Geteilt werden kann nur dort, wo ein Fahrer ein- oder aussteigen kann: an einer Endhaltestelle oder am Betriebshof."
  fr: "La journée d'un bus est trop longue pour un seul conducteur : chaque bloc est donc découpé en services de conduite, la journée de travail d'un conducteur. On ne peut couper que là où un conducteur peut monter ou descendre : à un terminus ou au dépôt."
  nl: "De dag van een bus is te lang voor één chauffeur, dus wordt elke omloop in diensten geknipt: de werkdag van één chauffeur. Knippen kan alleen waar een chauffeur in of uit kan stappen: aan een eindhalte of bij de remise."
  pl: "Dzień autobusu jest za długi dla jednego kierowcy, więc każdy obieg dzieli się na służby: dzień pracy jednego kierowcy. Podzielić można tylko tam, gdzie kierowca może wsiąść lub wysiąść: na pętli lub w zajezdni."
  ru: "День автобуса слишком длинный для одного водителя, поэтому каждый выпуск делится на смены: рабочий день одного водителя. Разрезать можно только там, где водитель может сесть или сойти: на конечной или в депо."
  uk: "День автобуса задовгий для одного водія, тож кожен випуск ділиться на зміни: робочий день одного водія. Розрізати можна лише там, де водій може сісти чи зійти: на кінцевій або в депо."
"4. Roster: which driver, which day":
  de: "4. Dienstplan: welcher Fahrer, welcher Tag"
  fr: "4. Roulement du personnel : quel conducteur, quel jour"
  nl: "4. Rooster: welke chauffeur, welke dag"
  pl: "4. Grafik: który kierowca, który dzień"
  ru: "4. График: какой водитель, какой день"
  uk: "4. Графік: який водій, який день"
"Here your drivers get their duties and your buses their blocks, weekday by weekday. What you plan for a Monday repeats every Monday.":
  de: "Hier bekommen Ihre Fahrer ihre Dienste und Ihre Busse ihre Umläufe, Wochentag für Wochentag. Was Sie für einen Montag planen, wiederholt sich jeden Montag."
  fr: "Ici, vos conducteurs reçoivent leurs services et vos bus leurs blocs, jour de semaine par jour de semaine. Ce que vous planifiez pour un lundi se répète chaque lundi."
  nl: "Hier krijgen je chauffeurs hun diensten en je bussen hun omlopen, weekdag voor weekdag. Wat je voor een maandag plant, herhaalt zich elke maandag."
  pl: "Tutaj kierowcy dostają służby, a autobusy obiegi, dzień tygodnia po dniu. To, co zaplanujesz na poniedziałek, powtarza się w każdy poniedziałek."
  ru: "Здесь водители получают смены, а автобусы — выпуски, день недели за днём. То, что вы запланируете на понедельник, повторяется каждый понедельник."
  uk: "Тут водії отримують зміни, а автобуси — випуски, день тижня за днем. Те, що ви заплануєте на понеділок, повторюється щопонеділка."
"Then SAVE":
  de: "Dann SPEICHERN"
  fr: "Puis ENREGISTRER"
  nl: "Dan OPSLAAN"
  pl: "Potem ZAPISZ"
  ru: "Затем СОХРАНИТЬ"
  uk: "Потім ЗБЕРЕГТИ"
"Your changes in Vehicles and Drivers are a draft. SAVE makes them the company's planning: the roster, the day and the game run it. DISCARD throws the draft away and goes back to what was saved.":
  de: "Ihre Änderungen unter Fahrzeuge und Fahrer sind ein Entwurf. SPEICHERN macht sie zur Planung des Unternehmens: Dienstplan, Tag und Spiel fahren danach. VERWERFEN wirft den Entwurf weg und kehrt zum Gespeicherten zurück."
  fr: "Vos modifications dans Véhicules et Conducteurs sont un brouillon. ENREGISTRER en fait la planification de l'entreprise : le roulement, la journée et le jeu l'appliquent. ABANDONNER jette le brouillon et revient à ce qui était enregistré."
  nl: "Je wijzigingen in Voertuigen en Chauffeurs zijn een concept. OPSLAAN maakt ze de planning van het bedrijf: het rooster, de dag en het spel rijden ermee. VERWERPEN gooit het concept weg en gaat terug naar wat was opgeslagen."
  pl: "Zmiany w Pojazdach i Kierowcach to szkic. ZAPISZ czyni je planem firmy: grafik, dzień i gra działają według niego. ODRZUĆ wyrzuca szkic i wraca do tego, co było zapisane."
  ru: "Ваши изменения в «Транспорте» и «Водителях» — это черновик. СОХРАНИТЬ делает их планом компании: по нему работают график, день и игра. ОТМЕНИТЬ выбрасывает черновик и возвращает сохранённое."
  uk: "Ваші зміни в «Транспорті» та «Водіях» — це чернетка. ЗБЕРЕГТИ робить їх планом компанії: за ним працюють графік, день і гра. СКАСУВАТИ викидає чернетку й повертає збережене."
"The title bar":
  de: "Die Titelleiste"
  fr: "La barre de titre"
  nl: "De titelbalk"
  pl: "Pasek tytułu"
  ru: "Строка заголовка"
  uk: "Рядок заголовка"
"On the left: the rules (preferences), printing, search by ID and the optimiser's settings. In the middle your company and the day, with a dot: green is saved, orange means there are changes not saved yet.":
  de: "Links: die Regeln (Einstellungen), Drucken, Suche nach ID und die Einstellungen der Optimierung. In der Mitte Ihr Unternehmen und der Tag mit einem Punkt: grün heißt gespeichert, orange heißt, es gibt noch ungespeicherte Änderungen."
  fr: "À gauche : les règles (préférences), l'impression, la recherche par identifiant et les réglages de l'optimiseur. Au milieu, votre entreprise et le jour, avec un point : vert, c'est enregistré ; orange, il reste des modifications non enregistrées."
  nl: "Links: de regels (voorkeuren), afdrukken, zoeken op ID en de instellingen van de optimalisatie. In het midden je bedrijf en de dag, met een stip: groen is opgeslagen, oranje betekent dat er nog niet-opgeslagen wijzigingen zijn."
  pl: "Po lewej: reguły (preferencje), drukowanie, wyszukiwanie po ID i ustawienia optymalizacji. Pośrodku twoja firma i dzień z kropką: zielona to zapisane, pomarańczowa oznacza niezapisane zmiany."
  ru: "Слева: правила (настройки), печать, поиск по номеру и параметры оптимизации. В середине ваша компания и день с точкой: зелёная — сохранено, оранжевая — есть несохранённые изменения."
  uk: "Ліворуч: правила (налаштування), друк, пошук за номером і параметри оптимізації. Посередині ваша компанія і день із крапкою: зелена — збережено, помаранчева — є незбережені зміни."
"Undo, redo and history":
  de: "Rückgängig, Wiederholen und Verlauf"
  fr: "Annuler, rétablir et historique"
  nl: "Ongedaan maken, opnieuw en geschiedenis"
  pl: "Cofnij, ponów i historia"
  ru: "Отмена, повтор и история"
  uk: "Скасування, повтор та історія"
"Every change can be undone (Ctrl+Z) and done again (Ctrl+Y). The clock lists all your changes, so you can go back to any one of them.":
  de: "Jede Änderung lässt sich rückgängig machen (Strg+Z) und wiederholen (Strg+Y). Die Uhr listet alle Ihre Änderungen auf, sodass Sie zu jeder davon zurückkehren können."
  fr: "Chaque modification peut être annulée (Ctrl+Z) et rétablie (Ctrl+Y). L'horloge liste toutes vos modifications : vous pouvez revenir à n'importe laquelle."
  nl: "Elke wijziging kun je ongedaan maken (Ctrl+Z) en opnieuw doen (Ctrl+Y). De klok toont al je wijzigingen, zodat je naar elk ervan terug kunt."
  pl: "Każdą zmianę można cofnąć (Ctrl+Z) i ponowić (Ctrl+Y). Zegar pokazuje wszystkie zmiany, więc możesz wrócić do dowolnej z nich."
  ru: "Любое изменение можно отменить (Ctrl+Z) и повторить (Ctrl+Y). Часы показывают все ваши изменения, и к любому из них можно вернуться."
  uk: "Будь-яку зміну можна скасувати (Ctrl+Z) і повторити (Ctrl+Y). Годинник показує всі ваші зміни, і до будь-якої з них можна повернутися."
"The day you plan":
  de: "Der Tag, den Sie planen"
  fr: "Le jour que vous planifiez"
  nl: "De dag die je plant"
  pl: "Dzień, który planujesz"
  ru: "День, который вы планируете"
  uk: "День, який ви плануєте"
"Choose the day here. A day's planning holds for that weekday every week: change a Tuesday and every Tuesday changes.":
  de: "Wählen Sie hier den Tag. Die Planung eines Tages gilt jede Woche für diesen Wochentag: Ändern Sie einen Dienstag, ändert sich jeder Dienstag."
  fr: "Choisissez le jour ici. La planification d'un jour vaut pour ce jour de la semaine chaque semaine : modifiez un mardi, et tous les mardis changent."
  nl: "Kies hier de dag. De planning van een dag geldt elke week voor die weekdag: verander een dinsdag en elke dinsdag verandert."
  pl: "Tutaj wybierasz dzień. Plan dnia obowiązuje w ten dzień tygodnia co tydzień: zmień wtorek, a zmieni się każdy wtorek."
  ru: "Выберите здесь день. План дня действует для этого дня недели каждую неделю: измените вторник — изменится каждый вторник."
  uk: "Виберіть тут день. План дня діє для цього дня тижня щотижня: змініть вівторок — зміниться кожен вівторок."
"How many duties and buses":
  de: "Wie viele Dienste und Busse"
  fr: "Combien de services et de bus"
  nl: "Hoeveel diensten en bussen"
  pl: "Ile służb i autobusów"
  ru: "Сколько смен и автобусов"
  uk: "Скільки змін і автобусів"
"Duties: how many drivers' working days the day needs. Blocks: how many buses drive; PVR is how many are out at the busiest moment. Fewer is cheaper, as long as every trip is driven.":
  de: "Dienste: wie viele Fahrer-Arbeitstage der Tag braucht. Umläufe: wie viele Busse fahren; die Spitze ist, wie viele zur verkehrsreichsten Zeit gleichzeitig unterwegs sind. Weniger ist günstiger, solange jede Fahrt gefahren wird."
  fr: "Services : combien de journées de conducteurs il faut. Blocs : combien de bus roulent ; la pointe est le nombre de bus en ligne au moment le plus chargé. Moins, c'est moins cher, tant que chaque course est assurée."
  nl: "Diensten: hoeveel werkdagen van chauffeurs de dag nodig heeft. Omlopen: hoeveel bussen er rijden; de piek is hoeveel er op het drukste moment tegelijk onderweg zijn. Minder is goedkoper, zolang elke rit gereden wordt."
  pl: "Służby: ile dni pracy kierowców potrzeba. Obiegi: ile autobusów jeździ; szczyt to ile jest w trasie w najbardziej ruchliwej chwili. Mniej znaczy taniej, pod warunkiem że każdy kurs jest wykonany."
  ru: "Смены: сколько рабочих дней водителей нужно на день. Выпуски: сколько автобусов работает; пик — сколько их на линии в самый загруженный момент. Меньше — дешевле, если каждый рейс выполняется."
  uk: "Зміни: скільки робочих днів водіїв потрібно на день. Випуски: скільки автобусів працює; пік — скільки їх на лінії в найзавантаженіший момент. Менше — дешевше, якщо кожен рейс виконується."
"Efficiency and cost":
  de: "Effizienz und Kosten"
  fr: "Efficacité et coût"
  nl: "Efficiëntie en kosten"
  pl: "Efektywność i koszt"
  ru: "Эффективность и стоимость"
  uk: "Ефективність і вартість"
"Vehicle efficiency: the share of the buses' kilometres that carry passengers. Crew efficiency: the share of paid time spent driving. Higher is better for both. After a change, green means better and red means worse. The small tab underneath shows more figures.":
  de: "Fahrzeugeffizienz: der Anteil der Buskilometer mit Fahrgästen. Personaleffizienz: der Anteil der bezahlten Zeit, der gefahren wird. Bei beiden ist höher besser. Nach einer Änderung bedeutet Grün besser und Rot schlechter. Der kleine Reiter darunter zeigt weitere Kennzahlen."
  fr: "Efficacité des véhicules : la part des kilomètres des bus avec des voyageurs. Efficacité du personnel : la part du temps payé passée à conduire. Plus c'est haut, mieux c'est. Après une modification, le vert signifie mieux et le rouge moins bien. Le petit onglet en dessous montre d'autres chiffres."
  nl: "Voertuigefficiëntie: het deel van de buskilometers met reizigers. Personeelsefficiëntie: het deel van de betaalde tijd dat gereden wordt. Bij allebei is hoger beter. Na een wijziging betekent groen beter en rood slechter. Het kleine lipje eronder toont meer cijfers."
  pl: "Efektywność pojazdów: udział kilometrów autobusów z pasażerami. Efektywność załogi: udział płatnego czasu spędzonego za kierownicą. W obu przypadkach wyżej znaczy lepiej. Po zmianie zielony oznacza lepiej, a czerwony gorzej. Mała zakładka pod spodem pokazuje więcej liczb."
  ru: "Эффективность транспорта: доля километров автобусов с пассажирами. Эффективность персонала: доля оплачиваемого времени за рулём. Для обеих — чем выше, тем лучше. После изменения зелёный означает лучше, красный — хуже. Маленькая вкладка внизу показывает больше показателей."
  uk: "Ефективність транспорту: частка кілометрів автобусів із пасажирами. Ефективність персоналу: частка оплачуваного часу за кермом. Для обох — що вище, то краще. Після зміни зелений означає краще, червоний — гірше. Маленька вкладка внизу показує більше показників."
"Stats, Layers and Filter":
  de: "Statistik, Ebenen und Filter"
  fr: "Statistiques, Calques et Filtre"
  nl: "Statistieken, Lagen en Filter"
  pl: "Statystyki, Warstwy i Filtr"
  ru: "Статистика, Слои и Фильтр"
  uk: "Статистика, Шари і Фільтр"
"Stats adds columns of figures beside the rows; click a column's heading to sort. Layers chooses what the chips say: the line, the times or the stops. Filter shows only some lines, one direction or part of the day.":
  de: "Statistik fügt neben den Zeilen Spalten mit Kennzahlen hinzu; ein Klick auf die Spaltenüberschrift sortiert. Ebenen bestimmt, was auf den Chips steht: die Linie, die Zeiten oder die Haltestellen. Filter zeigt nur einige Linien, eine Richtung oder einen Teil des Tages."
  fr: "Statistiques ajoute des colonnes de chiffres à côté des lignes ; cliquez sur un en-tête pour trier. Calques choisit ce qu'affichent les puces : la ligne, les horaires ou les arrêts. Filtre n'affiche que certaines lignes, un sens ou une partie de la journée."
  nl: "Statistieken zet kolommen met cijfers naast de rijen; klik op een kolomkop om te sorteren. Lagen kiest wat er op de chips staat: de lijn, de tijden of de haltes. Filter toont alleen sommige lijnen, één richting of een deel van de dag."
  pl: "Statystyki dodają kolumny liczb obok wierszy; kliknij nagłówek, by sortować. Warstwy wybierają, co pokazują kafelki: linię, godziny lub przystanki. Filtr pokazuje tylko niektóre linie, jeden kierunek lub część dnia."
  ru: "«Статистика» добавляет столбцы с цифрами рядом со строками; щелчок по заголовку сортирует. «Слои» выбирают, что написано на плашках: линия, время или остановки. «Фильтр» показывает только некоторые линии, одно направление или часть дня."
  uk: "«Статистика» додає стовпці з цифрами біля рядків; клацання по заголовку сортує. «Шари» вибирають, що написано на плашках: лінія, час чи зупинки. «Фільтр» показує лише деякі лінії, один напрямок або частину дня."
"OPTIMIZE":
  de: "OPTIMIEREN"
  fr: "OPTIMISER"
  nl: "OPTIMALISEREN"
  pl: "OPTYMALIZUJ"
  ru: "ОПТИМИЗИРОВАТЬ"
  uk: "ОПТИМІЗУВАТИ"
"RosterFlow makes the blocks and duties for you and shows them as a proposal; the figures compare it with yours, and you accept it or keep yours. Locked rows stay as they are. The gear beside it chooses buses, duties or both.":
  de: "RosterFlow erstellt die Umläufe und Dienste für Sie und zeigt sie als Vorschlag; die Kennzahlen vergleichen ihn mit Ihrer Planung, und Sie übernehmen ihn oder behalten Ihre. Gesperrte Zeilen bleiben, wie sie sind. Das Zahnrad daneben wählt Busse, Dienste oder beides."
  fr: "RosterFlow construit les blocs et les services pour vous et les montre comme une proposition ; les chiffres la comparent à la vôtre, et vous l'acceptez ou gardez la vôtre. Les lignes verrouillées restent telles quelles. La roue dentée à côté choisit les bus, les services ou les deux."
  nl: "RosterFlow maakt de omlopen en diensten voor je en toont ze als voorstel; de cijfers vergelijken het met jouw planning, en jij neemt het over of houdt de jouwe. Vergrendelde rijen blijven zoals ze zijn. Het tandwiel ernaast kiest bussen, diensten of allebei."
  pl: "RosterFlow układa za ciebie obiegi i służby i pokazuje je jako propozycję; liczby porównują ją z twoją, a ty ją przyjmujesz albo zostajesz przy swojej. Zablokowane wiersze pozostają bez zmian. Zębatka obok wybiera autobusy, służby lub jedno i drugie."
  ru: "RosterFlow сам составляет выпуски и смены и показывает их как предложение; показатели сравнивают его с вашим планом, а вы принимаете его или оставляете свой. Заблокированные строки не меняются. Шестерёнка рядом выбирает автобусы, смены или и то и другое."
  uk: "RosterFlow сам складає випуски й зміни та показує їх як пропозицію; показники порівнюють її з вашим планом, а ви приймаєте її або лишаєте свій. Заблоковані рядки не змінюються. Шестірня поруч вибирає автобуси, зміни або те й інше."
"A row":
  de: "Eine Zeile"
  fr: "Une ligne du tableau"
  nl: "Een rij"
  pl: "Wiersz"
  ru: "Строка"
  uk: "Рядок"
"Each row is one bus's block (in Drivers: one duty). On the left its ID and a tick box. Hover over the ID for the lock (OPTIMIZE leaves the row alone) and the pin (keeps it at the top).":
  de: "Jede Zeile ist der Umlauf eines Busses (unter Fahrer: ein Dienst). Links stehen die ID und ein Kästchen zum Ankreuzen. Fahren Sie mit der Maus über die ID für das Schloss (OPTIMIEREN lässt die Zeile in Ruhe) und die Stecknadel (hält sie oben)."
  fr: "Chaque ligne est le bloc d'un bus (dans Conducteurs : un service). À gauche, son identifiant et une case à cocher. Survolez l'identifiant pour le cadenas (OPTIMISER laisse la ligne tranquille) et l'épingle (la garde en haut)."
  nl: "Elke rij is de omloop van één bus (bij Chauffeurs: één dienst). Links staan de ID en een vinkje. Ga met de muis over de ID voor het slot (OPTIMALISEREN laat de rij met rust) en de punaise (houdt hem bovenaan)."
  pl: "Każdy wiersz to obieg jednego autobusu (w Kierowcach: jedna służba). Po lewej jego ID i pole wyboru. Najedź na ID, by zobaczyć kłódkę (OPTYMALIZUJ nie rusza wiersza) i pinezkę (trzyma go na górze)."
  ru: "Каждая строка — выпуск одного автобуса (в «Водителях» — одна смена). Слева номер и флажок. Наведите на номер, чтобы увидеть замок (ОПТИМИЗИРОВАТЬ не тронет строку) и булавку (держит её сверху)."
  uk: "Кожен рядок — випуск одного автобуса (у «Водіях» — одна зміна). Ліворуч номер і прапорець. Наведіть на номер, щоб побачити замок (ОПТИМІЗУВАТИ не чіпатиме рядок) і шпильку (тримає його вгорі)."
"A trip":
  de: "Eine Fahrt"
  fr: "Une course"
  nl: "Een rit"
  pl: "Kurs"
  ru: "Рейс"
  uk: "Рейс"
"Each coloured chip is one trip with passengers, in its line's colour. The pointed end shows the way it runs: right is outbound, left is inbound. Click it to see its card; drag it to move it.":
  de: "Jeder farbige Chip ist eine Fahrt mit Fahrgästen, in der Farbe ihrer Linie. Die Spitze zeigt die Fahrtrichtung: nach rechts ist Hinfahrt, nach links Rückfahrt. Klicken Sie für ihre Karte; ziehen Sie, um sie zu verschieben."
  fr: "Chaque puce colorée est une course avec voyageurs, dans la couleur de sa ligne. La pointe montre le sens : à droite c'est l'aller, à gauche le retour. Cliquez pour voir sa fiche ; faites-la glisser pour la déplacer."
  nl: "Elke gekleurde chip is één rit met reizigers, in de kleur van zijn lijn. De punt wijst de rijrichting aan: naar rechts is heen, naar links is terug. Klik erop voor zijn kaart; sleep hem om hem te verplaatsen."
  pl: "Każdy kolorowy kafelek to jeden kurs z pasażerami, w kolorze swojej linii. Szpic pokazuje kierunek: w prawo to kierunek tam, w lewo powrotny. Kliknij, by zobaczyć jego kartę; przeciągnij, by go przenieść."
  ru: "Каждая цветная плашка — один рейс с пассажирами, в цвете своей линии. Острый конец показывает направление: вправо — прямое, влево — обратное. Щёлкните, чтобы увидеть карточку; перетащите, чтобы переместить."
  uk: "Кожна кольорова плашка — один рейс із пасажирами, у кольорі своєї лінії. Гострий кінець показує напрямок: праворуч — прямий, ліворуч — зворотний. Клацніть, щоб побачити картку; перетягніть, щоб перемістити."
"The other symbols":
  de: "Die übrigen Symbole"
  fr: "Les autres symboles"
  nl: "De andere symbolen"
  pl: "Pozostałe symbole"
  ru: "Другие значки"
  uk: "Інші значки"
"Grey-blue boxes take the bus out of the depot and back. Small dark boxes are empty runs; an orange dot means their time is a guess. Arrows mark a change of driver. Split is a long unpaid break, W, P or R a driver on the way to the next bus, and a red \"!\" a broken rule.":
  de: "Graublaue Kästchen bringen den Bus aus dem Betriebshof und zurück. Kleine dunkle Kästchen sind Leerfahrten; ein oranger Punkt heißt, ihre Zeit ist geschätzt. Pfeile markieren einen Fahrerwechsel. Geteilt ist eine lange unbezahlte Pause, W, P oder R ein Fahrer auf dem Weg zum nächsten Bus und ein rotes „!“ eine verletzte Regel."
  fr: "Les cases gris-bleu font sortir le bus du dépôt et l'y ramènent. Les petites cases sombres sont des trajets à vide ; un point orange signifie que leur durée est estimée. Les flèches marquent une relève de conducteur. Coupure est une longue pause non payée, W, P ou R un conducteur en route vers le bus suivant, et un « ! » rouge une règle enfreinte."
  nl: "Grijsblauwe vakjes brengen de bus uit de remise en terug. Kleine donkere vakjes zijn lege ritten; een oranje stip betekent dat hun tijd geschat is. Pijlen markeren een chauffeurswissel. Gebroken is een lange onbetaalde pauze, W, P of R een chauffeur op weg naar de volgende bus, en een rood „!” een overtreden regel."
  pl: "Szaroniebieskie prostokąty to wyjazd autobusu z zajezdni i powrót. Małe ciemne prostokąty to puste przejazdy; pomarańczowa kropka oznacza, że ich czas jest szacowany. Strzałki oznaczają zmianę kierowcy. „Przerwa” to długa niepłatna przerwa w służbie, W, P lub R to kierowca w drodze do następnego autobusu, a czerwony „!” to złamana reguła."
  ru: "Серо-голубые прямоугольники — выезд автобуса из депо и возврат. Маленькие тёмные — порожние пробеги; оранжевая точка значит, что их время примерное. Стрелки отмечают смену водителя. Разрыв — долгий неоплачиваемый перерыв, W, P или R — водитель в пути к следующему автобусу, а красный «!» — нарушенное правило."
  uk: "Сіро-блакитні прямокутники — виїзд автобуса з депо й повернення. Маленькі темні — порожні пробіги; помаранчева крапка означає, що їхній час приблизний. Стрілки позначають зміну водія. Розрив — довга неоплачувана перерва, W, P або R — водій дорогою до наступного автобуса, а червоний «!» — порушене правило."
"Is every trip covered?":
  de: "Ist jede Fahrt abgedeckt?"
  fr: "Chaque course est-elle couverte ?"
  nl: "Is elke rit gedekt?"
  pl: "Czy każdy kurs jest obsadzony?"
  ru: "Все ли рейсы закрыты?"
  uk: "Чи всі рейси закриті?"
"How many rows are shown, and how many trips have a bus and a driver. The numbers are red until every trip has both.":
  de: "Wie viele Zeilen angezeigt werden und wie viele Fahrten einen Bus und einen Fahrer haben. Die Zahlen sind rot, bis jede Fahrt beides hat."
  fr: "Combien de lignes sont affichées, et combien de courses ont un bus et un conducteur. Les nombres restent rouges tant que chaque course n'a pas les deux."
  nl: "Hoeveel rijen er getoond worden, en hoeveel ritten een bus en een chauffeur hebben. De getallen zijn rood tot elke rit allebei heeft."
  pl: "Ile wierszy jest widocznych i ile kursów ma autobus i kierowcę. Liczby są czerwone, dopóki każdy kurs nie ma obu."
  ru: "Сколько строк показано и у скольких рейсов есть автобус и водитель. Числа красные, пока у каждого рейса нет и того и другого."
  uk: "Скільки рядків показано і скільки рейсів мають автобус і водія. Числа червоні, доки кожен рейс не має і того, і іншого."
"Issues and zoom":
  de: "Probleme und Zoom"
  fr: "Problèmes et zoom"
  nl: "Problemen en zoom"
  pl: "Problemy i powiększenie"
  ru: "Проблемы и масштаб"
  uk: "Проблеми та масштаб"
"The issues: Global, Duty and Vehicle. Click one to see what is wrong and jump to it. On the right the zoom; Ctrl and the mouse wheel zoom the hours, Shift and the wheel move along the day.":
  de: "Die Probleme: Allgemein, Dienst und Fahrzeug. Klicken Sie eines an, um zu sehen, was nicht stimmt, und dorthin zu springen. Rechts der Zoom; Strg und das Mausrad zoomen die Stunden, Umschalt und das Rad verschieben den Tag."
  fr: "Les problèmes : globaux, de service et de véhicule. Cliquez sur l'un d'eux pour voir ce qui ne va pas et y aller. À droite, le zoom ; Ctrl et la molette zooment sur les heures, Maj et la molette font défiler la journée."
  nl: "De problemen: Algemeen, Dienst en Voertuig. Klik er een aan om te zien wat er mis is en erheen te springen. Rechts de zoom; Ctrl en het muiswiel zoomen op de uren, Shift en het wiel schuiven langs de dag."
  pl: "Problemy: globalne, służb i pojazdów. Kliknij jeden, by zobaczyć, co jest nie tak, i do niego przejść. Po prawej powiększenie; Ctrl i kółko myszy powiększają godziny, Shift i kółko przesuwają dzień."
  ru: "Проблемы: общие, смен и транспорта. Щёлкните, чтобы увидеть, что не так, и перейти к ней. Справа масштаб; Ctrl и колесо мыши масштабируют часы, Shift и колесо сдвигают день."
  uk: "Проблеми: загальні, змін і транспорту. Клацніть, щоб побачити, що не так, і перейти до неї. Праворуч масштаб; Ctrl і коліщатко миші масштабують години, Shift і коліщатко зсувають день."
"The stack":
  de: "Der Stapel"
  fr: "La pile"
  nl: "De stapel"
  pl: "Stos"
  ru: "Стопка"
  uk: "Стос"
"Trips that no bus drives wait here, above the rows. Click one, then one of the slots that appear, to give it to a bus.":
  de: "Fahrten, die kein Bus fährt, warten hier über den Zeilen. Klicken Sie eine an und dann einen der erscheinenden Plätze, um sie einem Bus zu geben."
  fr: "Les courses qu'aucun bus n'assure attendent ici, au-dessus des lignes. Cliquez sur l'une, puis sur un des emplacements qui apparaissent, pour la confier à un bus."
  nl: "Ritten die geen bus rijdt, wachten hier boven de rijen. Klik er een aan en daarna een van de vakken die verschijnen, om hem aan een bus te geven."
  pl: "Kursy, których nie wykonuje żaden autobus, czekają tutaj, nad wierszami. Kliknij jeden, a potem jedno z pojawiających się miejsc, by dać go autobusowi."
  ru: "Рейсы, которые не выполняет ни один автобус, ждут здесь, над строками. Щёлкните рейс, затем одно из появившихся мест, чтобы отдать его автобусу."
  uk: "Рейси, які не виконує жоден автобус, чекають тут, над рядками. Клацніть рейс, а потім одне з місць, що з'являться, щоб віддати його автобусу."
"Moving trips":
  de: "Fahrten verschieben"
  fr: "Déplacer des courses"
  nl: "Ritten verplaatsen"
  pl: "Przenoszenie kursów"
  ru: "Перемещение рейсов"
  uk: "Переміщення рейсів"
"Drag a chip, or double-click it, to pick it up. Every bus it could go to shows a slot with stars: five is the cheapest, and blue means no rule is broken. Hover over a slot to see the cost, click to drop. Right-click a chip for more.":
  de: "Ziehen Sie einen Chip oder doppelklicken Sie ihn, um ihn aufzunehmen. Jeder Bus, zu dem er passt, zeigt einen Platz mit Sternen: fünf ist am günstigsten, blau heißt, keine Regel wird verletzt. Fahren Sie über einen Platz, um die Kosten zu sehen, und klicken Sie zum Ablegen. Rechtsklick auf einen Chip zeigt mehr."
  fr: "Faites glisser une puce, ou double-cliquez dessus, pour la prendre. Chaque bus qui peut la recevoir montre un emplacement avec des étoiles : cinq, c'est le moins cher, et le bleu signifie qu'aucune règle n'est enfreinte. Survolez un emplacement pour voir le coût, cliquez pour déposer. Clic droit sur une puce pour plus d'options."
  nl: "Sleep een chip, of dubbelklik erop, om hem op te pakken. Elke bus waar hij naartoe kan, toont een vak met sterren: vijf is het goedkoopst, en blauw betekent dat er geen regel wordt overtreden. Ga over een vak om de kosten te zien, klik om neer te zetten. Rechtsklik op een chip voor meer."
  pl: "Przeciągnij kafelek albo kliknij go dwukrotnie, by go podnieść. Każdy autobus, do którego może trafić, pokazuje miejsce z gwiazdkami: pięć to najtaniej, a niebieski oznacza, że żadna reguła nie jest łamana. Najedź na miejsce, by zobaczyć koszt, kliknij, by upuścić. Prawy klik na kafelek daje więcej opcji."
  ru: "Перетащите плашку или щёлкните по ней дважды, чтобы взять её. Каждый автобус, куда её можно поставить, показывает место со звёздами: пять — дешевле всего, синий цвет — ни одно правило не нарушено. Наведите на место, чтобы увидеть стоимость, щёлкните, чтобы поставить. Правый щелчок по плашке — больше действий."
  uk: "Перетягніть плашку або клацніть по ній двічі, щоб узяти її. Кожен автобус, куди її можна поставити, показує місце із зірками: п'ять — найдешевше, синій колір — жодне правило не порушено. Наведіть на місце, щоб побачити вартість, клацніть, щоб поставити. Правий клік по плашці — більше дій."
"Where drivers change":
  de: "Wo Fahrer wechseln"
  fr: "Où les conducteurs se relaient"
  nl: "Waar chauffeurs wisselen"
  pl: "Gdzie zmieniają się kierowcy"
  ru: "Где меняются водители"
  uk: "Де змінюються водії"
"The arrows mark where one driver hands the bus to the next; click them to join the two duties again. Hover over a gap between two trips: where a blue line shows, a click cuts a new duty there.":
  de: "Die Pfeile markieren, wo ein Fahrer den Bus an den nächsten übergibt; klicken Sie darauf, um die beiden Dienste wieder zu verbinden. Fahren Sie über eine Lücke zwischen zwei Fahrten: wo eine blaue Linie erscheint, teilt ein Klick dort einen neuen Dienst ab."
  fr: "Les flèches marquent l'endroit où un conducteur passe le bus au suivant ; cliquez dessus pour réunir les deux services. Survolez l'intervalle entre deux courses : là où une ligne bleue apparaît, un clic y coupe un nouveau service."
  nl: "De pijlen markeren waar de ene chauffeur de bus aan de volgende overdraagt; klik erop om de twee diensten weer samen te voegen. Ga over een gat tussen twee ritten: waar een blauwe streep verschijnt, knipt een klik daar een nieuwe dienst af."
  pl: "Strzałki pokazują, gdzie kierowca przekazuje autobus następnemu; kliknij je, by znów połączyć dwie służby. Najedź na przerwę między dwoma kursami: tam, gdzie pojawi się niebieska linia, kliknięcie tworzy w tym miejscu nową służbę."
  ru: "Стрелки отмечают, где один водитель передаёт автобус другому; щёлкните по ним, чтобы снова объединить две смены. Наведите на промежуток между рейсами: где появится синяя черта, щелчок отрежет там новую смену."
  uk: "Стрілки позначають, де один водій передає автобус іншому; клацніть по них, щоб знову об'єднати дві зміни. Наведіть на проміжок між рейсами: де з'явиться синя риска, клік відріже там нову зміну."
"A new vehicle":
  de: "Ein neues Fahrzeug"
  fr: "Un nouveau véhicule"
  nl: "Een nieuw voertuig"
  pl: "Nowy pojazd"
  ru: "Новый автобус"
  uk: "Новий автобус"
"Drop trips here to give them to an extra bus.":
  de: "Legen Sie Fahrten hier ab, um sie einem zusätzlichen Bus zu geben."
  fr: "Déposez des courses ici pour les confier à un bus supplémentaire."
  nl: "Zet ritten hier neer om ze aan een extra bus te geven."
  pl: "Upuść tu kursy, by dać je dodatkowemu autobusowi."
  ru: "Поставьте рейсы сюда, чтобы отдать их дополнительному автобусу."
  uk: "Поставте рейси сюди, щоб віддати їх додатковому автобусу."
"A duty":
  de: "Ein Dienst"
  fr: "Un service de conduite"
  nl: "Een dienst"
  pl: "Służba"
  ru: "Смена"
  uk: "Зміна"
"In Drivers each row is one driver's working day. It starts with the sign-on and ends with the sign-off (the T-shaped marks). In between are the pieces of work: the parts on one bus.":
  de: "Unter Fahrer ist jede Zeile der Arbeitstag eines Fahrers. Er beginnt mit dem Dienstbeginn und endet mit dem Dienstende (die T-förmigen Zeichen). Dazwischen liegen die Dienststücke: die Abschnitte auf einem Bus."
  fr: "Dans Conducteurs, chaque ligne est la journée de travail d'un conducteur. Elle commence par la prise de service et finit par la fin de service (les marques en forme de T). Entre les deux, les parties de travail : les parties sur un même bus."
  nl: "Bij Chauffeurs is elke rij de werkdag van één chauffeur. Die begint met het aanmelden en eindigt met het afmelden (de T-vormige tekens). Daartussen zitten de dienststukken: de delen op één bus."
  pl: "W Kierowcach każdy wiersz to dzień pracy jednego kierowcy. Zaczyna się zgłoszeniem, a kończy zakończeniem służby (znaki w kształcie litery T). Pomiędzy są części pracy: odcinki na jednym autobusie."
  ru: "В «Водителях» каждая строка — рабочий день одного водителя. Он начинается с явки и заканчивается сдачей смены (Т-образные знаки). Между ними — части работы: отрезки на одном автобусе."
  uk: "У «Водіях» кожен рядок — робочий день одного водія. Він починається з явки й закінчується здачею зміни (Т-подібні знаки). Між ними — частини роботи: відрізки на одному автобусі."
"Everything about a duty":
  de: "Alles über einen Dienst"
  fr: "Tout sur un service"
  nl: "Alles over een dienst"
  pl: "Wszystko o służbie"
  ru: "Всё о смене"
  uk: "Усе про зміну"
"Click a duty's ID to open its panel: its type, sign-on and sign-off, paid time, breaks, pieces of work and issues. You can lock it there, or add custom work such as office time.":
  de: "Klicken Sie auf die ID eines Dienstes, um sein Fenster zu öffnen: Art, Dienstbeginn und -ende, bezahlte Zeit, Pausen, Dienststücke und Probleme. Dort können Sie ihn sperren oder eigene Arbeit wie Bürozeit hinzufügen."
  fr: "Cliquez sur l'identifiant d'un service pour ouvrir son panneau : son type, la prise et la fin de service, le temps payé, les pauses, les parties de travail et les problèmes. Vous pouvez l'y verrouiller ou ajouter un travail particulier, comme du temps de bureau."
  nl: "Klik op de ID van een dienst om zijn paneel te openen: soort, aanmelden en afmelden, betaalde tijd, pauzes, dienststukken en problemen. Daar kun je hem vergrendelen of eigen werk toevoegen, zoals kantoortijd."
  pl: "Kliknij ID służby, by otworzyć jej panel: typ, zgłoszenie i zakończenie, czas płatny, przerwy, części pracy i problemy. Możesz ją tam zablokować albo dodać własną pracę, np. czas w biurze."
  ru: "Щёлкните номер смены, чтобы открыть её панель: тип, явка и сдача, оплачиваемое время, перерывы, части работы и проблемы. Там её можно заблокировать или добавить особую работу, например время в офисе."
  uk: "Клацніть номер зміни, щоб відкрити її панель: тип, явка і здача, оплачуваний час, перерви, частини роботи та проблеми. Там її можна заблокувати або додати особливу роботу, наприклад час в офісі."
"Building a duty":
  de: "Einen Dienst bauen"
  fr: "Construire un service"
  nl: "Een dienst bouwen"
  pl: "Budowanie służby"
  ru: "Как собрать смену"
  uk: "Як скласти зміну"
"Drag a piece of work here to start a duty of your own, or click for a spare duty. Drag pieces between duties to put them together.":
  de: "Ziehen Sie ein Dienststück hierher, um einen eigenen Dienst zu beginnen, oder klicken Sie für einen Reservedienst. Ziehen Sie Dienststücke zwischen Diensten, um sie zusammenzusetzen."
  fr: "Faites glisser une partie de travail ici pour commencer votre propre service, ou cliquez pour un service de réserve. Faites glisser des parties de travail d'un service à l'autre pour les assembler."
  nl: "Sleep een dienststuk hierheen om een eigen dienst te beginnen, of klik voor een reservedienst. Sleep stukken tussen diensten om ze samen te voegen."
  pl: "Przeciągnij tu część pracy, by zacząć własną służbę, albo kliknij, by dodać służbę rezerwową. Przeciągaj części między służbami, by je łączyć."
  ru: "Перетащите сюда часть работы, чтобы начать свою смену, или щёлкните для резервной смены. Перетаскивайте части между сменами, чтобы соединять их."
  uk: "Перетягніть сюди частину роботи, щоб почати власну зміну, або клацніть для резервної зміни. Перетягуйте частини між змінами, щоб поєднувати їх."
"The week":
  de: "Die Woche"
  fr: "La semaine"
  nl: "De week"
  pl: "Tydzień"
  ru: "Неделя"
  uk: "Тиждень"
"Pick a day of the coming week. Your plan for a weekday repeats every week.":
  de: "Wählen Sie einen Tag der kommenden Woche. Ihr Plan für einen Wochentag wiederholt sich jede Woche."
  fr: "Choisissez un jour de la semaine à venir. Votre plan pour un jour de semaine se répète chaque semaine."
  nl: "Kies een dag van de komende week. Je plan voor een weekdag herhaalt zich elke week."
  pl: "Wybierz dzień nadchodzącego tygodnia. Plan na dany dzień tygodnia powtarza się co tydzień."
  ru: "Выберите день ближайшей недели. План на день недели повторяется каждую неделю."
  uk: "Виберіть день найближчого тижня. План на день тижня повторюється щотижня."
"Each line's tours with their duties. Drag a driver or a bus from the list onto a duty or a tour, or click one and then the other.":
  de: "Die Umläufe jeder Linie mit ihren Diensten. Ziehen Sie einen Fahrer oder Bus aus der Liste auf einen Dienst oder Umlauf, oder klicken Sie erst das eine und dann das andere an."
  fr: "Les tournées de chaque ligne avec leurs services. Faites glisser un conducteur ou un bus de la liste sur un service ou une tournée, ou cliquez sur l'un puis sur l'autre."
  nl: "De omlopen van elke lijn met hun diensten. Sleep een chauffeur of bus uit de lijst op een dienst of omloop, of klik eerst op het een en dan op het ander."
  pl: "Obiegi każdej linii z ich służbami. Przeciągnij kierowcę lub autobus z listy na służbę lub obieg albo kliknij najpierw jedno, potem drugie."
  ru: "Обороты каждой линии с их сменами. Перетащите водителя или автобус из списка на смену или оборот либо щёлкните сначала одно, потом другое."
  uk: "Оберти кожної лінії з їхніми змінами. Перетягніть водія або автобус зі списку на зміну чи оберт або клацніть спершу одне, потім інше."
"Drivers and buses":
  de: "Fahrer und Busse"
  fr: "Conducteurs et bus"
  nl: "Chauffeurs en bussen"
  pl: "Kierowcy i autobusy"
  ru: "Водители и автобусы"
  uk: "Водії та автобуси"
"Your drivers and buses for the day. Click a duty or a tour in the chart to see who could take it.":
  de: "Ihre Fahrer und Busse für den Tag. Klicken Sie im Diagramm auf einen Dienst oder Umlauf, um zu sehen, wer ihn übernehmen könnte."
  fr: "Vos conducteurs et vos bus du jour. Cliquez sur un service ou une tournée dans le graphique pour voir qui pourrait le prendre."
  nl: "Je chauffeurs en bussen voor de dag. Klik in de grafiek op een dienst of omloop om te zien wie hem kan nemen."
  pl: "Twoi kierowcy i autobusy na ten dzień. Kliknij służbę lub obieg na wykresie, by zobaczyć, kto mógłby je wziąć."
  ru: "Ваши водители и автобусы на день. Щёлкните смену или оборот на графике, чтобы увидеть, кто мог бы его взять."
  uk: "Ваші водії та автобуси на день. Клацніть зміну чи оберт на графіку, щоб побачити, хто міг би його взяти."
"Fill, clear, repeat":
  de: "Füllen, leeren, wiederholen"
  fr: "Remplir, vider, répéter"
  nl: "Vullen, leegmaken, herhalen"
  pl: "Wypełnij, wyczyść, powtórz"
  ru: "Заполнить, очистить, повторить"
  uk: "Заповнити, очистити, повторити"
"Fill the roster gives free drivers and buses to what is still open. Clear the day empties it, and Repeat copies it to the other days.":
  de: "Dienstplan füllen gibt freie Fahrer und Busse an das, was noch offen ist. Tag leeren leert ihn, und Wiederholen kopiert ihn auf die anderen Tage."
  fr: "Remplir le roulement donne les conducteurs et bus libres à ce qui reste ouvert. Vider la journée l'efface, et Répéter la copie sur les autres jours."
  nl: "Rooster vullen geeft vrije chauffeurs en bussen aan wat nog open is. Dag leegmaken maakt hem leeg, en Herhalen kopieert hem naar de andere dagen."
  pl: "Wypełnij grafik daje wolnych kierowców i autobusy temu, co jeszcze otwarte. Wyczyść dzień opróżnia go, a Powtórz kopiuje go na inne dni."
  ru: "«Заполнить график» отдаёт свободных водителей и автобусы тому, что ещё открыто. «Очистить день» очищает его, а «Повторить» копирует на другие дни."
  uk: "«Заповнити графік» віддає вільних водіїв і автобуси тому, що ще відкрите. «Очистити день» очищає його, а «Повторити» копіює на інші дні."
"Line and days":
  de: "Linie und Tage"
  fr: "Ligne et jours"
  nl: "Lijn en dagen"
  pl: "Linia i dni"
  ru: "Линия и дни"
  uk: "Лінія та дні"
"Choose the line and the days: Monday to Friday, Saturday or Sunday. OUTBOUND and INBOUND switch the direction, and the icons on the right switch between running times and the timetable.":
  de: "Wählen Sie die Linie und die Tage: Montag bis Freitag, Samstag oder Sonntag. HIN und RÜCK wechseln die Richtung, und die Symbole rechts wechseln zwischen Fahrzeiten und Fahrplan."
  fr: "Choisissez la ligne et les jours : du lundi au vendredi, samedi ou dimanche. ALLER et RETOUR changent de sens, et les icônes à droite passent des temps de parcours à l'horaire."
  nl: "Kies de lijn en de dagen: maandag tot vrijdag, zaterdag of zondag. HEEN en TERUG wisselen de richting, en de pictogrammen rechts wisselen tussen rijtijden en dienstregeling."
  pl: "Wybierz linię i dni: od poniedziałku do piątku, sobotę lub niedzielę. TAM i POWRÓT zmieniają kierunek, a ikony po prawej przełączają między czasami przejazdu a rozkładem."
  ru: "Выберите линию и дни: с понедельника по пятницу, субботу или воскресенье. ТУДА и ОБРАТНО меняют направление, а значки справа переключают время хода и расписание."
  uk: "Виберіть лінію і дні: з понеділка по п'ятницю, суботу чи неділю. ТУДИ і НАЗАД змінюють напрямок, а значки праворуч перемикають час руху й розклад."
"The minutes a bus needs between two stops, in time bands: the rush hour can be slower than the evening. Click a box and type a number; every trip in that band moves with it.":
  de: "Die Minuten, die ein Bus zwischen zwei Haltestellen braucht, in Zeitbändern: Die Hauptverkehrszeit kann langsamer sein als der Abend. Klicken Sie in ein Kästchen und tippen Sie eine Zahl; jede Fahrt in diesem Band verschiebt sich mit."
  fr: "Les minutes qu'il faut à un bus entre deux arrêts, par tranches horaires : l'heure de pointe peut être plus lente que le soir. Cliquez sur une case et tapez un nombre ; chaque course de cette tranche suit."
  nl: "De minuten die een bus tussen twee haltes nodig heeft, in tijdvakken: het spitsuur kan trager zijn dan de avond. Klik op een vakje en typ een getal; elke rit in dat tijdvak schuift mee."
  pl: "Minuty potrzebne autobusowi między dwoma przystankami, w przedziałach czasu: szczyt może być wolniejszy niż wieczór. Kliknij pole i wpisz liczbę; każdy kurs w tym przedziale przesunie się razem z nim."
  ru: "Минуты, нужные автобусу между двумя остановками, по временным интервалам: час пик может быть медленнее вечера. Щёлкните ячейку и введите число; все рейсы этого интервала сдвинутся вместе с ним."
  uk: "Хвилини, потрібні автобусу між двома зупинками, за часовими проміжками: година пік може бути повільнішою за вечір. Клацніть клітинку і введіть число; усі рейси цього проміжку зсунуться разом із ним."
"The timetable":
  de: "Der Fahrplan"
  fr: "L'horaire"
  nl: "De dienstregeling"
  pl: "Rozkład jazdy"
  ru: "Расписание"
  uk: "Розклад"
"Every trip is a row with its time at each stop. Add trips one at a time or by headway: a first and a last departure and every how many minutes. A time typed by hand shows orange.":
  de: "Jede Fahrt ist eine Zeile mit ihrer Zeit an jeder Haltestelle. Fügen Sie Fahrten einzeln oder nach Takt hinzu: eine erste und eine letzte Abfahrt und alle wie viele Minuten. Eine von Hand getippte Zeit erscheint orange."
  fr: "Chaque course est une ligne avec son heure à chaque arrêt. Ajoutez des courses une par une ou par fréquence : un premier et un dernier départ, et toutes les combien de minutes. Une heure tapée à la main apparaît en orange."
  nl: "Elke rit is een rij met zijn tijd bij elke halte. Voeg ritten één voor één toe of met een interval: een eerste en een laatste vertrek en om de hoeveel minuten. Een met de hand getypte tijd wordt oranje."
  pl: "Każdy kurs to wiersz z godziną na każdym przystanku. Dodawaj kursy pojedynczo lub według taktu: pierwszy i ostatni odjazd oraz co ile minut. Godzina wpisana ręcznie jest pomarańczowa."
  ru: "Каждый рейс — строка с временем на каждой остановке. Добавляйте рейсы по одному или по интервалу: первое и последнее отправление и через сколько минут. Время, введённое вручную, показано оранжевым."
  uk: "Кожен рейс — рядок із часом на кожній зупинці. Додавайте рейси по одному або за інтервалом: перше й останнє відправлення і через скільки хвилин. Час, введений вручну, показано помаранчевим."
"Save, then Refresh":
  de: "Speichern, dann Aktualisieren"
  fr: "Enregistrer, puis Actualiser"
  nl: "Opslaan, dan Vernieuwen"
  pl: "Zapisz, potem Odśwież"
  ru: "Сохранить, затем Обновить"
  uk: "Зберегти, потім Оновити"
"Save writes the line's timetable. The status bar then says UNSYNCED - Refresh: click it, and the buses' blocks and the duties are made again for the new trips.":
  de: "Speichern schreibt den Fahrplan der Linie. Die Statusleiste zeigt dann NICHT ABGEGLICHEN – Aktualisieren: Klicken Sie darauf, und die Umläufe der Busse und die Dienste werden für die neuen Fahrten neu erstellt."
  fr: "Enregistrer écrit l'horaire de la ligne. La barre d'état affiche alors NON SYNCHRONISÉ – Actualiser : cliquez dessus, et les blocs des bus et les services sont refaits pour les nouveaux trajets."
  nl: "Opslaan schrijft de dienstregeling van de lijn weg. De statusbalk zegt dan NIET GESYNCHRONISEERD – Vernieuwen: klik erop, en de omlopen van de bussen en de diensten worden opnieuw gemaakt voor de nieuwe ritten."
  pl: "Zapisz zapisuje rozkład linii. Pasek stanu pokaże wtedy NIEZSYNCHRONIZOWANE – Odśwież: kliknij, a obiegi autobusów i służby zostaną ułożone od nowa dla nowych kursów."
  ru: "«Сохранить» записывает расписание линии. Затем в строке состояния появится НЕ СИНХРОНИЗИРОВАНО – Обновить: щёлкните, и выпуски автобусов и смены будут составлены заново для новых рейсов."
  uk: "«Зберегти» записує розклад лінії. Потім у рядку стану з'явиться НЕ СИНХРОНІЗОВАНО – Оновити: клацніть, і випуски автобусів та зміни буде складено заново для нових рейсів."
"Ready to plan":
  de: "Bereit zum Planen"
  fr: "Prêt à planifier"
  nl: "Klaar om te plannen"
  pl: "Gotowe do planowania"
  ru: "Можно планировать"
  uk: "Можна планувати"
"This question mark brings the tour back. It also has short lessons where you try each task yourself, and a one-page help sheet.":
  de: "Dieses Fragezeichen bringt die Tour zurück. Dort finden Sie auch kurze Lektionen, in denen Sie jede Aufgabe selbst ausprobieren, und eine Hilfeseite auf einen Blick."
  fr: "Ce point d'interrogation relance la visite. Il propose aussi de courtes leçons où vous essayez chaque tâche vous-même, et une fiche d'aide d'une page."
  nl: "Dit vraagteken brengt de rondleiding terug. Er zitten ook korte lessen in waarin je elke taak zelf probeert, en een hulpblad van één pagina."
  pl: "Ten znak zapytania przywraca przewodnik. Znajdziesz tam też krótkie lekcje, w których sam próbujesz każdego zadania, oraz jednostronicową ściągawkę."
  ru: "Этот вопросительный знак снова запускает обзор. Там же есть короткие уроки, где вы сами пробуете каждое действие, и памятка на одну страницу."
  uk: "Цей знак питання знову запускає огляд. Там також є короткі уроки, де ви самі пробуєте кожну дію, і пам'ятка на одну сторінку."
"Move a trip to another bus":
  de: "Eine Fahrt auf einen anderen Bus legen"
  fr: "Déplacer une course vers un autre bus"
  nl: "Een rit naar een andere bus verplaatsen"
  pl: "Przenieś kurs na inny autobus"
  ru: "Перенести рейс на другой автобус"
  uk: "Перенести рейс на інший автобус"
"Cut a duty and join it again":
  de: "Einen Dienst teilen und wieder verbinden"
  fr: "Couper un service et le réunir"
  nl: "Een dienst knippen en weer samenvoegen"
  pl: "Podziel służbę i połącz ją z powrotem"
  ru: "Разрезать смену и снова соединить"
  uk: "Розрізати зміну й знову з'єднати"
"Build a duty by hand":
  de: "Einen Dienst von Hand bauen"
  fr: "Construire un service à la main"
  nl: "Een dienst met de hand bouwen"
  pl: "Zbuduj służbę ręcznie"
  ru: "Собрать смену вручную"
  uk: "Скласти зміну вручну"
"Fix an issue":
  de: "Ein Problem beheben"
  fr: "Corriger un problème"
  nl: "Een probleem oplossen"
  pl: "Napraw problem"
  ru: "Исправить проблему"
  uk: "Виправити проблему"
"Let OPTIMIZE propose":
  de: "OPTIMIEREN vorschlagen lassen"
  fr: "Laisser OPTIMISER proposer"
  nl: "OPTIMALISEREN laten voorstellen"
  pl: "Pozwól OPTYMALIZUJ zaproponować"
  ru: "Пусть ОПТИМИЗИРОВАТЬ предложит"
  uk: "Хай ОПТИМІЗУВАТИ запропонує"
"Plan a timetable":
  de: "Einen Fahrplan planen"
  fr: "Planifier un horaire"
  nl: "Een dienstregeling plannen"
  pl: "Zaplanuj rozkład"
  ru: "Составить расписание"
  uk: "Скласти розклад"
"Give a line its own colour":
  de: "Einer Linie eine eigene Farbe geben"
  fr: "Donner sa propre couleur à une ligne"
  nl: "Een lijn een eigen kleur geven"
  pl: "Nadaj linii własny kolor"
  ru: "Дать линии свой цвет"
  uk: "Дати лінії свій колір"
"SAVE and DISCARD":
  de: "SPEICHERN und VERWERFEN"
  fr: "ENREGISTRER et ABANDONNER"
  nl: "OPSLAAN en VERWERPEN"
  pl: "ZAPISZ i ODRZUĆ"
  ru: "СОХРАНИТЬ и ОТМЕНИТЬ"
  uk: "ЗБЕРЕГТИ і СКАСУВАТИ"
"Open the Vehicles tab":
  de: "Öffnen Sie den Reiter Fahrzeuge"
  fr: "Ouvrez l'onglet Véhicules"
  nl: "Open het tabblad Voertuigen"
  pl: "Otwórz kartę Pojazdy"
  ru: "Откройте вкладку «Транспорт»"
  uk: "Відкрийте вкладку «Транспорт»"
"Each row there is one bus's day of trips.":
  de: "Jede Zeile dort ist der Tag eines Busses mit seinen Fahrten."
  fr: "Chaque ligne y est la journée de courses d'un bus."
  nl: "Elke rij daar is de dag met ritten van één bus."
  pl: "Każdy wiersz to tam dzień kursów jednego autobusu."
  ru: "Каждая строка там — день рейсов одного автобуса."
  uk: "Кожен рядок там — день рейсів одного автобуса."
"Pick up a trip":
  de: "Nehmen Sie eine Fahrt auf"
  fr: "Prenez une course"
  nl: "Pak een rit op"
  pl: "Podnieś kurs"
  ru: "Возьмите рейс"
  uk: "Візьміть рейс"
"Drag a coloured chip, or double-click it. Slots appear on every bus it could go to.":
  de: "Ziehen Sie einen farbigen Chip oder doppelklicken Sie ihn. Auf jedem Bus, zu dem er passt, erscheinen Plätze."
  fr: "Faites glisser une puce colorée, ou double-cliquez dessus. Des emplacements apparaissent sur chaque bus qui peut la recevoir."
  nl: "Sleep een gekleurde chip, of dubbelklik erop. Op elke bus waar hij naartoe kan, verschijnen vakken."
  pl: "Przeciągnij kolorowy kafelek albo kliknij go dwukrotnie. Na każdym autobusie, do którego może trafić, pojawią się miejsca."
  ru: "Перетащите цветную плашку или щёлкните по ней дважды. На каждом автобусе, куда её можно поставить, появятся места."
  uk: "Перетягніть кольорову плашку або клацніть по ній двічі. На кожному автобусі, куди її можна поставити, з'являться місця."
"Read the stars and the cost":
  de: "Lesen Sie Sterne und Kosten"
  fr: "Lisez les étoiles et le coût"
  nl: "Lees de sterren en de kosten"
  pl: "Odczytaj gwiazdki i koszt"
  ru: "Посмотрите на звёзды и стоимость"
  uk: "Подивіться на зірки й вартість"
"Hold the mouse over a slot: five stars is the cheapest choice, blue breaks no rule, and the card shows what it costs.":
  de: "Halten Sie die Maus über einen Platz: Fünf Sterne sind die günstigste Wahl, Blau verletzt keine Regel, und die Karte zeigt, was es kostet."
  fr: "Gardez la souris sur un emplacement : cinq étoiles, c'est le choix le moins cher, le bleu n'enfreint aucune règle, et la fiche montre ce que ça coûte."
  nl: "Houd de muis boven een vak: vijf sterren is de goedkoopste keuze, blauw overtreedt geen regel, en de kaart toont wat het kost."
  pl: "Przytrzymaj mysz nad miejscem: pięć gwiazdek to najtańszy wybór, niebieski nie łamie żadnej reguły, a karta pokazuje koszt."
  ru: "Задержите мышь над местом: пять звёзд — самый дешёвый вариант, синий не нарушает правил, а карточка показывает стоимость."
  uk: "Затримайте мишу над місцем: п'ять зірок — найдешевший варіант, синій не порушує правил, а картка показує вартість."
"Drop it on another bus":
  de: "Legen Sie sie auf einen anderen Bus"
  fr: "Déposez-la sur un autre bus"
  nl: "Zet hem op een andere bus"
  pl: "Upuść go na inny autobus"
  ru: "Поставьте его на другой автобус"
  uk: "Поставте його на інший автобус"
"Click a slot, or let go of the chip over it. Escape puts it back.":
  de: "Klicken Sie auf einen Platz oder lassen Sie den Chip darüber los. Escape legt ihn zurück."
  fr: "Cliquez sur un emplacement, ou lâchez la puce au-dessus. Échap la remet à sa place."
  nl: "Klik op een vak, of laat de chip erboven los. Escape zet hem terug."
  pl: "Kliknij miejsce albo puść nad nim kafelek. Escape odkłada go z powrotem."
  ru: "Щёлкните по месту или отпустите плашку над ним. Escape вернёт её обратно."
  uk: "Клацніть по місцю або відпустіть плашку над ним. Escape поверне її назад."
"See the figures change":
  de: "Sehen Sie, wie sich die Kennzahlen ändern"
  fr: "Regardez les chiffres changer"
  nl: "Zie de cijfers veranderen"
  pl: "Zobacz, jak zmieniają się liczby"
  ru: "Посмотрите, как меняются показатели"
  uk: "Подивіться, як змінюються показники"
"The green or red numbers beside the figures show what your move did: green is better, red is worse.":
  de: "Die grünen oder roten Zahlen neben den Kennzahlen zeigen, was Ihre Verschiebung bewirkt hat: Grün ist besser, Rot schlechter."
  fr: "Les nombres verts ou rouges à côté des chiffres montrent l'effet de votre déplacement : le vert est mieux, le rouge moins bien."
  nl: "De groene of rode getallen naast de cijfers laten zien wat je verplaatsing deed: groen is beter, rood is slechter."
  pl: "Zielone lub czerwone liczby obok wskaźników pokazują skutek przeniesienia: zielony to lepiej, czerwony gorzej."
  ru: "Зелёные или красные числа рядом с показателями показывают, к чему привёл перенос: зелёный — лучше, красный — хуже."
  uk: "Зелені або червоні числа біля показників показують, до чого призвело перенесення: зелений — краще, червоний — гірше."
"Undo it":
  de: "Machen Sie es rückgängig"
  fr: "Annulez-le"
  nl: "Maak het ongedaan"
  pl: "Cofnij to"
  ru: "Отмените это"
  uk: "Скасуйте це"
"Press Ctrl+Z, or the undo arrow at the top. The trip goes back to its bus.":
  de: "Drücken Sie Strg+Z oder den Rückgängig-Pfeil oben. Die Fahrt kehrt zu ihrem Bus zurück."
  fr: "Appuyez sur Ctrl+Z, ou sur la flèche d'annulation en haut. La course retourne à son bus."
  nl: "Druk op Ctrl+Z, of op de pijl voor ongedaan maken bovenaan. De rit gaat terug naar zijn bus."
  pl: "Naciśnij Ctrl+Z albo strzałkę cofania na górze. Kurs wraca do swojego autobusu."
  ru: "Нажмите Ctrl+Z или стрелку отмены вверху. Рейс вернётся к своему автобусу."
  uk: "Натисніть Ctrl+Z або стрілку скасування вгорі. Рейс повернеться до свого автобуса."
"Duties are cut from the buses' days, so you start here.":
  de: "Dienste werden aus den Tagen der Busse geteilt, darum beginnen Sie hier."
  fr: "Les services sont découpés dans les journées des bus : on commence donc ici."
  nl: "Diensten worden uit de dagen van de bussen geknipt, dus je begint hier."
  pl: "Służby wycina się z dni autobusów, więc zaczynasz tutaj."
  ru: "Смены нарезаются из дней автобусов, поэтому начинаем здесь."
  uk: "Зміни нарізаються з днів автобусів, тож починаємо тут."
"Cut a duty at a terminus":
  de: "Teilen Sie einen Dienst an einer Endhaltestelle"
  fr: "Coupez un service à un terminus"
  nl: "Knip een dienst bij een eindhalte"
  pl: "Podziel służbę na pętli"
  ru: "Разрежьте смену на конечной"
  uk: "Розріжте зміну на кінцевій"
"Hold the mouse over the gap between two trips. Where a blue line shows, a driver can take over: click to cut there.":
  de: "Halten Sie die Maus über die Lücke zwischen zwei Fahrten. Wo eine blaue Linie erscheint, kann ein Fahrer übernehmen: Klicken Sie, um dort zu teilen."
  fr: "Gardez la souris sur l'intervalle entre deux courses. Là où une ligne bleue apparaît, un conducteur peut prendre le relais : cliquez pour couper à cet endroit."
  nl: "Houd de muis boven het gat tussen twee ritten. Waar een blauwe streep verschijnt, kan een chauffeur overnemen: klik om daar te knippen."
  pl: "Przytrzymaj mysz nad przerwą między dwoma kursami. Tam, gdzie pojawi się niebieska linia, może przejąć inny kierowca: kliknij, by tam podzielić."
  ru: "Задержите мышь над промежутком между двумя рейсами. Где появится синяя черта, может смениться водитель: щёлкните, чтобы разрезать там."
  uk: "Затримайте мишу над проміжком між двома рейсами. Де з'явиться синя риска, може змінитися водій: клацніть, щоб розрізати там."
"Look at it in Drivers":
  de: "Sehen Sie es sich unter Fahrer an"
  fr: "Regardez-le dans Conducteurs"
  nl: "Bekijk het bij Chauffeurs"
  pl: "Zobacz to w Kierowcach"
  ru: "Посмотрите в «Водителях»"
  uk: "Подивіться у «Водіях»"
"There is one duty more now: the second driver's day starts where you cut.":
  de: "Jetzt gibt es einen Dienst mehr: Der Tag des zweiten Fahrers beginnt dort, wo Sie geteilt haben."
  fr: "Il y a maintenant un service de plus : la journée du second conducteur commence là où vous avez coupé."
  nl: "Er is nu één dienst meer: de dag van de tweede chauffeur begint waar je knipte."
  pl: "Jest teraz o jedną służbę więcej: dzień drugiego kierowcy zaczyna się tam, gdzie podzieliłeś."
  ru: "Теперь на одну смену больше: день второго водителя начинается там, где вы разрезали."
  uk: "Тепер на одну зміну більше: день другого водія починається там, де ви розрізали."
"Go back to Vehicles":
  de: "Gehen Sie zurück zu Fahrzeuge"
  fr: "Revenez à Véhicules"
  nl: "Ga terug naar Voertuigen"
  pl: "Wróć do Pojazdów"
  ru: "Вернитесь в «Транспорт»"
  uk: "Поверніться до «Транспорту»"
"The arrows on the bus's row mark your cut.":
  de: "Die Pfeile in der Zeile des Busses markieren Ihre Teilung."
  fr: "Les flèches sur la ligne du bus marquent votre coupure."
  nl: "De pijlen in de rij van de bus markeren je knip."
  pl: "Strzałki w wierszu autobusu oznaczają twój podział."
  ru: "Стрелки в строке автобуса отмечают ваш разрез."
  uk: "Стрілки в рядку автобуса позначають ваш розріз."
"Join the two duties again":
  de: "Verbinden Sie die beiden Dienste wieder"
  fr: "Réunissez les deux services"
  nl: "Voeg de twee diensten weer samen"
  pl: "Połącz z powrotem obie służby"
  ru: "Снова соедините две смены"
  uk: "Знову з'єднайте дві зміни"
"Click the arrows where the drivers change. The two duties become one.":
  de: "Klicken Sie auf die Pfeile, wo die Fahrer wechseln. Aus den beiden Diensten wird einer."
  fr: "Cliquez sur les flèches où les conducteurs se relaient. Les deux services n'en font plus qu'un."
  nl: "Klik op de pijlen waar de chauffeurs wisselen. De twee diensten worden er één."
  pl: "Kliknij strzałki w miejscu zmiany kierowców. Dwie służby stają się jedną."
  ru: "Щёлкните по стрелкам там, где меняются водители. Две смены станут одной."
  uk: "Клацніть по стрілках там, де змінюються водії. Дві зміни стануть однією."
"Open the Drivers tab":
  de: "Öffnen Sie den Reiter Fahrer"
  fr: "Ouvrez l'onglet Conducteurs"
  nl: "Open het tabblad Chauffeurs"
  pl: "Otwórz kartę Kierowcy"
  ru: "Откройте вкладку «Водители»"
  uk: "Відкрийте вкладку «Водії»"
"Each row there is one driver's working day.":
  de: "Jede Zeile dort ist der Arbeitstag eines Fahrers."
  fr: "Chaque ligne y est la journée de travail d'un conducteur."
  nl: "Elke rij daar is de werkdag van één chauffeur."
  pl: "Każdy wiersz to tam dzień pracy jednego kierowcy."
  ru: "Каждая строка там — рабочий день одного водителя."
  uk: "Кожен рядок там — робочий день одного водія."
"Pick up a piece of work":
  de: "Nehmen Sie ein Dienststück auf"
  fr: "Prenez une partie de travail"
  nl: "Pak een dienststuk op"
  pl: "Podnieś część pracy"
  ru: "Возьмите часть работы"
  uk: "Візьміть частину роботи"
"Drag a chip of a short duty, or double-click it: the whole part on that bus comes along.":
  de: "Ziehen Sie einen Chip eines kurzen Dienstes oder doppelklicken Sie ihn: Der ganze Abschnitt auf diesem Bus kommt mit."
  fr: "Faites glisser une puce d'un service court, ou double-cliquez dessus : toute la partie sur ce bus suit."
  nl: "Sleep een chip van een korte dienst, of dubbelklik erop: het hele deel op die bus gaat mee."
  pl: "Przeciągnij kafelek krótkiej służby albo kliknij go dwukrotnie: przeniesie się cały odcinek na tym autobusie."
  ru: "Перетащите плашку короткой смены или щёлкните по ней дважды: весь отрезок на этом автобусе пойдёт с ней."
  uk: "Перетягніть плашку короткої зміни або клацніть по ній двічі: увесь відрізок на цьому автобусі піде з нею."
"Drop it on another duty":
  de: "Legen Sie es auf einen anderen Dienst"
  fr: "Déposez-la sur un autre service"
  nl: "Zet het op een andere dienst"
  pl: "Upuść ją na inną służbę"
  ru: "Поставьте её на другую смену"
  uk: "Поставте її на іншу зміну"
"Click a slot: the two become one duty, with a break between them. No slot? The duty would get too long: take a shorter piece.":
  de: "Klicken Sie auf einen Platz: Beide werden ein Dienst, mit einer Pause dazwischen. Kein Platz? Der Dienst würde zu lang: Nehmen Sie ein kürzeres Stück."
  fr: "Cliquez sur un emplacement : les deux deviennent un seul service, avec une pause entre eux. Pas d'emplacement ? Le service serait trop long : prenez une partie plus courte."
  nl: "Klik op een vak: de twee worden één dienst, met een pauze ertussen. Geen vak? Dan wordt de dienst te lang: neem een korter stuk."
  pl: "Kliknij miejsce: obie stają się jedną służbą, z przerwą pomiędzy. Brak miejsca? Służba byłaby za długa: weź krótszą część."
  ru: "Щёлкните по месту: обе станут одной сменой с перерывом между ними. Нет места? Смена стала бы слишком длинной: возьмите часть покороче."
  uk: "Клацніть по місцю: обидві стануть однією зміною з перервою між ними. Немає місця? Зміна стала б задовгою: візьміть коротшу частину."
"Open a duty":
  de: "Öffnen Sie einen Dienst"
  fr: "Ouvrez un service"
  nl: "Open een dienst"
  pl: "Otwórz służbę"
  ru: "Откройте смену"
  uk: "Відкрийте зміну"
"Click a duty's ID on the left. Its panel shows what the duty is made of.":
  de: "Klicken Sie links auf die ID eines Dienstes. Sein Fenster zeigt, woraus der Dienst besteht."
  fr: "Cliquez sur l'identifiant d'un service à gauche. Son panneau montre de quoi il est fait."
  nl: "Klik links op de ID van een dienst. Zijn paneel laat zien waaruit de dienst bestaat."
  pl: "Kliknij ID służby po lewej. Jej panel pokazuje, z czego się składa."
  ru: "Щёлкните номер смены слева. Её панель покажет, из чего она состоит."
  uk: "Клацніть номер зміни ліворуч. Її панель покаже, з чого вона складається."
"Read sign-on, sign-off and breaks":
  de: "Lesen Sie Dienstbeginn, Dienstende und Pausen"
  fr: "Lisez la prise de service, la fin de service et les pauses"
  nl: "Lees aanmelden, afmelden en pauzes"
  pl: "Odczytaj rozpoczęcie, zakończenie i przerwy"
  ru: "Посмотрите явку, сдачу и перерывы"
  uk: "Подивіться явку, здачу й перерви"
"Sign-on and sign-off are when the driver starts and stops. The breaks are between the pieces of work; a long unpaid one is a split.":
  de: "Dienstbeginn und Dienstende sind, wann der Fahrer anfängt und aufhört. Die Pausen liegen zwischen den Dienststücken; eine lange unbezahlte heißt geteilter Dienst."
  fr: "La prise et la fin de service sont les moments où le conducteur commence et s'arrête. Les pauses sont entre les parties de travail ; une longue pause non payée est une coupure."
  nl: "Aanmelden en afmelden zijn wanneer de chauffeur begint en stopt. De pauzes liggen tussen de dienststukken; een lange onbetaalde heet een gebroken dienst."
  pl: "Rozpoczęcie i zakończenie to chwile, gdy kierowca zaczyna i kończy. Przerwy są między częściami pracy; długa niepłatna to służba dzielona."
  ru: "Явка и сдача — когда водитель начинает и заканчивает. Перерывы находятся между частями работы; долгий неоплачиваемый — это разрыв."
  uk: "Явка й здача — коли водій починає й закінчує. Перерви розташовані між частинами роботи; довга неоплачувана — це розрив."
"Lock the duty":
  de: "Sperren Sie den Dienst"
  fr: "Verrouillez le service"
  nl: "Vergrendel de dienst"
  pl: "Zablokuj służbę"
  ru: "Заблокируйте смену"
  uk: "Заблокуйте зміну"
"Click the lock at the top of the panel. OPTIMIZE will leave this duty as it is.":
  de: "Klicken Sie auf das Schloss oben im Fenster. OPTIMIEREN lässt diesen Dienst dann, wie er ist."
  fr: "Cliquez sur le cadenas en haut du panneau. OPTIMISER laissera ce service tel quel."
  nl: "Klik op het slot bovenaan het paneel. OPTIMALISEREN laat deze dienst dan zoals hij is."
  pl: "Kliknij kłódkę u góry panelu. OPTYMALIZUJ zostawi tę służbę bez zmian."
  ru: "Щёлкните по замку вверху панели. ОПТИМИЗИРОВАТЬ оставит эту смену как есть."
  uk: "Клацніть по замку вгорі панелі. ОПТИМІЗУВАТИ залишить цю зміну як є."
"Open Vehicles or Drivers":
  de: "Öffnen Sie Fahrzeuge oder Fahrer"
  fr: "Ouvrez Véhicules ou Conducteurs"
  nl: "Open Voertuigen of Chauffeurs"
  pl: "Otwórz Pojazdy lub Kierowców"
  ru: "Откройте «Транспорт» или «Водители»"
  uk: "Відкрийте «Транспорт» або «Водії»"
"The issues are counted in the status bar at the bottom of both.":
  de: "Die Probleme werden in beiden unten in der Statusleiste gezählt."
  fr: "Les problèmes sont comptés dans la barre d'état en bas de chacun."
  nl: "De problemen worden bij allebei onderaan in de statusbalk geteld."
  pl: "Problemy są liczone na pasku stanu na dole obu kart."
  ru: "Проблемы подсчитываются в строке состояния внизу обеих вкладок."
  uk: "Проблеми підраховуються в рядку стану внизу обох вкладок."
"Open the issues":
  de: "Öffnen Sie die Probleme"
  fr: "Ouvrez les problèmes"
  nl: "Open de problemen"
  pl: "Otwórz problemy"
  ru: "Откройте проблемы"
  uk: "Відкрийте проблеми"
"Click Duty Issues or Vehicle Issues in the status bar.":
  de: "Klicken Sie in der Statusleiste auf Dienstprobleme oder Fahrzeugprobleme."
  fr: "Cliquez sur Problèmes services ou Problèmes véhicules dans la barre d'état."
  nl: "Klik in de statusbalk op Dienstproblemen of Voertuigproblemen."
  pl: "Kliknij Problemy służb lub Problemy pojazdów na pasku stanu."
  ru: "Щёлкните «Проблемы смен» или «Проблемы машин» в строке состояния."
  uk: "Клацніть «Проблеми змін» або «Проблеми машин» у рядку стану."
"Jump to an issue":
  de: "Springen Sie zu einem Problem"
  fr: "Allez à un problème"
  nl: "Spring naar een probleem"
  pl: "Przejdź do problemu"
  ru: "Перейдите к проблеме"
  uk: "Перейдіть до проблеми"
"Click an issue in the list: RosterFlow shows its row.":
  de: "Klicken Sie auf ein Problem in der Liste: RosterFlow zeigt seine Zeile."
  fr: "Cliquez sur un problème dans la liste : RosterFlow montre sa ligne."
  nl: "Klik op een probleem in de lijst: RosterFlow toont zijn rij."
  pl: "Kliknij problem na liście: RosterFlow pokaże jego wiersz."
  ru: "Щёлкните проблему в списке: RosterFlow покажет её строку."
  uk: "Клацніть проблему у списку: RosterFlow покаже її рядок."
"Fix the issue":
  de: "Beheben Sie das Problem"
  fr: "Corrigez le problème"
  nl: "Los het probleem op"
  pl: "Napraw ten problem"
  ru: "Исправьте проблему"
  uk: "Виправте проблему"
"Move a trip, cut or join a duty, or change the rules under Preferences. If it is fine as it is, tick it and dismiss it.":
  de: "Verschieben Sie eine Fahrt, teilen oder verbinden Sie einen Dienst, oder ändern Sie die Regeln unter Einstellungen. Ist es so in Ordnung, haken Sie es an und verwerfen Sie es."
  fr: "Déplacez une course, coupez ou réunissez un service, ou changez les règles dans Préférences. Si c'est bien ainsi, cochez-le et ignorez-le."
  nl: "Verplaats een rit, knip of voeg een dienst samen, of wijzig de regels onder Voorkeuren. Is het goed zo, vink het aan en negeer het."
  pl: "Przenieś kurs, podziel lub połącz służbę albo zmień reguły w Preferencjach. Jeśli tak jest dobrze, zaznacz go i odrzuć."
  ru: "Перенесите рейс, разрежьте или соедините смену либо измените правила в «Предпочтениях». Если так и должно быть, отметьте проблему и скройте её."
  uk: "Перенесіть рейс, розріжте чи з'єднайте зміну або змініть правила у «Вподобаннях». Якщо так і має бути, позначте проблему й приховайте її."
"OPTIMIZE is on the toolbar of both.":
  de: "OPTIMIEREN steht in beiden in der Werkzeugleiste."
  fr: "OPTIMISER est dans la barre d'outils des deux."
  nl: "OPTIMALISEREN staat bij allebei in de werkbalk."
  pl: "OPTYMALIZUJ jest na pasku narzędzi obu kart."
  ru: "ОПТИМИЗИРОВАТЬ есть на панели инструментов обеих вкладок."
  uk: "ОПТИМІЗУВАТИ є на панелі інструментів обох вкладок."
"Click OPTIMIZE":
  de: "Klicken Sie auf OPTIMIEREN"
  fr: "Cliquez sur OPTIMISER"
  nl: "Klik op OPTIMALISEREN"
  pl: "Kliknij OPTYMALIZUJ"
  ru: "Щёлкните ОПТИМИЗИРОВАТЬ"
  uk: "Клацніть ОПТИМІЗУВАТИ"
"RosterFlow works out the blocks and duties by itself. Locked rows stay as they are.":
  de: "RosterFlow erstellt die Umläufe und Dienste selbst. Gesperrte Zeilen bleiben, wie sie sind."
  fr: "RosterFlow établit lui-même les blocs et les services. Les lignes verrouillées restent telles quelles."
  nl: "RosterFlow maakt zelf de omlopen en diensten. Vergrendelde rijen blijven zoals ze zijn."
  pl: "RosterFlow sam układa obiegi i służby. Zablokowane wiersze pozostają bez zmian."
  ru: "RosterFlow сам составляет выпуски и смены. Заблокированные строки не меняются."
  uk: "RosterFlow сам складає випуски й зміни. Заблоковані рядки не змінюються."
"Compare the figures":
  de: "Vergleichen Sie die Kennzahlen"
  fr: "Comparez les chiffres"
  nl: "Vergelijk de cijfers"
  pl: "Porównaj liczby"
  ru: "Сравните показатели"
  uk: "Порівняйте показники"
"The figures now show the proposal against your planning: green where it is better, red where it is worse.":
  de: "Die Kennzahlen zeigen jetzt den Vorschlag im Vergleich zu Ihrer Planung: grün, wo er besser ist, rot, wo er schlechter ist."
  fr: "Les chiffres montrent maintenant la proposition face à votre planification : en vert là où elle est meilleure, en rouge là où elle est moins bonne."
  nl: "De cijfers tonen nu het voorstel tegenover jouw planning: groen waar het beter is, rood waar het slechter is."
  pl: "Liczby pokazują teraz propozycję w porównaniu z twoim planem: zielone tam, gdzie jest lepsza, czerwone tam, gdzie gorsza."
  ru: "Показатели теперь сравнивают предложение с вашим планом: зелёным, где лучше, красным, где хуже."
  uk: "Показники тепер порівнюють пропозицію з вашим планом: зеленим, де краще, червоним, де гірше."
"Accept it or keep yours":
  de: "Übernehmen Sie ihn oder behalten Sie Ihre"
  fr: "Acceptez-la ou gardez la vôtre"
  nl: "Neem het over of houd de jouwe"
  pl: "Przyjmij ją albo zostaw swoją"
  ru: "Примите его или оставьте свой"
  uk: "Прийміть її або залиште свій"
"Accept puts the proposal in your draft; Keep mine forgets it.":
  de: "Annehmen übernimmt den Vorschlag in Ihren Entwurf; Meins behalten verwirft ihn."
  fr: "Accepter met la proposition dans votre brouillon ; Garder le mien l'oublie."
  nl: "Accepteren zet het voorstel in je concept; Mijn eigen houden vergeet het."
  pl: "Akceptuj wstawia propozycję do szkicu; Zostaw moje ją pomija."
  ru: "«Принять» добавляет предложение в черновик; «Оставить моё» забывает его."
  uk: "«Прийняти» додає пропозицію в чернетку; «Залишити моє» забуває її."
"Open the Timeplan tab":
  de: "Öffnen Sie den Reiter Fahrplanentwurf"
  fr: "Ouvrez l'onglet Plan horaire"
  nl: "Open het tabblad Dienstregelingsplan"
  pl: "Otwórz kartę Plan rozkładu"
  ru: "Откройте вкладку «План расписания»"
  uk: "Відкрийте вкладку «План розкладу»"
"Here a line gets its running times and its timetable.":
  de: "Hier bekommt eine Linie ihre Fahrzeiten und ihren Fahrplan."
  fr: "Ici, une ligne reçoit ses temps de parcours et son horaire."
  nl: "Hier krijgt een lijn zijn rijtijden en zijn dienstregeling."
  pl: "Tu linia dostaje czasy przejazdu i rozkład."
  ru: "Здесь линия получает время хода и расписание."
  uk: "Тут лінія отримує час руху й розклад."
"Show the running times":
  de: "Zeigen Sie die Fahrzeiten"
  fr: "Affichez les temps de parcours"
  nl: "Toon de rijtijden"
  pl: "Pokaż czasy przejazdu"
  ru: "Покажите время хода"
  uk: "Покажіть час руху"
"Click the clock icon on the right of the bar.":
  de: "Klicken Sie auf das Uhr-Symbol rechts in der Leiste."
  fr: "Cliquez sur l'icône d'horloge à droite de la barre."
  nl: "Klik op het klokpictogram rechts in de balk."
  pl: "Kliknij ikonę zegara po prawej stronie paska."
  ru: "Щёлкните значок часов справа на панели."
  uk: "Клацніть значок годинника праворуч на панелі."
"Change a running time":
  de: "Ändern Sie eine Fahrzeit"
  fr: "Modifiez un temps de parcours"
  nl: "Wijzig een rijtijd"
  pl: "Zmień czas przejazdu"
  ru: "Измените время хода"
  uk: "Змініть час руху"
"Click a box with minutes in a time band, type a new number and press Enter. Every trip in that band moves with it.":
  de: "Klicken Sie in einem Zeitband auf ein Kästchen mit Minuten, tippen Sie eine neue Zahl und drücken Sie Enter. Jede Fahrt in diesem Band verschiebt sich mit."
  fr: "Cliquez sur une case de minutes dans une tranche horaire, tapez un nouveau nombre et appuyez sur Entrée. Chaque course de cette tranche suit."
  nl: "Klik in een tijdvak op een vakje met minuten, typ een nieuw getal en druk op Enter. Elke rit in dat tijdvak schuift mee."
  pl: "Kliknij pole z minutami w przedziale czasu, wpisz nową liczbę i naciśnij Enter. Każdy kurs w tym przedziale przesunie się razem."
  ru: "Щёлкните ячейку с минутами во временном интервале, введите новое число и нажмите Enter. Все рейсы интервала сдвинутся вместе с ним."
  uk: "Клацніть клітинку з хвилинами в часовому проміжку, введіть нове число й натисніть Enter. Усі рейси проміжку зсунуться разом із ним."
"Show the timetable":
  de: "Zeigen Sie den Fahrplan"
  fr: "Affichez l'horaire"
  nl: "Toon de dienstregeling"
  pl: "Pokaż rozkład"
  ru: "Покажите расписание"
  uk: "Покажіть розклад"
"Click the grid icon on the right of the bar. Each row is a trip, with its time at every stop.":
  de: "Klicken Sie auf das Raster-Symbol rechts in der Leiste. Jede Zeile ist eine Fahrt mit ihrer Zeit an jeder Haltestelle."
  fr: "Cliquez sur l'icône de grille à droite de la barre. Chaque ligne est une course, avec son heure à chaque arrêt."
  nl: "Klik op het rasterpictogram rechts in de balk. Elke rij is een rit, met zijn tijd bij elke halte."
  pl: "Kliknij ikonę siatki po prawej stronie paska. Każdy wiersz to kurs z godziną na każdym przystanku."
  ru: "Щёлкните значок сетки справа на панели. Каждая строка — рейс со временем на каждой остановке."
  uk: "Клацніть значок сітки праворуч на панелі. Кожен рядок — рейс із часом на кожній зупинці."
"Add trips by headway":
  de: "Fügen Sie Fahrten nach Takt hinzu"
  fr: "Ajoutez des courses par fréquence"
  nl: "Voeg ritten toe met een interval"
  pl: "Dodaj kursy według taktu"
  ru: "Добавьте рейсы по интервалу"
  uk: "Додайте рейси за інтервалом"
"Click the clock tool above the table. Give the first and the last departure - in a quiet part of the day, such as the late evening - and the minutes between buses, then the tick.":
  de: "Klicken Sie auf das Uhr-Werkzeug über der Tabelle. Geben Sie die erste und die letzte Abfahrt ein – in einem ruhigen Teil des Tages, etwa am späten Abend – und die Minuten zwischen den Bussen, dann auf den Haken."
  fr: "Cliquez sur l'outil horloge au-dessus du tableau. Indiquez le premier et le dernier départ – dans un moment calme de la journée, par exemple tard le soir – et les minutes entre les bus, puis la coche."
  nl: "Klik op het klokgereedschap boven de tabel. Vul het eerste en het laatste vertrek in – in een rustig deel van de dag, zoals de late avond – en de minuten tussen de bussen, en klik dan op het vinkje."
  pl: "Kliknij narzędzie z zegarem nad tabelą. Podaj pierwszy i ostatni odjazd – w spokojnej porze dnia, np. późnym wieczorem – oraz minuty między autobusami, a potem kliknij ptaszek."
  ru: "Щёлкните инструмент с часами над таблицей. Укажите первое и последнее отправление — в спокойное время дня, например поздно вечером, — и минуты между автобусами, затем галочку."
  uk: "Клацніть інструмент із годинником над таблицею. Вкажіть перше й останнє відправлення — у спокійну пору дня, наприклад пізно ввечері, — і хвилини між автобусами, потім галочку."
"Save the timetable":
  de: "Speichern Sie den Fahrplan"
  fr: "Enregistrez l'horaire"
  nl: "Sla de dienstregeling op"
  pl: "Zapisz rozkład"
  ru: "Сохраните расписание"
  uk: "Збережіть розклад"
"Save writes the line's new timetable. If it asks you to mend something first, two trips leave at the same minute: undo them (the arrow in the bar) and add them at other times.":
  de: "Speichern schreibt den neuen Fahrplan der Linie. Verlangt es, zuerst etwas zu beheben, fahren zwei Fahrten in derselben Minute ab: Machen Sie sie rückgängig (der Pfeil in der Leiste) und fügen Sie sie zu anderen Zeiten hinzu."
  fr: "Enregistrer écrit le nouvel horaire de la ligne. S'il demande d'abord une correction, deux courses partent à la même minute : annulez-les (la flèche dans la barre) et ajoutez-les à d'autres heures."
  nl: "Opslaan schrijft de nieuwe dienstregeling van de lijn weg. Vraagt het om eerst iets te herstellen, dan vertrekken twee ritten in dezelfde minuut: maak ze ongedaan (de pijl in de balk) en voeg ze op andere tijden toe."
  pl: "Zapisz zapisuje nowy rozkład linii. Jeśli najpierw prosi o poprawkę, dwa kursy odjeżdżają w tej samej minucie: cofnij je (strzałka na pasku) i dodaj o innych porach."
  ru: "«Сохранить» записывает новое расписание линии. Если сначала просят что-то исправить, два рейса отправляются в одну минуту: отмените их (стрелка на панели) и добавьте в другое время."
  uk: "«Зберегти» записує новий розклад лінії. Якщо спершу просять щось виправити, два рейси вирушають в одну хвилину: скасуйте їх (стрілка на панелі) і додайте в інший час."
"Refresh the blocks":
  de: "Aktualisieren Sie die Umläufe"
  fr: "Actualisez les blocs"
  nl: "Vernieuw de omlopen"
  pl: "Odśwież obiegi"
  ru: "Обновите выпуски"
  uk: "Оновіть випуски"
"Click UNSYNCED - Refresh in the status bar: the buses' blocks and the duties are made again for the new trips.":
  de: "Klicken Sie in der Statusleiste auf NICHT ABGEGLICHEN – Aktualisieren: Die Umläufe der Busse und die Dienste werden für die neuen Fahrten neu erstellt."
  fr: "Cliquez sur NON SYNCHRONISÉ – Actualiser dans la barre d'état : les blocs des bus et les services sont refaits pour les nouvelles courses."
  nl: "Klik in de statusbalk op NIET GESYNCHRONISEERD – Vernieuwen: de omlopen van de bussen en de diensten worden opnieuw gemaakt voor de nieuwe ritten."
  pl: "Kliknij NIEZSYNCHRONIZOWANE – Odśwież na pasku stanu: obiegi autobusów i służby zostaną ułożone od nowa dla nowych kursów."
  ru: "Щёлкните НЕ СИНХРОНИЗИРОВАНО – Обновить в строке состояния: выпуски автобусов и смены будут составлены заново для новых рейсов."
  uk: "Клацніть НЕ СИНХРОНІЗОВАНО – Оновити в рядку стану: випуски автобусів і зміни буде складено заново для нових рейсів."
"Open the line's colour":
  de: "Öffnen Sie die Farbe der Linie"
  fr: "Ouvrez la couleur de la ligne"
  nl: "Open de kleur van de lijn"
  pl: "Otwórz kolor linii"
  ru: "Откройте цвет линии"
  uk: "Відкрийте колір лінії"
"Right-click a trip and choose Line colour.":
  de: "Klicken Sie mit der rechten Maustaste auf eine Fahrt und wählen Sie Linienfarbe."
  fr: "Faites un clic droit sur une course et choisissez Couleur de ligne."
  nl: "Klik met rechts op een rit en kies Lijnkleur."
  pl: "Kliknij kurs prawym przyciskiem i wybierz Kolor linii."
  ru: "Щёлкните рейс правой кнопкой и выберите «Цвет маршрута»."
  uk: "Клацніть рейс правою кнопкою й виберіть «Колір маршруту»."
"Pick a colour":
  de: "Wählen Sie eine Farbe"
  fr: "Choisissez une couleur"
  nl: "Kies een kleur"
  pl: "Wybierz kolor"
  ru: "Выберите цвет"
  uk: "Виберіть колір"
"Click a colour: every chip of the line takes it at once. Automatic gives it back its old one.":
  de: "Klicken Sie auf eine Farbe: Jeder Chip der Linie übernimmt sie sofort. Automatisch gibt ihr die alte zurück."
  fr: "Cliquez sur une couleur : chaque puce de la ligne la prend aussitôt. Automatique lui rend l'ancienne."
  nl: "Klik op een kleur: elke chip van de lijn neemt hem meteen over. Automatisch geeft hem zijn oude terug."
  pl: "Kliknij kolor: każdy kafelek linii od razu go przyjmie. Automatycznie przywraca poprzedni."
  ru: "Щёлкните цвет: все плашки линии сразу его примут. «Автоматически» вернёт прежний."
  uk: "Клацніть колір: усі плашки лінії одразу його приймуть. «Автоматично» поверне попередній."
"Make a change":
  de: "Ändern Sie etwas"
  fr: "Faites une modification"
  nl: "Maak een wijziging"
  pl: "Wprowadź zmianę"
  ru: "Внесите изменение"
  uk: "Внесіть зміну"
"Move a trip or cut a duty. The dot at the top turns orange: there are changes not saved.":
  de: "Verschieben Sie eine Fahrt oder teilen Sie einen Dienst. Der Punkt oben wird orange: Es gibt ungespeicherte Änderungen."
  fr: "Déplacez une course ou coupez un service. Le point en haut devient orange : il y a des modifications non enregistrées."
  nl: "Verplaats een rit of knip een dienst. De stip bovenaan wordt oranje: er zijn niet-opgeslagen wijzigingen."
  pl: "Przenieś kurs albo podziel służbę. Kropka na górze robi się pomarańczowa: są niezapisane zmiany."
  ru: "Перенесите рейс или разрежьте смену. Точка вверху станет оранжевой: есть несохранённые изменения."
  uk: "Перенесіть рейс або розріжте зміну. Крапка вгорі стане помаранчевою: є незбережені зміни."
"DISCARD it":
  de: "VERWERFEN Sie es"
  fr: "ABANDONNEZ-la"
  nl: "VERWERP het"
  pl: "ODRZUĆ ją"
  ru: "ОТМЕНИТЕ его"
  uk: "СКАСУЙТЕ її"
"DISCARD forgets your changes and goes back to what was saved.":
  de: "VERWERFEN vergisst Ihre Änderungen und kehrt zum Gespeicherten zurück."
  fr: "ABANDONNER oublie vos modifications et revient à ce qui était enregistré."
  nl: "VERWERPEN vergeet je wijzigingen en gaat terug naar wat was opgeslagen."
  pl: "ODRZUĆ zapomina twoje zmiany i wraca do tego, co było zapisane."
  ru: "ОТМЕНИТЬ забывает ваши изменения и возвращает сохранённое."
  uk: "СКАСУВАТИ забуває ваші зміни й повертає збережене."
"Make a change again":
  de: "Ändern Sie wieder etwas"
  fr: "Refaites une modification"
  nl: "Maak opnieuw een wijziging"
  pl: "Wprowadź zmianę jeszcze raz"
  ru: "Снова внесите изменение"
  uk: "Знову внесіть зміну"
"Any change will do.":
  de: "Jede Änderung genügt."
  fr: "N'importe quelle modification convient."
  nl: "Elke wijziging is goed."
  pl: "Wystarczy dowolna zmiana."
  ru: "Подойдёт любое изменение."
  uk: "Підійде будь-яка зміна."
"SAVE it":
  de: "SPEICHERN Sie es"
  fr: "ENREGISTREZ-la"
  nl: "SLA het OP"
  pl: "ZAPISZ ją"
  ru: "СОХРАНИТЕ его"
  uk: "ЗБЕРЕЖІТЬ її"
"SAVE makes it the company's planning: the roster, the day and the game run it now. The dot turns green.":
  de: "SPEICHERN macht es zur Planung des Unternehmens: Dienstplan, Tag und Spiel fahren jetzt danach. Der Punkt wird grün."
  fr: "ENREGISTRER en fait la planification de l'entreprise : le roulement, la journée et le jeu l'appliquent désormais. Le point devient vert."
  nl: "OPSLAAN maakt het de planning van het bedrijf: het rooster, de dag en het spel rijden er nu mee. De stip wordt groen."
  pl: "ZAPISZ czyni ją planem firmy: grafik, dzień i gra działają teraz według niej. Kropka robi się zielona."
  ru: "СОХРАНИТЬ делает его планом компании: график, день и игра теперь работают по нему. Точка станет зелёной."
  uk: "ЗБЕРЕГТИ робить її планом компанії: графік, день і гра тепер працюють за ним. Крапка стане зеленою."
"This day has no trips yet. Give the company a line first (on the Lines page), then come back.":
  de: "Dieser Tag hat noch keine Fahrten. Geben Sie dem Unternehmen zuerst eine Linie (auf der Seite Linien) und kommen Sie dann zurück."
  fr: "Ce jour n'a encore aucune course. Donnez d'abord une ligne à l'entreprise (page Lignes), puis revenez."
  nl: "Deze dag heeft nog geen ritten. Geef het bedrijf eerst een lijn (op de pagina Lijnen) en kom dan terug."
  pl: "Ten dzień nie ma jeszcze kursów. Najpierw daj firmie linię (na stronie Linie), a potem wróć."
  ru: "В этот день ещё нет рейсов. Сначала дайте компании линию (на странице «Линии»), затем возвращайтесь."
  uk: "Цього дня ще немає рейсів. Спершу дайте компанії лінію (на сторінці «Лінії»), потім повертайтеся."
"Moving a trip needs at least two buses on the day. Add a line or more trips first, then come back.":
  de: "Zum Verschieben einer Fahrt braucht der Tag mindestens zwei Busse. Fügen Sie zuerst eine Linie oder mehr Fahrten hinzu und kommen Sie dann zurück."
  fr: "Pour déplacer une course, il faut au moins deux bus dans la journée. Ajoutez d'abord une ligne ou plus de courses, puis revenez."
  nl: "Een rit verplaatsen kan pas met minstens twee bussen op de dag. Voeg eerst een lijn of meer ritten toe en kom dan terug."
  pl: "Do przeniesienia kursu potrzeba co najmniej dwóch autobusów w ciągu dnia. Najpierw dodaj linię lub więcej kursów, a potem wróć."
  ru: "Чтобы перенести рейс, в дне должно быть хотя бы два автобуса. Сначала добавьте линию или больше рейсов, затем возвращайтесь."
  uk: "Щоб перенести рейс, у дні має бути щонайменше два автобуси. Спершу додайте лінію або більше рейсів, потім повертайтеся."
"Nothing is red right now: every rule is kept. Come back when a number shows beside the issues in the status bar.":
  de: "Gerade ist nichts rot: Jede Regel wird eingehalten. Kommen Sie wieder, wenn neben den Problemen in der Statusleiste eine Zahl steht."
  fr: "Rien n'est rouge pour l'instant : chaque règle est respectée. Revenez quand un nombre apparaît à côté des problèmes dans la barre d'état."
  nl: "Er is nu niets rood: elke regel wordt gehouden. Kom terug als er een getal naast de problemen in de statusbalk staat."
  pl: "Na razie nic nie jest czerwone: każda reguła jest przestrzegana. Wróć, gdy obok problemów na pasku stanu pojawi się liczba."
  ru: "Сейчас ничего не красное: все правила соблюдены. Возвращайтесь, когда рядом с проблемами в строке состояния появится число."
  uk: "Зараз нічого не червоне: усі правила дотримано. Повертайтеся, коли поруч із проблемами в рядку стану з'явиться число."
"When the buses run: each line's running times and timetable.":
  de: "Wann die Busse fahren: Fahrzeiten und Fahrplan jeder Linie."
  fr: "Quand les bus circulent : les temps de parcours et l'horaire de chaque ligne."
  nl: "Wanneer de bussen rijden: de rijtijden en de dienstregeling van elke lijn."
  pl: "Kiedy jeżdżą autobusy: czasy przejazdu i rozkład każdej linii."
  ru: "Когда ходят автобусы: время хода и расписание каждой линии."
  uk: "Коли ходять автобуси: час руху й розклад кожної лінії."
"Which bus drives which trips. One bus's day is a block.":
  de: "Welcher Bus welche Fahrten fährt. Der Tag eines Busses ist ein Umlauf."
  fr: "Quel bus fait quelles courses. La journée d'un bus est un bloc."
  nl: "Welke bus welke ritten rijdt. De dag van één bus is een omloop."
  pl: "Który autobus wykonuje które kursy. Dzień jednego autobusu to obieg."
  ru: "Какой автобус выполняет какие рейсы. День одного автобуса — это выпуск."
  uk: "Який автобус виконує які рейси. День одного автобуса — це випуск."
"Who drives. Blocks are cut into duties at a terminus or the depot.":
  de: "Wer fährt. Umläufe werden an einer Endhaltestelle oder am Betriebshof in Dienste geteilt."
  fr: "Qui conduit. Les blocs sont coupés en services à un terminus ou au dépôt."
  nl: "Wie rijdt. Omlopen worden bij een eindhalte of de remise in diensten geknipt."
  pl: "Kto prowadzi. Obiegi dzieli się na służby na pętli lub w zajezdni."
  ru: "Кто ведёт. Выпуски делятся на смены на конечной или в депо."
  uk: "Хто веде. Випуски діляться на зміни на кінцевій або в депо."
"Which driver and which bus, for each weekday.":
  de: "Welcher Fahrer und welcher Bus, für jeden Wochentag."
  fr: "Quel conducteur et quel bus, pour chaque jour de la semaine."
  nl: "Welke chauffeur en welke bus, voor elke weekdag."
  pl: "Który kierowca i który autobus, na każdy dzień tygodnia."
  ru: "Какой водитель и какой автобус, на каждый день недели."
  uk: "Який водій і який автобус, на кожен день тижня."
"Nothing counts until you save. DISCARD goes back to what was saved.":
  de: "Nichts zählt, bevor Sie speichern. VERWERFEN kehrt zum Gespeicherten zurück."
  fr: "Rien ne compte tant que vous n'avez pas enregistré. ABANDONNER revient à ce qui était enregistré."
  nl: "Niets telt voordat je opslaat. VERWERPEN gaat terug naar wat was opgeslagen."
  pl: "Nic się nie liczy, dopóki nie zapiszesz. ODRZUĆ wraca do tego, co było zapisane."
  ru: "Ничего не действует, пока вы не сохраните. ОТМЕНИТЬ возвращает сохранённое."
  uk: "Ніщо не діє, доки ви не збережете. СКАСУВАТИ повертає збережене."
"Block":
  de: "Umlauf"
  fr: "Bloc"
  nl: "Omloop"
  pl: "Obieg"
  ru: "Выпуск"
  uk: "Випуск"
"Piece of work":
  de: "Dienststück"
  fr: "Partie de travail"
  nl: "Dienststuk"
  pl: "Część pracy"
  ru: "Часть работы"
  uk: "Частина роботи"
"Relief":
  de: "Ablösung"
  fr: "Relève"
  nl: "Aflossing"
  pl: "Zmiana kierowcy"
  ru: "Пересменка"
  uk: "Перезмінка"
"Sign-on and sign-off":
  de: "Dienstbeginn und Dienstende"
  fr: "Prise et fin de service"
  nl: "Aanmelden en afmelden"
  pl: "Rozpoczęcie i zakończenie"
  ru: "Явка и сдача"
  uk: "Явка і здача"
"Deadhead":
  de: "Leerfahrt"
  fr: "Haut-le-pied"
  nl: "Leegrit"
  pl: "Przejazd techniczny"
  ru: "Нулевой рейс"
  uk: "Нульовий рейс"
"Pull-out and pull-in":
  de: "Aus- und Einrücken"
  fr: "Sortie et rentrée au dépôt"
  nl: "Uitrukken en inrukken"
  pl: "Wyjazd i zjazd do zajezdni"
  ru: "Выезд и заезд в депо"
  uk: "Виїзд і заїзд у депо"
"Drop slot":
  de: "Ablageplatz"
  fr: "Emplacement de dépôt"
  nl: "Neerzetvak"
  pl: "Miejsce upuszczenia"
  ru: "Место для переноса"
  uk: "Місце для перенесення"
"Draft":
  de: "Entwurf"
  fr: "Brouillon"
  nl: "Concept"
  pl: "Szkic"
  ru: "Черновик"
  uk: "Чернетка"
"PVR":
  de: "Spitzenbedarf"
  fr: "Pointe"
  nl: "Piekbehoefte"
  pl: "Szczyt"
  ru: "Пиковый выпуск"
  uk: "Піковий випуск"
"Time band":
  de: "Zeitband"
  fr: "Tranche horaire"
  nl: "Tijdvak"
  pl: "Przedział czasu"
  ru: "Временной интервал"
  uk: "Часовий проміжок"
"Running time":
  de: "Fahrzeit"
  fr: "Temps de parcours"
  nl: "Rijtijd"
  pl: "Czas przejazdu"
  ru: "Время хода"
  uk: "Час руху"
"Issue":
  de: "Problem"
  fr: "Problème"
  nl: "Probleem"
  pl: "Problem"
  ru: "Проблема"
  uk: "Проблема"
"One run of a bus from one end of the line to the other, with passengers. Shown as a chip in the line's colour.":
  de: "Eine Fahrt eines Busses von einem Ende der Linie zum anderen, mit Fahrgästen. Dargestellt als Chip in der Farbe der Linie."
  fr: "Un trajet d'un bus d'un bout à l'autre de la ligne, avec voyageurs. Affiché comme une puce de la couleur de la ligne."
  nl: "Eén rit van een bus van het ene eind van de lijn naar het andere, met reizigers. Getoond als een chip in de kleur van de lijn."
  pl: "Jeden przejazd autobusu z jednego końca linii na drugi, z pasażerami. Pokazany jako kafelek w kolorze linii."
  ru: "Одна поездка автобуса от одного конца линии до другого, с пассажирами. Показана плашкой в цвете линии."
  uk: "Одна поїздка автобуса від одного кінця лінії до іншого, з пасажирами. Показана плашкою в кольорі лінії."
"The pointed end of a chip shows the way the trip runs: to the right is outbound, to the left inbound.":
  de: "Die Spitze eines Chips zeigt die Fahrtrichtung: nach rechts ist Hinfahrt, nach links Rückfahrt."
  fr: "La pointe d'une puce montre le sens de la course : vers la droite c'est l'aller, vers la gauche le retour."
  nl: "De punt van een chip toont de rijrichting: naar rechts is heen, naar links terug."
  pl: "Szpic kafelka pokazuje kierunek kursu: w prawo to kierunek tam, w lewo powrotny."
  ru: "Острый конец плашки показывает направление рейса: вправо — туда, влево — обратно."
  uk: "Гострий кінець плашки показує напрямок рейсу: праворуч — туди, ліворуч — назад."
"One bus's whole day: every trip it drives, from leaving the depot until it is back. Also called a vehicle schedule.":
  de: "Der ganze Tag eines Busses: jede Fahrt, die er fährt, von der Ausfahrt aus dem Betriebshof bis zur Rückkehr. Auch Fahrzeugumlauf genannt."
  fr: "Toute la journée d'un bus : chaque course qu'il fait, de la sortie du dépôt jusqu'à son retour. On dit aussi graphique de véhicule."
  nl: "De hele dag van één bus: elke rit die hij rijdt, van het verlaten van de remise tot hij terug is. Ook wel voertuigomloop genoemd."
  pl: "Cały dzień jednego autobusu: każdy kurs, który wykonuje, od wyjazdu z zajezdni do powrotu. Nazywany też planem pojazdu."
  ru: "Весь день одного автобуса: каждый его рейс от выезда из депо до возвращения. Ещё называется графиком машины."
  uk: "Увесь день одного автобуса: кожен його рейс від виїзду з депо до повернення. Ще називається графіком машини."
"One driver's working day, from sign-on to sign-off.":
  de: "Der Arbeitstag eines Fahrers, vom Dienstbeginn bis zum Dienstende."
  fr: "La journée de travail d'un conducteur, de la prise à la fin de service."
  nl: "De werkdag van één chauffeur, van aanmelden tot afmelden."
  pl: "Dzień pracy jednego kierowcy, od rozpoczęcia do zakończenia."
  ru: "Рабочий день одного водителя, от явки до сдачи."
  uk: "Робочий день одного водія, від явки до здачі."
"The part of a duty spent on one bus. A duty can have pieces on different buses.":
  de: "Der Teil eines Dienstes auf einem Bus. Ein Dienst kann Stücke auf verschiedenen Bussen haben."
  fr: "La partie d'un service passée sur un même bus. Un service peut avoir des parties sur différents bus."
  nl: "Het deel van een dienst op één bus. Een dienst kan stukken op verschillende bussen hebben."
  pl: "Część służby spędzona na jednym autobusie. Służba może mieć części na różnych autobusach."
  ru: "Часть смены на одном автобусе. У смены могут быть части на разных автобусах."
  uk: "Частина зміни на одному автобусі. Зміна може мати частини на різних автобусах."
"Where one driver hands the bus to the next: always at a terminus or at the depot (the relief point).":
  de: "Wo ein Fahrer den Bus an den nächsten übergibt: immer an einer Endhaltestelle oder am Betriebshof (dem Ablösepunkt)."
  fr: "Là où un conducteur passe le bus au suivant : toujours à un terminus ou au dépôt (le point de relève)."
  nl: "Waar een chauffeur de bus aan de volgende overdraagt: altijd bij een eindhalte of de remise (het aflospunt)."
  pl: "Miejsce, gdzie kierowca przekazuje autobus następnemu: zawsze na pętli lub w zajezdni (punkt zmiany)."
  ru: "Место, где водитель передаёт автобус следующему: всегда на конечной или в депо (пункт пересменки)."
  uk: "Місце, де водій передає автобус наступному: завжди на кінцевій або в депо (пункт перезмінки)."
"The start and the end of a duty, with a few minutes to check the bus.":
  de: "Anfang und Ende eines Dienstes, mit ein paar Minuten, um den Bus zu prüfen."
  fr: "Le début et la fin d'un service, avec quelques minutes pour vérifier le bus."
  nl: "Het begin en het eind van een dienst, met een paar minuten om de bus na te kijken."
  pl: "Początek i koniec służby, z kilkoma minutami na sprawdzenie autobusu."
  ru: "Начало и конец смены, с несколькими минутами на осмотр автобуса."
  uk: "Початок і кінець зміни, з кількома хвилинами на огляд автобуса."
"A bus driving without passengers, for example to where its next trip starts. An orange dot means its time is a guess.":
  de: "Ein Bus, der ohne Fahrgäste fährt, etwa dorthin, wo seine nächste Fahrt beginnt. Ein oranger Punkt heißt, die Zeit ist geschätzt."
  fr: "Un bus qui roule sans voyageurs, par exemple jusqu'au départ de sa course suivante. Un point orange signifie que sa durée est estimée."
  nl: "Een bus die zonder reizigers rijdt, bijvoorbeeld naar waar zijn volgende rit begint. Een oranje stip betekent dat de tijd geschat is."
  pl: "Autobus jadący bez pasażerów, np. tam, gdzie zaczyna się jego następny kurs. Pomarańczowa kropka oznacza, że czas jest szacowany."
  ru: "Автобус едет без пассажиров, например к началу следующего рейса. Оранжевая точка значит, что время примерное."
  uk: "Автобус їде без пасажирів, наприклад до початку наступного рейсу. Помаранчева крапка означає, що час приблизний."
"The bus leaving the depot in the morning and going back at night.":
  de: "Der Bus verlässt morgens den Betriebshof und kehrt abends zurück."
  fr: "Le bus qui quitte le dépôt le matin et y rentre le soir."
  nl: "De bus die 's ochtends de remise verlaat en 's avonds teruggaat."
  pl: "Autobus wyjeżdża rano z zajezdni i wraca do niej wieczorem."
  ru: "Автобус утром выезжает из депо и вечером возвращается."
  uk: "Автобус уранці виїжджає з депо й увечері повертається."
"The wait at the end of the line before the next trip.":
  de: "Die Wartezeit am Ende der Linie vor der nächsten Fahrt."
  fr: "L'attente au bout de la ligne avant la course suivante."
  nl: "Het wachten aan het eind van de lijn voor de volgende rit."
  pl: "Oczekiwanie na końcu linii przed następnym kursem."
  ru: "Ожидание на конечной перед следующим рейсом."
  uk: "Очікування на кінцевій перед наступним рейсом."
"A long unpaid break in the middle of a duty: the driver works early and again later.":
  de: "Eine lange unbezahlte Pause mitten im Dienst: Der Fahrer arbeitet früh und später noch einmal."
  fr: "Une longue pause non payée au milieu d'un service : le conducteur travaille tôt, puis de nouveau plus tard."
  nl: "Een lange onbetaalde pauze midden in een dienst: de chauffeur werkt vroeg en later opnieuw."
  pl: "Długa niepłatna przerwa w środku służby: kierowca pracuje rano i potem jeszcze raz później."
  ru: "Долгий неоплачиваемый перерыв посреди смены: водитель работает утром и снова позже."
  uk: "Довга неоплачувана перерва посеред зміни: водій працює вранці й знову пізніше."
"How a driver gets to the next bus: W walking, P by public transport, R by road in a company car.":
  de: "Wie ein Fahrer zum nächsten Bus kommt: W zu Fuß, P mit öffentlichen Verkehrsmitteln, R auf der Straße mit einem Dienstwagen."
  fr: "Comment un conducteur rejoint le bus suivant : W à pied, P en transports en commun, R par la route en voiture de service."
  nl: "Hoe een chauffeur bij de volgende bus komt: W lopend, P met het openbaar vervoer, R over de weg met een dienstauto."
  pl: "Jak kierowca dociera do następnego autobusu: W pieszo, P komunikacją publiczną, R drogą samochodem służbowym."
  ru: "Как водитель добирается до следующего автобуса: W пешком, P общественным транспортом, R по дороге на служебной машине."
  uk: "Як водій дістається до наступного автобуса: W пішки, P громадським транспортом, R дорогою службовою машиною."
"Where something picked up may go, with stars for how good it is: blue breaks no rule, red breaks one.":
  de: "Wohin etwas Aufgenommenes darf, mit Sternen dafür, wie gut es ist: Blau verletzt keine Regel, Rot eine."
  fr: "Là où peut aller ce que vous avez pris, avec des étoiles selon la qualité : le bleu n'enfreint aucune règle, le rouge en enfreint une."
  nl: "Waar iets opgepakts heen mag, met sterren voor hoe goed het is: blauw overtreedt geen regel, rood er wel een."
  pl: "Miejsce, gdzie może trafić to, co podniesiono, z gwiazdkami oceny: niebieskie nie łamie reguł, czerwone łamie jedną."
  ru: "Куда можно поставить взятое, со звёздами за качество: синее не нарушает правил, красное нарушает."
  uk: "Куди можна поставити взяте, із зірками за якість: синє не порушує правил, червоне порушує."
"Trips no bus drives yet. They wait above the rows until you give them a bus.":
  de: "Fahrten, die noch kein Bus fährt. Sie warten über den Zeilen, bis Sie ihnen einen Bus geben."
  fr: "Les courses qu'aucun bus n'assure encore. Elles attendent au-dessus des lignes jusqu'à ce que vous leur donniez un bus."
  nl: "Ritten die nog geen bus rijdt. Ze wachten boven de rijen tot je ze een bus geeft."
  pl: "Kursy, których jeszcze nie wykonuje żaden autobus. Czekają nad wierszami, aż dasz im autobus."
  ru: "Рейсы, которые пока не выполняет ни один автобус. Они ждут над строками, пока вы не дадите им автобус."
  uk: "Рейси, які поки не виконує жоден автобус. Вони чекають над рядками, доки ви не дасте їм автобус."
"A locked bus or duty stays as it is: OPTIMIZE and your other edits leave it alone.":
  de: "Ein gesperrter Bus oder Dienst bleibt, wie er ist: OPTIMIEREN und Ihre anderen Änderungen lassen ihn in Ruhe."
  fr: "Un bus ou un service verrouillé reste tel quel : OPTIMISER et vos autres modifications n'y touchent pas."
  nl: "Een vergrendelde bus of dienst blijft zoals hij is: OPTIMALISEREN en je andere wijzigingen laten hem met rust."
  pl: "Zablokowany autobus lub służba zostaje bez zmian: OPTYMALIZUJ i inne twoje zmiany ich nie ruszają."
  ru: "Заблокированный автобус или смена не меняются: ОПТИМИЗИРОВАТЬ и другие ваши правки их не трогают."
  uk: "Заблокований автобус чи зміна не змінюються: ОПТИМІЗУВАТИ та інші ваші правки їх не чіпають."
"Your changes before SAVE (orange dot). The game keeps running the saved planning (green dot) until you save.":
  de: "Ihre Änderungen vor dem SPEICHERN (oranger Punkt). Das Spiel fährt weiter die gespeicherte Planung (grüner Punkt), bis Sie speichern."
  fr: "Vos modifications avant ENREGISTRER (point orange). Le jeu continue d'appliquer la planification enregistrée (point vert) tant que vous n'enregistrez pas."
  nl: "Je wijzigingen vóór OPSLAAN (oranje stip). Het spel blijft de opgeslagen planning rijden (groene stip) tot je opslaat."
  pl: "Twoje zmiany przed ZAPISZ (pomarańczowa kropka). Gra dalej działa według zapisanego planu (zielona kropka), dopóki nie zapiszesz."
  ru: "Ваши изменения до СОХРАНИТЬ (оранжевая точка). Игра работает по сохранённому плану (зелёная точка), пока вы не сохраните."
  uk: "Ваші зміни до ЗБЕРЕГТИ (помаранчева крапка). Гра працює за збереженим планом (зелена крапка), доки ви не збережете."
"Peak vehicle requirement: the most buses out at the same time. That is how many buses the day needs.":
  de: "Spitzenbedarf an Fahrzeugen: die meisten Busse, die gleichzeitig unterwegs sind. So viele Busse braucht der Tag."
  fr: "Besoin en véhicules à la pointe : le plus grand nombre de bus en ligne en même temps. C'est le nombre de bus dont la journée a besoin."
  nl: "Piekbehoefte aan voertuigen: het grootste aantal bussen dat tegelijk onderweg is. Zoveel bussen heeft de dag nodig."
  pl: "Szczytowe zapotrzebowanie na pojazdy: najwięcej autobusów w trasie jednocześnie. Tyle autobusów potrzebuje dzień."
  ru: "Пиковая потребность в машинах: наибольшее число автобусов на линии одновременно. Столько автобусов нужно на день."
  uk: "Пікова потреба в машинах: найбільша кількість автобусів на лінії одночасно. Стільки автобусів потрібно на день."
"A part of the day with its own running times: the rush hour is often slower than the evening.":
  de: "Ein Teil des Tages mit eigenen Fahrzeiten: Die Hauptverkehrszeit ist oft langsamer als der Abend."
  fr: "Une partie de la journée avec ses propres temps de parcours : l'heure de pointe est souvent plus lente que le soir."
  nl: "Een deel van de dag met eigen rijtijden: het spitsuur is vaak trager dan de avond."
  pl: "Część dnia z własnymi czasami przejazdu: szczyt bywa wolniejszy niż wieczór."
  ru: "Часть дня со своим временем хода: в час пик автобусы часто идут медленнее, чем вечером."
  uk: "Частина дня зі своїм часом руху: у годину пік автобуси часто їдуть повільніше, ніж увечері."
"The minutes a bus needs from one stop to the next.":
  de: "Die Minuten, die ein Bus von einer Haltestelle zur nächsten braucht."
  fr: "Les minutes qu'il faut à un bus d'un arrêt au suivant."
  nl: "De minuten die een bus nodig heeft van de ene halte naar de volgende."
  pl: "Minuty potrzebne autobusowi od jednego przystanku do następnego."
  ru: "Минуты, нужные автобусу от одной остановки до следующей."
  uk: "Хвилини, потрібні автобусу від однієї зупинки до наступної."
"Every how many minutes a bus leaves: a headway of 10 minutes is six buses an hour.":
  de: "Alle wie viele Minuten ein Bus abfährt: Ein 10-Minuten-Takt sind sechs Busse pro Stunde."
  fr: "Toutes les combien de minutes un bus part : une fréquence de 10 minutes, c'est six bus par heure."
  nl: "Om de hoeveel minuten er een bus vertrekt: een interval van 10 minuten is zes bussen per uur."
  pl: "Co ile minut odjeżdża autobus: takt 10 minut to sześć autobusów na godzinę."
  ru: "Через сколько минут отправляется автобус: интервал 10 минут — это шесть автобусов в час."
  uk: "Через скільки хвилин вирушає автобус: інтервал 10 хвилин — це шість автобусів на годину."
"One version of a line's route: the full run, or a short one that leaves out stops.":
  de: "Eine Variante des Linienwegs: die ganze Strecke oder eine kurze, die Haltestellen auslässt."
  fr: "Une version du parcours d'une ligne : le trajet complet, ou un trajet court qui saute des arrêts."
  nl: "Eén versie van de route van een lijn: de hele rit, of een korte die haltes overslaat."
  pl: "Jedna wersja trasy linii: pełny przejazd albo krótki, pomijający przystanki."
  ru: "Один вариант маршрута линии: полный рейс или короткий, пропускающий остановки."
  uk: "Один варіант маршруту лінії: повний рейс або короткий, що пропускає зупинки."
"A rule that is broken, such as a duty without a meal break. Red is a hard rule, orange a soft one that costs a penalty.":
  de: "Eine verletzte Regel, etwa ein Dienst ohne Essenspause. Rot ist eine harte Regel, Orange eine weiche, die eine Strafe kostet."
  fr: "Une règle enfreinte, par exemple un service sans pause repas. Le rouge est une règle stricte, l'orange une règle souple qui coûte une pénalité."
  nl: "Een overtreden regel, zoals een dienst zonder maaltijdpauze. Rood is een harde regel, oranje een zachte die een boete kost."
  pl: "Złamana reguła, np. służba bez przerwy na posiłek. Czerwony to reguła twarda, pomarańczowy — miękka, za którą jest kara."
  ru: "Нарушенное правило, например смена без перерыва на обед. Красное — жёсткое правило, оранжевое — мягкое, за него штраф."
  uk: "Порушене правило, наприклад зміна без перерви на обід. Червоне — жорстке правило, помаранчеве — м'яке, за нього штраф."
