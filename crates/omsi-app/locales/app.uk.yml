"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Наскільки сильно автобус у русі повертає кермо в пряме положення після повороту; на місці кермо ніколи не тягне."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Наскільки кермо опирається швидкому руху, щоб відпущене кермо зупинялося в центрі, а не проскакувало його; збільште, якщо кермо розгойдується."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Наскільки важко крутити кермо, поки автобус стоїть або повзе; із рухом стає легше."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Піднімає найслабші зусилля вище порога, з якого ваше кермо починає їх передавати; корисно для пасових і шестеренчастих кермів із мертвою зоною в центрі, на direct drive залиште 0."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Згладжує різкі стрибки зусилля на кермі, які на потужних кермах за низької частоти кадрів відчуваються як зернистість; більші значення додають невелику затримку."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Загальна сила зусиль на цьому кермі; зменште на потужній базі direct drive, збільште на слабкому кермі."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Загальна сила трусіння, ударів об бордюр і тремтіння від дороги та двигуна на цьому кермі."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Вимк.: гра не передає керму жодних зусиль; залишковий опір створює власне програмне забезпечення драйвера керма (наприклад, центрувальна пружина в Logitech G HUB)"
