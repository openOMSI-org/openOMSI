"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "Perubahan berkuat kuasa apabila anda memandu seterusnya, atau selepas “Muat semula pengawal yang disimpan” dalam menu pengawal permainan."
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Sekuat mana bas yang bergerak memusingkan stereng kembali lurus selepas membelok; ia tidak menarik ketika bas berhenti."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Sejauh mana stereng menahan pergerakan pantas, supaya stereng yang dilepaskan berhenti di tengah dan tidak terlajak; naikkan jika stereng berayun."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Seberat mana stereng untuk dipusingkan ketika bas pegun atau merangkak; ia menjadi ringan apabila bas bergerak."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Menaikkan daya terkecil melepasi titik stereng anda mula merasainya; berguna pada stereng tali sawat dan gear yang mempunyai titik mati di tengah, biarkan 0 pada direct drive."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Melembutkan lonjakan mendadak dalam daya stereng yang boleh terasa kasar pada stereng berkuasa tinggi ketika kadar bingkai rendah; nilai lebih tinggi menambah sedikit kelewatan."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Kekuatan keseluruhan daya stereng pada stereng ini; turunkan pada tapak direct drive yang kuat, naikkan pada stereng yang lemah."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Kekuatan keseluruhan goncangan, hentakan bahu jalan serta getaran jalan dan enjin pada stereng ini."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Mati: permainan tidak menghantar sebarang daya kepada stereng; rintangan yang tinggal datang daripada perisian pemacu stereng itu sendiri (contohnya spring pemusat dalam Logitech G HUB)"
"The running engine buzzes in the wheel, felt even at a standstill": "Enjin yang hidup berdengung dalam stereng, terasa walaupun ketika pegun"
