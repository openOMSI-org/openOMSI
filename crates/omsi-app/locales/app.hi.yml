"the host runs LAN protocol {PROTOCOL}, your game an older one - both players need the same version of the game": "होस्ट LAN प्रोटोकॉल {PROTOCOL} चलाता है, आपका गेम पुराना - दोनों खिलाड़ियों को गेम का एक ही वर्ज़न चाहिए"
"the host runs LAN protocol {PROTOCOL}, your game protocol {proto} - both players need the same version of the game": "होस्ट LAN प्रोटोकॉल {PROTOCOL} चलाता है, आपका गेम प्रोटोकॉल {proto} - दोनों खिलाड़ियों को गेम का एक ही वर्ज़न चाहिए"
