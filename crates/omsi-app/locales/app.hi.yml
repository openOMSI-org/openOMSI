"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "बदलाव अगली बार गाड़ी चलाने पर, या गेम के कंट्रोलर मेनू में “सहेजे गए कंट्रोलर फिर से लोड करें” के बाद लागू होंगे।"
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "चलती बस मोड़ के बाद स्टीयरिंग व्हील को कितनी ताकत से वापस सीधा करती है; बस रुकी होने पर यह कभी नहीं खींचता।"
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "स्टीयरिंग व्हील तेज़ हरकत का कितना विरोध करता है, ताकि छोड़ा गया व्हील बीच से आगे झूलने के बजाय बीच में ठहर जाए; व्हील डोलता रहे तो इसे बढ़ाएँ।"
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "बस रुकी हो या रेंग रही हो तब स्टीयरिंग व्हील घुमाना कितना भारी है; बस चलने लगे तो यह हल्का होता जाता है।"
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "सबसे छोटे बलों को उस बिंदु से ऊपर उठाता है जहाँ से आपका व्हील उन्हें महसूस कराने लगता है; बीच में डेड सेंटर वाले बेल्ट और गियर व्हील पर उपयोगी, डायरेक्ट ड्राइव पर 0 रहने दें।"
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "स्टीयरिंग बल में अचानक आने वाले उछालों को नरम करता है, जो कम फ़्रेम रेट पर ताकतवर व्हील में खुरदुरे लग सकते हैं; ऊँचे मान थोड़ी देरी जोड़ते हैं।"
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "इस व्हील पर स्टीयरिंग बलों की कुल ताकत; ताकतवर डायरेक्ट-ड्राइव बेस पर इसे घटाएँ, कमज़ोर व्हील पर बढ़ाएँ।"
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "इस व्हील पर झटकों, कर्ब से टकराने और सड़क व इंजन की थरथराहट की कुल ताकत।"
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "बंद: गेम व्हील को कोई बल नहीं भेजता; बचा हुआ कोई भी प्रतिरोध व्हील के अपने ड्राइवर सॉफ़्टवेयर से आता है (उदाहरण के लिए Logitech G HUB में सेंटर स्प्रिंग)"
"The running engine buzzes in the wheel, felt even at a standstill": "चलता इंजन व्हील में भिनभिनाता है, जो खड़े रहने पर भी महसूस होता है"
