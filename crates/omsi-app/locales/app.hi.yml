"the entry '{t}' is neither a session code (OMSI-…), an address nor a port, and no computer of that name was found ({e})": "एंट्री '{t}' न सेशन कोड है (OMSI-…), न पता, न पोर्ट, और इस नाम का कोई कंप्यूटर नहीं मिला ({e})"
