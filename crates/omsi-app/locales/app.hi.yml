"Manage your current room or join a multiplayer game.": "अपने मौजूदा कमरे को प्रबंधित करें या मल्टीप्लेयर गेम में शामिल हों।"
"Join room": "कमरे में शामिल हों"
"Current room": "मौजूदा कमरा"
"Closing this window keeps your current room connected.": "इस विंडो को बंद करने पर मौजूदा कमरे का कनेक्शन बना रहता है।"
"Manage your current room connection.": "अपने मौजूदा कमरे के कनेक्शन को प्रबंधित करें।"
"Leaving closes your hosted room for all other players.": "आपके जाने पर आपके बनाए कमरे को अन्य सभी खिलाड़ियों के लिए बंद कर दिया जाएगा।"
"NVIDIA DLSS runtime (optional)": "NVIDIA DLSS रनटाइम (वैकल्पिक)"
"Not included with openOMSI. Installs NVIDIA's own DLLs only after your approval. Windows, NVIDIA RTX and a game restart required.": "openOMSI में शामिल नहीं। NVIDIA की अपनी DLL केवल आपकी स्वीकृति के बाद इंस्टॉल होती हैं। Windows, NVIDIA RTX और गेम को फिर से शुरू करना आवश्यक है।"
"Checking NVIDIA DLSS files…": "NVIDIA DLSS फ़ाइलें जाँची जा रही हैं…"
"NVIDIA DLSS runtime is installed.": "NVIDIA DLSS रनटाइम इंस्टॉल है।"
"DLSS files are not installed. The game works without them.": "DLSS फ़ाइलें इंस्टॉल नहीं हैं। गेम इनके बिना भी चलता है।"
"NVIDIA RTX/NGX license": "NVIDIA RTX/NGX लाइसेंस"
"Streamline MIT license": "Streamline MIT लाइसेंस"
"View official NVIDIA SDK 2.14.1": "आधिकारिक NVIDIA SDK 2.14.1 देखें"
"I have read and agree to NVIDIA's applicable Streamline and RTX/NGX license terms. The launcher will download the SDK directly from NVIDIA and install the four verified DLSS DLLs plus notices.": "मैंने Streamline और RTX/NGX की लागू NVIDIA लाइसेंस शर्तें पढ़ ली हैं और उनसे सहमत हूँ। लॉन्चर SDK सीधे NVIDIA से डाउनलोड करेगा और चार सत्यापित DLSS DLL तथा सूचनाएँ इंस्टॉल करेगा।"
"Downloading and verifying NVIDIA DLSS…": "NVIDIA DLSS डाउनलोड और सत्यापित हो रहा है…"
"Install NVIDIA DLSS": "NVIDIA DLSS इंस्टॉल करें"
"NVIDIA DLSS installed. Restarting the launcher to refresh available upscalers.": "NVIDIA DLSS इंस्टॉल हो गया। उपलब्ध अपस्केलर ताज़ा करने के लिए लॉन्चर फिर से शुरू हो रहा है।"
"The NVIDIA runtime was not found after installation": "इंस्टॉल के बाद NVIDIA रनटाइम नहीं मिला"
"Standard Catmull-Rom or AMD FSR 1; changes show at once": "मानक Catmull-Rom या AMD FSR 1; बदलाव तुरंत दिखते हैं"
"Discord: the map": "Discord: मैप"
"Discord: the bus": "Discord: बस"
"Discord: the line and tour": "Discord: लाइन और टूर"
