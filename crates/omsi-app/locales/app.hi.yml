"the entry '{t}' is neither a session code (OMSI-…), an address (192.168.1.20 or 192.168.1.20:27015) nor a port": "एंट्री '{t}' न सेशन कोड है (OMSI-…), न पता (192.168.1.20 या 192.168.1.20:27015), न पोर्ट"
