"Enhanced: the clouds' shadow moving over the land and the sun's shafts through the gaps of a broken sky": "Enhanced: senka oblaka koja se kreće preko terena i sunčevi zraci kroz proreze rascepkanog neba"
"Enhanced: the glare round bright lights and the lamps' halo in the night air": "Enhanced: sjaj oko jakih svetala i oreol lampi u noćnom vazduhu"
