"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS ga ne sadrži. U režimu radne površine, u Konsole: sudo steamos-readonly disable, zatim sudo pacman -S webkit2gtk-4.1, zatim sudo steamos-readonly enable (ažuriranje SteamOS-a može ponovo da ga ukloni). Pogledajte docs/USER_GUIDE.md."
