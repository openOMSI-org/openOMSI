"The wheel is unavailable. Reconnect it and try again.": "Točak je nedostupan. Ponovo ga povežite i pokušajte ponovo."
"Move the wheel away from its end stops and try again.": "Pomerite točak od njegovih krajnjih graničnika i pokušajte ponovo."
