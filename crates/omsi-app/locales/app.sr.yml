"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Koliko snažno autobus u vožnji vraća volan u pravac posle krivine; dok autobus stoji, nikad ne vuče."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Koliko se volan opire brzom pokretu, da bi se pušten volan smirio u sredini umesto da preleti preko nje; povećajte ako volan osciluje."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Koliko je volan težak za okretanje dok autobus stoji ili puzi; olakšava se kad autobus krene."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Podiže najmanje sile iznad tačke od koje ih volan počinje osećati; korisno kod volana sa kaišem ili zupčanicima koji imaju mrtvu sredinu, kod direct drive ostavite 0."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Ublažava nagle skokove upravljačke sile koji se na jakim volanima pri niskom broju sličica u sekundi mogu osećati zrnasto; veće vrednosti dodaju malo kašnjenja."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Ukupna jačina upravljačkih sila na ovom volanu; smanjite je na jakoj direct drive bazi, povećajte na slabom volanu."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Ukupna jačina potresa, udaraca o ivičnjak i podrhtavanja puta i motora na ovom volanu."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Isključeno: igra volanu ne šalje nikakve sile; preostali otpor dolazi iz upravljačkog softvera samog volana (na primer opruga za centriranje u Logitech G HUB)"
