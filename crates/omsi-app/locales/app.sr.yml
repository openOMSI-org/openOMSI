"The wheel moved too far. Test stopped.": "Točak se pomerio predaleko. Test je zaustavljen."
"The result is inconclusive. Retry or choose the direction manually.": "Rezultat je neubedljiv. Pokušajte ponovo ili ručno izaberite pravac."
"Force feedback is unavailable. Choose the direction manually.": "Povratna sila nije dostupna. Ručno izaberite smer."
