_version: 2
# The bus company's start: the play mode, then the company.
"How do you want to play?":
  de: "Wie möchtest du spielen?"
  fr: "Comment veux-tu jouer ?"
  nl: "Hoe wil je spelen?"
  pl: "Jak chcesz grać?"
  ru: "Как вы хотите играть?"
  uk: "Як ви хочете грати?"
"Your own company in a time of its own, or one run together with others.":
  de: "Dein eigenes Unternehmen in seiner eigenen Zeit, oder eines, das du mit anderen führst."
  fr: "Ta propre entreprise dans son propre temps, ou une entreprise menée avec d'autres."
  nl: "Je eigen bedrijf in een eigen tijd, of een bedrijf dat je samen met anderen runt."
  pl: "Własna firma we własnym czasie albo firma prowadzona razem z innymi."
  ru: "Собственная компания в своём времени или компания, которой вы управляете вместе с другими."
  uk: "Власна компанія у своєму часі або компанія, якою ви керуєте разом з іншими."
"Singleplayer":
  de: "Einzelspieler"
  fr: "Solo"
  nl: "Singleplayer"
  pl: "Gra jednoosobowa"
  ru: "Одиночная игра"
  uk: "Одиночна гра"
"Found and run your own companies, in a time of their own that runs while you play.":
  de: "Gründe und führe deine eigenen Unternehmen, in einer eigenen Zeit, die beim Spielen weiterläuft."
  fr: "Fonde et dirige tes propres entreprises, dans un temps à elles qui avance pendant que tu joues."
  nl: "Richt je eigen bedrijven op en run ze, in een eigen tijd die doorloopt terwijl je speelt."
  pl: "Zakładaj i prowadź własne firmy, we własnym czasie, który płynie podczas gry."
  ru: "Основывайте свои компании и управляйте ими в их собственном времени, которое идёт, пока вы играете."
  uk: "Засновуйте власні компанії та керуйте ними у їхньому власному часі, що йде, поки ви граєте."
"Run a company together on a server: an owner, planners and drivers who take its duties.":
  de: "Führt gemeinsam ein Unternehmen auf einem Server: ein Inhaber, Planer und Fahrer, die seine Dienste übernehmen."
  fr: "Dirigez ensemble une entreprise sur un serveur : un propriétaire, des planificateurs et des conducteurs qui prennent ses services."
  nl: "Run samen een bedrijf op een server: een eigenaar, planners en chauffeurs die de diensten rijden."
  pl: "Prowadźcie razem firmę na serwerze: właściciel, planiści i kierowcy, którzy biorą jej służby."
  ru: "Управляйте компанией вместе на сервере: владелец, планировщики и водители, которые берут её смены."
  uk: "Керуйте компанією разом на сервері: власник, планувальники та водії, які беруть її зміни."
"Coming later":
  de: "Kommt später"
  fr: "Bientôt"
  nl: "Komt later"
  pl: "Wkrótce"
  ru: "Скоро"
  uk: "Згодом"
"Multiplayer companies come in a later version.":
  de: "Mehrspieler-Unternehmen kommen in einer späteren Version."
  fr: "Les entreprises multijoueur arrivent dans une version ultérieure."
  nl: "Multiplayer-bedrijven komen in een latere versie."
  pl: "Firmy wieloosobowe pojawią się w późniejszej wersji."
  ru: "Многопользовательские компании появятся в следующей версии."
  uk: "Багатокористувацькі компанії з'являться в наступній версії."
"1 company on this computer":
  de: "1 Unternehmen auf diesem Computer"
  fr: "1 entreprise sur cet ordinateur"
  nl: "1 bedrijf op deze computer"
  pl: "1 firma na tym komputerze"
  ru: "1 компания на этом компьютере"
  uk: "1 компанія на цьому комп'ютері"
"%{n} companies on this computer":
  de: "%{n} Unternehmen auf diesem Computer"
  fr: "%{n} entreprises sur cet ordinateur"
  nl: "%{n} bedrijven op deze computer"
  pl: "Firmy na tym komputerze: %{n}"
  ru: "Компаний на этом компьютере: %{n}"
  uk: "Компаній на цьому комп'ютері: %{n}"
"Play mode":
  de: "Spielmodus"
  fr: "Mode de jeu"
  nl: "Speelmodus"
  pl: "Tryb gry"
  ru: "Режим игры"
  uk: "Режим гри"
"Found your first company":
  de: "Gründe dein erstes Unternehmen"
  fr: "Fonde ta première entreprise"
  nl: "Richt je eerste bedrijf op"
  pl: "Załóż swoją pierwszą firmę"
  ru: "Основайте свою первую компанию"
  uk: "Заснуйте свою першу компанію"
"You have no company yet: give it a name, colours, a map and a depot.":
  de: "Du hast noch kein Unternehmen: gib ihm einen Namen, Farben, eine Karte und einen Betriebshof."
  fr: "Tu n'as pas encore d'entreprise : donne-lui un nom, des couleurs, une carte et un dépôt."
  nl: "Je hebt nog geen bedrijf: geef het een naam, kleuren, een kaart en een remise."
  pl: "Nie masz jeszcze firmy: nadaj jej nazwę, kolory, mapę i zajezdnię."
  ru: "У вас ещё нет компании: дайте ей название, цвета, карту и депо."
  uk: "У вас ще немає компанії: дайте їй назву, кольори, карту та депо."
"Choose the company to open, or found a new one.":
  de: "Wähle das Unternehmen, das du öffnen willst, oder gründe ein neues."
  fr: "Choisis l'entreprise à ouvrir, ou fonde-en une nouvelle."
  nl: "Kies het bedrijf dat je wilt openen, of richt een nieuw bedrijf op."
  pl: "Wybierz firmę do otwarcia albo załóż nową."
  ru: "Выберите компанию, которую хотите открыть, или основайте новую."
  uk: "Виберіть компанію, яку хочете відкрити, або заснуйте нову."
"New company":
  de: "Neues Unternehmen"
  fr: "Nouvelle entreprise"
  nl: "Nieuw bedrijf"
  pl: "Nowa firma"
  ru: "Новая компания"
  uk: "Нова компанія"
"Its name, colours, map and depot":
  de: "Name, Farben, Karte und Betriebshof"
  fr: "Son nom, ses couleurs, sa carte et son dépôt"
  nl: "Naam, kleuren, kaart en remise"
  pl: "Nazwa, kolory, mapa i zajezdnia"
  ru: "Название, цвета, карта и депо"
  uk: "Назва, кольори, карта та депо"
"Other company":
  de: "Anderes Unternehmen"
  fr: "Autre entreprise"
  nl: "Ander bedrijf"
  pl: "Inna firma"
  ru: "Другая компания"
  uk: "Інша компанія"
"Delete this company":
  de: "Dieses Unternehmen löschen"
  fr: "Supprimer cette entreprise"
  nl: "Dit bedrijf verwijderen"
  pl: "Usuń tę firmę"
  ru: "Удалить эту компанию"
  uk: "Видалити цю компанію"
