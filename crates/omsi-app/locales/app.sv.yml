"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Hur starkt den rullande bussen vrider tillbaka ratten till rakt fram efter en sväng; den drar aldrig när bussen står still."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Hur mycket ratten motstår snabba rörelser, så att en släppt ratt stannar i mitten i stället för att svänga förbi; höj om ratten pendlar."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Hur tungt ratten går att vrida när bussen står still eller kryper; den lättar när bussen rullar."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Lyfter de minsta krafterna över den punkt där din ratt börjar kännas; användbart på rem- och kugghjulsrattar med ett dött centrum, lämna på 0 med direktdrift."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Mjukar upp plötsliga hopp i styrkraften som kan kännas korniga på starka rattar vid låg bildfrekvens; högre värden ger lite fördröjning."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Den totala styrkan hos styrkrafterna på den här ratten; sänk den på en stark direktdriven bas, höj den på en svag ratt."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Den totala styrkan hos skakningar, kantstensstötar och vägens och motorns darrningar på den här ratten."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Av: spelet skickar inga krafter till ratten; eventuellt kvarvarande motstånd kommer från rattens egen drivrutinsprogramvara (till exempel centreringsfjädern i Logitech G HUB)"
"The running engine buzzes in the wheel, felt even at a standstill": "Den gående motorn surrar i ratten, kännbart även vid stillastående"
"On foot: W A S D walk, Shift runs, F4 free camera / F1 back, G sits down (by the driver's place: back at the wheel), Ctrl+Shift+G steps out of the bus": "Till fots: W A S D går, Shift springer, F4 fri kamera / F1 tillbaka, G sätter dig (vid förarplatsen: tillbaka vid ratten), Ctrl+Shift+G går ut ur bussen"
