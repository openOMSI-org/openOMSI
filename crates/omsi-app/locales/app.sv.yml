"openOMSI {version} does not start on this computer, and it could not heal itself.\n\nDownload the latest version: {url}\n\nThe start's log: {log}\nTo report it, attach a support package: openomsi --export-diagnostics support.json": "openOMSI {version} startar inte på den här datorn och kunde inte laga sig självt.\n\nLadda ned den senaste versionen: {url}\n\nStartens logg: {log}\nFör att rapportera det, bifoga ett supportpaket: openomsi --export-diagnostics support.json"
"Open the download page": "Öppna nedladdningssidan"
"OK": "OK"
"Open the download page now?": "Öppna nedladdningssidan nu?"
"The openOMSI launcher ({launcher}) was not found. It belongs in the same folder as the game ({folder}).\n\nPlease download openOMSI again and keep all of its files together.": "openOMSI-startprogrammet ({launcher}) hittades inte. Det ska ligga i samma mapp som spelet ({folder}).\n\nLadda ned openOMSI igen och håll ihop alla dess filer."
"The openOMSI launcher ({launcher}) could not be started: {why}.": "openOMSI-startprogrammet ({launcher}) kunde inte startas: {why}."
