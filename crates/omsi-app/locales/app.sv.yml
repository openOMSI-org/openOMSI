"Microsoft Edge WebView2 {version} is registered on this Windows, but its files are missing (removed by a clean-up tool?). Repair it: Settings > Apps > Installed apps > Microsoft Edge WebView2 Runtime > Modify > Repair, or install Microsoft's \"Evergreen Standalone Installer\" from https://developer.microsoft.com/microsoft-edge/webview2/": "Microsoft Edge WebView2 {version} är registrerat i det här Windows, men dess filer saknas (borttagna av ett rensningsverktyg?). Reparera det: Inställningar > Appar > Installerade appar > Microsoft Edge WebView2 Runtime > Ändra > Reparera, eller installera Microsofts \"Evergreen Standalone Installer\" från https://developer.microsoft.com/microsoft-edge/webview2/"
"Its log says: {error}": "Loggen säger: {error}"
"Microsoft Edge WebView2 {version} is installed, so it is not missing.": "Microsoft Edge WebView2 {version} är installerat, så det saknas inte."
"The openOMSI launcher shows its window with Microsoft Edge WebView2, which this Windows does not have yet.\n\nInstall it now with Microsoft's installer?": "openOMSI-startprogrammet visar sitt fönster med Microsoft Edge WebView2, som det här Windows inte har än.\n\nInstallera det nu med Microsofts installationsprogram?"
"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "Loggen finns i openOMSI:s datamapp (launcher.log); Microsoft Edge WebView2 {version} är installerat."
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "Startprogrammets fönster behöver Microsoft Edge WebView2 (ingår i Windows 10 och 11; för äldre system: https://developer.microsoft.com/microsoft-edge/webview2/)."
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS innehåller det inte. I skrivbordsläget, i Konsole: sudo steamos-readonly disable, sedan sudo pacman -S webkit2gtk-4.1, sedan sudo steamos-readonly enable (en SteamOS-uppdatering kan ta bort det igen). Se docs/USER_GUIDE.md."
