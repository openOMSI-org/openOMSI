"Wheels with a saved direction use their own setting under Controls → Game controllers.": "Les volants dont le sens est enregistré gardent leur propre réglage sous Commandes → Contrôleurs de jeu."
"INJURY RISK: TAKE YOUR HANDS OFF THE WHEEL. Keep hands and fingers clear before starting and throughout the test.": "RISQUE DE BLESSURE : LÂCHEZ LE VOLANT. Gardez les mains et les doigts à l'écart avant de commencer et pendant tout le test."
"Start test": "Lancer le test"
"Test strength": "Force du test"
"If the wheel barely moves, increase Test strength and retry. Keep your hands clear.": "Si le volant bouge, augmentez la force du test et réessayez. Gardez les mains à l'écart, risque de blessure."
"The wheel did not move enough. Retry or choose the direction manually.": "Le volant n'a pas assez bougé. Réessayez ou choisissez le sens manuellement."
"Direction detected: normal": "Sens détecté : normal"
"Direction detected: inverted": "Sens détecté : inversé"
"Testing: keep your hands off the wheel...": "Test en cours : ne touchez pas le volant..."
"If detection is inconclusive, retry or choose the direction manually. You can change it later on this device's page.": "Si la détection n'est pas concluante, réessayez ou choisissez le sens manuellement. Vous pourrez le changer plus tard sur la page de ce périphérique."
"The test was interrupted. Please try again.": "Le test a été interrompu. Veuillez réessayer."
"The wheel is unavailable. Reconnect it and try again.": "Le volant est indisponible. Reconnectez-le et réessayez."
"Move the wheel away from its end stops and try again.": "Éloignez le volant de ses butées et réessayez."
"The wheel did not settle. Let go and try again.": "Le volant ne s'est pas stabilisé. Lâchez-le et réessayez."
"The wheel moved too far. Test stopped.": "Le volant a trop tourné. Test arrêté."
"The result is inconclusive. Retry or choose the direction manually.": "Le résultat n'est pas concluant. Réessayez ou choisissez le sens manuellement."
"Force feedback is unavailable. Choose the direction manually.": "Le retour de force est indisponible. Choisissez le sens manuellement."
