"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "La fenêtre du lanceur a besoin de Microsoft Edge WebView2 (inclus dans Windows 10 et 11 ; pour les systèmes plus anciens : https://developer.microsoft.com/microsoft-edge/webview2/)."
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS ne l'inclut pas. En mode Bureau, dans Konsole : sudo steamos-readonly disable, puis sudo pacman -S webkit2gtk-4.1, puis sudo steamos-readonly enable (une mise à jour de SteamOS peut le supprimer à nouveau). Voir docs/USER_GUIDE.md."
