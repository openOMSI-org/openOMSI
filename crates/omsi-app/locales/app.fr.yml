"Enhanced: the clouds' shadow moving over the land and the sun's shafts through the gaps of a broken sky": "Enhanced : l'ombre des nuages qui défile sur le paysage et les rayons du soleil dans les trouées d'un ciel fragmenté"
"Enhanced: the glare round bright lights and the lamps' halo in the night air": "Enhanced : l'éblouissement autour des lumières vives et le halo des lampes dans l'air de la nuit"
"Sets the graphics mode and most of the options at once, from Low (Vanilla) to Ultra (Enhanced with everything on)": "Règle le mode graphique et la plupart des options en une fois, de « Faible » (Vanilla) à « Ultra » (Enhanced avec tout activé)"
