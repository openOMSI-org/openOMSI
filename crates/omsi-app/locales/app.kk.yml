"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Ең әлсіз күштерді рульіңіз оларды сезе бастайтын шектен жоғары көтереді; ортасында өлі аймағы бар белдікті және тісті доңғалақты рульдерге пайдалы, direct drive үшін 0 қалдырыңыз."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Кадр жиілігі төмен болғанда қуатты рульдерде түйіршіктей сезілетін руль күшінің кенет секірістерін жұмсартады; жоғары мәндер шамалы кідіріс қосады."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Осы рульдегі руль күштерінің жалпы қуаты; қуатты direct drive базасында азайтыңыз, әлсіз рульде арттырыңыз."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Осы рульдегі шайқалу, жиекке соғылу және жол мен қозғалтқыш дірілінің жалпы күші."
