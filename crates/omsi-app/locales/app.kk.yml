"The folder {root} is not a complete OMSI 2 - it lacks {}. openOMSI plays on the original's stock content: choose the folder of a complete installation under Setup.": "{root} қалтасы толық OMSI 2 емес - онда {} жоқ. openOMSI түпнұсқаның стандартты мазмұнымен ойнайды: Орнату бөлімінде толық орнатылым қалтасын таңдаңыз."
"No depot bus {id}": "{id} депо автобусы жоқ"
