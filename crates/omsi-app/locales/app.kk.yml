"openOMSI is installed by the store here": "мұнда openOMSI дүкен арқылы орнатылған"
"No version is installed yet.": "Әзірге ешбір нұсқа орнатылмаған."
"that player has left": "бұл ойыншы шығып кетті"
"that player is no longer here: number taken by another connection ({now}); refresh the list": "бұл ойыншы енді мұнда жоқ: нөмірін басқа қосылым алды ({now}); тізімді жаңартыңыз"
"openOMSI {from} could not start on this computer.\n\nIt has updated itself to {to} and starts again now.": "openOMSI {from} бұл компьютерде іске қосылмады.\n\nОл өздігінен {to} нұсқасына жаңартылды және қазір қайта іске қосылады."
"openOMSI {from} could not start on this computer.\n\nIt went back to {to}, which ran here, and starts again now. {from} will not be installed again, only a newer version.": "openOMSI {from} бұл компьютерде іске қосылмады.\n\nОл мұнда жұмыс істеген {to} нұсқасына қайтты және қазір қайта іске қосылады. {from} қайта орнатылмайды, тек жаңарақ нұсқа орнатылады."
"The project lists openOMSI {from} as broken.\n\nIt was replaced by {to} and starts again now.": "Жоба openOMSI {from} нұсқасын ақаулы деп белгіледі.\n\nОл {to} нұсқасымен ауыстырылды және қазір қайта іске қосылады."
"The project lists openOMSI {from} as broken: {why}.\n\nIt was replaced by {to} and starts again now.": "Жоба openOMSI {from} нұсқасын ақаулы деп белгіледі: {why}.\n\nОл {to} нұсқасымен ауыстырылды және қазір қайта іске қосылады."
"openOMSI {version} could not start on this computer, and there is no newer or earlier version for it yet.\n\nIt tries once more in safe mode (simple graphics, no plugins).": "openOMSI {version} бұл компьютерде іске қосылмады, ал оған әзірге жаңарақ не ертерек нұсқа жоқ.\n\nОл қауіпсіз режимде (қарапайым графика, плагиндерсіз) тағы бір рет іске қосылып көреді."
"openOMSI {version} does not start on this computer, and it could not heal itself.\n\nDownload the latest version: {url}\n\nThe start's log: {log}\nTo report it, attach a support package: openomsi --export-diagnostics support.json": "openOMSI {version} бұл компьютерде іске қосылмайды және өзін қалпына келтіре алмады.\n\nСоңғы нұсқаны жүктеп алыңыз: {url}\n\nІске қосу журналы: {log}\nХабарлау үшін қолдау пакетін тіркеңіз: openomsi --export-diagnostics support.json"
"Open the download page": "Жүктеп алу бетін ашу"
"OK": "OK"
"Open the download page now?": "Жүктеп алу бетін қазір ашу керек пе?"
"The openOMSI launcher ({launcher}) was not found. It belongs in the same folder as the game ({folder}).\n\nPlease download openOMSI again and keep all of its files together.": "openOMSI лаунчері ({launcher}) табылмады. Ол ойынмен бір қалтада ({folder}) болуы керек.\n\nopenOMSI-ді қайта жүктеп алып, оның барлық файлдарын бірге сақтаңыз."
"The openOMSI launcher ({launcher}) could not be started: {why}.": "openOMSI лаунчерін ({launcher}) іске қосу мүмкін болмады: {why}."
"The openOMSI launcher ({launcher}) stopped right after it started ({why}).": "openOMSI лаунчері ({launcher}) іске қосылған бойда тоқтады ({why})."
"Microsoft Edge WebView2 {version} is registered on this Windows, but its files are missing (removed by a clean-up tool?). Repair it: Settings > Apps > Installed apps > Microsoft Edge WebView2 Runtime > Modify > Repair, or install Microsoft's \"Evergreen Standalone Installer\" from https://developer.microsoft.com/microsoft-edge/webview2/": "Microsoft Edge WebView2 {version} осы Windows жүйесінде тіркелген, бірақ оның файлдары жоқ (тазалау құралы жойған ба?). Оны жөндеңіз: Параметрлер > Қолданбалар > Орнатылған қолданбалар > Microsoft Edge WebView2 Runtime > Өзгерту > Жөндеу, немесе Microsoft-тың \"Evergreen Standalone Installer\" орнатқышын https://developer.microsoft.com/microsoft-edge/webview2/ сайтынан орнатыңыз"
"Its log says: {error}": "Оның журналында: {error}"
"Microsoft Edge WebView2 {version} is installed, so it is not missing.": "Microsoft Edge WebView2 {version} орнатылған, яғни ол жоқ емес."
"The openOMSI launcher shows its window with Microsoft Edge WebView2, which this Windows does not have yet.\n\nInstall it now with Microsoft's installer?": "openOMSI лаунчері терезесін Microsoft Edge WebView2 арқылы көрсетеді, ал бұл Windows жүйесінде ол әлі жоқ.\n\nОны қазір Microsoft орнатқышымен орнату керек пе?"
"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "Оның журналы openOMSI деректер қалтасында (launcher.log); Microsoft Edge WebView2 {version} орнатылған."
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "Лаунчер терезесіне Microsoft Edge WebView2 керек (Windows 10 және 11 құрамында бар; ескі жүйелер үшін: https://developer.microsoft.com/microsoft-edge/webview2/)."
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS құрамында ол жоқ. Desktop Mode режимінде, Konsole ішінде: sudo steamos-readonly disable, содан кейін sudo pacman -S webkit2gtk-4.1, содан кейін sudo steamos-readonly enable (SteamOS жаңартуы оны қайта жоюы мүмкін). docs/USER_GUIDE.md қараңыз."
"this code was made by a game with LAN protocol {}, this one speaks {PROTOCOL} - both players need the same version": "бұл кодты LAN хаттамасы {} ойын жасаған, ал бұл ойын {PROTOCOL} хаттамасын пайдаланады - екі ойыншыға да бірдей нұсқа керек"
