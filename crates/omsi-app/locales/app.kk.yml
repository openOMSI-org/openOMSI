"the entry '{t}': the part after ':' must be a port (1 to 65535)": "'{t}' жазбасы: ':' белгісінен кейінгі бөлік порт (1-ден 65535-ке дейін) болуы керек"
"the entry '{t}' is neither a session code (OMSI-…), an address (192.168.1.20 or 192.168.1.20:27015) nor a port": "'{t}' жазбасы сессия коды (OMSI-…), мекенжай (192.168.1.20 немесе 192.168.1.20:27015) немесе порт емес"
"the computer {host} has no IPv4 address": "{host} компьютерінде IPv4 мекенжайы жоқ"
"the entry '{t}' is neither a session code (OMSI-…), an address nor a port, and no computer of that name was found ({e})": "'{t}' жазбасы сессия коды (OMSI-…), мекенжай немесе порт емес, және мұндай атпен компьютер табылмады ({e})"
"a session code has {} characters after OMSI- (this one has {n}) - copy the whole code": "сессия кодында OMSI- кейін {} таңба болады (бұл кодта {n}) - кодты толық көшіріңіз"
