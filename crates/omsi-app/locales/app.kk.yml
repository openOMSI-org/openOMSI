"the host drives on {}, you on {} - you will not meet": "хост {} картасында, сіз {} картасында жүрсіз - кездеспейсіз"
"the host has not answered for {:.0} s - the session is over (playing on alone; still trying, or type /reconnect)": "хост {:.0} с бойы жауап бермеді - сессия аяқталды (жалғыз ойнап жатырсыз; әлі де әрекет жасалуда, немесе /reconnect деп теріңіз)"
"the address {} answers, but no session runs on port {port} there - check the port, or whether the host has started its game": "{} мекенжайы жауап береді, бірақ ондағы {port} портында сессия жүріп жатқан жоқ - портты немесе хост ойынын іске қосқанын тексеріңіз"
"the host did not answer (another computer did: {r})": "хост жауап бермеді (басқа компьютер жауап берді: {r})"
"no answer from {} within {:.0} s. Is the session still running, and was the whole code copied? The host's firewall must let the game receive UDP on port {port} (on Windows allow it for public networks too). If both of you are behind a mobile or carrier network that changes the port for every connection, the way cannot be opened: the host can forward UDP port {port} on the router, or you both use a VPN": "{} мекенжайынан {:.0} с ішінде жауап жоқ. Сессия әлі жүріп жатыр ма, код толық көшірілді ме? Хосттың брандмауэрі ойынға {port} портында UDP қабылдауға рұқсат етуі керек (Windows-та жалпыға ортақ желілер үшін де рұқсат етіңіз). Егер екеуіңіз де әр қосылым үшін портты өзгертетін мобильді не провайдер желісінің артында болсаңыз, жолды ашу мүмкін емес: хост роутерде UDP {port} портын бағыттай алады немесе екеуіңіз де VPN пайдаланыңыз"
"the host runs LAN protocol {PROTOCOL}, your game an older one - both players need the same version of the game": "хост LAN хаттамасы {PROTOCOL} пайдаланады, сіздің ойыныңыздікі ескірек - екі ойыншыға да ойынның бірдей нұсқасы керек"
"the host runs LAN protocol {PROTOCOL}, your game protocol {proto} - both players need the same version of the game": "хост LAN хаттамасы {PROTOCOL} пайдаланады, сіздің ойыныңыз {proto} хаттамасын - екі ойыншыға да ойынның бірдей нұсқасы керек"
"wrong session code: this host now runs another session - ask for the current code": "сессия коды қате: бұл хост қазір басқа сессия жүргізуде - ағымдағы кодты сұраңыз"
"the session is full ({} players)": "сессия толы ({} ойыншы)"
