"no answer from {} within {:.0} s. Is the session still running, and was the whole code copied? The host's firewall must let the game receive UDP on port {port} (on Windows allow it for public networks too). If both of you are behind a mobile or carrier network that changes the port for every connection, the way cannot be opened: the host can forward UDP port {port} on the router, or you both use a VPN": "პასუხი არ მოვიდა მისამართიდან {} {:.0} წმ-ში. სესია ისევ მუშაობს და მთელი კოდი დაკოპირდა? ჰოსტის ფაიერვოლმა თამაშს UDP-ის მიღება უნდა დაუშვას პორტზე {port} (Windows-ზე საჯარო ქსელებისთვისაც დაუშვით). თუ ორივე მობილურ ან ოპერატორის ქსელში ხართ, რომელიც ყოველ კავშირზე პორტს ცვლის, გზის გახსნა შეუძლებელია: ჰოსტს შეუძლია როუტერზე UDP პორტის {port} გადამისამართება, ან ორივემ VPN გამოიყენეთ"
"the host runs LAN protocol {PROTOCOL}, your game an older one - both players need the same version of the game": "ჰოსტი იყენებს LAN პროტოკოლს {PROTOCOL}, თქვენი თამაში - უფრო ძველს - ორივე მოთამაშეს თამაშის ერთი ვერსია სჭირდება"
"the host runs LAN protocol {PROTOCOL}, your game protocol {proto} - both players need the same version of the game": "ჰოსტი იყენებს LAN პროტოკოლს {PROTOCOL}, თქვენი თამაში - პროტოკოლს {proto} - ორივე მოთამაშეს თამაშის ერთი ვერსია სჭირდება"
