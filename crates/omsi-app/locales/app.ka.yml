"Microsoft Edge WebView2 {version} is installed, so it is not missing.": "Microsoft Edge WebView2 {version} დაყენებულია, ასე რომ, ის არ აკლია."
"The openOMSI launcher shows its window with Microsoft Edge WebView2, which this Windows does not have yet.\n\nInstall it now with Microsoft's installer?": "openOMSI-ის გამშვები ფანჯარას Microsoft Edge WebView2-ით აჩვენებს, რომელიც ამ Windows-ს ჯერ არ აქვს.\n\nდავაყენოთ ახლა Microsoft-ის ინსტალერით?"
"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "მისი ჟურნალი openOMSI-ის მონაცემთა საქაღალდეშია (launcher.log); Microsoft Edge WebView2 {version} დაყენებულია."
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "გამშვების ფანჯარას სჭირდება Microsoft Edge WebView2 (Windows 10-ისა და 11-ის ნაწილია; ძველი სისტემებისთვის: https://developer.microsoft.com/microsoft-edge/webview2/)."
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS-ში ის არ შედის. Desktop Mode-ში, Konsole-ში: sudo steamos-readonly disable, შემდეგ sudo pacman -S webkit2gtk-4.1, შემდეგ sudo steamos-readonly enable (SteamOS-ის განახლებამ შეიძლება ისევ წაშალოს). იხ. docs/USER_GUIDE.md."
