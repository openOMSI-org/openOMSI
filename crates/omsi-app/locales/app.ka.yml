"the entry '{t}' is neither a session code (OMSI-…), an address nor a port, and no computer of that name was found ({e})": "ჩანაწერი '{t}' არც სესიის კოდია (OMSI-…), არც მისამართი და არც პორტი, და ამ სახელის კომპიუტერიც ვერ მოიძებნა ({e})"
"a session code has {} characters after OMSI- (this one has {n}) - copy the whole code": "სესიის კოდს OMSI--ის შემდეგ {} სიმბოლო აქვს (ამას {n}) - დააკოპირეთ მთელი კოდი"
"the character '{}' never appears in a session code - check the character that looks like it": "სიმბოლო '{}' სესიის კოდში არასდროს გვხვდება - შეამოწმეთ მისი მსგავსი სიმბოლო"
"the character '{}' is not part of a session code": "სიმბოლო '{}' სესიის კოდის ნაწილი არ არის"
"the session code has a typo (its checksum does not match)": "სესიის კოდში შეცდომაა (საკონტროლო ჯამი არ ემთხვევა)"
