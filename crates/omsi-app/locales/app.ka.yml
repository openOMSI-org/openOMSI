"The test was interrupted. Please try again.": "ტესტი შეწყდა. გთხოვთ, სცადოთ ხელახლა."
"The wheel is unavailable. Reconnect it and try again.": "საჭე მიუწვდომელია. ხელახლა შეაერთეთ და სცადეთ კიდევ ერთხელ."
"Move the wheel away from its end stops and try again.": "საჭე გადაიტანეთ კიდურა მდებარეობიდან და სცადეთ ხელახლა."
