"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "ცვლილებები ძალაში შევა შემდეგი მგზავრობისას ან თამაშის კონტროლერების მენიუში „შენახული კონტროლერების ხელახლა ჩატვირთვის“ შემდეგ."
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "რამდენად ძლიერად აბრუნებს მოძრავი ავტობუსი საჭეს პირდაპირ მდგომარეობაში მოხვევის შემდეგ; გაჩერებულ ავტობუსზე საჭე არასოდეს იწევს."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "რამდენად ეწინააღმდეგება საჭე სწრაფ მოძრაობას, რათა გაშვებული საჭე ცენტრში გაჩერდეს და არ გადაცდეს; გაზარდეთ, თუ საჭე ირხევა."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "რამდენად მძიმედ ტრიალებს საჭე, როცა ავტობუსი დგას ან ნელა მიცოცავს; მოძრაობისას მსუბუქდება."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "ყველაზე სუსტ ძალებს მაღლა სწევს იმ ზღვრის ზემოთ, საიდანაც საჭე მათ გრძნობას იწყებს; სასარგებლოა ღვედიან და კბილანებიან საჭეებზე, რომლებსაც ცენტრში მკვდარი ზონა აქვთ, direct drive-ზე დატოვეთ 0."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "არბილებს საჭის ძალის უეცარ ნახტომებს, რომლებიც ძლიერ საჭეებზე კადრების დაბალი სიხშირისას შეიძლება ხორკლიანად იგრძნობოდეს; მაღალი მნიშვნელობები მცირე დაყოვნებას ამატებს."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "ამ საჭეზე საჭის ძალების საერთო სიძლიერე; შეამცირეთ ძლიერ direct drive ბაზაზე, გაზარდეთ სუსტ საჭეზე."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "ამ საჭეზე რყევების, ბორდიურზე დარტყმების და გზისა და ძრავის ძიგძიგის საერთო სიძლიერე."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "გამორთული: თამაში საჭეს არანაირ ძალას არ უგზავნის; დარჩენილი წინააღმდეგობა საჭის საკუთარი დრაივერის პროგრამიდან მოდის (მაგალითად, ცენტრირების ზამბარა Logitech G HUB-ში)"
"The running engine buzzes in the wheel, felt even at a standstill": "მომუშავე ძრავა საჭეში ზუზუნებს, რაც დგომისასაც იგრძნობა"
"On foot: W A S D walk, Shift runs, F4 free camera / F1 back, G sits down (by the driver's place: back at the wheel), Ctrl+Shift+G steps out of the bus": "ფეხით: W A S D სიარული, Shift სირბილი, F4 თავისუფალი კამერა / F1 უკან, G ჯდომა (მძღოლის ადგილთან: ისევ საჭესთან), Ctrl+Shift+G ავტობუსიდან გადმოსვლა"
"No door within reach here (or no room outside it): walk to a door first": "აქ ხელმისაწვდომ მანძილზე კარი არ არის (ან გარეთ ადგილი არ არის): ჯერ კართან მიდით"
"There is no vehicle to remove: you are on foot": "მოსაშორებელი მანქანა არ არის: თქვენ ფეხით ხართ"
