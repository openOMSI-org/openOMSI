"the entry '{t}': the part after ':' must be a port (1 to 65535)": "ჩანაწერი '{t}': ':'-ის შემდეგ ნაწილი პორტი უნდა იყოს (1-დან 65535-მდე)"
"the entry '{t}' is neither a session code (OMSI-…), an address (192.168.1.20 or 192.168.1.20:27015) nor a port": "ჩანაწერი '{t}' არც სესიის კოდია (OMSI-…), არც მისამართი (192.168.1.20 ან 192.168.1.20:27015) და არც პორტი"
