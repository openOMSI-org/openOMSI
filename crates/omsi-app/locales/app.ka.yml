"The wheel moved too far. Test stopped.": "საჭე ზედმეტად შეტრიალდა. ტესტი შეწყდა."
"The result is inconclusive. Retry or choose the direction manually.": "შედეგი გაურკვეველია. სცადეთ ხელახლა ან მიმართულება ხელით აირჩიეთ."
"Force feedback is unavailable. Choose the direction manually.": "უკუკავშირის ძალა მიუწვდომელია. მიმართულება ხელით აირჩიეთ."
