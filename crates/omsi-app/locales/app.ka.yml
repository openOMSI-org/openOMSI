"The device is not connected: plug it in (the list on the left marks it green).": "მოწყობილობა არ არის შეერთებული: შეაერთეთ (მარცხნივ სიაში ის მწვანედ მოინიშნება)."
"The device shows no axis yet: move the wheel and the pedals a little, let go, and press Next again.": "მოწყობილობა ჯერ ღერძს არ აჩვენებს: ოდნავ ამოძრავეთ საჭე და პედლები, გაუშვით ხელი და ისევ დააჭირეთ „შემდეგს“."
"The engine is off  (E electrics, M starter; mod buses with an ignition key turn it with E: press again and hold. Shift+U does it all)": "ძრავა გამორთულია  (E ელექტროობა, M სტარტერი; ანთების გასაღებიანი მოდის ავტობუსები E-თი ირთვება: ისევ დააჭირეთ და დაიჭირეთ. Shift+U ყველაფერს აკეთებს)"
"The gearbox is in N: press D (Shift+D when W A S D drive), or click it. Buses like the Citaro take D only with the brake held": "გადაცემათა კოლოფი N-ზეა: დააჭირეთ D-ს (Shift+D, როცა W A S D მართავს), ან დააწკაპუნეთ მასზე. Citaro-ს მსგავსი ავტობუსები D-ს მხოლოდ დაჭერილი მუხრუჭით იღებენ"
