"the host has not answered for {:.0} s - the session is over (playing on alone; still trying, or type /reconnect)": "ჰოსტი {:.0} წმ-ია არ პასუხობს - სესია დასრულდა (მარტო აგრძელებთ; ცდა გრძელდება, ან აკრიფეთ /reconnect)"
"the address {} answers, but no session runs on port {port} there - check the port, or whether the host has started its game": "მისამართი {} პასუხობს, მაგრამ იქ პორტზე {port} სესია არ მუშაობს - შეამოწმეთ პორტი, ან დაიწყო თუ არა ჰოსტმა თამაში"
