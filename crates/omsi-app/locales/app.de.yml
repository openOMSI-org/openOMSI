"Enhanced: the sun's shadows, the ambient occlusion and the reflections traced with hardware ray queries, where the card has them; the heaviest option (takes effect when the game starts the next time)": "Enhanced: Sonnenschatten, Umgebungsverdeckung und Reflexionen per Hardware-Strahlenabfragen berechnet, wo die Karte sie hat; die aufwendigste Option (gilt beim nächsten Spielstart)"
"Enhanced: which lights cast shadows - the street lamps and the vehicles' headlamps, or every light: spots along their own axis and the lamps that shine every way in cube maps. Cached maps, a few passes a frame": "Enhanced: welche Lichter Schatten werfen – die Straßenlampen und die Scheinwerfer der Fahrzeuge oder jedes Licht: Spots entlang ihrer Achse und Lampen, die nach allen Seiten leuchten, in Würfelkarten. Zwischengespeicherte Karten, wenige Durchgänge pro Bild"
"Enhanced: the clouds' shadow moving over the land and the sun's shafts through the gaps of a broken sky": "Enhanced: der Schatten der Wolken, der über das Land zieht, und die Sonnenstrahlen durch die Lücken eines aufgerissenen Himmels"
"Enhanced: the glare round bright lights and the lamps' halo in the night air": "Enhanced: der Schein um helle Lichter und der Hof der Lampen in der Nachtluft"
"Sets the graphics mode and most of the options at once, from Low (Vanilla) to Ultra (Enhanced with everything on)": "Stellt den Grafikmodus und die meisten Optionen auf einmal ein, von „Niedrig“ (Vanilla) bis „Ultra“ (Enhanced mit allem an)"
"AI Lists": "KI-Listen"
"Choose which AI cars and buses a map's traffic is made of, and which buses run on which line. You choose from the vehicles you have installed; nothing new is added, and the map's own lists stay as they are.": "Legen Sie fest, aus welchen KI-Autos und -Bussen der Verkehr einer Karte besteht und welche Busse auf welcher Linie fahren. Sie wählen aus den installierten Fahrzeugen; es kommt nichts Neues hinzu, und die eigenen Listen der Karte bleiben unverändert."
"Saved. The next game you start uses these lists.": "Gespeichert. Das nächste Spiel, das Sie starten, verwendet diese Listen."
