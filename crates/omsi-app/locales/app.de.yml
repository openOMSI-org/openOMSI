"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Wie stark der fahrende Bus das Lenkrad nach einer Kurve in die Geradeausstellung zurückdreht; im Stand zieht es nie."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Wie stark sich das Lenkrad schnellen Bewegungen widersetzt, damit ein losgelassenes Lenkrad in der Mitte zur Ruhe kommt, statt darüber hinauszuschwingen; erhöhen, wenn das Lenkrad pendelt."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Wie schwer sich das Lenkrad dreht, solange der Bus steht oder kriecht; beim Rollen wird es leichter."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Hebt die kleinsten Kräfte über die Schwelle, ab der dein Lenkrad sie spürbar macht; nützlich bei Riemen- und Zahnradlenkrädern mit totem Mittelpunkt, bei Direct Drive auf 0 lassen."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Glättet plötzliche Sprünge der Lenkkraft, die sich auf starken Lenkrädern bei niedriger Bildrate körnig anfühlen können; höhere Werte bringen eine kleine Verzögerung."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Gesamtstärke der Lenkkräfte an diesem Lenkrad; bei einer starken Direct-Drive-Basis senken, bei einem schwachen Lenkrad erhöhen."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Gesamtstärke von Erschütterungen, Bordsteinstößen und dem Zittern von Straße und Motor an diesem Lenkrad."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Aus: Das Spiel sendet dem Lenkrad keine Kräfte; ein verbleibender Widerstand kommt von der Treibersoftware des Lenkrads selbst (zum Beispiel die Zentrierfeder in Logitech G HUB)"
