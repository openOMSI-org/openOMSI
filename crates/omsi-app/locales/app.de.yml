"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS enthält es nicht. Im Desktop-Modus, in Konsole: sudo steamos-readonly disable, dann sudo pacman -S webkit2gtk-4.1, dann sudo steamos-readonly enable (ein SteamOS-Update kann es wieder entfernen). Siehe docs/USER_GUIDE.md."
