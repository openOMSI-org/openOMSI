_version: 2
# The bus company's easy and advanced modes: the choice, the easy start screen, the duties the
# player takes, the lines taken at the asking price, and what the company does by itself.
"Easy mode":
  de: "Leichter Modus"
  fr: "Mode facile"
  nl: "Makkelijke modus"
  pl: "Tryb łatwy"
  ru: "Простой режим"
  uk: "Простий режим"
"Advanced mode":
  de: "Erweiterter Modus"
  fr: "Mode avancé"
  nl: "Uitgebreide modus"
  pl: "Tryb zaawansowany"
  ru: "Расширенный режим"
  uk: "Розширений режим"
"The company runs its routine by itself: rosters, spare parts, repairs, staff and research. You drive, buy buses, add lines and watch the money.":
  de: "Der Betrieb erledigt seine Routine selbst: Dienstpläne, Ersatzteile, Reparaturen, Personal und Forschung. Du fährst, kaufst Busse, fügst Linien hinzu und behältst das Geld im Blick."
  fr: "L'entreprise gère sa routine elle-même : roulements, pièces détachées, réparations, personnel et recherche. Toi, tu conduis, achètes des bus, ajoutes des lignes et surveilles l'argent."
  nl: "Het bedrijf regelt zijn routine zelf: roosters, onderdelen, reparaties, personeel en onderzoek. Jij rijdt, koopt bussen, voegt lijnen toe en houdt het geld in de gaten."
  pl: "Firma sama zajmuje się rutyną: grafikami, częściami zamiennymi, naprawami, personelem i badaniami. Ty jeździsz, kupujesz autobusy, dodajesz linie i pilnujesz pieniędzy."
  ru: "Компания сама ведёт рутину: графики, запчасти, ремонт, персонал и исследования. Вы водите, покупаете автобусы, добавляете линии и следите за деньгами."
  uk: "Компанія сама веде рутину: графіки, запчастини, ремонти, персонал і дослідження. Ви водите, купуєте автобуси, додаєте лінії й стежите за грошима."
"Every page and every function: you plan the rosters, run the workshop, bid for concessions and manage everything yourself.":
  de: "Jede Seite und jede Funktion: Du planst die Dienstpläne, führst die Werkstatt, bietest auf Konzessionen und regelst alles selbst."
  fr: "Chaque page et chaque fonction : tu planifies les roulements, gères l'atelier, enchéris pour les concessions et t'occupes de tout toi-même."
  nl: "Elke pagina en elke functie: jij plant de roosters, runt de werkplaats, biedt op concessies en regelt alles zelf."
  pl: "Każda strona i każda funkcja: planujesz grafiki, prowadzisz warsztat, licytujesz koncesje i wszystkim zarządzasz sam."
  ru: "Все страницы и функции: вы планируете графики, управляете мастерской, делаете ставки на концессии и ведёте всё сами."
  uk: "Усі сторінки та функції: ви плануєте графіки, керуєте майстернею, робите ставки на концесії й ведете все самі."
"How you run the company":
  de: "Wie du den Betrieb führst"
  fr: "Comment tu diriges l'entreprise"
  nl: "Hoe je het bedrijf runt"
  pl: "Jak prowadzisz firmę"
  ru: "Как вы управляете компанией"
  uk: "Як ви керуєте компанією"
"How much of the company you run yourself: change it in the company's settings":
  de: "Wie viel vom Betrieb du selbst führst: Ändere es in den Einstellungen des Betriebs"
  fr: "La part de l'entreprise que tu gères toi-même : change-la dans les réglages de l'entreprise"
  nl: "Hoeveel van het bedrijf je zelf regelt: wijzig het in de instellingen van het bedrijf"
  pl: "Ile firmy prowadzisz sam: zmień to w ustawieniach firmy"
  ru: "Сколько компании вы ведёте сами: измените это в настройках компании"
  uk: "Скільки компанії ви ведете самі: змініть це в налаштуваннях компанії"
"The company runs in the easy mode now: it sees to its routine by itself.":
  de: "Der Betrieb läuft jetzt im leichten Modus: Er erledigt seine Routine selbst."
  fr: "L'entreprise est maintenant en mode facile : elle s'occupe elle-même de sa routine."
  nl: "Het bedrijf draait nu in de makkelijke modus: het regelt zijn routine zelf."
  pl: "Firma działa teraz w trybie łatwym: sama zajmuje się rutyną."
  ru: "Компания теперь в простом режиме: рутину она ведёт сама."
  uk: "Компанія тепер у простому режимі: рутину вона веде сама."
"The company runs in the advanced mode now: every page and every function is open.":
  de: "Der Betrieb läuft jetzt im erweiterten Modus: Jede Seite und jede Funktion ist offen."
  fr: "L'entreprise est maintenant en mode avancé : chaque page et chaque fonction est ouverte."
  nl: "Het bedrijf draait nu in de uitgebreide modus: elke pagina en elke functie is open."
  pl: "Firma działa teraz w trybie zaawansowanym: każda strona i każda funkcja jest dostępna."
  ru: "Компания теперь в расширенном режиме: открыты все страницы и функции."
  uk: "Компанія тепер у розширеному режимі: відкриті всі сторінки й функції."
"The easy mode buys at the list price, in one click: the buses are yours at once.":
  de: "Der leichte Modus kauft zum Listenpreis, mit einem Klick: Die Busse gehören sofort dir."
  fr: "Le mode facile achète au prix catalogue, en un clic : les bus sont à toi tout de suite."
  nl: "De makkelijke modus koopt tegen de catalogusprijs, met één klik: de bussen zijn meteen van jou."
  pl: "Tryb łatwy kupuje po cenie katalogowej, jednym kliknięciem: autobusy są od razu twoje."
  ru: "Простой режим покупает по каталожной цене одним щелчком: автобусы сразу ваши."
  uk: "Простий режим купує за каталожною ціною одним клацанням: автобуси одразу ваші."
# the easy start screen
"What to do next":
  de: "Was als Nächstes"
  fr: "Que faire ensuite"
  nl: "Wat nu te doen"
  pl: "Co dalej"
  ru: "Что делать дальше"
  uk: "Що робити далі"
"Take on a line":
  de: "Eine Linie übernehmen"
  fr: "Prendre une ligne"
  nl: "Neem een lijn"
  pl: "Weź linię"
  ru: "Возьмите линию"
  uk: "Візьміть лінію"
"Choose one of the map's lines, or draw a line of your own.":
  de: "Wähle eine der Linien der Karte, oder zeichne eine eigene Linie."
  fr: "Choisis l'une des lignes de la carte, ou trace ta propre ligne."
  nl: "Kies een van de lijnen van de kaart, of teken een eigen lijn."
  pl: "Wybierz jedną z linii mapy albo narysuj własną."
  ru: "Выберите одну из линий карты или нарисуйте свою."
  uk: "Виберіть одну з ліній карти або намалюйте власну."
"Get your buses":
  de: "Hol dir deine Busse"
  fr: "Procure-toi tes bus"
  nl: "Haal je bussen"
  pl: "Zdobądź autobusy"
  ru: "Обзаведитесь автобусами"
  uk: "Придбайте автобуси"
"Buy, lease or rent buses at the dealer: one for every tour on the road at once.":
  de: "Kaufe, lease oder miete Busse beim Händler: einen für jeden Umlauf, der gleichzeitig unterwegs ist."
  fr: "Achète, prends en leasing ou loue des bus chez le concessionnaire : un pour chaque service en route en même temps."
  nl: "Koop, lease of huur bussen bij de dealer: één voor elke omloop die tegelijk rijdt."
  pl: "Kup, weź w leasing lub wynajmij autobusy u dealera: po jednym na każdą brygadę jednocześnie na trasie."
  ru: "Купите, возьмите в лизинг или арендуйте автобусы у дилера: по одному на каждый оборот, что в пути одновременно."
  uk: "Купіть, візьміть у лізинг або орендуйте автобуси в дилера: по одному на кожен оборот, що в дорозі одночасно."
"%{n} tours of today have no bus: get more buses.":
  de: "%{n} Umläufe von heute haben keinen Bus: Hol dir mehr Busse."
  fr: "%{n} services d'aujourd'hui n'ont pas de bus : procure-toi plus de bus."
  nl: "%{n} omlopen van vandaag hebben geen bus: haal meer bussen."
  pl: "Brygady bez autobusu dzisiaj: %{n}. Zdobądź więcej autobusów."
  ru: "Оборотов без автобуса сегодня: %{n}. Обзаведитесь ещё автобусами."
  uk: "Оборотів без автобуса сьогодні: %{n}. Придбайте ще автобуси."
"Drivers for the duties":
  de: "Fahrer für die Dienste"
  fr: "Des conducteurs pour les services"
  nl: "Chauffeurs voor de diensten"
  pl: "Kierowcy do służb"
  ru: "Водители для смен"
  uk: "Водії для змін"
"Hire drivers, or let the company hire them tonight for the duties of its lines.":
  de: "Stelle Fahrer ein, oder lass den Betrieb sie heute Nacht für die Dienste seiner Linien einstellen."
  fr: "Embauche des conducteurs, ou laisse l'entreprise les embaucher cette nuit pour les services de ses lignes."
  nl: "Neem chauffeurs aan, of laat het bedrijf ze vannacht aannemen voor de diensten van zijn lijnen."
  pl: "Zatrudnij kierowców albo pozwól firmie zatrudnić ich tej nocy do służb jej linii."
  ru: "Наймите водителей или позвольте компании нанять их этой ночью для смен её линий."
  uk: "Найміть водіїв або дозвольте компанії найняти їх цієї ночі для змін її ліній."
"%{n} duties of today have no driver: the company hires more tonight, or hire them now.":
  de: "%{n} Dienste von heute haben keinen Fahrer: Der Betrieb stellt heute Nacht mehr ein, oder stell sie jetzt ein."
  fr: "%{n} services d'aujourd'hui n'ont pas de conducteur : l'entreprise en embauche d'autres cette nuit, ou embauche-les maintenant."
  nl: "%{n} diensten van vandaag hebben geen chauffeur: het bedrijf neemt er vannacht meer aan, of neem ze nu aan."
  pl: "Służby bez kierowcy dzisiaj: %{n}. Firma zatrudni więcej tej nocy albo zatrudnij ich teraz."
  ru: "Смен без водителя сегодня: %{n}. Компания наймёт ещё этой ночью, или наймите их сейчас."
  uk: "Змін без водія сьогодні: %{n}. Компанія найме ще цієї ночі, або найміть їх зараз."
"%{n} drivers: every duty has its driver.":
  de: "%{n} Fahrer: Jeder Dienst hat seinen Fahrer."
  fr: "%{n} conducteurs : chaque service a son conducteur."
  nl: "%{n} chauffeurs: elke dienst heeft zijn chauffeur."
  pl: "Kierowców: %{n}, każda służba ma kierowcę."
  ru: "Водителей: %{n}, у каждой смены есть водитель."
  uk: "Водіїв: %{n}, кожна зміна має водія."
"Let the time run":
  de: "Lass die Zeit laufen"
  fr: "Laisse le temps passer"
  nl: "Laat de tijd lopen"
  pl: "Puść czas"
  ru: "Пусть идёт время"
  uk: "Нехай іде час"
"Start the company's clock at the top, or simulate to tomorrow: the tours run and the money comes in.":
  de: "Starte oben die Uhr des Betriebs, oder simuliere bis morgen: Die Umläufe fahren und das Geld kommt herein."
  fr: "Lance l'horloge de l'entreprise en haut, ou simule jusqu'à demain : les services roulent et l'argent rentre."
  nl: "Start bovenaan de klok van het bedrijf, of simuleer tot morgen: de omlopen rijden en het geld komt binnen."
  pl: "Uruchom zegar firmy u góry albo symuluj do jutra: brygady jeżdżą, a pieniądze wpływają."
  ru: "Запустите часы компании вверху или симулируйте до завтра: обороты идут, деньги поступают."
  uk: "Запустіть годинник компанії вгорі або симулюйте до завтра: обороти йдуть, гроші надходять."
"The days run: every morning the company fills its roster by itself.":
  de: "Die Tage laufen: Jeden Morgen füllt der Betrieb seinen Dienstplan selbst."
  fr: "Les jours passent : chaque matin, l'entreprise remplit elle-même son roulement."
  nl: "De dagen lopen: elke ochtend vult het bedrijf zelf zijn rooster."
  pl: "Dni mijają: co rano firma sama wypełnia grafik."
  ru: "Дни идут: каждое утро компания сама заполняет график."
  uk: "Дні йдуть: щоранку компанія сама заповнює графік."
"Drive a duty yourself":
  de: "Fahre selbst einen Dienst"
  fr: "Conduis toi-même un service"
  nl: "Rijd zelf een dienst"
  pl: "Poprowadź służbę samodzielnie"
  ru: "Проведите смену сами"
  uk: "Проведіть зміну самі"
"You drive 1 duty a week.":
  de: "Du fährst 1 Dienst pro Woche."
  fr: "Tu conduis 1 service par semaine."
  nl: "Je rijdt 1 dienst per week."
  pl: "Prowadzisz 1 służbę w tygodniu."
  ru: "Вы ведёте 1 смену в неделю."
  uk: "Ви ведете 1 зміну на тиждень."
"You drive %{n} duties a week.":
  de: "Du fährst %{n} Dienste pro Woche."
  fr: "Tu conduis %{n} services par semaine."
  nl: "Je rijdt %{n} diensten per week."
  pl: "Twoich służb w tygodniu: %{n}."
  ru: "Ваших смен в неделю: %{n}."
  uk: "Ваших змін на тиждень: %{n}."
"Take one of the company's duties and drive it in the game.":
  de: "Übernimm einen Dienst des Betriebs und fahre ihn im Spiel."
  fr: "Prends un service de l'entreprise et conduis-le dans le jeu."
  nl: "Neem een dienst van het bedrijf en rijd hem in het spel."
  pl: "Weź służbę firmy i poprowadź ją w grze."
  ru: "Возьмите смену компании и проведите её в игре."
  uk: "Візьміть зміну компанії та проведіть її в грі."
"1 duty of yours a week":
  de: "1 Dienst von dir pro Woche"
  fr: "1 service à toi par semaine"
  nl: "1 dienst van jou per week"
  pl: "1 twoja służba w tygodniu"
  ru: "1 ваша смена в неделю"
  uk: "1 ваша зміна на тиждень"
"%{n} duties of yours a week":
  de: "%{n} Dienste von dir pro Woche"
  fr: "%{n} services à toi par semaine"
  nl: "%{n} diensten van jou per week"
  pl: "Twoich służb w tygodniu: %{n}"
  ru: "Ваших смен в неделю: %{n}"
  uk: "Ваших змін на тиждень: %{n}"
"Take a duty and drive it":
  de: "Übernimm einen Dienst und fahre ihn"
  fr: "Prends un service et conduis-le"
  nl: "Neem een dienst en rijd hem"
  pl: "Weź służbę i poprowadź ją"
  ru: "Возьмите смену и проведите её"
  uk: "Візьміть зміну та проведіть її"
"Your own duties in the game":
  de: "Deine eigenen Dienste im Spiel"
  fr: "Tes propres services dans le jeu"
  nl: "Je eigen diensten in het spel"
  pl: "Twoje własne służby w grze"
  ru: "Ваши собственные смены в игре"
  uk: "Ваші власні зміни в грі"
"Your company runs. Grow it when you like: another line, more buses, a duty of your own now and then.":
  de: "Dein Betrieb läuft. Lass ihn wachsen, wann du willst: eine weitere Linie, mehr Busse, ab und zu ein eigener Dienst."
  fr: "Ton entreprise tourne. Fais-la grandir quand tu veux : une autre ligne, plus de bus, un service à toi de temps en temps."
  nl: "Je bedrijf draait. Laat het groeien wanneer je wilt: nog een lijn, meer bussen, af en toe een eigen dienst."
  pl: "Twoja firma działa. Rozwijaj ją, kiedy chcesz: kolejna linia, więcej autobusów, od czasu do czasu własna służba."
  ru: "Ваша компания работает. Развивайте её, когда захотите: ещё линия, больше автобусов, иногда своя смена."
  uk: "Ваша компанія працює. Розвивайте її, коли захочете: ще лінія, більше автобусів, іноді власна зміна."
"Done by the company itself":
  de: "Vom Betrieb selbst erledigt"
  fr: "Fait par l'entreprise elle-même"
  nl: "Door het bedrijf zelf gedaan"
  pl: "Zrobione przez firmę samodzielnie"
  ru: "Сделано самой компанией"
  uk: "Зроблено самою компанією"
"Every morning and every night the company sees to its routine: the roster, spare parts, repairs, staff and research. What it did is told here.":
  de: "Jeden Morgen und jede Nacht erledigt der Betrieb seine Routine: Dienstplan, Ersatzteile, Reparaturen, Personal und Forschung. Was er getan hat, steht hier."
  fr: "Chaque matin et chaque nuit, l'entreprise s'occupe de sa routine : le roulement, les pièces détachées, les réparations, le personnel et la recherche. Ce qu'elle a fait est indiqué ici."
  nl: "Elke ochtend en elke nacht doet het bedrijf zijn routine: het rooster, onderdelen, reparaties, personeel en onderzoek. Wat het deed, staat hier."
  pl: "Każdego ranka i każdej nocy firma zajmuje się rutyną: grafikiem, częściami zamiennymi, naprawami, personelem i badaniami. Co zrobiła, widać tutaj."
  ru: "Каждое утро и каждую ночь компания выполняет рутину: график, запчасти, ремонт, персонал и исследования. Что она сделала, показано здесь."
  uk: "Щоранку й щоночі компанія виконує рутину: графік, запчастини, ремонти, персонал і дослідження. Що вона зробила, показано тут."
# the career's "My duties" in the easy mode
"Duties you can take":
  de: "Dienste, die du übernehmen kannst"
  fr: "Services que tu peux prendre"
  nl: "Diensten die je kunt nemen"
  pl: "Służby do wzięcia"
  ru: "Смены, которые можно взять"
  uk: "Зміни, які можна взяти"
"Take one of the company's duties in the list beside: it is yours on that weekday every week, and the company's drivers take the others.":
  de: "Nimm einen der Dienste des Betriebs aus der Liste daneben: Er gehört dann jede Woche an diesem Wochentag dir, und die Fahrer des Betriebs übernehmen die anderen."
  fr: "Prends l'un des services de l'entreprise dans la liste à côté : il est à toi ce jour-là chaque semaine, et les conducteurs de l'entreprise assurent les autres."
  nl: "Neem een van de diensten van het bedrijf in de lijst ernaast: die is dan elke week op die weekdag van jou, en de chauffeurs van het bedrijf rijden de rest."
  pl: "Weź jedną ze służb firmy z listy obok: będzie twoja w ten dzień tygodnia co tydzień, a pozostałe przejmą kierowcy firmy."
  ru: "Возьмите одну из смен компании в списке рядом: она будет вашей в этот день недели каждую неделю, а остальные возьмут водители компании."
  uk: "Візьміть одну зі змін компанії у списку поруч: вона буде вашою в цей день тижня щотижня, а решту візьмуть водії компанії."
"Give the duty back: the company's drivers drive it again":
  de: "Dienst zurückgeben: Die Fahrer des Betriebs fahren ihn wieder"
  fr: "Rendre le service : les conducteurs de l'entreprise le reprennent"
  nl: "Dienst teruggeven: de chauffeurs van het bedrijf rijden hem weer"
  pl: "Oddaj służbę: znów prowadzą ją kierowcy firmy"
  ru: "Вернуть смену: её снова поведут водители компании"
  uk: "Повернути зміну: її знову поведуть водії компанії"
"The company runs no line yet: take one on, and its duties are here.":
  de: "Der Betrieb fährt noch keine Linie: Übernimm eine, dann stehen ihre Dienste hier."
  fr: "L'entreprise n'exploite encore aucune ligne : prends-en une, et ses services apparaissent ici."
  nl: "Het bedrijf rijdt nog geen lijn: neem er een, dan staan de diensten hier."
  pl: "Firma nie obsługuje jeszcze żadnej linii: weź jakąś, a jej służby pojawią się tutaj."
  ru: "У компании ещё нет линий: возьмите линию, и её смены появятся здесь."
  uk: "У компанії ще немає ліній: візьміть лінію, і її зміни з'являться тут."
"The company's lines run no tours in the coming week.":
  de: "Die Linien des Betriebs haben in der kommenden Woche keine Umläufe."
  fr: "Les lignes de l'entreprise n'ont aucune course prévue la semaine à venir."
  nl: "De lijnen van het bedrijf hebben de komende week geen omlopen."
  pl: "Linie firmy nie mają brygad w nadchodzącym tygodniu."
  ru: "На ближайшей неделе у линий компании нет оборотов."
  uk: "На найближчому тижні лінії компанії не мають оборотів."
"Every duty of the coming week is yours already.":
  de: "Jeder Dienst der kommenden Woche gehört schon dir."
  fr: "Tous les services de la semaine à venir sont déjà à toi."
  nl: "Elke dienst van de komende week is al van jou."
  pl: "Wszystkie służby nadchodzącego tygodnia są już twoje."
  ru: "Все смены ближайшей недели уже ваши."
  uk: "Усі зміни найближчого тижня вже ваші."
"Take it":
  de: "Übernehmen"
  fr: "Prendre"
  nl: "Nemen"
  pl: "Weź"
  ru: "Взять"
  uk: "Взяти"
"Yours on this weekday every week: drive it from your duties":
  de: "Jede Woche an diesem Wochentag deiner: Fahre ihn aus deinen Diensten"
  fr: "À toi ce jour-là chaque semaine : conduis-le depuis tes services"
  nl: "Elke week op deze weekdag van jou: rijd hem vanuit je diensten"
  pl: "Twoja w ten dzień tygodnia co tydzień: prowadź ją ze swoich służb"
  ru: "Ваша в этот день недели каждую неделю: ведите её из своих смен"
  uk: "Ваша в цей день тижня щотижня: ведіть її зі своїх змін"
"The duty is yours on that weekday every week: drive it from My duties.":
  de: "Der Dienst gehört jede Woche an diesem Wochentag dir: Fahre ihn unter Meine Dienste."
  fr: "Le service est à toi ce jour-là chaque semaine : conduis-le depuis Mes services."
  nl: "De dienst is elke week op die weekdag van jou: rijd hem vanuit Mijn diensten."
  pl: "Służba jest twoja w ten dzień tygodnia co tydzień: prowadź ją z Moich służb."
  ru: "Смена ваша в этот день недели каждую неделю: ведите её из раздела «Мои смены»."
  uk: "Зміна ваша в цей день тижня щотижня: ведіть її з розділу «Мої наряди»."
# the lines in the easy mode
"%{n} tours of today lack a bus or a driver: the company hires drivers by itself, buses you get at the dealer.":
  de: "%{n} Umläufen von heute fehlt ein Bus oder ein Fahrer: Fahrer stellt der Betrieb selbst ein, Busse holst du beim Händler."
  fr: "%{n} services d'aujourd'hui manquent d'un bus ou d'un conducteur : l'entreprise embauche elle-même les conducteurs, les bus, tu les obtiens chez le concessionnaire."
  nl: "%{n} omlopen van vandaag missen een bus of een chauffeur: het bedrijf neemt zelf chauffeurs aan, bussen haal je bij de dealer."
  pl: "Brygady bez autobusu lub kierowcy dzisiaj: %{n}. Kierowców firma zatrudni sama, autobusy zdobędziesz u dealera."
  ru: "Оборотов без автобуса или водителя сегодня: %{n}. Водителей компания наймёт сама, автобусы вы берёте у дилера."
  uk: "Оборотів без автобуса чи водія сьогодні: %{n}. Водіїв компанія найме сама, автобуси ви берете в дилера."
"What the line asks of the company on a day like today, against what it has. In the easy mode it runs at once: the company fills its roster every morning.":
  de: "Was die Linie an einem Tag wie heute vom Betrieb verlangt, gegenüber dem, was er hat. Im leichten Modus fährt sie sofort: Der Betrieb füllt jeden Morgen seinen Dienstplan."
  fr: "Ce que la ligne demande à l'entreprise un jour comme aujourd'hui, face à ce qu'elle a. En mode facile, elle circule tout de suite : l'entreprise remplit son roulement chaque matin."
  nl: "Wat de lijn vraagt van het bedrijf op een dag als vandaag, tegenover wat het heeft. In de makkelijke modus rijdt ze meteen: het bedrijf vult elke ochtend zijn rooster."
  pl: "Czego linia wymaga od firmy w dzień taki jak dziś, wobec tego, co firma ma. W trybie łatwym kursuje od razu: firma co rano wypełnia grafik."
  ru: "Что линия требует от компании в такой день, как сегодня, и что у компании есть. В простом режиме она работает сразу: компания каждое утро заполняет график."
  uk: "Що лінія вимагає від компанії в такий день, як сьогодні, і що в компанії є. У простому режимі вона працює одразу: компанія щоранку заповнює графік."
"What the line asks of the company on a day like today, against what it has. Its concession is taken at the asking price, without an auction: the line is the company's from tomorrow and runs by itself.":
  de: "Was die Linie an einem Tag wie heute vom Betrieb verlangt, gegenüber dem, was er hat. Ihre Konzession wird zum Angebotspreis übernommen, ohne Versteigerung: Die Linie gehört ab morgen dem Betrieb und fährt von selbst."
  fr: "Ce que la ligne demande à l'entreprise un jour comme aujourd'hui, face à ce qu'elle a. Sa concession est prise au prix demandé, sans enchères : la ligne est à l'entreprise dès demain et circule d'elle-même."
  nl: "Wat de lijn vraagt van het bedrijf op een dag als vandaag, tegenover wat het heeft. Haar concessie wordt tegen de vraagprijs genomen, zonder veiling: de lijn is vanaf morgen van het bedrijf en rijdt vanzelf."
  pl: "Czego linia wymaga od firmy w dzień taki jak dziś, wobec tego, co firma ma. Jej koncesja jest brana po cenie ofertowej, bez aukcji: linia należy do firmy od jutra i kursuje sama."
  ru: "Что линия требует от компании в такой день, как сегодня, и что у компании есть. Её концессия берётся по запрашиваемой цене, без аукциона: линия принадлежит компании с завтрашнего дня и работает сама."
  uk: "Що лінія вимагає від компанії в такий день, як сьогодні, і що в компанії є. Її концесія береться за запитуваною ціною, без аукціону: лінія належить компанії з завтрашнього дня й працює сама."
"Short for this line: %{b} buses and %{d} drivers. Get the buses at the dealer; the company hires the drivers by itself, at night.":
  de: "Für diese Linie fehlen: %{b} Busse und %{d} Fahrer. Hol die Busse beim Händler; die Fahrer stellt der Betrieb nachts selbst ein."
  fr: "Il manque pour cette ligne : %{b} bus et %{d} conducteurs. Procure-toi les bus chez le concessionnaire ; l'entreprise embauche elle-même les conducteurs, la nuit."
  nl: "Tekort voor deze lijn: %{b} bussen en %{d} chauffeurs. Haal de bussen bij de dealer; de chauffeurs neemt het bedrijf 's nachts zelf aan."
  pl: "Na tę linię brakuje: %{b} autobusów i %{d} kierowców. Autobusy zdobądź u dealera; kierowców firma zatrudni sama, w nocy."
  ru: "Для этой линии не хватает: %{b} автобусов и %{d} водителей. Автобусы возьмите у дилера; водителей компания наймёт сама, ночью."
  uk: "Для цієї лінії бракує: %{b} автобусів і %{d} водіїв. Автобуси візьміть у дилера; водіїв компанія найме сама, вночі."
"Its concession at the asking price: %{amount} (the company has %{cash}).":
  de: "Ihre Konzession zum Angebotspreis: %{amount} (der Betrieb hat %{cash})."
  fr: "Sa concession au prix demandé : %{amount} (l'entreprise a %{cash})."
  nl: "Haar concessie tegen de vraagprijs: %{amount} (het bedrijf heeft %{cash})."
  pl: "Jej koncesja po cenie ofertowej: %{amount} (firma ma %{cash})."
  ru: "Её концессия по запрашиваемой цене: %{amount} (у компании %{cash})."
  uk: "Її концесія за запитуваною ціною: %{amount} (у компанії %{cash})."
"Take it on for %{amount}":
  de: "Für %{amount} übernehmen"
  fr: "La prendre pour %{amount}"
  nl: "Overnemen voor %{amount}"
  pl: "Przejmij za %{amount}"
  ru: "Взять за %{amount}"
  uk: "Взяти за %{amount}"
"The concession for line %{n} is the company's: the line runs from tomorrow.":
  de: "Die Konzession für Linie %{n} gehört dem Betrieb: Die Linie fährt ab morgen."
  fr: "La concession de la ligne %{n} est à l'entreprise : la ligne circule dès demain."
  nl: "De concessie voor lijn %{n} is van het bedrijf: de lijn rijdt vanaf morgen."
  pl: "Koncesja na linię %{n} należy do firmy: linia kursuje od jutra."
  ru: "Концессия на линию %{n} принадлежит компании: линия работает с завтрашнего дня."
  uk: "Концесія на лінію %{n} належить компанії: лінія працює з завтрашнього дня."
"Line %{n} is the company's and runs from now on: its roster fills itself.":
  de: "Linie %{n} gehört dem Betrieb und fährt ab jetzt: Ihr Dienstplan füllt sich selbst."
  fr: "La ligne %{n} est à l'entreprise et circule dès maintenant : son roulement se remplit tout seul."
  nl: "Lijn %{n} is van het bedrijf en rijdt vanaf nu: het rooster vult zichzelf."
  pl: "Linia %{n} należy do firmy i kursuje od teraz: jej grafik wypełnia się sam."
  ru: "Линия %{n} принадлежит компании и работает с этого момента: её график заполняется сам."
  uk: "Лінія %{n} належить компанії й працює відтепер: її графік заповнюється сам."
"The concession for line %{n} is yours until %{date}: the line runs by itself from its first day.":
  de: "Die Konzession für Linie %{n} gehört dir bis %{date}: Die Linie fährt ab ihrem ersten Tag von selbst."
  fr: "La concession de la ligne %{n} est à toi jusqu'au %{date} : la ligne circule d'elle-même dès son premier jour."
  nl: "De concessie voor lijn %{n} is van jou tot %{date}: de lijn rijdt vanaf haar eerste dag vanzelf."
  pl: "Koncesja na linię %{n} jest twoja do %{date}: linia kursuje sama od pierwszego dnia."
  ru: "Концессия на линию %{n} ваша до %{date}: линия работает сама с первого дня."
  uk: "Концесія на лінію %{n} ваша до %{date}: лінія працює сама з першого дня."
"%{count} new goals are on offer until %{until}, each with trophies and money as its reward: the company takes them on by itself, up to three at once.":
  de: "%{count} neue Ziele sind bis %{until} im Angebot, jedes mit Trophäen und Geld als Belohnung: Der Betrieb nimmt sie selbst an, bis zu drei gleichzeitig."
  fr: "%{count} nouveaux objectifs sont proposés jusqu'au %{until}, chacun récompensé par des trophées et de l'argent : l'entreprise les accepte d'elle-même, jusqu'à trois à la fois."
  nl: "%{count} nieuwe doelen worden aangeboden tot %{until}, elk met trofeeën en geld als beloning: het bedrijf neemt ze zelf aan, tot drie tegelijk."
  pl: "Nowe cele w ofercie do %{until}: %{count}, każdy z trofeami i pieniędzmi jako nagrodą. Firma sama je przyjmuje, do trzech naraz."
  ru: "Новых целей в предложении до %{until}: %{count}, каждая с трофеями и деньгами в награду. Компания сама берёт их, до трёх сразу."
  uk: "Нових цілей у пропозиції до %{until}: %{count}, кожна з трофеями й грошима в нагороду. Компанія сама бере їх, до трьох одночасно."
