"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Hareket hâlindeki otobüsün virajdan sonra direksiyonu ne kadar güçlü düzelttiği; otobüs dururken asla çekmez."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Direksiyonun hızlı harekete ne kadar direndiği; böylece bırakılan direksiyon merkezi geçip sallanmak yerine merkezde durur. Direksiyon salınıyorsa artırın."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Otobüs dururken veya çok yavaş giderken direksiyonun ne kadar ağır döndüğü; otobüs hızlandıkça hafifler."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "En küçük kuvvetleri direksiyonunuzun onları hissettirmeye başladığı eşiğin üzerine çıkarır; ortasında ölü bölge olan kayışlı ve dişli direksiyonlarda yararlıdır, direct drive'da 0'da bırakın."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Düşük kare hızlarında güçlü direksiyonlarda pürüzlü hissedilebilen direksiyon kuvvetindeki ani sıçramaları yumuşatır; yüksek değerler biraz gecikme ekler."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Bu direksiyondaki direksiyon kuvvetlerinin genel gücü; güçlü bir direct drive tabanda azaltın, zayıf bir direksiyonda artırın."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Bu direksiyondaki sarsıntıların, kaldırım darbelerinin ve yol ile motor titreşiminin genel gücü."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Kapalı: oyun direksiyona hiçbir kuvvet göndermez; kalan direnç direksiyonun kendi sürücü yazılımından gelir (örneğin Logitech G HUB'daki merkezleme yayı)"
"The running engine buzzes in the wheel, felt even at a standstill": "Çalışan motor direksiyonda vızıldar, dururken bile hissedilir"
