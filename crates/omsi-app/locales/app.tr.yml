"The keys of the game are OMSI's Inputs/keyboard.cfg: the openOMSI launcher of Windows and Linux sets them on its Controls page, which reads and writes the same file.": "Oyunun tuşları OMSI'nin Inputs/keyboard.cfg dosyasındadır: Windows ve Linux için openOMSI başlatıcısı bunları Kontroller sayfasında ayarlar; bu sayfa aynı dosyayı okur ve yazar."
"Anything put into this folder is installed by itself once it has finished copying.": "Bu klasöre konan her şey, kopyalanması bitince kendiliğinden kurulur."
"No mods yet. Choose a folder or an archive.": "Henüz mod yok. Bir klasör veya arşiv seçin."
"The original OMSI 2 was not found.": "Orijinal OMSI 2 bulunamadı."
"Copy a complete OMSI 2 (the folder with Omsi.exe, maps and Vehicles) into openOMSI in the Files app (On My iPhone / iPad), or from a Mac's Finder over a cable, and choose it here. A copy on iCloud Drive or a USB drive can be chosen as well.": "Eksiksiz bir OMSI 2'yi (Omsi.exe, maps ve Vehicles içeren klasör) Dosyalar uygulamasında openOMSI içine (iPhone'umda / iPad'imde) veya kabloyla bir Mac'in Finder'ından kopyalayın ve burada seçin. iCloud Drive'daki veya bir USB sürücüdeki bir kopya da seçilebilir."
"The OMSI 2 folder is the one with maps and Vehicles in it (any complete installation).": "OMSI 2 klasörü, içinde maps ve Vehicles bulunan klasördür (eksiksiz herhangi bir kurulum)."
