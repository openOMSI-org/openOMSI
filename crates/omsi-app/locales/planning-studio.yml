_version: 2
# The planning's scheduling studio (Luc: "like Optibus Scheduling"): the buses' blocks and the
# drivers' duties cut from them, edited by hand, with the rules and the day's figures.
"Roster":
  de: "Dienstplan"
  fr: "Roulement"
  nl: "Rooster"
  pl: "Grafik"
  ru: "График"
  uk: "Графік"
"Roster: who drives what. Vehicles and Drivers: the scheduling studio - the buses' blocks and the duties cut from them":
  de: "Dienstplan: wer was fährt. Fahrzeuge und Fahrer: das Planungsstudio – die Umläufe der Busse und die daraus geschnittenen Dienste"
  fr: "Roulement : qui conduit quoi. Véhicules et Conducteurs : l'atelier de planification – les services des bus et les services des conducteurs qui en sont découpés"
  nl: "Rooster: wie wat rijdt. Voertuigen en Chauffeurs: de planningsstudio – de omlopen van de bussen en de diensten die eruit gesneden zijn"
  pl: "Grafik: kto co prowadzi. Pojazdy i Kierowcy: studio planowania – brygady autobusów i wycięte z nich służby"
  ru: "График: кто что ведёт. Транспорт и Водители: студия планирования – выходы автобусов и нарезанные из них смены"
  uk: "Графік: хто що веде. Транспорт і Водії: студія планування – обороти автобусів і нарізані з них зміни"
"Optimise":
  de: "Optimieren"
  fr: "Optimiser"
  nl: "Optimaliseren"
  pl: "Optymalizuj"
  ru: "Оптимизировать"
  uk: "Оптимізувати"
"Run the automatic blocking and runcutting: its result is shown as a proposal you can accept, then change by hand":
  de: "Die automatische Umlauf- und Dienstplanung laufen lassen: ihr Ergebnis erscheint als Vorschlag, den Sie annehmen und dann von Hand ändern können"
  fr: "Lancer la construction automatique des services des bus et des conducteurs : le résultat s'affiche comme une proposition que vous pouvez accepter, puis modifier à la main"
  nl: "De automatische omloop- en dienstplanning draaien: de uitkomst verschijnt als voorstel dat u kunt aannemen en daarna met de hand aanpassen"
  pl: "Uruchom automatyczne układanie brygad i służb: wynik pojawi się jako propozycja, którą możesz przyjąć, a potem zmienić ręcznie"
  ru: "Запустить автоматическое составление выходов и смен: результат появится как предложение, которое можно принять, а затем изменить вручную"
  uk: "Запустити автоматичне складання оборотів і змін: результат з'явиться як пропозиція, яку можна прийняти, а потім змінити вручну"
"Take the last change of the blocks or duties back":
  de: "Die letzte Änderung an Umläufen oder Diensten zurücknehmen"
  fr: "Annuler la dernière modification des services"
  nl: "De laatste wijziging van de omlopen of diensten terugdraaien"
  pl: "Cofnij ostatnią zmianę brygad lub służb"
  ru: "Отменить последнее изменение выходов или смен"
  uk: "Скасувати останню зміну оборотів або змін"
"Laid out by hand: holds every %{day}. The roster gives its buses and drivers.":
  de: "Von Hand geplant: gilt jeden %{day}. Der Dienstplan gibt ihm Busse und Fahrer."
  fr: "Composé à la main : vaut pour chaque %{day}. Le roulement lui donne ses bus et ses conducteurs."
  nl: "Met de hand ingedeeld: geldt elke %{day}. Het rooster geeft er de bussen en chauffeurs aan."
  pl: "Ułożone ręcznie: obowiązuje w każdy %{day}. Grafik przydziela autobusy i kierowców."
  ru: "Составлено вручную: действует каждый %{day}. Автобусы и водителей назначает график."
  uk: "Складено вручну: діє щоразу в %{day}. Автобуси й водіїв призначає графік."
"The automatic blocks and duties of every %{day}: drag a trip or tap between two trips to change them.":
  de: "Die automatischen Umläufe und Dienste jedes %{day}: eine Fahrt ziehen oder zwischen zwei Fahrten tippen, um sie zu ändern."
  fr: "Les services automatiques de chaque %{day} : faites glisser un voyage ou touchez entre deux voyages pour les modifier."
  nl: "De automatische omlopen en diensten van elke %{day}: sleep een rit of tik tussen twee ritten om ze te veranderen."
  pl: "Automatyczne brygady i służby na każdy %{day}: przeciągnij kurs albo stuknij między dwoma kursami, aby je zmienić."
  ru: "Автоматические выходы и смены на каждый %{day}: перетащите рейс или нажмите между двумя рейсами, чтобы изменить их."
  uk: "Автоматичні обороти й зміни на кожен %{day}: перетягніть рейс або торкніться між двома рейсами, щоб змінити їх."
"The last change is taken back.":
  de: "Die letzte Änderung ist zurückgenommen."
  fr: "La dernière modification est annulée."
  nl: "De laatste wijziging is teruggedraaid."
  pl: "Ostatnia zmiana została cofnięta."
  ru: "Последнее изменение отменено."
  uk: "Останню зміну скасовано."
"The timetable changed: line %{n} runs with the automatic blocks and duties again.":
  de: "Der Fahrplan hat sich geändert: Linie %{n} fährt wieder mit den automatischen Umläufen und Diensten."
  fr: "L'horaire a changé : la ligne %{n} roule de nouveau avec les services automatiques."
  nl: "De dienstregeling is veranderd: lijn %{n} rijdt weer met de automatische omlopen en diensten."
  pl: "Rozkład się zmienił: linia %{n} znów jeździ według automatycznych brygad i służb."
  ru: "Расписание изменилось: маршрут %{n} снова работает с автоматическими выходами и сменами."
  uk: "Розклад змінився: маршрут %{n} знову працює з автоматичними оборотами й змінами."
"Buses at the peak":
  de: "Busse in der Spitze"
  fr: "Bus à la pointe"
  nl: "Bussen in de spits"
  pl: "Autobusy w szczycie"
  ru: "Автобусов в пик"
  uk: "Автобусів у пік"
"Paid driver hours":
  de: "Bezahlte Fahrerstunden"
  fr: "Heures de conduite payées"
  nl: "Betaalde chauffeursuren"
  pl: "Płatne godziny kierowców"
  ru: "Оплачиваемые часы водителей"
  uk: "Оплачувані години водіїв"
"Deadhead km":
  de: "Leer-km"
  fr: "Km haut-le-pied"
  nl: "Lege km"
  pl: "Km bez pasażerów"
  ru: "Нулевой пробег"
  uk: "Нульовий пробіг"
"Cost of the day":
  de: "Kosten des Tages"
  fr: "Coût de la journée"
  nl: "Kosten van de dag"
  pl: "Koszt dnia"
  ru: "Затраты за день"
  uk: "Витрати за день"
"Keep mine":
  de: "Meins behalten"
  fr: "Garder le mien"
  nl: "Mijn eigen houden"
  pl: "Zostaw moje"
  ru: "Оставить моё"
  uk: "Залишити моє"
"Proposal: the automatic blocks and duties. The figures show it against yours.":
  de: "Vorschlag: die automatischen Umläufe und Dienste. Die Zahlen zeigen ihn gegenüber Ihren."
  fr: "Proposition : les services automatiques. Les chiffres la comparent aux vôtres."
  nl: "Voorstel: de automatische omlopen en diensten. De cijfers zetten het af tegen de uwe."
  pl: "Propozycja: automatyczne brygady i służby. Liczby porównują ją z twoimi."
  ru: "Предложение: автоматические выходы и смены. Цифры сравнивают его с вашими."
  uk: "Пропозиція: автоматичні обороти й зміни. Цифри порівнюють її з вашими."
"Your day is the automatic one already: the proposal is the same.":
  de: "Ihr Tag ist schon der automatische: der Vorschlag ist derselbe."
  fr: "Votre journée est déjà l'automatique : la proposition est identique."
  nl: "Uw dag is al de automatische: het voorstel is hetzelfde."
  pl: "Twój dzień już jest automatyczny: propozycja jest taka sama."
  ru: "Ваш день уже автоматический: предложение такое же."
  uk: "Ваш день уже автоматичний: пропозиція така сама."
"The automatic blocks and duties are taken: change them by hand from here.":
  de: "Die automatischen Umläufe und Dienste sind übernommen: ändern Sie sie von hier aus von Hand."
  fr: "Les services automatiques sont repris : modifiez-les à la main à partir d'ici."
  nl: "De automatische omlopen en diensten zijn overgenomen: pas ze vanaf hier met de hand aan."
  pl: "Przyjęto automatyczne brygady i służby: odtąd zmieniaj je ręcznie."
  ru: "Автоматические выходы и смены приняты: дальше меняйте их вручную."
  uk: "Автоматичні обороти й зміни прийнято: далі змінюйте їх вручну."
"Show more of the day (Ctrl and the wheel)":
  de: "Mehr vom Tag zeigen (Strg und Mausrad)"
  fr: "Afficher une plus grande partie de la journée (Ctrl et molette)"
  nl: "Meer van de dag tonen (Ctrl en het wieltje)"
  pl: "Pokaż większą część dnia (Ctrl i kółko)"
  ru: "Показать больше дня (Ctrl и колесо)"
  uk: "Показати більше дня (Ctrl і коліщатко)"
"Show the hours wider (Ctrl and the wheel; Shift and the wheel moves along the day)":
  de: "Die Stunden breiter zeigen (Strg und Mausrad; Umschalt und Mausrad verschiebt den Tag)"
  fr: "Élargir les heures (Ctrl et molette ; Maj et molette pour parcourir la journée)"
  nl: "De uren breder tonen (Ctrl en het wieltje; Shift en het wieltje schuift door de dag)"
  pl: "Pokaż godziny szerzej (Ctrl i kółko; Shift i kółko przesuwa dzień)"
  ru: "Показать часы шире (Ctrl и колесо; Shift и колесо — прокрутка по дню)"
  uk: "Показати години ширше (Ctrl і коліщатко; Shift і коліщатко — прокрутка днем)"
"Take the duty apart: each piece a duty of its own":
  de: "Den Dienst auflösen: jedes Stück ein eigener Dienst"
  fr: "Séparer le service : chaque morceau devient un service à part"
  nl: "De dienst uit elkaar halen: elk stuk een eigen dienst"
  pl: "Rozdziel służbę: każdy kawałek osobną służbą"
  ru: "Разделить смену: каждая часть станет отдельной сменой"
  uk: "Розділити зміну: кожна частина стане окремою зміною"
"Split":
  de: "Geteilt"
  fr: "Coupure"
  nl: "Gebroken"
  pl: "Przerwa"
  ru: "Разрыв"
  uk: "Розрив"
"A driver takes over here, at %{stop}. Tap to join the two duties.":
  de: "Hier übernimmt ein Fahrer, an %{stop}. Tippen, um die beiden Dienste zu verbinden."
  fr: "Un conducteur prend la relève ici, à %{stop}. Touchez pour réunir les deux services."
  nl: "Hier neemt een chauffeur het over, bij %{stop}. Tik om de twee diensten samen te voegen."
  pl: "Tu zmienia się kierowca, na przystanku %{stop}. Stuknij, aby połączyć obie służby."
  ru: "Здесь водителя сменяют, на %{stop}. Нажмите, чтобы объединить две смены."
  uk: "Тут водія змінюють, на %{stop}. Торкніться, щоб об'єднати дві зміни."
"Tap to cut the duty here: a driver takes over at %{stop}.":
  de: "Tippen, um den Dienst hier zu teilen: an %{stop} übernimmt ein Fahrer."
  fr: "Touchez pour couper le service ici : un conducteur prend la relève à %{stop}."
  nl: "Tik om de dienst hier te knippen: bij %{stop} neemt een chauffeur het over."
  pl: "Stuknij, aby przeciąć służbę tutaj: na przystanku %{stop} zmienia się kierowca."
  ru: "Нажмите, чтобы разрезать смену здесь: на %{stop} водителя сменяют."
  uk: "Торкніться, щоб розрізати зміну тут: на %{stop} водія змінюють."
"Drop here: the trip runs with a new bus":
  de: "Hier ablegen: die Fahrt fährt mit einem neuen Bus"
  fr: "Déposez ici : le voyage roule avec un nouveau bus"
  nl: "Hier loslaten: de rit rijdt met een nieuwe bus"
  pl: "Upuść tutaj: kurs pojedzie nowym autobusem"
  ru: "Отпустите здесь: рейс пойдёт новым автобусом"
  uk: "Відпустіть тут: рейс піде новим автобусом"
"New bus: drag a trip here":
  de: "Neuer Bus: eine Fahrt hierher ziehen"
  fr: "Nouveau bus : faites glisser un voyage ici"
  nl: "Nieuwe bus: sleep een rit hierheen"
  pl: "Nowy autobus: przeciągnij tu kurs"
  ru: "Новый автобус: перетащите сюда рейс"
  uk: "Новий автобус: перетягніть сюди рейс"
"In the timetable: tour %{t}":
  de: "Im Fahrplan: Umlauf %{t}"
  fr: "Dans l'horaire : service %{t}"
  nl: "In de dienstregeling: omloop %{t}"
  pl: "W rozkładzie: brygada %{t}"
  ru: "В расписании: выход %{t}"
  uk: "У розкладі: оборот %{t}"
"Drag it to another bus of the line, or to the New bus row.":
  de: "Ziehen Sie sie auf einen anderen Bus der Linie oder in die Zeile Neuer Bus."
  fr: "Faites-le glisser vers un autre bus de la ligne, ou vers la rangée Nouveau bus."
  nl: "Sleep hem naar een andere bus van de lijn, of naar de rij Nieuwe bus."
  pl: "Przeciągnij go na inny autobus linii albo do wiersza Nowy autobus."
  ru: "Перетащите его на другой автобус маршрута или в строку «Новый автобус»."
  uk: "Перетягніть його на інший автобус маршруту або в рядок «Новий автобус»."
"Planning back to automatic":
  de: "Planung wieder automatisch"
  fr: "Planification revenue en automatique"
  nl: "Planning weer automatisch"
  pl: "Planowanie znów automatyczne"
  ru: "Планирование снова автоматическое"
  uk: "Планування знову автоматичне"
"The timetable of line %{n} changed: the blocks and duties you laid out for it in the planning no longer fit, so it runs with the automatic ones again.":
  de: "Der Fahrplan der Linie %{n} hat sich geändert: die Umläufe und Dienste, die Sie in der Planung dafür angelegt hatten, passen nicht mehr, darum fährt sie wieder mit den automatischen."
  fr: "L'horaire de la ligne %{n} a changé : les services que vous aviez composés pour elle dans la planification ne conviennent plus, elle roule donc de nouveau avec les services automatiques."
  nl: "De dienstregeling van lijn %{n} is veranderd: de omlopen en diensten die u er in de planning voor had ingedeeld passen niet meer, dus rijdt hij weer met de automatische."
  pl: "Rozkład linii %{n} się zmienił: brygady i służby ułożone dla niej w planowaniu już nie pasują, więc znów jeździ według automatycznych."
  ru: "Расписание маршрута %{n} изменилось: выходы и смены, составленные для него в планировании, больше не подходят, поэтому он снова работает с автоматическими."
  uk: "Розклад маршруту %{n} змінився: обороти й зміни, складені для нього в плануванні, більше не підходять, тому він знову працює з автоматичними."
"It overlaps another trip of this bus.":
  de: "Sie überschneidet sich mit einer anderen Fahrt dieses Busses."
  fr: "Il chevauche un autre voyage de ce bus."
  nl: "Hij overlapt een andere rit van deze bus."
  pl: "Nakłada się na inny kurs tego autobusu."
  ru: "Он пересекается с другим рейсом этого автобуса."
  uk: "Він перетинається з іншим рейсом цього автобуса."
"No time to get there: the bus cannot reach the trip's first stop in time.":
  de: "Keine Zeit hinzukommen: der Bus erreicht die erste Haltestelle der Fahrt nicht rechtzeitig."
  fr: "Pas le temps d'y aller : le bus ne peut pas atteindre à temps le premier arrêt du voyage."
  nl: "Geen tijd om er te komen: de bus haalt de eerste halte van de rit niet op tijd."
  pl: "Brak czasu na dojazd: autobus nie zdąży na pierwszy przystanek kursu."
  ru: "Не успеть: автобус не доберётся вовремя до первой остановки рейса."
  uk: "Не встигнути: автобус не доїде вчасно до першої зупинки рейсу."
"The bus is still in the depot then: it leaves for its first trip later.":
  de: "Der Bus ist dann noch im Depot: er rückt erst später zu seiner ersten Fahrt aus."
  fr: "Le bus est encore au dépôt à ce moment : il ne sort que plus tard pour son premier voyage."
  nl: "De bus staat dan nog in de remise: hij rukt pas later uit voor zijn eerste rit."
  pl: "Autobus jest wtedy jeszcze w zajezdni: wyjeżdża na pierwszy kurs później."
  ru: "Автобус тогда ещё в депо: он выезжает на первый рейс позже."
  uk: "Автобус тоді ще в депо: він виїжджає на перший рейс пізніше."
"The bus is back in the depot by then.":
  de: "Der Bus ist bis dahin schon wieder im Depot."
  fr: "Le bus est déjà rentré au dépôt à ce moment."
  nl: "De bus is dan al terug in de remise."
  pl: "Autobus jest już wtedy z powrotem w zajezdni."
  ru: "К этому времени автобус уже вернулся в депо."
  uk: "На той час автобус уже повернувся в депо."
"A bus keeps to its line: move the trip to a bus of the same line.":
  de: "Ein Bus bleibt auf seiner Linie: verschieben Sie die Fahrt auf einen Bus derselben Linie."
  fr: "Un bus reste sur sa ligne : déplacez le voyage vers un bus de la même ligne."
  nl: "Een bus blijft op zijn lijn: verplaats de rit naar een bus van dezelfde lijn."
  pl: "Autobus trzyma się swojej linii: przenieś kurs na autobus tej samej linii."
  ru: "Автобус работает на своём маршруте: перенесите рейс на автобус того же маршрута."
  uk: "Автобус працює на своєму маршруті: перенесіть рейс на автобус того самого маршруту."
"Only a trip with passengers can be moved.":
  de: "Nur eine Fahrt mit Fahrgästen lässt sich verschieben."
  fr: "Seul un voyage avec voyageurs peut être déplacé."
  nl: "Alleen een rit met reizigers kan worden verplaatst."
  pl: "Przenieść można tylko kurs z pasażerami."
  ru: "Перенести можно только рейс с пассажирами."
  uk: "Перенести можна лише рейс із пасажирами."
"The trip is on this bus already.":
  de: "Die Fahrt ist schon auf diesem Bus."
  fr: "Le voyage est déjà sur ce bus."
  nl: "De rit zit al op deze bus."
  pl: "Ten kurs jest już na tym autobusie."
  ru: "Этот рейс уже на этом автобусе."
  uk: "Цей рейс уже на цьому автобусі."
"This bus runs only this trip already.":
  de: "Dieser Bus fährt schon nur diese Fahrt."
  fr: "Ce bus ne fait déjà que ce voyage."
  nl: "Deze bus rijdt al alleen deze rit."
  pl: "Ten autobus i tak wykonuje tylko ten kurs."
  ru: "Этот автобус и так выполняет только этот рейс."
  uk: "Цей автобус і так виконує лише цей рейс."
"A duty can only be cut between two trips.":
  de: "Ein Dienst lässt sich nur zwischen zwei Fahrten teilen."
  fr: "Un service ne peut être coupé qu'entre deux voyages."
  nl: "Een dienst kan alleen tussen twee ritten worden geknipt."
  pl: "Służbę można przeciąć tylko między dwoma kursami."
  ru: "Смену можно разрезать только между двумя рейсами."
  uk: "Зміну можна розрізати лише між двома рейсами."
"A new duty begins there already.":
  de: "Dort beginnt schon ein neuer Dienst."
  fr: "Un nouveau service commence déjà là."
  nl: "Daar begint al een nieuwe dienst."
  pl: "Tam już zaczyna się nowa służba."
  ru: "Там уже начинается новая смена."
  uk: "Там уже починається нова зміна."
"The bus is on the move there: drivers change only where it stands.":
  de: "Der Bus ist dort unterwegs: Fahrer wechseln nur, wo er steht."
  fr: "Le bus roule à cet endroit : les conducteurs ne se relaient que là où il est à l'arrêt."
  nl: "De bus is daar onderweg: chauffeurs wisselen alleen waar hij stilstaat."
  pl: "Autobus jest tam w drodze: kierowcy zmieniają się tylko tam, gdzie stoi."
  ru: "Там автобус в пути: водители меняются только там, где он стоит."
  uk: "Там автобус у дорозі: водії змінюються лише там, де він стоїть."
"Drivers change only at the line's termini or at the depot.":
  de: "Fahrer wechseln nur an den Endhaltestellen der Linie oder im Depot."
  fr: "Les conducteurs ne se relaient qu'aux terminus de la ligne ou au dépôt."
  nl: "Chauffeurs wisselen alleen aan de eindpunten van de lijn of in de remise."
  pl: "Kierowcy zmieniają się tylko na pętlach linii albo w zajezdni."
  ru: "Водители меняются только на конечных маршрута или в депо."
  uk: "Водії змінюються лише на кінцевих маршруту або в депо."
"Each duty needs a trip with passengers.":
  de: "Jeder Dienst braucht eine Fahrt mit Fahrgästen."
  fr: "Chaque service a besoin d'un voyage avec voyageurs."
  nl: "Elke dienst heeft een rit met reizigers nodig."
