"Your dealers sell you articulated buses: 18 metres, half as many places again as a solo bus.":
  de: "Ihre Händler verkaufen Ihnen Gelenkbusse: 18 Meter, anderthalbmal so viele Plätze wie ein Solobus."
  fr: "Vos concessionnaires vous vendent des bus articulés : 18 mètres, moitié plus de places qu'un bus standard."
  nl: "Je dealers verkopen je gelede bussen: 18 meter, de helft meer plaatsen dan een solobus."
  pl: "Dealerzy sprzedają Ci autobusy przegubowe: 18 metrów, o połowę więcej miejsc niż autobus solo."
  ru: "Дилеры продают вам сочленённые автобусы: 18 метров, в полтора раза больше мест, чем у одиночного автобуса."
  uk: "Дилери продають вам зчленовані автобуси: 18 метрів, у півтора раза більше місць, ніж в одиночного автобуса."
"Your dealers sell you double-deckers: many seats on the footprint of a solo bus.":
  de: "Ihre Händler verkaufen Ihnen Doppeldecker: viele Sitzplätze auf der Fläche eines Solobusses."
  fr: "Vos concessionnaires vous vendent des bus à impériale : beaucoup de places assises sur l'emprise d'un bus standard."
  nl: "Je dealers verkopen je dubbeldekkers: veel zitplaatsen op de oppervlakte van een solobus."
  pl: "Dealerzy sprzedają Ci autobusy piętrowe: wiele miejsc siedzących na powierzchni autobusu solo."
  ru: "Дилеры продают вам двухэтажные автобусы: много сидячих мест на площади одиночного автобуса."
  uk: "Дилери продають вам двоповерхові автобуси: багато сидячих місць на площі одиночного автобуса."
