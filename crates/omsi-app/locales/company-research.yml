"What falls under half of what the stores keep - and what a waiting bus needs - is ordered for the free delivery of the next day.":
  de: "Was unter die Hälfte des Lagerbestands fällt - und was ein wartender Bus braucht -, wird für die kostenlose Lieferung am nächsten Tag bestellt."
  fr: "Ce qui tombe sous la moitié du stock prévu - et ce dont un bus en attente a besoin - est commandé pour la livraison gratuite du lendemain."
  nl: "Wat onder de helft zakt van wat het magazijn aanhoudt - en wat een wachtende bus nodig heeft - wordt besteld voor de gratis levering van de volgende dag."
  pl: "To, co spada poniżej połowy zapasu magazynu, i to, czego potrzebuje czekający autobus, jest zamawiane z bezpłatną dostawą na następny dzień."
  ru: "То, что опускается ниже половины нормы склада, и то, что нужно ждущему автобусу, заказывается с бесплатной доставкой на следующий день."
  uk: "Те, що опускається нижче половини норми складу, і те, що потрібно автобусу в очікуванні, замовляється з безкоштовною доставкою наступного дня."
