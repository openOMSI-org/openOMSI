"No mechanics at work: an outside garage repairs the buses that break down, in its own time. Hire mechanics on the Staff page.":
  de: "Keine Mechaniker bei der Arbeit: Eine fremde Werkstatt repariert die liegengebliebenen Busse in ihrem eigenen Tempo. Stellen Sie auf der Seite Personal Mechaniker ein."
  fr: "Aucun mécanicien au travail : un garage extérieur répare les bus en panne, à son rythme. Embauchez des mécaniciens sur la page Personnel."
  nl: "Geen monteurs aan het werk: een externe garage repareert de bussen met pech, in zijn eigen tempo. Neem monteurs aan op de pagina Personeel."
  pl: "Brak mechaników w pracy: zepsute autobusy naprawia zewnętrzny warsztat we własnym tempie. Zatrudnij mechaników na stronie Personel."
  ru: "Механиков на работе нет: сломавшиеся автобусы ремонтирует сторонний сервис в своём темпе. Наймите механиков на странице «Персонал»."
