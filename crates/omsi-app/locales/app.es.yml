"Enhanced: the clouds' shadow moving over the land and the sun's shafts through the gaps of a broken sky": "Enhanced: la sombra de las nubes que se desplaza por el terreno y los haces de sol entre los claros de un cielo fragmentado"
"Enhanced: the glare round bright lights and the lamps' halo in the night air": "Enhanced: el resplandor alrededor de las luces brillantes y el halo de las lámparas en el aire de la noche"
"Sets the graphics mode and most of the options at once, from Low (Vanilla) to Ultra (Enhanced with everything on)": "Ajusta el modo gráfico y la mayoría de las opciones a la vez, de «Bajo» (Vanilla) a «Ultra» (Enhanced con todo activado)"
"AI Lists": "Listas de IA"
