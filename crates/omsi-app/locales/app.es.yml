"The wheel is unavailable. Reconnect it and try again.": "El volante no está disponible. Vuelve a conectarlo e inténtalo de nuevo."
"Move the wheel away from its end stops and try again.": "Aleja el volante de los topes de giro y vuelve a intentarlo."
"The wheel did not settle. Let go and try again.": "El volante no se ha estabilizado. Suéltalo y vuelve a intentarlo."
"The wheel moved too far. Test stopped.": "El volante se ha movido demasiado. Prueba detenida."
"The result is inconclusive. Retry or choose the direction manually.": "El resultado no es concluyente. Repite la prueba o elige el sentido manualmente."
"Force feedback is unavailable. Choose the direction manually.": "La respuesta de fuerza no está disponible. Elige el sentido manualmente."
