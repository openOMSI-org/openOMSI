"Soft limits: active downloads may temporarily exceed them, then older files are removed when safe.":
  be: "Мяккія абмежаванні: спампоўванні могуць часова перавышаць іх; старыя файлы выдаляюцца, калі гэта бяспечна."
  ca: "Límits flexibles: es poden superar durant les descàrregues; els fitxers antics s’eliminen quan és segur."
  cs: "Měkké limity: stahování je může dočasně překročit; starší soubory se odstraní, až to bude bezpečné."
  de: "Weiche Grenzen: Downloads dürfen sie vorübergehend überschreiten; ältere Dateien werden entfernt, sobald es sicher ist."
  es: "Límites flexibles: las descargas activas pueden superarlos temporalmente; los archivos antiguos se eliminan cuando sea seguro."
  fr: "Limites souples : les téléchargements peuvent les dépasser temporairement ; les anciens fichiers sont supprimés dès que cela est sûr."
  hi: "लचीली सीमाएँ: डाउनलोड इन्हें अस्थायी रूप से पार कर सकते हैं; सुरक्षित होने पर पुरानी फ़ाइलें हटती हैं।"
  hu: "Rugalmas korlátok: a letöltések átmenetileg túlléphetik őket; a régi fájlok biztonságos időpontban törlődnek."
  id: "Batas lunak: unduhan boleh melampauinya sementara; berkas lama dihapus saat aman."
  it: "Limiti flessibili: i download possono superarli temporaneamente; i file vecchi vengono rimossi quando è sicuro."
  ja: "柔軟な上限です。ダウンロード中は一時的に超過でき、安全になり次第古いファイルを削除します。"
  ka: "მოქნილი ლიმიტები: ჩამოტვირთვისას დროებითი გადაჭარბება დასაშვებია; ძველი ფაილები წაიშლება, როცა უსაფრთხო იქნება."
  kk: "Икемді шектер: жүктемелер олардан уақытша аса алады; ескі файлдар қауіпсіз болғанда жойылады."
  ko: "유연한 한도: 다운로드 중에는 일시적으로 초과할 수 있으며 안전해지면 오래된 파일을 삭제합니다."
  ms: "Had fleksibel: muat turun boleh melebihinya sementara; fail lama dipadam apabila selamat."
  nl: "Flexibele limieten: downloads mogen deze tijdelijk overschrijden; oude bestanden worden verwijderd zodra dat veilig is."
  pl: "Elastyczne limity: pobieranie może je chwilowo przekraczać; stare pliki są usuwane, gdy jest to bezpieczne."
  pt: "Limites flexíveis: downloads ativos podem ultrapassá-los temporariamente; os arquivos antigos são removidos quando for seguro."
  pt-pt: "Limites flexíveis: downloads ativos podem ultrapassá-los temporariamente; os arquivos antigos são removidos quando for seguro."
  ru: "Мягкие ограничения: загрузки могут временно превышать их; старые файлы удаляются, когда это безопасно."
  sr: "Меке границе: преузимања их могу привремено премашити; стари фајлови се уклањају када је безбедно."
  sv: "Mjuka gränser: nedladdningar får överskrida dem tillfälligt; äldre filer tas bort när det är säkert."
  th: "ขีดจำกัดแบบยืดหยุ่น: ดาวน์โหลดอาจเกินชั่วคราว และจะลบไฟล์เก่าเมื่อปลอดภัย"
  tl: "Maluwag na limitasyon: puwedeng pansamantalang lumampas ang pag-download; binubura ang lumang file kapag ligtas na."
  tr: "Esnek sınırlar: indirmeler geçici olarak aşabilir; eski dosyalar güvenli olduğunda kaldırılır."
  uk: "М’які обмеження: завантаження можуть тимчасово перевищувати їх; старі файли видаляються, коли це безпечно."
  vi: "Giới hạn mềm: tải xuống có thể tạm vượt giới hạn; tệp cũ sẽ bị xóa khi an toàn."
  zh: "软上限：下载时可暂时超出，安全时会删除旧文件。"
  zh-tw: "軟上限：下載時可暫時超出，安全時會刪除舊檔案。"

