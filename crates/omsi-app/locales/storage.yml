"Cached files can be downloaded or rebuilt again. Installed mods, saves and settings will not be removed. Close the game first.":
  be: "Файлы кэша можна спампаваць або стварыць зноў. Усталяваныя моды, захаванні і налады застануцца. Спачатку закрыйце гульню."
  ca: "La memòria cau es pot tornar a baixar o generar. No s’eliminaran mods instal·lats, partides desades ni configuració. Tanqueu primer el joc."
  cs: "Soubory mezipaměti lze znovu stáhnout nebo vytvořit. Nainstalované mody, uložené hry a nastavení zůstanou. Nejprve zavřete hru."
  de: "Cache-Dateien können erneut heruntergeladen oder erzeugt werden. Installierte Mods, Spielstände und Einstellungen bleiben erhalten. Zuerst das Spiel schließen."
  es: "Los archivos en caché se pueden descargar o reconstruir. No se borrarán mods instalados, partidas guardadas ni ajustes. Cierra el juego primero."
  fr: "Les fichiers en cache peuvent être téléchargés ou générés à nouveau. Les mods installés, sauvegardes et réglages seront conservés. Fermez d’abord le jeu."
  hi: "कैश फ़ाइलें दोबारा डाउनलोड या बनाई जा सकती हैं। इंस्टॉल किए मॉड, सेव और सेटिंग नहीं हटेंगे। पहले गेम बंद करें।"
  hu: "A gyorsítótár fájljai újra letölthetők vagy létrehozhatók. A telepített modok, mentések és beállítások megmaradnak. Előbb zárja be a játékot."
  id: "Berkas cache dapat diunduh atau dibuat ulang. Mod terpasang, simpanan, dan pengaturan tidak dihapus. Tutup permainan dahulu."
  it: "I file nella cache possono essere riscaricati o rigenerati. Mod installate, salvataggi e impostazioni non saranno rimossi. Chiudi prima il gioco."
  ja: "キャッシュは再ダウンロードまたは再生成できます。インストール済みMOD、セーブ、設定は削除しません。先にゲームを終了してください。"
  ka: "ქეშის ფაილები ხელახლა ჩამოიტვირთება ან შეიქმნება. დაყენებული მოდები, შენახული თამაშები და პარამეტრები არ წაიშლება. ჯერ დახურეთ თამაში."
  kk: "Кэш файлдарын қайта жүктеуге не жасауға болады. Орнатылған модтар, сақталған ойындар мен баптаулар жойылмайды. Алдымен ойынды жабыңыз."
  ko: "캐시 파일은 다시 다운로드하거나 생성할 수 있습니다. 설치된 모드, 저장 파일, 설정은 삭제되지 않습니다. 먼저 게임을 종료하세요."
  ms: "Fail cache boleh dimuat turun atau dibina semula. Mod terpasang, simpanan dan tetapan tidak dipadam. Tutup permainan dahulu."
  nl: "Cachebestanden kunnen opnieuw worden gedownload of opgebouwd. Geïnstalleerde mods, opgeslagen spellen en instellingen blijven behouden. Sluit eerst het spel."
  pl: "Pliki pamięci można pobrać lub utworzyć ponownie. Zainstalowane mody, zapisy i ustawienia pozostaną. Najpierw zamknij grę."
  pt: "Os arquivos em cache podem ser baixados ou recriados novamente. Mods instalados, jogos salvos e configurações não serão apagados. Feche o jogo antes."
  pt-pt: "Os arquivos em cache podem ser baixados ou recriados novamente. Mods instalados, jogos salvos e configurações não serão apagados. Feche o jogo antes."
  ru: "Файлы кэша можно скачать или создать заново. Установленные моды, сохранения и настройки останутся. Сначала закройте игру."
  sr: "Фајлови кеша се могу поново преузети или направити. Инсталирани модови, сачуване игре и подешавања остају. Прво затворите игру."
  sv: "Cachefiler kan hämtas eller skapas igen. Installerade moddar, sparfiler och inställningar tas inte bort. Stäng spelet först."
  th: "ไฟล์แคชสามารถดาวน์โหลดหรือสร้างใหม่ได้ ม็อดที่ติดตั้ง ไฟล์บันทึก และการตั้งค่าจะไม่ถูกลบ โปรดปิดเกมก่อน"
  tl: "Puwedeng i-download o buuin muli ang cache. Hindi buburahin ang naka-install na mod, save at setting. Isara muna ang laro."
  tr: "Önbellek dosyaları yeniden indirilebilir veya üretilebilir. Kurulu modlar, kayıtlar ve ayarlar silinmez. Önce oyunu kapatın."
  uk: "Файли кешу можна завантажити або створити знову. Встановлені моди, збереження й налаштування залишаться. Спочатку закрийте гру."
  vi: "Tệp đệm có thể tải hoặc tạo lại. Bản mod đã cài, bản lưu và cài đặt sẽ được giữ nguyên. Hãy đóng trò chơi trước."
  zh: "缓存文件可以重新下载或生成。不会删除已安装的模组、存档或设置。请先关闭游戏。"
  zh-tw: "快取檔案可以重新下載或產生。不會刪除已安裝的模組、存檔或設定。請先關閉遊戲。"

