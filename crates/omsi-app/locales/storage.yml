  pt: "Limites flexíveis: downloads ativos podem ultrapassá-los temporariamente; os arquivos antigos são removidos quando for seguro."
  es: "Límites flexibles: las descargas activas pueden superarlos temporalmente; los archivos antiguos se eliminan cuando sea seguro."
