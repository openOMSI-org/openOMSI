"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "O SteamOS não o inclui. No Modo Ambiente de Trabalho, no Konsole: sudo steamos-readonly disable, depois sudo pacman -S webkit2gtk-4.1, depois sudo steamos-readonly enable (uma atualização do SteamOS pode voltar a removê-lo). Consulte docs/USER_GUIDE.md."
