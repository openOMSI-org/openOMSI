"The test was interrupted. Please try again.": "O teste foi interrompido. Tente novamente."
"The wheel is unavailable. Reconnect it and try again.": "O volante não está disponível. Volte a ligá-lo e tente novamente."
"Move the wheel away from its end stops and try again.": "Afaste o volante dos batentes de fim de curso e tente novamente."
"The wheel did not settle. Let go and try again.": "O volante não ficou imóvel. Solte-o e tente novamente."
"The wheel moved too far. Test stopped.": "O volante moveu-se demasiado. Teste interrompido."
"The result is inconclusive. Retry or choose the direction manually.": "O resultado é inconclusivo. Tente novamente ou escolha a direção manualmente."
"Force feedback is unavailable. Choose the direction manually.": "O force feedback não está disponível. Escolha a direção manualmente."
