"Enhanced: the clouds' shadow moving over the land and the sun's shafts through the gaps of a broken sky": "Enhanced: a sombra das nuvens que se desloca sobre o terreno e os feixes de sol pelas aberturas de um céu fragmentado"
"Enhanced: the glare round bright lights and the lamps' halo in the night air": "Enhanced: o brilho à volta de luzes fortes e o halo das lâmpadas no ar da noite"
"Sets the graphics mode and most of the options at once, from Low (Vanilla) to Ultra (Enhanced with everything on)": "Define o modo gráfico e a maioria das opções de uma só vez, de «Baixo» (Vanilla) a «Ultra» (Enhanced com tudo ativado)"
"AI Lists": "Listas de IA"
