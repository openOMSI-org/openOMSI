"Changes take effect the next time you drive, or after Reload saved controllers in the game's controller menu.": "Thay đổi có hiệu lực từ lần lái tiếp theo, hoặc sau khi chọn “Tải lại bộ điều khiển đã lưu” trong menu bộ điều khiển của trò chơi."
"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "Mức xe buýt đang chạy kéo vô lăng về thẳng sau khi vào cua; khi xe đứng yên vô lăng không bao giờ bị kéo."
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "Mức vô lăng cản lại chuyển động nhanh, để vô lăng khi buông tay dừng ở giữa thay vì văng quá; tăng lên nếu vô lăng dao động."
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "Vô lăng nặng thế nào khi xe buýt đứng yên hoặc bò chậm; nhẹ dần khi xe lăn bánh."
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "Nâng các lực nhỏ nhất lên trên ngưỡng mà vô lăng của bạn bắt đầu cảm nhận được; hữu ích với vô lăng dây đai và bánh răng có vùng chết ở giữa, để 0 với direct drive."
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "Làm dịu các bước nhảy đột ngột của lực đánh lái, vốn có thể thấy lợn cợn trên vô lăng mạnh khi tốc độ khung hình thấp; giá trị cao hơn thêm một chút độ trễ."
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "Cường độ chung của lực đánh lái trên vô lăng này; giảm xuống với đế direct drive mạnh, tăng lên với vô lăng yếu."
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "Cường độ chung của rung lắc, cú va vào lề đường và độ rung của mặt đường và động cơ trên vô lăng này."
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "Tắt: trò chơi không gửi lực nào tới vô lăng; lực cản còn lại đến từ phần mềm trình điều khiển riêng của vô lăng (ví dụ lò xo hồi tâm trong Logitech G HUB)"
"The running engine buzzes in the wheel, felt even at a standstill": "Động cơ đang chạy rung nhẹ trong vô lăng, cảm nhận được cả khi đứng yên"
