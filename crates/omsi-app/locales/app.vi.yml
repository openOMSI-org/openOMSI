"Shows a generated frame between every two drawn ones: smoother motion for a little more input lag. Needs Apple MetalFX upscaling and works best from 30 drawn frames a second; with V-sync the game draws half the display's rate": "Hiển thị một khung hình được tạo ra giữa mỗi hai khung hình được vẽ: chuyển động mượt hơn, đổi lại độ trễ đầu vào tăng nhẹ. Cần nâng độ phân giải Apple MetalFX và hoạt động tốt nhất từ 30 khung hình được vẽ mỗi giây; khi bật V-sync, trò chơi vẽ một nửa tần số của màn hình"
"Standard Catmull-Rom or AMD FSR 1 change at once; NVIDIA DLSS or AMD FSR 3 take the place of the anti-aliasing and the render scale, on DirectX 12 or Vulkan, from the next start": "Catmull-Rom tiêu chuẩn hoặc AMD FSR 1 thay đổi ngay lập tức; NVIDIA DLSS hoặc AMD FSR 3 thay thế khử răng cưa và tỷ lệ kết xuất, trên DirectX 12 hoặc Vulkan, từ lần khởi động tiếp theo"
