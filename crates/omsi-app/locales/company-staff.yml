"Ticket inspectors can be hired once the company has researched ticket inspection.":
  nl: "Kaartjescontroleurs kunnen worden aangenomen zodra het bedrijf kaartcontrole heeft onderzocht."
  de: "Fahrkartenkontrolleure können eingestellt werden, sobald das Unternehmen die Fahrkartenkontrolle erforscht hat."
  fr: "Les contrôleurs peuvent être embauchés une fois que l'entreprise a recherché le contrôle des billets."
  ru: "Контролёров можно нанять, когда компания исследует проверку билетов."
  uk: "Контролерів можна найняти, коли компанія дослідить перевірку квитків."
  pl: "Kontrolerów biletów można zatrudnić, gdy firma zbada kontrolę biletów."
"Bus drivers work their duties: plan them on the Planning page.":
  nl: "Buschauffeurs rijden hun diensten: plan ze op de pagina Planning."
  de: "Busfahrer fahren ihre Dienste: plane sie auf der Seite Planung."
  fr: "Les conducteurs font leurs services : planifiez-les sur la page Planification."
  ru: "Водители работают по своим сменам: планируйте их на странице «Планирование»."
  uk: "Водії працюють за своїми змінами: плануйте їх на сторінці «Планування»."
  pl: "Kierowcy jeżdżą swoje służby: zaplanuj je na stronie Planowanie."
"The working hours can be set once the company has researched the shift schedule.":
  nl: "De werktijden kun je instellen zodra het bedrijf het dienstrooster heeft onderzocht."
  de: "Die Arbeitszeiten lassen sich einstellen, sobald das Unternehmen den Schichtplan erforscht hat."
  fr: "Les horaires de travail se règlent une fois que l'entreprise a recherché le planning des équipes."
  ru: "Рабочее время можно задать, когда компания исследует график смен."
  uk: "Робочий час можна задати, коли компанія дослідить графік змін."
  pl: "Godziny pracy można ustawić, gdy firma zbada grafik zmian."
"Experience %{n} of 100: Trainee, Novice, Experienced, Expert":
  nl: "Ervaring %{n} van 100: stagiair, beginner, ervaren, expert"
  de: "Erfahrung %{n} von 100: Azubi, Anfänger, erfahren, Experte"
  fr: "Expérience %{n} sur 100 : stagiaire, débutant, expérimenté, expert"
  ru: "Опыт %{n} из 100: стажёр, новичок, опытный, эксперт"
  uk: "Досвід %{n} із 100: стажер, новачок, досвідчений, експерт"
  pl: "Doświadczenie %{n} na 100: praktykant, nowicjusz, doświadczony, ekspert"
"Nobody works here yet. Every duty of a tour needs a driver; mechanics, cleaners, service employees and ticket inspectors help the company in their own ways. Hire some among the week's applicants.":
  nl: "Er werkt hier nog niemand. Elke dienst van een omloop heeft een chauffeur nodig; monteurs, schoonmakers, servicemedewerkers en kaartjescontroleurs helpen het bedrijf elk op hun eigen manier. Neem er een paar aan uit de sollicitanten van deze week."
  de: "Hier arbeitet noch niemand. Jeder Dienst eines Umlaufs braucht einen Fahrer; Mechaniker, Reinigungskräfte, Servicemitarbeiter und Fahrkartenkontrolleure helfen dem Unternehmen auf ihre Weise. Stelle einige der Bewerber dieser Woche ein."
  fr: "Personne ne travaille encore ici. Chaque service d'un roulement a besoin d'un conducteur ; mécaniciens, agents d'entretien, employés du service client et contrôleurs aident l'entreprise chacun à leur manière. Embauchez parmi les candidats de la semaine."
  ru: "Здесь пока никто не работает. Каждой смене оборота нужен водитель; механики, уборщики, сотрудники сервиса и контролёры помогают компании каждый по-своему. Наймите кого-нибудь из кандидатов этой недели."
  uk: "Тут ще ніхто не працює. Кожній зміні обороту потрібен водій; механіки, прибиральники, працівники сервісу й контролери допомагають компанії кожен по-своєму. Найміть когось із кандидатів цього тижня."
  pl: "Nikt tu jeszcze nie pracuje. Każda służba obiegu potrzebuje kierowcy; mechanicy, sprzątacze, pracownicy obsługi i kontrolerzy biletów pomagają firmie na swój sposób. Zatrudnij kogoś spośród kandydatów tego tygodnia."
