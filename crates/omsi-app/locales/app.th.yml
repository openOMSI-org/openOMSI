"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "พวงมาลัยต้านการหมุนเร็วมากแค่ไหน เพื่อให้พวงมาลัยที่ปล่อยมือหยุดที่ตรงกลางแทนที่จะเหวี่ยงเลยไป เพิ่มค่านี้หากพวงมาลัยแกว่ง"
