"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "ยกแรงที่เล็กที่สุดให้สูงกว่าจุดที่พวงมาลัยของคุณเริ่มรู้สึกได้ มีประโยชน์กับพวงมาลัยแบบสายพานและแบบเฟืองที่มีจุดบอดตรงกลาง สำหรับไดเร็กต์ไดรฟ์ให้คงไว้ที่ 0"
