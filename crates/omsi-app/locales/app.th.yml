"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "ความแรงโดยรวมของการสั่นสะเทือน แรงกระแทกขอบทาง และการสั่นจากถนนและเครื่องยนต์บนพวงมาลัยนี้"
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "ปิด: เกมจะไม่ส่งแรงใด ๆ ไปยังพวงมาลัย แรงต้านที่เหลืออยู่มาจากซอฟต์แวร์ไดรเวอร์ของพวงมาลัยเอง (เช่น สปริงคืนศูนย์ใน Logitech G HUB)"
