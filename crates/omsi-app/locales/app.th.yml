"Reading the content stopped on an error ({why})": "การอ่านเนื้อหาหยุดลงเพราะข้อผิดพลาด ({why})"
"Reading the buses... ({} maps)": "กำลังอ่านรถบัส... ({} แผนที่)"
"Reading the vehicle folders: {done} of {total} ({maps} maps, {buses} buses)": "กำลังอ่านโฟลเดอร์ยานพาหนะ: {done} จาก {total} ({maps} แผนที่, {buses} รถบัส)"
"Content read: {} maps, {} buses, {} weathers": "อ่านเนื้อหาแล้ว: {} แผนที่, {} รถบัส, {} สภาพอากาศ"
"The content cannot be read: {e}\nSet the OMSI 2 folder under Setup.": "อ่านเนื้อหาไม่ได้: {e}\nตั้งโฟลเดอร์ OMSI 2 ในหน้าตั้งค่าเริ่มต้น"
"Timetable of {date}: {n} lines": "ตารางเวลาของ {date}: {n} สาย"
"Timetable of {date}: {n} lines - line {line} does not run that day": "ตารางเวลาของ {date}: {n} สาย - สาย {line} ไม่วิ่งในวันนั้น"
"Timetable of {date}: {n} lines - tour {} of line {line} does not run that day ({})": "ตารางเวลาของ {date}: {n} สาย - รอบ {} ของสาย {line} ไม่วิ่งในวันนั้น ({})"
"Installing {} from the Mods folder...": "กำลังติดตั้ง {} จากโฟลเดอร์ Mods..."
"Game started (process {}), log {}": "เริ่มเกมแล้ว (โปรเซส {}) บันทึก {}"
"Game started (process {}), log {} - {} other game(s) keep running": "เริ่มเกมแล้ว (โปรเซส {}) บันทึก {} - เกมอื่นอีก {} เกมยังทำงานอยู่"
"Not done ({e})": "ไม่สำเร็จ ({e})"
"The folder {root} does not exist: choose the folder of the original OMSI 2 (with Omsi.exe, maps and Vehicles in it) under Setup.": "ไม่มีโฟลเดอร์ {root}: เลือกโฟลเดอร์ของ OMSI 2 ต้นฉบับ (ที่มี Omsi.exe, maps และ Vehicles อยู่ข้างใน) ในหน้าตั้งค่าเริ่มต้น"
"The folder {root} is openOMSI's own folder, not OMSI 2's: choose the folder of the original game (with Omsi.exe in it) under Setup.": "โฟลเดอร์ {root} เป็นโฟลเดอร์ของ openOMSI เอง ไม่ใช่ของ OMSI 2: เลือกโฟลเดอร์ของเกมต้นฉบับ (ที่มี Omsi.exe อยู่ข้างใน) ในหน้าตั้งค่าเริ่มต้น"
"The folder {root} is not a complete OMSI 2 - it lacks {}. openOMSI plays on the original's stock content: choose the folder of a complete installation under Setup.": "โฟลเดอร์ {root} ไม่ใช่ OMSI 2 ที่สมบูรณ์ - ขาด {} openOMSI เล่นด้วยเนื้อหาดั้งเดิมของต้นฉบับ: เลือกโฟลเดอร์ของการติดตั้งที่สมบูรณ์ในหน้าตั้งค่าเริ่มต้น"
"No depot bus {id}": "ไม่มีรถบัสในอู่ {id}"
"No depot service {kind}": "ไม่มีบริการอู่ {kind}"
"There is already a depot called {name}": "มีอู่ชื่อ {name} อยู่แล้ว"
"the game program was not found": "ไม่พบโปรแกรมเกม"
"the game could not write the support package": "เกมเขียนแพ็กเกจสนับสนุนไม่ได้"
"{map} is not a map file": "{map} ไม่ใช่ไฟล์แผนที่"
"line {name}: {why}": "สาย {name}: {why}"
"not a file name": "ไม่ใช่ชื่อไฟล์"
"tour {tour}: a departure is not a time": "รอบ {tour}: มีเวลาออกรถที่ไม่ถูกต้อง"
"it would be written into the OMSI 2 folder": "จะถูกเขียนลงในโฟลเดอร์ OMSI 2"
"its copy would go into the OMSI 2 folder": "สำเนาจะไปอยู่ในโฟลเดอร์ OMSI 2"
"{folder} cannot be read": "อ่าน {folder} ไม่ได้"
"openOMSI is installed by the store here": "ที่นี่ openOMSI ติดตั้งผ่านสโตร์"
"No version is installed yet.": "ยังไม่ได้ติดตั้งเวอร์ชันใด"
"that player has left": "ผู้เล่นนั้นออกไปแล้ว"
"that player is no longer here: number taken by another connection ({now}); refresh the list": "ผู้เล่นนั้นไม่อยู่แล้ว: หมายเลขถูกการเชื่อมต่ออื่นใช้ ({now}) รีเฟรชรายการ"
"openOMSI {from} could not start on this computer.\n\nIt has updated itself to {to} and starts again now.": "openOMSI {from} เริ่มบนคอมพิวเตอร์เครื่องนี้ไม่ได้\n\nได้อัปเดตตัวเองเป็น {to} และกำลังเริ่มใหม่"
"openOMSI {from} could not start on this computer.\n\nIt went back to {to}, which ran here, and starts again now. {from} will not be installed again, only a newer version.": "openOMSI {from} เริ่มบนคอมพิวเตอร์เครื่องนี้ไม่ได้\n\nได้ย้อนกลับไปใช้ {to} ซึ่งเคยทำงานได้ที่นี่ และกำลังเริ่มใหม่ จะไม่ติดตั้ง {from} อีก จะติดตั้งเฉพาะเวอร์ชันที่ใหม่กว่าเท่านั้น"
"The project lists openOMSI {from} as broken.\n\nIt was replaced by {to} and starts again now.": "โครงการระบุว่า openOMSI {from} มีปัญหา\n\nจึงถูกแทนที่ด้วย {to} และกำลังเริ่มใหม่"
"The project lists openOMSI {from} as broken: {why}.\n\nIt was replaced by {to} and starts again now.": "โครงการระบุว่า openOMSI {from} มีปัญหา: {why}\n\nจึงถูกแทนที่ด้วย {to} และกำลังเริ่มใหม่"
"openOMSI {version} could not start on this computer, and there is no newer or earlier version for it yet.\n\nIt tries once more in safe mode (simple graphics, no plugins).": "openOMSI {version} เริ่มบนคอมพิวเตอร์เครื่องนี้ไม่ได้ และยังไม่มีเวอร์ชันที่ใหม่กว่าหรือเก่ากว่าให้ใช้\n\nจะลองอีกครั้งในโหมดปลอดภัย (กราฟิกพื้นฐาน ไม่มีปลั๊กอิน)"
"openOMSI {version} does not start on this computer, and it could not heal itself.\n\nDownload the latest version: {url}\n\nThe start's log: {log}\nTo report it, attach a support package: openomsi --export-diagnostics support.json": "openOMSI {version} เริ่มบนคอมพิวเตอร์เครื่องนี้ไม่ได้ และแก้ไขตัวเองไม่สำเร็จ\n\nดาวน์โหลดเวอร์ชันล่าสุด: {url}\n\nบันทึกการเริ่ม: {log}\nหากต้องการรายงาน ให้แนบแพ็กเกจสนับสนุน: openomsi --export-diagnostics support.json"
"Open the download page": "เปิดหน้าดาวน์โหลด"
"OK": "ตกลง"
"Open the download page now?": "เปิดหน้าดาวน์โหลดตอนนี้หรือไม่"
"The openOMSI launcher ({launcher}) was not found. It belongs in the same folder as the game ({folder}).\n\nPlease download openOMSI again and keep all of its files together.": "ไม่พบตัวเปิดเกม openOMSI ({launcher}) ซึ่งต้องอยู่ในโฟลเดอร์เดียวกับเกม ({folder})\n\nโปรดดาวน์โหลด openOMSI ใหม่และเก็บไฟล์ทั้งหมดไว้ด้วยกัน"
"The openOMSI launcher ({launcher}) could not be started: {why}.": "เริ่มตัวเปิดเกม openOMSI ({launcher}) ไม่ได้: {why}"
"The openOMSI launcher ({launcher}) stopped right after it started ({why}).": "ตัวเปิดเกม openOMSI ({launcher}) หยุดทำงานทันทีหลังเริ่ม ({why})"
"Microsoft Edge WebView2 {version} is registered on this Windows, but its files are missing (removed by a clean-up tool?). Repair it: Settings > Apps > Installed apps > Microsoft Edge WebView2 Runtime > Modify > Repair, or install Microsoft's \"Evergreen Standalone Installer\" from https://developer.microsoft.com/microsoft-edge/webview2/": "Microsoft Edge WebView2 {version} ลงทะเบียนอยู่ใน Windows นี้ แต่ไฟล์หายไป (ถูกเครื่องมือล้างข้อมูลลบ?) ซ่อมแซม: การตั้งค่า > แอป > แอปที่ติดตั้ง > Microsoft Edge WebView2 Runtime > ปรับเปลี่ยน > ซ่อมแซม หรือติดตั้ง \"Evergreen Standalone Installer\" ของ Microsoft จาก https://developer.microsoft.com/microsoft-edge/webview2/"
"Its log says: {error}": "บันทึกของมันระบุว่า: {error}"
"Microsoft Edge WebView2 {version} is installed, so it is not missing.": "ติดตั้ง Microsoft Edge WebView2 {version} แล้ว จึงไม่ได้ขาดหาย"
"The openOMSI launcher shows its window with Microsoft Edge WebView2, which this Windows does not have yet.\n\nInstall it now with Microsoft's installer?": "ตัวเปิดเกม openOMSI แสดงหน้าต่างด้วย Microsoft Edge WebView2 ซึ่ง Windows นี้ยังไม่มี\n\nติดตั้งตอนนี้ด้วยตัวติดตั้งของ Microsoft หรือไม่"
"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "บันทึกอยู่ในโฟลเดอร์ข้อมูลของ openOMSI (launcher.log) ติดตั้ง Microsoft Edge WebView2 {version} แล้ว"
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "หน้าต่างของตัวเปิดเกมต้องใช้ Microsoft Edge WebView2 (มีใน Windows 10 และ 11 สำหรับระบบที่เก่ากว่า: https://developer.microsoft.com/microsoft-edge/webview2/)"
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS ไม่มีสิ่งนี้มาให้ ในโหมดเดสก์ท็อป ใน Konsole: sudo steamos-readonly disable จากนั้น sudo pacman -S webkit2gtk-4.1 แล้ว sudo steamos-readonly enable (การอัปเดต SteamOS อาจลบออกอีก) ดู docs/USER_GUIDE.md"
"this code was made by a game with LAN protocol {}, this one speaks {PROTOCOL} - both players need the same version": "รหัสนี้สร้างโดยเกมที่ใช้โปรโตคอล LAN {} ส่วนเกมนี้ใช้ {PROTOCOL} - ผู้เล่นทั้งสองต้องใช้เวอร์ชันเดียวกัน"
"the number {t} is not a port (1 to 65535)": "หมายเลข {t} ไม่ใช่พอร์ต (1 ถึง 65535)"
"the part after ':' must be a port (1 to 65535), not '{p}'": "ส่วนหลัง ':' ต้องเป็นพอร์ต (1 ถึง 65535) ไม่ใช่ '{p}'"
"the entry '{t}' is neither a session code (OMSI-XXXX-…), an address (192.168.1.20 or 192.168.1.20:27015), a port, nor empty (search)": "'{t}' ไม่ใช่รหัสเซสชัน (OMSI-XXXX-…), ที่อยู่ (192.168.1.20 หรือ 192.168.1.20:27015), พอร์ต หรือค่าว่าง (ค้นหา)"
"the entry '{t}': the part after ':' must be a port (1 to 65535)": "'{t}': ส่วนหลัง ':' ต้องเป็นพอร์ต (1 ถึง 65535)"
"the entry '{t}' is neither a session code (OMSI-…), an address (192.168.1.20 or 192.168.1.20:27015) nor a port": "'{t}' ไม่ใช่รหัสเซสชัน (OMSI-…), ที่อยู่ (192.168.1.20 หรือ 192.168.1.20:27015) หรือพอร์ต"
"the computer {host} has no IPv4 address": "คอมพิวเตอร์ {host} ไม่มีที่อยู่ IPv4"
"the entry '{t}' is neither a session code (OMSI-…), an address nor a port, and no computer of that name was found ({e})": "'{t}' ไม่ใช่รหัสเซสชัน (OMSI-…), ที่อยู่ หรือพอร์ต และไม่พบคอมพิวเตอร์ชื่อนั้น ({e})"
"a session code has {} characters after OMSI- (this one has {n}) - copy the whole code": "รหัสเซสชันมี {} ตัวอักษรหลัง OMSI- (รหัสนี้มี {n}) - คัดลอกรหัสทั้งหมด"
"the character '{}' never appears in a session code - check the character that looks like it": "ตัวอักษร '{}' ไม่เคยอยู่ในรหัสเซสชัน - ตรวจสอบตัวอักษรที่หน้าตาคล้ายกัน"
"the character '{}' is not part of a session code": "ตัวอักษร '{}' ไม่ใช่ส่วนหนึ่งของรหัสเซสชัน"
"the session code has a typo (its checksum does not match)": "รหัสเซสชันพิมพ์ผิด (checksum ไม่ตรง)"
"the host has sent you away from this session (reason: {why})": "โฮสต์เชิญคุณออกจากเซสชันนี้ (เหตุผล: {why})"
"nothing to say": "ไม่มีข้อความ"
"not connected to a session": "ไม่ได้เชื่อมต่อกับเซสชัน"
"not so fast: one line a second": "ช้าลงหน่อย: หนึ่งบรรทัดต่อวินาที"
"the host drives on {}, you on {} - you will not meet": "โฮสต์ขับบน {} คุณขับบน {} - จะไม่ได้พบกัน"
"the host has not answered for {:.0} s - the session is over (playing on alone; still trying, or type /reconnect)": "โฮสต์ไม่ตอบมา {:.0} วินาที - เซสชันจบแล้ว (เล่นต่อคนเดียว ยังพยายามเชื่อมต่ออยู่ หรือพิมพ์ /reconnect)"
"the address {} answers, but no session runs on port {port} there - check the port, or whether the host has started its game": "ที่อยู่ {} ตอบกลับ แต่ไม่มีเซสชันที่พอร์ต {port} - ตรวจสอบพอร์ต หรือโฮสต์เริ่มเกมแล้วหรือยัง"
"the host did not answer (another computer did: {r})": "โฮสต์ไม่ตอบ (มีคอมพิวเตอร์อื่นตอบ: {r})"
"no answer from {} within {:.0} s. Is the session still running, and was the whole code copied? The host's firewall must let the game receive UDP on port {port} (on Windows allow it for public networks too). If both of you are behind a mobile or carrier network that changes the port for every connection, the way cannot be opened: the host can forward UDP port {port} on the router, or you both use a VPN": "ไม่มีการตอบกลับจาก {} ภายใน {:.0} วินาที เซสชันยังทำงานอยู่ไหม และคัดลอกรหัสครบหรือไม่ ไฟร์วอลล์ของโฮสต์ต้องอนุญาตให้เกมรับ UDP ที่พอร์ต {port} (บน Windows ให้อนุญาตสำหรับเครือข่ายสาธารณะด้วย) หากทั้งสองฝ่ายอยู่หลังเครือข่ายมือถือหรือผู้ให้บริการที่เปลี่ยนพอร์ตทุกการเชื่อมต่อ จะเปิดทางไม่ได้: โฮสต์สามารถฟอร์เวิร์ด UDP พอร์ต {port} บนเราเตอร์ หรือทั้งคู่ใช้ VPN"
"the host runs LAN protocol {PROTOCOL}, your game an older one - both players need the same version of the game": "โฮสต์ใช้โปรโตคอล LAN {PROTOCOL} เกมของคุณใช้เวอร์ชันเก่ากว่า - ผู้เล่นทั้งสองต้องใช้เกมเวอร์ชันเดียวกัน"
"the host runs LAN protocol {PROTOCOL}, your game protocol {proto} - both players need the same version of the game": "โฮสต์ใช้โปรโตคอล LAN {PROTOCOL} เกมของคุณใช้โปรโตคอล {proto} - ผู้เล่นทั้งสองต้องใช้เกมเวอร์ชันเดียวกัน"
"wrong session code: this host now runs another session - ask for the current code": "รหัสเซสชันผิด: ตอนนี้โฮสต์นี้รันเซสชันอื่นอยู่ - ขอรหัสปัจจุบัน"
"the session is full ({} players)": "เซสชันเต็มแล้ว ({} ผู้เล่น)"
"the host is letting other players in - try again in a minute": "โฮสต์กำลังรับผู้เล่นคนอื่นเข้ามา - ลองใหม่ในอีกหนึ่งนาที"
"this session needs the game's hardware identifier: update the game": "เซสชันนี้ต้องใช้รหัสฮาร์ดแวร์ของเกม: อัปเดตเกม"
"the host runs LAN protocol {proto}, this game protocol {PROTOCOL}": "โฮสต์ใช้โปรโตคอล LAN {proto} เกมนี้ใช้โปรโตคอล {PROTOCOL}"
"the host answered with session {} instead of {}": "โฮสต์ตอบด้วยเซสชัน {} แทนที่จะเป็น {}"
"this build does not know the official server": "บิลด์นี้ไม่รู้จักเซิร์ฟเวอร์ทางการ"
"the official server's address could not be read ({e})": "อ่านที่อยู่ของเซิร์ฟเวอร์ทางการไม่ได้ ({e})"
"the official server is not online right now": "เซิร์ฟเวอร์ทางการไม่ได้ออนไลน์ในขณะนี้"
"no address given": "ไม่ได้ระบุที่อยู่"
"the answer is not an openOMSI server's": "การตอบกลับไม่ได้มาจากเซิร์ฟเวอร์ openOMSI"
"the host did not answer within {} seconds": "โฮสต์ไม่ตอบภายใน {} วินาที"
"the server list could not be reached ({e})": "เชื่อมต่อรายการเซิร์ฟเวอร์ไม่ได้ ({e})"
"the server list answered with too much": "รายการเซิร์ฟเวอร์ตอบกลับมามากเกินไป"
"the server list answered with something else": "รายการเซิร์ฟเวอร์ตอบกลับด้วยข้อมูลที่ไม่ถูกต้อง"
"Line {line}": "สาย {line}"
"Tour {tour}": "รอบ {tour}"
"In launcher": "อยู่ในตัวเปิดเกม"
"Preparing a drive": "กำลังเตรียมการขับ"
"map cfg must be UTF-8": "cfg ของแผนที่ต้องเป็น UTF-8"
"Could not check for updates: {e}.": "ตรวจหาอัปเดตไม่ได้: {e}"
"openOMSI was not updated to {}: {e}": "ไม่ได้อัปเดต openOMSI เป็น {}: {e}"
