_version: 2
# The line editor on the map's own lines: listed apart, opened and edited as an own line,
# saved in the original's place and restored: the English text is the key, as in app.yml.
"Lines of the map":
  de: "Linien der Karte"
  fr: "Lignes de la carte"
  nl: "Lijnen van de kaart"
  pl: "Linie mapy"
  ru: "Линии карты"
  uk: "Лінії мапи"
"edited":
  de: "bearbeitet"
  fr: "modifiée"
  nl: "bewerkt"
  pl: "zmieniona"
  ru: "изменена"
  uk: "змінена"
"%{n} m · as the map drives it":
  de: "%{n} m · wie auf der Karte"
  fr: "%{n} m · comme sur la carte"
  nl: "%{n} m · zoals op de kaart"
  pl: "%{n} m · tak jak na mapie"
  ru: "%{n} м · как на карте"
  uk: "%{n} м · як на мапі"
"The table holds the map's departures, each in the tour the map runs it in: change them there. A change to the patterns below makes that group of days anew from them.":
  de: "Die Tabelle enthält die Abfahrten der Karte, jede in dem Umlauf, in dem die Karte sie fährt: dort änderst du sie. Eine Änderung an den Mustern unten erstellt diese Tagesgruppe neu aus ihnen."
  fr: "Le tableau contient les départs de la carte, chacun dans le service où la carte le fait rouler : modifie-les là. Une modification des modèles ci-dessous refait ce groupe de jours à partir d'eux."
  nl: "De tabel bevat de vertrektijden van de kaart, elk in de omloop waarin de kaart hem rijdt: wijzig ze daar. Een wijziging in de patronen hieronder maakt die groep dagen opnieuw uit de patronen."
  pl: "Tabela zawiera odjazdy z mapy, każdy w obiegu, w którym jeździ na mapie: zmieniaj je tam. Zmiana wzorców poniżej tworzy tę grupę dni od nowa na ich podstawie."
  ru: "В таблице — отправления карты, каждое в том выпуске, в котором его выполняет карта: меняйте их там. Изменение шаблонов ниже создаёт эту группу дней заново по ним."
  uk: "У таблиці — відправлення мапи, кожне в тому випуску, у якому його виконує мапа: змінюйте їх там. Зміна шаблонів нижче створює цю групу днів наново за ними."
"Reading the map's roads: the line opens in a moment":
  de: "Die Straßen der Karte werden gelesen: die Linie öffnet sich gleich"
  fr: "Lecture des routes de la carte : la ligne s'ouvre dans un instant"
  nl: "De wegen van de kaart worden gelezen: de lijn gaat zo open"
  pl: "Wczytywanie dróg mapy: linia zaraz się otworzy"
  ru: "Читаются дороги карты: линия сейчас откроется"
  uk: "Читаються дороги мапи: лінія зараз відкриється"
"Line %{n} of the map runs no trip the timetable has: it cannot be opened":
  de: "Linie %{n} der Karte fährt keine Fahrt, die der Fahrplan kennt: sie lässt sich nicht öffnen"
  fr: "La ligne %{n} de la carte ne fait aucun trajet que l'horaire connaît : elle ne peut pas être ouverte"
  nl: "Lijn %{n} van de kaart rijdt geen rit die de dienstregeling kent: hij kan niet worden geopend"
  pl: "Linia %{n} mapy nie ma żadnego kursu znanego rozkładowi: nie można jej otworzyć"
  ru: "Линия %{n} карты не выполняет ни одного рейса из расписания: её нельзя открыть"
  uk: "Лінія %{n} мапи не виконує жодного рейсу з розкладу: її не можна відкрити"
"Line %{n} of the map is open: change it as one of your own. Saved, the game drives it instead of the map's original.":
  de: "Linie %{n} der Karte ist geöffnet: ändere sie wie eine eigene. Gespeichert fährt das Spiel sie statt des Originals der Karte."
  fr: "La ligne %{n} de la carte est ouverte : modifie-la comme une des tiennes. Enregistrée, le jeu la fait rouler à la place de l'originale de la carte."
  nl: "Lijn %{n} van de kaart is geopend: wijzig hem als een eigen lijn. Opgeslagen rijdt het spel hem in plaats van het origineel van de kaart."
  pl: "Linia %{n} mapy jest otwarta: zmieniaj ją jak własną. Po zapisaniu gra jeździ nią zamiast oryginału mapy."
  ru: "Линия %{n} карты открыта: меняйте её как свою. После сохранения игра ездит по ней вместо оригинала карты."
  uk: "Лінію %{n} мапи відкрито: змінюйте її як свою. Після збереження гра їздить нею замість оригіналу мапи."
"%{n} leg(s) the map has no way for are routed over the roads.":
  de: "%{n} Abschnitt(e), für die die Karte keinen Weg hat, sind über die Straßen geführt."
  fr: "%{n} tronçon(s) sans chemin dans la carte passent par les routes."
  nl: "%{n} traject(en) waarvoor de kaart geen weg heeft, lopen nu over de wegen."
  pl: "%{n} odcinek(ów), dla których mapa nie ma drogi, poprowadzono po drogach."
  ru: "Участков без пути на карте, проложенных по дорогам: %{n}."
  uk: "Ділянок без шляху на мапі, прокладених дорогами: %{n}."
"%{n} of its trips could not be taken: they have fewer than two stops the timetable knows.":
  de: "%{n} ihrer Fahrten ließen sich nicht übernehmen: sie haben weniger als zwei Haltestellen, die der Fahrplan kennt."
  fr: "%{n} de ses trajets n'ont pas pu être repris : ils ont moins de deux arrêts que l'horaire connaît."
  nl: "%{n} van zijn ritten konden niet worden overgenomen: ze hebben minder dan twee haltes die de dienstregeling kent."
  pl: "Nie udało się przejąć %{n} jej kursów: mają mniej niż dwa przystanki znane rozkładowi."
  ru: "Не удалось взять рейсов: %{n} — у них меньше двух остановок, известных расписанию."
  uk: "Не вдалося взяти рейсів: %{n} — у них менше двох зупинок, відомих розкладу."
"Your edit goes: the game runs the map's own line again, exactly as the map has it":
  de: "Deine Bearbeitung verschwindet: das Spiel fährt wieder die Linie der Karte, genau so, wie die Karte sie hat"
  fr: "Ta modification disparaît : le jeu refait rouler la ligne de la carte, exactement comme la carte l'a"
  nl: "Je bewerking verdwijnt: het spel rijdt weer de eigen lijn van de kaart, precies zoals de kaart hem heeft"
  pl: "Twoja zmiana znika: gra znów jeździ linią mapy, dokładnie taką, jaką ma mapa"
  ru: "Ваши изменения исчезнут: игра снова ездит по линии карты точно так, как она есть на карте"
  uk: "Ваші зміни зникнуть: гра знову їздить лінією мапи точно так, як вона є на мапі"
"Variant %{n}":
  de: "Variante %{n}"
  fr: "Variante %{n}"
  nl: "Variant %{n}"
  pl: "Wariant %{n}"
  ru: "Вариант %{n}"
  uk: "Варіант %{n}"
"Restore the map's original":
  de: "Original der Karte wiederherstellen"
  fr: "Rétablir l'originale de la carte"
  nl: "Origineel van de kaart terugzetten"
  pl: "Przywróć oryginał mapy"
  ru: "Вернуть оригинал карты"
  uk: "Повернути оригінал мапи"
"Press again: the map's original back":
  de: "Noch einmal: das Original der Karte zurück"
  fr: "Encore une fois : l'originale de la carte revient"
  nl: "Nog eens: het origineel van de kaart terug"
  pl: "Jeszcze raz: oryginał mapy wraca"
  ru: "Ещё раз: вернуть оригинал карты"
  uk: "Ще раз: повернути оригінал мапи"
"Press again: the edit goes and the game runs the map's own line as before":
  de: "Noch einmal drücken: die Bearbeitung verschwindet und das Spiel fährt die Linie der Karte wie zuvor"
  fr: "Appuie encore : la modification disparaît et le jeu fait rouler la ligne de la carte comme avant"
  nl: "Druk nog eens: de bewerking verdwijnt en het spel rijdt de eigen lijn van de kaart weer zoals eerst"
  pl: "Naciśnij jeszcze raz: zmiana znika, a gra jeździ linią mapy jak wcześniej"
  ru: "Нажмите ещё раз: изменения исчезнут, и игра будет ездить по линии карты как раньше"
  uk: "Натисніть ще раз: зміни зникнуть, і гра їздитиме лінією мапи як раніше"
"Line %{n} saved: the game drives it instead of the map's original (the next game start picks it up)":
  de: "Linie %{n} gespeichert: das Spiel fährt sie statt des Originals der Karte (der nächste Spielstart übernimmt sie)"
  fr: "Ligne %{n} enregistrée : le jeu la fait rouler à la place de l'originale de la carte (le prochain lancement du jeu la prend)"
  nl: "Lijn %{n} opgeslagen: het spel rijdt hem in plaats van het origineel van de kaart (de volgende start van het spel neemt hem mee)"
  pl: "Linia %{n} zapisana: gra jeździ nią zamiast oryginału mapy (następne uruchomienie gry ją uwzględni)"
  ru: "Линия %{n} сохранена: игра ездит по ней вместо оригинала карты (её подхватит следующий запуск игры)"
  uk: "Лінію %{n} збережено: гра їздить нею замість оригіналу мапи (її підхопить наступний запуск гри)"
"Not restored":
  de: "Nicht wiederhergestellt"
  fr: "Non rétablie"
  nl: "Niet teruggezet"
  pl: "Nie przywrócono"
  ru: "Не возвращено"
  uk: "Не повернуто"
"Taken out of your lines, but there is no content folder to put the map's line back into":
  de: "Aus deinen Linien genommen, aber es gibt keinen Inhaltsordner, in den die Linie der Karte zurückgelegt werden kann"
  fr: "Retirée de tes lignes, mais il n'y a pas de dossier de contenu où remettre la ligne de la carte"
  nl: "Uit je lijnen gehaald, maar er is geen inhoudsmap om de lijn van de kaart in terug te zetten"
  pl: "Usunięto z twoich linii, ale nie ma folderu zawartości, do którego można przywrócić linię mapy"
  ru: "Убрано из ваших линий, но нет папки контента, куда вернуть линию карты"
  uk: "Прибрано з ваших ліній, але немає теки вмісту, куди повернути лінію мапи"
"Line %{n} is the map's own again: the game runs its original as before":
  de: "Linie %{n} gehört wieder der Karte: das Spiel fährt ihr Original wie zuvor"
  fr: "La ligne %{n} est de nouveau celle de la carte : le jeu fait rouler l'originale comme avant"
  nl: "Lijn %{n} is weer van de kaart: het spel rijdt het origineel zoals eerst"
  pl: "Linia %{n} znów należy do mapy: gra jeździ jej oryginałem jak wcześniej"
  ru: "Линия %{n} снова карты: игра ездит по оригиналу как раньше"
  uk: "Лінія %{n} знову мапи: гра їздить оригіналом як раніше"
"Edit the line in the line editor: its route, timetable and displays":
  de: "Die Linie im Linieneditor bearbeiten: ihren Weg, ihren Fahrplan und ihre Anzeigen"
  fr: "Modifier la ligne dans l'éditeur de lignes : son parcours, son horaire et ses afficheurs"
  nl: "De lijn bewerken in de lijneditor: zijn route, dienstregeling en displays"
  pl: "Edytuj linię w edytorze linii: jej trasę, rozkład i wyświetlacze"
  ru: "Изменить линию в редакторе линий: маршрут, расписание и табло"
  uk: "Змінити лінію в редакторі ліній: маршрут, розклад і табло"
