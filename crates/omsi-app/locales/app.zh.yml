"Its log is in the openOMSI data folder (launcher.log); Microsoft Edge WebView2 {version} is installed.": "日志位于 openOMSI 数据文件夹（launcher.log）；Microsoft Edge WebView2 {version} 已安装。"
"The launcher's window needs Microsoft Edge WebView2 (part of Windows 10 and 11; for older systems: https://developer.microsoft.com/microsoft-edge/webview2/).": "启动器窗口需要 Microsoft Edge WebView2（Windows 10 和 11 自带；较旧的系统请见：https://developer.microsoft.com/microsoft-edge/webview2/）。"
"SteamOS does not include it. In Desktop Mode, in Konsole: sudo steamos-readonly disable, then sudo pacman -S webkit2gtk-4.1, then sudo steamos-readonly enable (a SteamOS update can remove it again). See docs/USER_GUIDE.md.": "SteamOS 不自带它。在桌面模式下打开 Konsole：sudo steamos-readonly disable，然后 sudo pacman -S webkit2gtk-4.1，再 sudo steamos-readonly enable（SteamOS 更新可能会再次将其移除）。参见 docs/USER_GUIDE.md。"
