"How strongly the moving bus turns the wheel back to straight after a turn; it never pulls while the bus is stopped.": "行驶中的巴士在转弯后把方向盘拉回正中的力度；巴士停止时绝不会拉动。"
"How much the wheel resists fast movement, so a released wheel settles at the centre instead of swinging past it; raise it if the wheel oscillates.": "方向盘对快速转动的阻力，让松开的方向盘停在中间而不会摆过头；如果方向盘来回摆动，请调高。"
"How heavy the wheel is to turn while the bus stands or crawls; it eases as the bus rolls.": "巴士停止或缓慢移动时转动方向盘的沉重程度；巴士行驶起来后会变轻。"
"Lifts the smallest forces above the point where your wheel starts to feel them; useful on belt and gear wheels with a dead centre, leave at 0 on direct drive.": "将最小的力度提升到方向盘开始能感受到的门槛之上；适用于中间有死区的皮带式和齿轮式方向盘，直驱方向盘请保持 0。"
"Softens sudden steps in the steering force that can feel grainy on strong wheels at low frame rates; higher values add a little delay.": "柔化转向力度的突然跳变，这在低帧率下的强力方向盘上可能感觉粗糙；数值越高会增加少许延迟。"
"Overall strength of the steering forces on this wheel; lower it on a strong direct-drive base, raise it on a weak wheel.": "此方向盘上转向力度的整体强度；强力的直驱底座请调低，力度弱的方向盘请调高。"
"Overall strength of shakes, kerb jolts and the road and engine tremble on this wheel.": "此方向盘上晃动、撞上路缘的冲击以及路面与发动机震颤的整体强度。"
"Off: the game sends the wheel no forces; any resistance left comes from the wheel's own driver software (for example the centre spring in Logitech G HUB)": "关闭：游戏不向方向盘发送任何力；剩余的阻力来自方向盘自身的驱动软件（例如 Logitech G HUB 中的回中弹簧）"
"The running engine buzzes in the wheel, felt even at a standstill": "运转中的发动机会在方向盘上嗡嗡震动，即使停着也能感觉到"
