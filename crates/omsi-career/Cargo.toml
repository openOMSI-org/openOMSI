[package]
name = "omsi-career"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "openOMSI's driver record: the personnel file's career (ratings, stops, tickets, crashes) and the real-time clock sync"

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-content = { path = "../omsi-content" }
omsi-sim = { path = "../omsi-sim" }
glam.workspace = true
log.workspace = true
serde_json.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows: the local date and time (GetLocalTime, see `real_time`)
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
