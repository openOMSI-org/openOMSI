[package]
name = "omsi-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio: cpal mixer with pitch/gain/3D voices, WAV loading, and the OMSI sound-config runtime (unit mc_sound)"

[dependencies]
omsi-vehicle = { path = "../omsi-vehicle" }
omsi-cfg = { path = "../omsi-cfg" }
cpal = "0.15"
parking_lot.workspace = true
hashbrown.workspace = true
glam.workspace = true
log.workspace = true
anyhow.workspace = true
# internet radio (MP3 / AAC / Ogg streams over HTTP(S)) and every sound file besides WAV:
# Ogg Vorbis, FLAC, MP3 / MP2 / MP1, AAC and ALAC in MP4 / M4A, AIFF, CAF, Matroska audio,
# and the WAV codings our own reader leaves (ADPCM and the like)
symphonia = { version = "0.6", default-features = false, features = ["mp1", "mp2", "mp3", "aac", "alac", "adpcm", "pcm", "ogg", "vorbis", "flac", "wav", "aiff", "caf", "isomp4", "mkv"] }
ureq.workspace = true

[dev-dependencies]
env_logger.workspace = true
