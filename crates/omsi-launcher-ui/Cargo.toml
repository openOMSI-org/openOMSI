[package]
name = "omsi-launcher-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The launcher's interface: its window, pages and toolkit (the toolkit also draws the game's pause menu, photo mode and developer tools)"

[dependencies]
anyhow.workspace = true
glam.workspace = true
hashbrown.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true
omsi-cfg = { path = "../omsi-cfg" }
omsi-content = { path = "../omsi-content" }
omsi-input = { path = "../omsi-input" }
omsi-lan = { path = "../omsi-lan" }
omsi-launcher-core = { path = "../omsi-launcher-core" }
omsi-map = { path = "../omsi-map" }
omsi-net = { path = "../omsi-net" }
omsi-platform = { path = "../omsi-platform" }
omsi-guard = { path = "../omsi-guard" }
omsi-render = { path = "../omsi-render" }
omsi-sim = { path = "../omsi-sim" }
omsi-timetable = { path = "../omsi-timetable" }
omsi-ui = { path = "../omsi-ui" }
omsi-vehicle = { path = "../omsi-vehicle" }
omsi-weather = { path = "../omsi-weather" }
# Omsi-Hub's launcher: the bus company, the editors and the livery studio
omsi-model = { path = "../omsi-model" }
omsi-scene = { path = "../omsi-scene" }
omsi-texture = { path = "../omsi-texture" }
ab_glyph.workspace = true
pollster.workspace = true
rayon.workspace = true
sha2.workspace = true
# the livery studio: shapes, outlines and SVG pictures rasterised (as omsi-ui does its icons)
resvg = { version = "0.45", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false }
# the desktop's file dialogs (the livery studio's pictures, the company's prints)
rfd.workspace = true

[features]
# what an app's tests see of the toolkit: every clickable thing's place (`Ui::drawn`)
test-support = []

[dev-dependencies]
omsi-input = { path = "../omsi-input", features = ["test-support"] }
# the tests that every text of the company's pages is translated read the game's tables
# (`crates/omsi-app/locales`) as the game does
rust-i18n = "4"
