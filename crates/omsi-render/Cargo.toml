[package]
name = "omsi-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu renderer: textured, lit meshes with OMSI alpha modes; on-screen and off-screen targets"

[features]
default = ["test-hooks"]
# The fault-injection hook OMSI_FAKE_GPU_ERROR (see docs/DEBUG_FLAGS.md); a build without
# it cannot be made to fail on purpose.
test-hooks = []

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-geometry = { path = "../omsi-geometry" }
omsi-texture = { path = "../omsi-texture" }
wgpu.workspace = true
# (mX Graphics: what differs when the game draws with mX - MetalFX on mX's Metal objects,
# the main pass without render bundles)
wgpu-mx.workspace = true
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
rayon.workspace = true
hashbrown.workspace = true
log.workspace = true
anyhow.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# (DLSS and FSR 3 run on wgpu's own D3D12 device and queue, see `temporal`)
windows = { workspace = true, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D12", "Win32_Foundation", "Win32_System_LibraryLoader"] }
# (the `windows::core::implement` macro in `temporal::streamline` expands to code naming this
# crate, so it has to be a dependency here even though nothing imports it by that name)
windows-core = { workspace = true }
wgpu-hal = { workspace = true, features = ["dx12", "vulkan"] }
# (the same ash as wgpu-hal's: DLSS and FSR 3 on wgpu's Vulkan device, see `temporal::vulkan`)
ash = "0.38"
# (the same glow as wgpu's GL backend, to turn ANGLE's parallel shader compiles off)
glow = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
# (MetalFX runs on wgpu's own Metal device and queue, see `temporal::metalfx`; the same objc2
# crates as wgpu-hal's, so that their types match. MetalFX itself is not linked: it is opened
# when asked for, as macOS 11 and 12 have none)
wgpu-hal = { workspace = true, features = ["metal"] }
objc2 = "0.6"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture"] }
libc.workspace = true

[dev-dependencies]
naga = { workspace = true, features = ["spv-out", "glsl-out", "hlsl-out"] }
env_logger.workspace = true

[target.'cfg(windows)'.dev-dependencies.wgpu]
# Standalone renderer tests do not inherit omsi-app's ANGLE feature.
workspace = true
features = ["angle"]

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
