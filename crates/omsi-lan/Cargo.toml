[package]
name = "omsi-lan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "openOMSI's multiplayer on top of omsi-net: the host's mods for joining players, the voice chat link, the public gateway and the server's status page, the sync tables and the spawn geometry"

[dependencies]
omsi-model = { path = "../omsi-model" }
omsi-cfg = { path = "../omsi-cfg" }
omsi-net = { path = "../omsi-net" }
omsi-map = { path = "../omsi-map" }
omsi-sim = { path = "../omsi-sim" }
omsi-vehicle = { path = "../omsi-vehicle" }
omsi-script = { path = "../omsi-script" }
# what came from another machine is checked for what it says it is (`mods::quarantine`)
omsi-o3d = { path = "../omsi-o3d" }
# the players' buses by their content (`mods`): where a bus's textures are, and the pieces
# its files go in over the wire
omsi-texture = { path = "../omsi-texture" }
flate2.workspace = true
# the fonts of a fetched bus, shared as the world's are (`mods::vehicles::fonts_of`)
parking_lot.workspace = true
zstd.workspace = true
anyhow.workspace = true
glam.workspace = true
hashbrown.workspace = true
log.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ring.workspace = true
# the chat's word filter
rustrict = "0.7"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# the LAN store's key, sealed with the user's account (DPAPI, see `mods::store`)
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography"] }

[dev-dependencies]
# the tests: the box's picture, and `mods::quarantine`'s scan of a mod archive, read in place
# as the game reads one
image.workspace = true
zip.workspace = true
