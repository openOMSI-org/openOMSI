[package]
name = "omsi-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Signed and optionally encrypted openOMSI publisher packs"

[dependencies]
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
zeroize = "1"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

